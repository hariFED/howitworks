const portSideSym = (V) => disc(V, [M.PORT_FS, M.PORT_WL], 33, "paper") + K.line(V, K.circle(M.PORT_FS, M.PORT_WL, 33, 16), "vis", true) + disc(V, [M.PORT_FS, M.PORT_WL], 11, "solid", 10);
const portPlanSym = (V, sg) => K.body(V, K.rect(M.PORT_FS - 33, sg * M.PORT_R - 12, M.PORT_FS + 33, sg * M.PORT_R + 12));
// a drain trap or the valve as a small block symbol, at 3× true size
const trapSym = (V, [fs, wl]) => K.body(V, K.rect(fs - 45, wl - 110, fs + 45, wl + 40));
const valveSym = (V, [fs, wl]) => K.body(V, K.rect(fs - 70, wl - 33, fs + 70, wl + 33));
// the three instruments, schematic: their cases behind the panel
const instSide = (V, wl) => K.body(V, K.rect(A.CABIN.fs0 + 192, wl - 40, M.PANEL.fs, wl + 40));
const panelSide = (V) => K.cut(V, K.rect(M.PANEL.fs, M.PANEL.wl0, M.PANEL.fs + M.PANEL.t, M.PANEL.wl1), { mat: "alu", angle: 135 });

// ================================================================ SECTION A-A: the heated pitot head
// x from the tip aft, y up, axis y = 0. Ram hole Ø3.2, chamber Ø14 to the dam at x 36, bore Ø18 aft;
// drain hole Ø0.8 in the chamber's floor; the pressure tube from the dam's top hole aft and up the
// mast; the heater coiled inside the wall from x 40 to 140; the mast at x 445–475 up to the wing.
const HD = { R: PS.r, ram: M.HEAD.ram / 2, ch: 7, bore: 9, dam: [36, 38.5], drainX: 30, pt: [1.5, 1.0], ptY: 5.6, len: M.HEAD.len, coil: [40, 100, 10], mastX: [PS.mast[0] - PS.fs0, PS.mast[1] - PS.fs0], top: M.MAST_TOP_WL - M.PITOT_WL };
// the ogive nose: r from the ram mouth's lip to the tube's radius over 28 mm
const nose = range(0, 28, 10).map((x) => [3.6 + (HD.R - 3.6) * Math.sin(((x / 28) * Math.PI) / 2), x]);
// the head's body (brass, nickel plated) in [r, s] for revolve along u: outer skin, aft cap, inner walls
const HEAD_LOOP = [
  [HD.ram, 0], ...nose, [HD.R, HD.len - 6], [HD.R - 4, HD.len], [0, HD.len], [0, HD.len - 4], [HD.bore, HD.len - 4],
  [HD.bore, HD.dam[0]], [HD.ch, HD.dam[0]], [HD.ch, 6], [HD.ram, 4],
];
// the break in the section: the drawn x runs 0–XB0, then XB1–len shifted left by SHIFT
const XB0 = 110;
const XB1 = 430;
const SHIFT = XB1 - XB0 - 12;
const hx = (x) => (x <= XB0 + 6 ? x : x - SHIFT);
const hpts = (pts) => pts.map(([x, y]) => [hx(x), y]);
// the body's outer radius at x, and its walls as cut faces (split at the break unless full)
const headR = (x) => (x <= 28 ? 3.6 + (HD.R - 3.6) * Math.sin(((x / 28) * Math.PI) / 2) : x <= HD.len - 6 ? HD.R : HD.R - ((x - (HD.len - 6)) * 4) / 6);
function wallPts(x0, x1) {
  const out = [];
  for (const x of range(0, 28, 12)) if (x >= x0 && x <= x1) out.push([x, headR(x)]);
  if (x1 > 28) out.push([Math.max(28, x0), headR(Math.max(28, x0))], [x1, headR(x1)]);
  const inner = [[HD.len, HD.bore], [HD.dam[0], HD.bore], [HD.dam[0], HD.ch], [6, HD.ch], [4, HD.ram], [0, HD.ram]];
  const rIn = (x) => (x < 4 ? HD.ram : x < 6 ? HD.ram + ((x - 4) * (HD.ch - HD.ram)) / 2 : x < HD.dam[0] ? HD.ch : HD.bore);
  out.push([x1, rIn(x1 - 1e-9)]);
  for (const [x, r] of inner) if (x < x1 && x > x0) out.push([x, r]);
  out.push([x0, rIn(x0)]);
  return out;
}
const mirrorY = (pts) => pts.map(([x, y]) => [x, -y]).reverse();
function headBody(V, { full = false } = {}) {
  const segs = full ? [[0, HD.len - 4]] : [[0, XB0], [XB1, HD.len - 4]];
  const m = full ? (p) => p : hpts;
  let out = "";
  for (const [a, b] of segs) {
    const w = wallPts(a, b);
    out += K.cut(V, m(w), { mat: "brass", angle: 45 }) + K.cut(V, m(mirrorY(w)), { mat: "brass", angle: 45 });
  }
  const e = HD.len - 4;
  const cap = [[e, -headR(e)], [HD.len, -(HD.R - 4)], [HD.len, HD.R - 4], [e, headR(e)]];
  out += K.cut(V, m(cap), { mat: "brass", angle: 45 });
  return out;
}
// the drain hole, a gap in the lower wall at x 30 (drawn as a paper slot over the wall)
function drainHole(V, blocked) {
  const x = HD.drainX;
  const w = M.HEAD.drain / 2;
  const slot = [[x - w, -HD.ch + 0.05], [x + w, -HD.ch + 0.05], [x + w, -headR(x) - 0.4], [x - w, -headR(x) - 0.4]];
  return `<path class="paper" d="${K.d(V, slot)}"/>` + K.line(V, [slot[0], slot[3]], "vis") + K.line(V, [slot[1], slot[2]], "vis") + (blocked ? `<path class="ice" d="${K.d(V, slot)}"/>` : "");
}
// the dam: a disc across the bore with the pressure tube's mouth at its top
function dam(V, map = hpts) {
  const [x0, x1] = HD.dam;
  const r = HD.bore;
  const y0 = HD.ptY - HD.pt[0];
  const y1 = HD.ptY + HD.pt[0];
  return K.cut(V, map([[x0, -r], [x1, -r], [x1, y0], [x0, y0]]), { mat: "brass", angle: 135 }) + K.cut(V, map([[x0, y1], [x1, y1], [x1, r], [x0, r]]), { mat: "brass", angle: 135 });
}
// the pressure tube: from the dam aft along the top of the bore, up the mast to the union
const PT_PATH = [[HD.dam[0], HD.ptY], [HD.mastX[0] + 9, HD.ptY], [HD.mastX[0] + 15, HD.ptY + 6], [HD.mastX[0] + 15, HD.top + 6]];
function pressureTube(V, map = hpts) {
  const segs = [PT_PATH.slice(0, 2).map(([x, y]) => [Math.min(x, XB0), y]), [[XB1, HD.ptY], ...PT_PATH.slice(1)]];
  return segs.map((s) => tubeCut(V, map(s), HD.pt[0], HD.pt[1])).join("");
}
const ptBores = () => [boreOf(hpts([[HD.dam[0], HD.ptY], [XB0, HD.ptY]]), HD.pt[1]), boreOf(hpts([[XB1, HD.ptY], ...PT_PATH.slice(1)]), HD.pt[1])];
// the heater coil: a helix of Ø1.6 sheathed wire against the wall, blacked in both sides
function heater(V, map = hpts) {
  const [x0, x1, n] = HD.coil;
  const p = (x1 - x0) / n;
  const r = HD.bore - 0.85;
  let out = "";
  for (let i = 0; i <= n; i++) {
    const x = x0 + i * p;
    if (x > XB0 - 1 && map === hpts) continue;
    out += disc(V, map([[x, r]])[0], 0.8, "solid", 10) + disc(V, map([[x + p / 2, -r]])[0], 0.8, "solid", 10);
  }
  // the two leads, along the bottom of the bore and up the mast's rear wall
  const lead = (dy) => [[x1, -r + dy], [HD.mastX[1] - 4, -r + dy], [HD.mastX[1] - 4 - dy, HD.top + 4]];
  for (const dy of [0.2, 2.2]) {
    const L = lead(dy);
    if (map === hpts) out += K.line(V, map([[x1, L[0][1]], [XB0, L[0][1]]]), "vis") + K.line(V, map([[XB1, L[0][1]], ...L.slice(1)]), "vis");
    else out += K.line(V, map(L), "vis");
  }
  return out;
}
// the mast: an aerofoil strut, hollow, from the tube's top to its flange under the wing skin
function mast(V, map = hpts) {
  const [a, b] = HD.mastX;
  const t = 2;
  const y0 = Math.sqrt(HD.R ** 2 - 0) - 0.6;
  const flange = [[a - 22, HD.top - 5], [b + 22, HD.top - 5], [b + 22, HD.top], [a - 22, HD.top]];
  const front = [[a, y0], [a + t, y0], [a + t, HD.top - 5], [a, HD.top - 5]];
  const rear = [[b - t, y0], [b, y0], [b, HD.top - 5], [b - t, HD.top - 5]];
  return K.cut(V, map(front), { mat: "alu", angle: 135 }) + K.cut(V, map(rear), { mat: "alu", angle: 135 }) + K.cut(V, map(flange), { mat: "alu", angle: 45 }) + K.line(V, map([[a + t, y0], [b - t, y0]]), "thin");
}
// the wing's lower skin over the mast, a strip cut (phantom beyond)
const wingSkin = (V, map = hpts) => K.cut(V, map([[HD.mastX[0] - 60, HD.top], [HD.mastX[1] + 60, HD.top], [HD.mastX[1] + 60, HD.top + 1.0], [HD.mastX[0] - 60, HD.top + 1.0]]), { mat: "solid" });
// the union on the flange and the start of the pitot line (5), going inboard
function union(V, map = hpts) {
  const x = HD.mastX[0] + 15;
  const y = HD.top + 1;
  const nut = [[x - 7, y], [x + 7, y], [x + 7, y + 9], [x - 7, y + 9]];
  return K.body(V, map(nut)) + K.line(V, map([[x - 7, y + 4.5], [x + 7, y + 4.5]]), "thin");
}
function lineStub(V, map = hpts) {
  const x = HD.mastX[0] + 15;
  const y = HD.top + 10;
  return tubeCut(V, map([[x, y], [x, y + 8], [x + 6, y + 14], [x + 40, y + 14]]), M.LINE.od / 2, M.LINE_ID / 2);
}
const lineStubBore = (map = hpts) => {
  const x = HD.mastX[0] + 15;
  const y = HD.top + 10;
  return boreOf(map([[x, y - 9], [x, y + 8], [x + 6, y + 14], [x + 40, y + 14]]), M.LINE_ID / 2);
};
// the air in the head: ram hole and chamber up to the dam, as one region (the accent)
function headAir(full = false) {
  const m = full ? (p) => p : hpts;
  return m([[0, -HD.ram], [4, -HD.ram], [6, -HD.ch], [HD.dam[0], -HD.ch], [HD.dam[0], HD.ch], [6, HD.ch], [4, HD.ram], [0, HD.ram]]);
}

// ================================================================ SECTION C-C: the tail cone at the ports, looking forward
// u = BL, v = WL. The skin (0.8, blacked in), a frame (Z-section, alu), the two ports, their lines down
// the skin to the tee at the bottom and the static line leaving forward (seen end-on).
const CONE = { r: M.PORT_R, axis: M.PORT_WL, skin: 0.8 };
function coneSkin(V) {
  const o = K.circle(0, CONE.axis, CONE.r, 96);
  const i = K.circle(0, CONE.axis, CONE.r - 10, 96).reverse();
  return cutHoles(V, o, [i], { mat: "solid" });
}
// the frame at this station: a ring of Z-section behind the cut, seen as its inner flange edge
const coneFrame = (V) => K.line(V, K.circle(0, CONE.axis, CONE.r - 40, 96), "vis", true) + K.line(V, K.circle(0, CONE.axis, CONE.r - 46, 96), "thin", true);
// the port lines in C-C (u = BL, v = WL): from each port's nipple to the tee
const coneRoute = (sg) => (sg < 0 ? M.ROUTE.portL : M.ROUTE.portR).map(([, bl, wl]) => [bl, wl]);
function teeC(V) {
  const [, , wl] = M.TEE;
  return K.body(V, K.rect(-30, wl - 18, 30, wl + 18)) + K.line(V, K.circle(0, wl, 12, 16), "thin", true);
}
// the static port seen in C-C (×1 at 1:20 it is a few units: drawn as its body outline)
const portC = (V, sg) => K.body(V, K.rect(sg * CONE.r - (sg > 0 ? 30 : -30) - (sg > 0 ? 0 : 0), CONE.axis - 14, sg * CONE.r, CONE.axis + 14).map(([u, v]) => [u, v]));

// ================================================================ DETAIL D: the left static port, 2:1
// The skin's true curvature about the cone's axis; the port's axis is the BL line through the axis.
// n: inward along +u from the skin's outer surface (BL = −PORT_R + n); t: along the WL.
const SP = { head: 8, headT: 1.2, shank: 4, nut: [2.4, 6.4, 5.5], nip: [9, 21], nipR: M.LINE.od / 2, hole: M.PORT_HOLE / 2, doubler: [0.8, 2.4], dR: 17 };
const R0 = CONE.r;
// a point on the skin's arc: n inward from the outer surface, t along it
const spP = (n, t) => [-(R0 - n) * Math.cos(Math.asin(t / (R0 - n))), CONE.axis + t];
const spArc = (n, t0, t1, k = 16) => range(t0, t1, k).map((t) => spP(n, t));
function spSkin(V, t0 = -24, t1 = 24) {
  // the skin, with the head's hole
  const h = SP.head + 0.1;
  const a = [...spArc(0, t0, -h, 6), ...spArc(0.8, -h, t0, 6).reverse()];
  const b = [...spArc(0, h, t1, 6), ...spArc(0.8, t1, h, 6).reverse()];
  return K.cut(V, a, { mat: "solid" }) + K.cut(V, b, { mat: "solid" });
}
function spDoubler(V) {
  const [n0, n1] = SP.doubler;
  const R = SP.dR;
  const h = SP.shank + 0.1;
  const hh = SP.head + 0.1;
  // counterbored for the head (0.4 of its 1.2 thickness sits in the doubler)
  const up = [...spArc(n0, hh, R, 6), [spP(n1, R)[0] + 0, spP(n1, R)[1]], ...spArc(n1, R, h, 6).reverse().slice(1), spP(1.2, h), spP(1.2, hh)];
  const dn = [...spArc(n0, -R, -hh, 6), spP(1.2, -hh), spP(1.2, -h), ...spArc(n1, -h, -R, 6)];
  return K.cut(V, up, { mat: "alu", angle: 45 }) + K.cut(V, dn, { mat: "alu", angle: 45 });
}
// the port button: a turned brass part (head, shank, nipple) with its bore, and the nut (unhatched)
function spButton(V) {
  const n = (v) => -R0 + v;
  const H = SP.head;
  const s = SP.shank;
  const r = SP.nipR;
  const ho = SP.hole;
  const [n0, n1] = SP.nip;
  // half profile in (n, t) for t ≥ 0, mirrored
  const half = [[0, ho], [0, H], [SP.headT, H], [SP.headT, s], [n0, s], [n0, r], [n1 - 2, r], [n1 - 1, r + 0.6], [n1, r - 0.4], [n1, ho]];
  const pts = (sg) => half.map(([a, t]) => [n(a), CONE.axis + sg * t]);
  const up = pts(1);
  const dn = pts(-1).reverse();
  const nut = K.rect(n(SP.nut[0]), CONE.axis - SP.nut[2] * 1.15, n(SP.nut[1]), CONE.axis + SP.nut[2] * 1.15);
  return K.cut(V, up, { mat: "brass", angle: 135 }) + K.cut(V, dn, { mat: "brass", angle: 135 }) + K.body(V, nut) + K.line(V, [[n(SP.nut[0]), CONE.axis + SP.nut[2] * 0.58], [n(SP.nut[1]), CONE.axis + SP.nut[2] * 0.58]], "thin") + K.line(V, [[n(SP.nut[0]), CONE.axis - SP.nut[2] * 0.58], [n(SP.nut[1]), CONE.axis - SP.nut[2] * 0.58]], "thin");
}
const spBore = () => [[-R0 - 0.3, CONE.axis - SP.hole], [-R0 + SP.nip[1] + 14, CONE.axis - SP.hole], [-R0 + SP.nip[1] + 14, CONE.axis + SP.hole], [-R0 - 0.3, CONE.axis + SP.hole]];
// the hose on the nipple (rubber, cut)
function spHose(V) {
  const n = (v) => -R0 + v;
  const ri = SP.nipR;
  const ro = ri + 2.6;
  const a = n(SP.nip[0] + 4);
  const b = n(SP.nip[1] + 14);
  return K.cut(V, [[a, CONE.axis + ri], [b, CONE.axis + ri], [b, CONE.axis + ro], [a, CONE.axis + ro]], { mat: "rubber", angle: 45 }) + K.cut(V, [[a, CONE.axis - ro], [b, CONE.axis - ro], [b, CONE.axis - ri], [a, CONE.axis - ri]], { mat: "rubber", angle: 45 });
}
const spIce = () => [[-R0 - 1.4, CONE.axis - SP.head + 1], [-R0 + 0.1, CONE.axis - SP.head + 1], [-R0 + 0.1, CONE.axis + SP.head - 1], [-R0 - 1.4, CONE.axis + SP.head - 1]];

// ================================================================ SECTION F-F: a drain trap (pitot and static alike), 1:1
// u across, v up from the bowl's seat; the line passes through the body at v = 7.
const TR = { w: 15, top: 15, bowl: [12, 10, -42], floor: 3, line: 7, plug: [4, -48] };
function trapBody(V) {
  const { w, top, line } = TR;
  const ri = M.LINE_ID / 2;
  const up = [[-w, line + ri], [w, line + ri], [w, top - 1.5], [w - 1.5, top], [-w + 1.5, top], [-w, top - 1.5]];
  const lo = [[-w, 0], [-2.5, 0], [-2.5, line - ri], [-w, line - ri]];
  const lo2 = [[2.5, 0], [w, 0], [w, line - ri], [2.5, line - ri]];
  // the bowl's spigot below the body
  const sp = [[-TR.bowl[1] - 0.05, -6], [-2.5, -6], [-2.5, 0], [-TR.bowl[1] - 0.05, 0]];
  const sp2 = [[2.5, -6], [TR.bowl[1] + 0.05, -6], [TR.bowl[1] + 0.05, 0], [2.5, 0]];
  return [up, lo, lo2, sp, sp2].map((p) => K.cut(V, p, { mat: "brass", angle: 45 })).join("");
}
function trapBowl(V) {
  const [ro, ri, z] = TR.bowl;
  const f = TR.floor;
  const wall = (sg) => [[sg * ri, -6], [sg * ro, -6], [sg * ro, z + 2], [sg * (ro - 2), z], [sg * 4.05, z], [sg * 4.05, z + f], [sg * ri, z + f]];
  const L = wall(-1);
  const R = wall(1).reverse();
  return K.cut(V, L, { mat: "plastic", angle: 135 }) + K.cut(V, R, { mat: "plastic", angle: 135 }) + K.line(V, [[-ro, 0.05], [-ro, -6]], "thin");
}
function trapPlug(V) {
  const z = TR.bowl[2];
  const plug = [[-4, z + TR.floor + 1], [4, z + TR.floor + 1], [4, z - 1], [6.5, z - 1], [6.5, z - 7], [-6.5, z - 7], [-6.5, z - 1], [-4, z - 1]];
  return K.body(V, plug) + K.line(V, [[-6.5, z - 4], [6.5, z - 4]], "thin") + disc(V, [-4.4, z + 1.5], 0.7, "solid", 8) + disc(V, [4.4, z + 1.5], 0.7, "solid", 8);
}
const TR_STUB = 8;
const trapLines = (V) => [-1, 1].map((sg) => tubeCut(V, [[sg * TR.w, TR.line], [sg * (TR.w + TR_STUB), TR.line]], M.LINE.od / 2, M.LINE_ID / 2)).join("");
const trapAir = () => [[-TR.w - TR_STUB, TR.line - M.LINE_ID / 2], [-2.5, TR.line - M.LINE_ID / 2], [-2.5, -6], [-TR.bowl[1], -6], [-TR.bowl[1], TR.bowl[2] + TR.floor], [TR.bowl[1], TR.bowl[2] + TR.floor], [TR.bowl[1], -6], [2.5, -6], [2.5, TR.line - M.LINE_ID / 2], [TR.w + TR_STUB, TR.line - M.LINE_ID / 2], [TR.w + TR_STUB, TR.line + M.LINE_ID / 2], [-TR.w - TR_STUB, TR.line + M.LINE_ID / 2]];
const trapWater = (h) => [[-TR.bowl[1], TR.bowl[2] + TR.floor], [TR.bowl[1], TR.bowl[2] + TR.floor], [TR.bowl[1], TR.bowl[2] + TR.floor + h], [-TR.bowl[1], TR.bowl[2] + TR.floor + h]];

// ================================================================ SECTION E-E: the alternate static valve, 1:1
// u along the spool (aft, toward the pilot, to the right), v up; body x 0–44, bore Ø10; ports: A from
// the static ports (below, x 12), B to the instruments (above, x 22), C the cabin (above, x 32, Ø3.2).
const AV = { len: 44, R: 11, bore: 5, A: 12, B: 22, C: 32, travel: 9, panel: [48, 51], knob: [55, 66] };
function valveBody(V) {
  const { len, R, bore } = AV;
  const ri = M.LINE_ID / 2;
  const hc = M.ALT_HOLE / 2;
  const top = [[0, bore], [AV.B - ri, bore], [AV.B - ri, R], [0, R]];
  const top2 = [[AV.B + ri, bore], [AV.C - hc, bore], [AV.C - hc, R], [AV.B + ri, R]];
  const top3 = [[AV.C + hc, bore], [len, bore], [len, R], [AV.C + hc, R]];
  const bot = [[0, -R], [AV.A - ri, -R], [AV.A - ri, -bore], [0, -bore]];
  const bot2 = [[AV.A + ri, -R], [len, -R], [len, -bore], [AV.A + ri, -bore]];
  const end = [[0, -bore], [4, -bore], [4, bore], [0, bore]];
  return [top, top2, top3, bot, bot2, end].map((p) => K.cut(V, p, { mat: "alu", angle: 45 })).join("") + K.line(V, [[AV.C - hc, R], [AV.C + hc, R]], "thin");
}
// the spool at travel s (0 normal, 9 pulled): lands with O-rings, the rod and the knob
function valveSpool(V, s) {
  const b = AV.bore - 0.05;
  const g = 3;
  const x = (v) => v + s;
  const land1 = [[x(4.5), -b], [x(8.5), -b], [x(8.5), b], [x(4.5), b]];
  const neck = [[x(8.5), -g], [x(25), -g], [x(25), g], [x(8.5), g]];
  const land2 = [[x(25), -b], [x(42), -b], [x(42), b], [x(25), b]];
  const rod = [[x(42), -3], [x(AV.knob[0]), -3], [x(AV.knob[0]), 3], [x(42), 3]];
  return K.body(V, [...land1]) + K.body(V, neck) + K.body(V, land2) + K.body(V, rod) + [6.5, 28].map((xx) => disc(V, [x(xx), b - 0.2], 1.0, "solid", 10) + disc(V, [x(xx), -b + 0.2], 1.0, "solid", 10)).join("");
}
function valveKnob(V, s) {
  const [a, b] = AV.knob;
  return K.cut(V, [[a + s, -8], [b + s, -8], [b + s, 8], [a + s, 8]], { mat: "plastic", angle: 45 }) + K.line(V, [[b + s - 3, -8], [b + s - 3, 8]], "thin");
}
const valvePanel = (V) => K.cut(V, [[AV.panel[0], 3.3], [AV.panel[1], 3.3], [AV.panel[1], 17], [AV.panel[0], 17]], { mat: "alu", angle: 135 }) + K.cut(V, [[AV.panel[0], -17], [AV.panel[1], -17], [AV.panel[1], -3.3], [AV.panel[0], -3.3]], { mat: "alu", angle: 135 });
const valveLines = (V) => tubeCut(V, [[AV.A, -AV.R], [AV.A, -AV.R - 14]], M.LINE.od / 2, M.LINE_ID / 2) + tubeCut(V, [[AV.B, AV.R], [AV.B, AV.R + 14]], M.LINE.od / 2, M.LINE_ID / 2);
// the air the spool connects: the passages and the groove
function valveAir(s) {
  const ri = M.LINE_ID / 2;
  const hc = M.ALT_HOLE / 2;
  const b = AV.bore;
  return {
    A: [[AV.A - ri, -AV.R - 14], [AV.A + ri, -AV.R - 14], [AV.A + ri, -b], [AV.A - ri, -b]],
    B: [[AV.B - ri, AV.R + 14], [AV.B + ri, AV.R + 14], [AV.B + ri, b], [AV.B - ri, b]],
    C: [[AV.C - hc, AV.R], [AV.C + hc, AV.R], [AV.C + hc, b], [AV.C - hc, b]],
    groove: [[8.5 + s, -b], [25 + s, -b], [25 + s, b], [8.5 + s, b]],
  };
}

// ================================================================ the instruments
// The case: a 3⅛ in aluminium die casting, closed at the back, with the glass and its gasket and spring
// ring at the front and the square mounting flange behind the panel. The panel plate is cut too.
const IC = { Ro: 39.7, Ri: 38.5, back: 3, front: 100, flange: [100, 104, 41.25], panel: [104, 107, 46], glass: [95, 97.5], dial: [86, 87], ptr: [89, 89.6] };
const PLATES = { rear: [64, 65.2], front: [76, 77.2], sector: [69.7, 70.3], pinion: [68.5, 71.5], hair: 79.2, rock: 62 };
function caseSection(V, { boss = [] } = {}) {
  const { Ro, Ri, back, front } = IC;
  const [f0, f1, fr] = IC.flange;
  const wall = (sg) => [[back, sg * Ri], [f0, sg * Ri], [f0, sg * (Ri + 0.4)], [f1, sg * (Ri + 0.4)], [f1, sg * fr], [f0, sg * fr], [f0 - 3, sg * Ro], [back, sg * Ro]].map(([x, y]) => [x, y]);
  let out = K.cut(V, wall(1), { mat: "alu", angle: 45 }) + K.cut(V, wall(-1).reverse(), { mat: "alu", angle: 45 });
  // the back wall, with the fittings' holes (boss: [y, r] list)
  const holes = boss.slice().sort((a, b) => b[0] - a[0]);
  let y = Ro;
  const segs = [];
  for (const [yc, r] of holes) {
    segs.push([yc + r, y]);
    y = yc - r;
  }
  segs.push([-Ro, y]);
  for (const [a, b] of segs) if (b - a > 0.2) out += K.cut(V, [[0, a], [back, a], [back, b], [0, b]], { mat: "alu", angle: 45 });
  void front;
  return out;
}
function glass(V) {
  const [g0, g1] = IC.glass;
  const r = IC.Ri - 0.05;
  return K.cut(V, [[g0, -r], [g1, -r], [g1, r], [g0, r]], { mat: "plastic", angle: 60 }) +
    [1, -1].map((sg) => K.cut(V, [[g1, sg * (r - 1.6)], [g1 + 1.4, sg * (r - 1.6)], [g1 + 1.4, sg * r], [g1, sg * r]], { mat: "solid" }) + K.cut(V, [[g0 - 0.8, sg * (r - 1.6)], [g0, sg * (r - 1.6)], [g0, sg * r], [g0 - 0.8, sg * r]], { mat: "solid" })).join("");
}
function panelCut(V) {
  const [p0, p1, r] = IC.panel;
  return K.cut(V, [[p0, 40.5], [p1, 40.5], [p1, r], [p0, r]], { mat: "alu", angle: 135 }) + K.cut(V, [[p0, -r], [p1, -r], [p1, -40.5], [p0, -40.5]], { mat: "alu", angle: 135 });
}
function dialSide(V, hole = 1.6) {
  const [d0, d1] = IC.dial;
  const r = IC.Ri - 1;
  return K.cut(V, [[d0, hole], [d1, hole], [d1, r], [d0, r]], { mat: "solid" }) + K.cut(V, [[d0, -r], [d1, -r], [d1, -hole], [d0, -hole]], { mat: "solid" });
}
// the movement's two plates, the pillars and the dial feet (section on z = 0)
function platesSide(V, { rearSpan = [-36, 36], frontSpan = [-18, 5], gap = [] } = {}) {
  const [r0, r1] = PLATES.rear;
  const [f0, f1] = PLATES.front;
  let out = "";
  // the rear plate, with a hole for the pointer arbor's rear pivot and gaps where things pass
  const cuts = [[rearSpan[0], rearSpan[1]]];
  for (const g of gap) {
    const c = cuts.pop();
    cuts.push([c[0], g[0]], [g[1], c[1]]);
  }
  for (const [a, b] of cuts) if (b - a > 0.3) out += K.cut(V, [[r0, a], [r1, a], [r1, b], [r0, b]], { mat: "solid" });
  out += K.cut(V, [[f0, frontSpan[0]], [f1, frontSpan[0]], [f1, frontSpan[1]], [f0, frontSpan[1]]], { mat: "solid" });
  // pillars at y ±30 (unhatched rods), dial feet at y ±32
  for (const sg of [1, -1]) {
    out += K.body(V, [[r1, sg * 28.5], [IC.dial[0], sg * 28.5], [IC.dial[0], sg * 31.5], [r1, sg * 31.5]]);
  }
  return out;
}
// the movement's moving parts in section: push rod (from the capsule's stud), crank 1, rocking shaft,
// arm 2 (beyond the plane), sector edge-on, its arbor, the pinion arbor and pinion, hairspring, pointer
function movementSide(V, g, { rockDeg, ptrLen, ptrDeg, studX, l1 = 12, toggle0 = 0, crank = "toggle", sectorY = -21.5, sectorTop = -2.2, l2 = 12, extra = "" }) {
  const xr = PLATES.rock;
  const th = (toggle0 + rockDeg) * rad;
  const pin = [xr - l1 * Math.cos(th), -l1 * Math.sin(th)];
  // the push rod: from the stud to the pad that bears on crank 1's pin
  const padX = pin[0] - 0.6;
  let out = K.body(V, [[studX, -0.75], [padX - 0.8, -0.75], [padX - 0.8, 0.75], [studX, 0.75]]);
  out += K.body(V, [[padX - 0.8, Math.min(-1.5, pin[1] - 2)], [padX, Math.min(-1.5, pin[1] - 2)], [padX, Math.max(2, pin[1] + 2)], [padX - 0.8, Math.max(2, pin[1] + 2)]]);
  // crank 1 (a thin plate in the plane) and the rocking shaft, cut across
  out += K.cut(V, strip([[xr, 0], pin], 0.55), { mat: "solid" }) + disc(V, pin, 0.8, "paper", 10) + K.line(V, K.circle(pin[0], pin[1], 0.8, 10), "vis", true);
  out += disc(V, [xr, 0], 1.0, "solid", 12);
  // arm 2 at z = 8, beyond the plane: from the shaft to the sector's plane
  const tip = [xr + l2 * Math.cos(rockDeg * rad), l2 * Math.sin(rockDeg * rad)];
  out += `<g class="beyond">${K.line(V, [[xr, 0], tip], "thin")}${K.line(V, [tip, [tip[0], sectorY]], "thin")}</g>`;
  // the sector edge-on (thin, blacked in) and its arbor between the plates (unhatched)
  const [s0, s1] = PLATES.sector;
  out += K.body(V, [[PLATES.rear[1], sectorY - 0.6], [PLATES.front[0], sectorY - 0.6], [PLATES.front[0], sectorY + 0.6], [PLATES.rear[1], sectorY + 0.6]]);
  out += K.cut(V, [[s0, sectorY - 2.6], [s1, sectorY - 2.6], [s1, sectorTop], [s0, sectorTop]], { mat: "solid" });
  // the pointer arbor (on the axis) through the front plate and the dial, the pinion on it
  const [p0, p1] = PLATES.pinion;
  out += K.body(V, [[PLATES.rear[0], -0.6], [IC.ptr[1] + 0.6, -0.6], [IC.ptr[1] + 0.6, 0.6], [PLATES.rear[0], 0.6]]);
  out += K.body(V, [[p0, -2.3], [p1, -2.3], [p1, 2.3], [p0, 2.3]]) + K.lines(V, [[[p0, -1.9], [p1, -1.9]], [[p0, 1.9], [p1, 1.9]]], "thin");
  // the hairspring, its coils edge-on in front of the front plate
  for (let k = 0; k <= 5; k++) out += disc(V, [PLATES.hair, 2.2 + k * 1.16], 0.2, "solid", 6) + disc(V, [PLATES.hair, -(2.2 + k * 1.16)], 0.2, "solid", 6);
  // the pointer: its hub and its blade, foreshortened by its angle from the vertical
  const [q0, q1] = IC.ptr;
  const c = Math.cos(ptrDeg * rad);
  out += K.body(V, [[q0 - 0.8, -2], [q1 + 0.4, -2], [q1 + 0.4, 2], [q0 - 0.8, 2]]);
  if (Math.abs(c) > 0.02) out += K.cut(V, [[q0, 0], [q1, 0], [q1, ptrLen * c], [q0, ptrLen * c]], { mat: "solid" });
  void g;
  void crank;
  return out + extra;
}

// ---------------------------------------------------------------- capsules (section)
// A pair of corrugated diaphragms soldered at the rim, Ø46: rear face fixed at xr, front face's centre
// moved by δ (the rim stays). Returns the two blacked-in diaphragm strips and the air inside.
const RIPPLE = (r, R) => 0.45 * Math.sin((r / R) * Math.PI * 4.5) * (1 - r / R);
function capsulePts(x0, gap, R, dl, { n = 28 } = {}) {
  // x0: rim plane; gap: the half-gap at the centre; dl: the front centre's extra travel
  const rs = range(0, R, n);
  const front = rs.map((r) => [x0 + (gap + dl) * (1 - (r / R) ** 2) + RIPPLE(r, R), r]);
  const rear = rs.map((r) => [x0 - gap * (1 - (r / R) ** 2) - RIPPLE(r, R), r]);
  return { front, rear };
}
function capsuleSection(V, x0, gap, R, dl, { stem = null, studOut = true } = {}) {
  const { front, rear } = capsulePts(x0, gap, R, dl);
  const t = 0.16;
  const sheet = (pts, sg) => {
    const up = pts.map(([x, r]) => [x, sg * r]);
    const dn = pts.map(([x, r]) => [x + (pts === front ? t : -t), sg * r]).reverse();
    return K.cut(V, [...up, ...dn], { mat: "solid" });
  };
  let out = sheet(front, 1) + sheet(front, -1) + sheet(rear, 1) + sheet(rear, -1);
  // the rim (soldered seam)
  out += K.cut(V, [[x0 - 0.5, R - 0.3], [x0 + 0.5, R - 0.3], [x0 + 0.5, R + 0.5], [x0 - 0.5, R + 0.5]], { mat: "solid" }) + K.cut(V, [[x0 - 0.5, -R - 0.5], [x0 + 0.5, -R - 0.5], [x0 + 0.5, -R + 0.3], [x0 - 0.5, -R + 0.3]], { mat: "solid" });
  // the centre stud on the front face
  if (studOut) out += K.body(V, [[front[0][0] + t, -2.2], [front[0][0] + t + 2.4, -2.2], [front[0][0] + t + 2.4, 2.2], [front[0][0] + t, 2.2]]);
  if (stem) out += stem;
  return out;
}
function capsuleAir(x0, gap, R, dl) {
  const { front, rear } = capsulePts(x0, gap, R, dl, { n: 20 });
  const fr = front.map(([x, r]) => [x + 0.16, r]);
  const re = rear.map(([x, r]) => [x - 0.16, r]);
  return [...fr, ...re.slice().reverse(), ...re.map(([x, r]) => [x, -r]), ...fr.slice().reverse().map(([x, r]) => [x, -r])];
}
// (front centre) x of a capsule
const capFront = (x0, gap, dl) => x0 + gap + dl;

// ---------------------------------------------------------------- fittings at the back (section)
function fitting(V, y, { len = 10, label = "" } = {}) {
  const ri = M.LINE_ID / 2 - 0.4;
  const hex = [[-len, y - 6.4], [-len + 6, y - 6.4], [-len + 6, y + 6.4], [-len, y + 6.4]];
  const body = (sg) => [[-len, y + sg * ri], [IC.back + 0.01, y + sg * ri], [IC.back + 0.01, y + sg * 3.5], [-len + 6, y + sg * 3.5], [-len + 6, y + sg * 6.4], [-len, y + sg * 6.4]];
  void hex;
  void label;
  return K.cut(V, body(1), { mat: "brass", angle: 135 }) + K.cut(V, body(-1).reverse(), { mat: "brass", angle: 135 });
}
const fittingBore = (y, len = 10) => [[-len, y - (M.LINE_ID / 2 - 0.4)], [IC.back, y - (M.LINE_ID / 2 - 0.4)], [IC.back, y + (M.LINE_ID / 2 - 0.4)], [-len, y + (M.LINE_ID / 2 - 0.4)]];

// ---------------------------------------------------------------- front views (dial half and movement half)
// The bezel opening and the case, as seen from the pilot: the panel's hole edge and the flange square
function faceFrame(V) {
  // from the pilot's side the flange is behind the panel: the panel's hole, the bezel and the glass
  return K.line(V, K.circle(0, 0, 40.5, 72), "vis", true) + K.line(V, K.circle(0, 0, IC.Ri, 72), "thin", true);
}
// the dial plate's half, broken along the vertical diameter: side "L" keeps u < 0, "R" keeps u > 0
function dialHalf(V, side) {
  const r = IC.Ri - 1;
  const sg = side === "L" ? -1 : 1;
  const arc = K.arc(0, 0, r, sg < 0 ? 90 : -90, sg < 0 ? 270 : 90, 36);
  // a freehand break line along the diameter (a gentle zigzag)
  const brk = range(1, -1, 12).map((t, i) => [sg * (i % 2 ? 0.9 : -0.4), (sg < 0 ? 1 : -1) * t * r]);
  return K.body(V, [...arc, ...brk.slice(1, -1)]);
}
// the rear plate as seen through the broken-away half (a disc, the background of the movement)
const rearPlateFront = (V, side) => {
  const sg = side === "L" ? -1 : 1;
  const r = 36;
  const screw = (c) => K.body(V, K.circle(c[0], c[1], 2.2, 16)) + K.line(V, [[c[0] - 1.6, c[1] + 0.6], [c[0] + 1.6, c[1] - 0.6]], "thin");
  return K.body(V, [...K.arc(0, 0, r, sg < 0 ? 90 : -90, sg < 0 ? 270 : 90, 30)]) + screw([sg * 27, 20]) + screw([sg * 27, -22]);
};
// graduations: a list of [cwDeg, r0, r1, cls] in the dial's half; numbers at [cwDeg, r, text]
function grads(V, side, ticks, nums, { tSize = "t-sm" } = {}) {
  const keep = (cw) => (side === "L" ? Math.sin(cw * rad) < -0.02 : Math.sin(cw * rad) > 0.02);
  const thin = [];
  const thick = [];
  for (const [cw, r0, r1, cls] of ticks) if (keep(cw)) (cls === "vis" ? thick : thin).push([dialPt([0, 0], r0, cw), dialPt([0, 0], r1, cw)]);
  let out = (thin.length ? K.lines(V, thin, "thin") : "") + (thick.length ? K.lines(V, thick, "vis") : "");
  let txt = "";
  for (const [cw, r, s] of nums) {
    if (!keep(cw)) continue;
    const [x, y] = V.p(dialPt([0, 0], r, cw));
    txt += `<text class="t ${tSize}" x="${x}" y="${K.r2(y + 2.6)}" text-anchor="middle">${s}</text>`;
  }
  return { lines: out, text: txt };
}
// a band (arc) on the dial between two clockwise angles, radii r0..r1
const dialBand = (cw0, cw1, r0, r1) => {
  const n = Math.max(3, Math.ceil(Math.abs(cw1 - cw0) / 4));
  return [...range(cw0, cw1, n).map((a) => dialPt([0, 0], r1, a)), ...range(cw1, cw0, n).map((a) => dialPt([0, 0], r0, a))];
};
// clip a dial band to one half
function bandHalf(side, cw0, cw1) {
  const lo = side === "L" ? 180 : 0;
  const hi = side === "L" ? 360 : 180;
  const a = Math.max(lo + 0.5, cw0);
  const b = Math.min(hi - 0.5, cw1);
  return b > a ? [a, b] : null;
}
// a pointer: a tapered blade of length L and a counterweight tail, turned to cw (clockwise from twelve)
function pointer(V, cw, L, { w = 1.2, tail = 8, hub = 2.4, shape = "blade" } = {}) {
  const base = shape === "wide" ? [[0, -w * 1.8], [L - 5, -w * 1.5], [L, 0], [L - 5, w * 1.5], [0, w * 1.8], [-tail, w * 1.4], [-tail, -w * 1.4]] : [[L, 0], [L * 0.2, w], [-tail, w * 0.8], [-tail, -w * 0.8], [L * 0.2, -w]];
  const pts = rot(base, [0, 0], 90 - cw);
  return K.cut(V, pts, { mat: "solid" }) + disc(V, [0, 0], hub, "solid", 16) + disc(V, [0, 0], 0.7, "paper", 8);
}
// the movement as seen through the broken half: the sector on its arbor (turned by sDeg about piv), its
// tail out to armZ and the link to arm 2's tip, the pinion turned with the pointer, the front bridge.
function movementFront(V, { piv = [0, -13.5], rs = 12.3, sDeg = 0, ptrCw = 0, rockDeg = 0, armZ = 8, l2 = 8, pinR = 1.15, pinAt = [0, 0], pinCw = null, teeth = 12, bridge = null, sectorArc = [60, 120], sg = 1 }) {
  let out = "";
  // the rocking shaft behind the rear plate (hidden), arm 2's tip through its slot in the plate
  out += K.line(V, [[-6, 0], [armZ + 4 * Math.sign(armZ), 0]], "hid");
  const tipY = l2 * Math.sin(rockDeg * rad);
  const slot = K.rrect(armZ - 1.6, -4.2, armZ + 1.6, 4.2, 1.4);
  out += `<path class="paper" d="${K.d(V, slot)}"/>` + K.line(V, slot, "thin", true);
  // the sector: a plate from its arbor to a toothed arc, and its tail arm out to the link
  const tail = rot([[armZ, piv[1]]], piv, sg * sDeg)[0];
  const nT = Math.round((teeth * rs) / pinR);
  const teethPts = gearPts(piv, rs, nT, sg * sDeg, { arc: sectorArc });
  const hub = rot([[piv[0] + 3, piv[1] - 2.2], [piv[0] - 3, piv[1] - 2.2]], piv, sg * sDeg);
  out += K.body(V, [...teethPts, ...hub]);
  out += K.body(V, strip([piv, tail], 1.1));
  out += K.line(V, [tail, [tail[0], tipY]], "vis") + disc(V, tail, 0.7, "solid", 8) + disc(V, [tail[0], tipY], 0.9, "solid", 8);
  out += disc(V, piv, 1.5, "paper", 12) + K.line(V, K.circle(piv[0], piv[1], 1.5, 12), "vis", true) + disc(V, piv, 0.5, "solid", 6);
  // the pinion, turned with its arbor
  out += K.body(V, gearPts(pinAt, pinR, teeth, -(pinCw ?? ptrCw)));
  if (bridge) out += K.body(V, bridge);
  return out;
}
// the hairspring: an Archimedean spiral of 5 turns from the collet (turned with the pointer) to its stud
function hairspring(V, ptrCw, { r0 = 1.3, r1 = 5.2, turns = 5, stud = 30 } = {}) {
  const n = 120;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const r = r0 + (r1 - r0) * t;
    const a = stud + 360 * turns * (t - 1) - ptrCw * (1 - t) * 0.6;
    pts.push(pol([0, 0], r, a));
  }
  return K.line(V, pts, "vis") + disc(V, pol([0, 0], r1, stud), 0.6, "solid", 8) + disc(V, [0, 0], 1.0, "paper", 10) + K.line(V, K.circle(0, 0, 1.0, 10), "vis", true);
}

// ================================================================ the three instruments: states and drawings
// Each movement's angles from the model's indications (all degrees):
//   ASI: sector = (pointer − stop)/N, toggle crank at dead centre at rest, so the stud's travel is
//        l1(1 − cos θ): about Δp, while θ and the pointer go about as airspeed (the square root).
//   ALT: sector = pressure-altitude pointer turn / (11.7 × 10), turned clockwise; crank at −50°.
//   VSI: sector = pointer/N either way from nine o'clock; crank at −30°, so a shrinking capsule
//        (static falling in a climb, the case lagging) turns it up.
const HS_STUD = [8.4 * Math.cos((20 * Math.PI) / 180), 8.4 * Math.sin((20 * Math.PI) / 180)]; // the hairspring's outer stud
const PIV = [0, -21.5]; // the ASI's and VSI's sector arbor (front view)
const ALT_W1 = [12.5, -5.73]; // the altimeter's intermediate wheel: 12.5 + 1.25 from the centre
const ALT_PIV = [12.5, -5.73 - 19.6]; // its sector's arbor, 18 + 1.6 below the wheel
const INSTR = {
  asi: { N: 19.6 / 1.9, l1: 12, t0: 0, sg: 1, cap: { x0: 24, gap: 1.6, R: 23 }, ptr: 30 },
  alt: { N: (18 / 1.6) * 10, l1: 5, t0: -50, sg: -1, cap: { x0: 18, gap: 1.6, R: 22 }, ptr: 30 },
  vsi: { N: 19.6 / 1.9, l1: 12, t0: -30, sg: 1, cap: { x0: 24, gap: 1.6, R: 23 }, ptr: 30 },
};
const toggle = (I, th) => I.l1 * (Math.cos(I.t0 * rad) - Math.cos((I.t0 + th) * rad)); // the stud's travel
function asiState(ind) {
  const cw = M.asiDeg(ind.ias);
  const s = (cw - M.ASI.stop) / INSTR.asi.N;
  return { cw, sDeg: s, rock: s, dl: toggle(INSTR.asi, s) };
}
function altState(ind, setPa) {
  const h = ind.hInd;
  const pa = ind.hPress;
  const paDeg = (pa / 1000) * 360;
  const s = paDeg / INSTR.alt.N;
  const cradle = (((h - pa) / 1000) * 360) / 11;
  return { h, cw1: (h / 1000) * 360, cw10: (h / 10000) * 360, cw100: (h / 100000) * 360, sDeg: s, rock: -s, dl: toggle(INSTR.alt, -s), cradle, set: setPa / M.HPA, wheel: s * (18 / 1.6) };
}
function vsiState(ind) {
  const cw = M.vsiDeg(ind.vsi);
  const s = cw / INSTR.vsi.N;
  return { cw, sDeg: s, rock: s, dl: toggle(INSTR.vsi, s) };
}

// ---------------------------------------------------------------- sections (side, from port; z > 0 beyond)
const STEM = (V, x1) => tubeCut(V, [[-0.5, 0], [x1, 0]], 1.6, 0.8);
// the static (unchanging) half of each section
function asiStatic(V) {
  return (
    part(12, caseSection(V, { boss: [[0, 1.65], [24, M.LINE_ID / 2 - 0.4]] }) + glass(V) + dialSide(V) + fitting(V, 0) + fitting(V, 24)) +
    part(11, panelCut(V)) +
    part(14, platesSide(V, { frontSpan: [-18, 5] }))
  );
}

  for (const e of el.stLines) e?.setAttribute("stroke-opacity", K.r2(0.35 + 0.65 * ts));
  // ---- ice on the ram hole, the drain, the ports
  if (shown.ram !== s.ram || shown.drain !== s.drain) {
    const hd = P.HD;
    const ram = [[-0.6, -hd.ram - 0.6], [5, -hd.ram - 0.6], [7.5, -hd.ch + 0.2], [7.5, hd.ch - 0.2], [5, hd.ram + 0.6], [-0.6, hd.ram + 0.6]];
    el.aIce.innerHTML = s.ram ? iceAt(V.A, ram) : "";
    el.bIce.innerHTML = s.ram ? iceAt(V.B, ram) : "";
    el.bDrain.innerHTML = P.drainHole(V.B, s.drain);
    shown.ram = s.ram;
    shown.drain = s.drain;
  }
  if (shown.ports !== s.ports) {
    el.dIce.innerHTML = s.ports ? iceAt(V.D, P.spIce()) : "";
    el.cIce.innerHTML = s.ports ? [-1, 1].map((sg) => iceAt(V.C, K.rect(sg * M.PORT_R - 26 * (sg < 0 ? 1 : 0) - (sg > 0 ? -0 : 0), M.PORT_WL - 40, sg * M.PORT_R + (sg > 0 ? 26 : 0), M.PORT_WL + 40))).join("") : "";
    shown.ports = s.ports;
  }
  // ---- the alternate valve's spool
  const sp = K.r2(s.valve * P.AV.travel);
  if (shown.valve !== sp) {
    el.eSpool.innerHTML = P.part(10, P.valveSpool(V.E, sp) + P.valveKnob(V.E, sp));
    el.eGroove.setAttribute("d", K.d(V.E, P.valveAir(sp).groove));
    el.lb10.innerHTML = K.balloon(V.E, [P.AV.knob[1] - 4 + sp, 6], LIVE[10].at, 10, { target: 10 });
    shown.valve = sp;
  }
  el.eA.setAttribute("fill-opacity", tint(tr.air.p));
  el.eC.setAttribute("fill-opacity", tint(tr.pCab));
  el.eGroove.setAttribute("fill-opacity", ts);
  // ---- diagram 3
  el.n["n-pit"].textContent = `Δ ${sgn(s.pPit - s.pSt)}${fmtK(Math.abs(s.pPit - s.pSt))}`;
  el.n["n-st"].textContent = `${(s.pSt / 100).toFixed(1)} hPa`;
  el.n["n-vc"].textContent = `Δ ${sgn(s.pVc - s.pSt)}${fmtK(Math.abs(s.pVc - s.pSt))}`;
  el.n["n-ram"].classList.toggle("on", s.ram);
  el.n["n-drain"].classList.toggle("on", s.drain);
  el.n["n-ports"].classList.toggle("on", s.ports || s.valve > 0.5);
  el.n["n-alt"].classList.toggle("on", s.valve < 0.5);
  // ---- charts
  const hFt = M.ft(s.h);
  el.c1Ias.setAttribute("d", `M${cx(s.ias)} ${CH.y0}V${CH.y1}`);
  el.c1Tas.setAttribute("points", Array.from({ length: 21 }, (_, i) => `${cx(M.tasKt(s.ias, (i * CH.hMax) / 20))},${cy((i * CH.hMax) / 20)}`).join(" "));
  el.c1Dot.setAttribute("cx", cx(tr.tas));
  el.c1Dot.setAttribute("cy", cy(hFt));
  el.c1Idot.setAttribute("cx", cx(s.ias));
  el.c1Idot.setAttribute("cy", cy(hFt));
  const t0 = s.ft - CT.span;
  const px = (f) => K.r2(CT.x0 + ((f - t0) / CT.span) * (CT.x1 - CT.x0));
  el.c2True.setAttribute("points", trail.map(([f, v]) => `${px(f)},${ty(v)}`).join(" "));
  el.c2Ind.setAttribute("points", trail.map(([f, , v]) => `${px(f)},${ty(v)}`).join(" "));
  // ---- readouts
  const ph = mode === "tour" ? M.phase(s) : M.phase(s).replace("CRUISE", "LEVEL");
  const warp = s.warp > 1.5 ? ` · ×${Math.round(s.warp)}` : "";
  el.readout.textContent = `${fmtK(hFt)} ft · IAS ${Math.round(s.ias)} · TAS ${Math.round(tr.tas)} kt · ${sgn(s.w)}${fmtK(Math.abs(s.w / M.FPM))} ft/min · q ${fmtK(tr.q)} Pa${warp}`;
  el.readout2.textContent = `ASI ${Math.round(ind.ias)} · ALT ${fmtK(ind.hInd)} · ${Math.round(s.set / 100)} hPa · VSI ${sgn(ind.vsi)}${fmtK(Math.abs(ind.vsi))} · ${ph}`;
  say(`${ph.toLowerCase()}: true ${fmtK(hFt)} feet, ${Math.round(s.ias)} knots; the airspeed indicator shows ${Math.round(ind.ias)}, the altimeter ${fmtK(ind.hInd)}, the vertical speed indicator ${fmtK(ind.vsi)} feet a minute.`, live.clock);
}

// ---------------------------------------------------------------- input
const live = L.run({
  root: svg,
  step,
  render,
  idleAfter: 8,
  onFrozen: () => q.check && C.selfCheck(svg),
});

if (live.reduced && !live.frozen) {
  // a still, true moment: the static ports blocked in the descent, the ASI reading high
  const fake = { touring: true, reduced: false, clock: 0 };
  for (let t = 0; t < 52.5; t += 1 / 240) step(1 / 240, fake);
  render(live);
}

const setBaro = (pa) => (s.set = Math.min(M.BARO.max * 100, Math.max(M.BARO.min * 100, pa)));
for (const hitEl of svg.querySelectorAll("[data-drag]")) {
  let v0 = 0;
  const kind = hitEl.dataset.drag;
  L.dragY(svg, hitEl, {
    start: () => {
      dragging = true;
      toFree();
      v0 = kind === "knob" ? s.set : s.alt ? 1 : 0;
      live.input();
    },
    move: (dy) => {
      if (kind === "knob") setBaro(Math.round((v0 - dy * 20) / 100) * 100);
      else s.alt = dy < -6 ? true : dy > 6 ? false : v0 === 1;
      live.input();
    },
    end: () => {
      dragging = false;
      live.input();
    },
  });
}

svg.addEventListener("keydown", (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === "ArrowLeft" || k === "ArrowRight") {
    toFree();
    ctl.iasCmd = Math.min(160, Math.max(50, ctl.iasCmd + (k === "ArrowRight" ? 5 : -5)));
  } else if (k === "ArrowUp" || k === "ArrowDown") {
    toFree();
    ctl.vsCmd = Math.min(1500, Math.max(-1500, ctl.vsCmd + (k === "ArrowUp" ? 100 : -100)));
  } else if (k === "p") {
    toFree();
    s.ram = !s.ram;
    if (s.ram) s.heat = false;
  } else if (k === "d") {
    toFree();
    s.drain = !s.drain;
    if (s.drain) s.heat = false;
  } else if (k === "o") {
    toFree();
    s.ports = !s.ports;
  } else if (k === "a") {
    toFree();
    s.alt = !s.alt;
  } else if (k === "h") {
    toFree();
    s.heat = !s.heat;
  } else if (k === "[" || k === "]") {
    toFree();
    setBaro(s.set + (k === "]" ? 100 : -100));
  } else if (k === " ") {
    mode = "tour";
    s = M.tourStart();
    trail = [];
  } else if (k === "s") live.slow = live.slow === 1 ? 0.25 : live.slow === 0.25 ? 0.06 : 1;
  else return;
  e.preventDefault();
  live.input();
});

if (q.check && !live.frozen) setTimeout(() => C.selfCheck(svg), 400);

</script>
<script>
"use strict";
const BP_LINKS = {};
const BP_ATLAS = {"slug":"pitot-static","kind":"2d","level":1,"parent":"light-aircraft","parentPart":"17","atlas":false};
const BP_CARDS = (() => {
// Part cards: hover, tap or focus a balloon and a small card names the part, gives its size and
// material, and says in a sentence what it does. The part it points to lights up in the accent.
//
// Works on both pages: a 2D sheet's balloons are <g data-role="balloon" data-target="n">, a 3D page's
// are <g data-part="n"> in its overlay (re-drawn every frame, so everything here is delegated and
// keyed on the number, never on the element). The data comes from examples/<slug>/info.json, which
// kit/page.mjs inlines as BP_INFO when it exists:
//   { "4": { "name": "O-ring", "spec": "33 × 2", "material": "NBR 70", "note": "Seals the barrel..." } }
// 2D: the part's [data-part] groups get the class bp-hl.  3D: a "bp:part" event (detail.id, or null)
// that kit/solid3d.mjs answers by tinting the part.
//
// Atlas (references/atlas.md): a part with "open": "<slug>" is a doorway into another example. Its card
// adds the child's idea and a "Look inside →" link (or "drawing in progress" while the child is not
// drawn). Activating it (the link, Enter on the focused balloon, double-click on the part in 3D) flies
// in and then navigates: a "bp:open" event (detail { id, href, go }) that kit/solid3d.mjs takes over
// by calling preventDefault (it flies the camera, then calls go); on a 2D sheet the viewBox eases in on
// the part here. links: page.mjs's BP_LINKS; atlas: BP_ATLAS, the page's own slug and place.
// The page also answers ?focus=<part> (start zoomed on that part, ease out) and ?from=<slug> (a short
// zoom-out on arrival); on a 3D page kit/solid3d.mjs does both.

function attach({ info = {}, links = null, atlas = null, root = document }) {
  info = info || {};
  const has = Object.keys(info).length > 0;
  const Q = new URLSearchParams(location.search);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const is3d = !!document.getElementById("gl");
  // no flights in a deterministic frame, a sheet's ?zoom= close-up or a check run
  const still = reduced || Q.has("t") || Q.has("check") || (!is3d && Q.has("zoom"));
  const sheet = is3d ? null : root.querySelector("svg.bp-sheet");
  if (!has && !atlas) return null;

  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

  function light(id) {
    for (const el of document.querySelectorAll(".bp-hl")) el.classList.remove("bp-hl");
    if (id != null) for (const el of document.querySelectorAll(`svg [data-part="${CSS.escape(id)}"]`)) if (!el.closest("#ov")) el.classList.add("bp-hl");
    document.dispatchEvent(new CustomEvent("bp:part", { detail: { id } }));
  }

  // ---- atlas: where a doorway leads, and the flight there
  // { slug, href } for a doorway whose child is drawn, { slug, wip: true } while it is not, else null
  const doorway = (id) => {
    const slug = info[id]?.open;
    if (!slug) return null;
    const l = links?.[slug];
    const href = l ? (is3d ? l.href3d || l.href2d : l.href2d) || l.href : null;
    if (!href) return { slug, wip: true };
    const from = atlas?.slug ? `${href.includes("?") ? "&" : "?"}from=${encodeURIComponent(atlas.slug)}` : "";
    return { slug, href: href + from, title: l.title, idea: l.idea };
  };
  let going = false;
  function go(id) {
    const d = doorway(id);
    if (!d?.href || going) return;
    going = true;
    // inside a frame (a landing-page hero) the whole window goes, not the little frame
    const nav = () => {
      const abs = new URL(d.href, location.href).href;
      try { if (window.top !== window) return window.top.location.assign(abs); } catch {}
      location.assign(abs);
    };
    if (still) return nav();
    hide();
    // a 3D page flies its camera and calls go; otherwise a sheet zooms its viewBox; else straight there
    const ev = new CustomEvent("bp:open", { cancelable: true, detail: { id, href: d.href, go: nav } });
    if (!document.dispatchEvent(ev)) return;
    if (sheet) flySheet(id, nav);
    else nav();
  }

  // 2D: the sheet's viewBox, eased between two boxes [x, y, w, h]
  const full = sheet ? (sheet.getAttribute("viewBox") || "0 0 1200 848").split(/[\s,]+/).map(Number) : null;
  let anim = 0;
  function tween(a, b, ms, done) {
    cancelAnimationFrame(anim);
    const t0 = performance.now();
    const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, t)));
    const step = (now) => {
      const k = ease((now - t0) / ms);
      sheet.setAttribute("viewBox", a.map((v, i) => +(v + (b[i] - v) * k).toFixed(2)).join(" "));
      if (now - t0 < ms) anim = requestAnimationFrame(step);
      else done?.();
    };
    anim = requestAnimationFrame(step);
  }
  // the part's box in sheet units: of the view (data-geom) nearest its balloon's leader end, padded
  // and grown to the sheet's aspect
  function partBox(id) {
    if (!sheet) return null;
    const inv = sheet.getScreenCTM()?.inverse();
    if (!inv) return null;
    const pt = (x, y) => new DOMPoint(x, y).matrixTransform(inv);
    const groups = new Map();
    for (const el of sheet.querySelectorAll(`[data-part="${CSS.escape(id)}"]`)) {
      if (el.closest('[data-role="balloon"]')) continue;
      const r = el.getBoundingClientRect();
      if (!r.width && !r.height) continue;
      const a = pt(r.left, r.top);
      const b = pt(r.right, r.bottom);
      const key = el.closest("[data-geom]") ?? sheet;
      const g = groups.get(key) ?? [Infinity, Infinity, -Infinity, -Infinity];
      groups.set(key, [Math.min(g[0], a.x), Math.min(g[1], a.y), Math.max(g[2], b.x), Math.max(g[3], b.y)]);
    }
    if (!groups.size) return null;
    const at = sheet.querySelector(`[data-role="balloon"][data-target="${CSS.escape(id)}"]`)?.dataset.at?.split(/\s+/).map(Number);
    let best = null;
    let score = Infinity;
    for (const g of groups.values()) {
      const s = at ? Math.hypot((g[0] + g[2]) / 2 - at[0], (g[1] + g[3]) / 2 - at[1]) : -(g[2] - g[0]) * (g[3] - g[1]);
      if (s < score) [score, best] = [s, g];
    }
    const [x0, y0, x1, y1] = best;
    let w = Math.max(24, (x1 - x0) * 1.5);
    let h = Math.max(24, (y1 - y0) * 1.5);
    const aspect = full[2] / full[3];
    if (w / h < aspect) w = h * aspect;
    else h = w / aspect;
    w = Math.min(w, full[2]);
    h = Math.min(h, full[3]);
    return [(x0 + x1) / 2 - w / 2, (y0 + y1) / 2 - h / 2, w, h];
  }
  function flySheet(id, nav) {
    const box = partBox(id);
    if (!box) return nav();
    light(id);
    sheet.classList.add("bp-flying");
    tween(full, box, 900, nav);
  }
  // back to this page from the browser's cache: the whole sheet, not the end of the flight
  addEventListener("pageshow", (e) => {
    if (!e.persisted) return;
    going = false;
    if (sheet) {
      cancelAnimationFrame(anim);
      sheet.setAttribute("viewBox", full.join(" "));
      sheet.classList.remove("bp-flying");
      light(null);
    }
  });
  // arriving: ?focus=<part> starts on that part and eases out to the whole sheet; ?from= a short zoom-out
  if (sheet && !still) {
    const focus = Q.get("focus");
    const box = focus ? partBox(focus) : null;
    if (box) {
      sheet.setAttribute("viewBox", box.join(" "));
      if (info[focus]) light(focus);
      tween(box, full, 900, () => setTimeout(() => light(null), 600));
    } else if (Q.has("from")) {
      const z = 1 / 1.35;
      const a = [full[0] + (full[2] * (1 - z)) / 2, full[1] + (full[3] * (1 - z)) / 2, full[2] * z, full[3] * z];
      sheet.setAttribute("viewBox", a.join(" "));
      tween(a, full, 650);
    }
  }
  if (!has) return null;

  const card = document.createElement("div");
  card.className = "bp-card";
  card.setAttribute("role", "dialog");
  card.setAttribute("aria-live", "polite");
  card.hidden = true;
  document.body.appendChild(card);

  let shown = null;
  let pinned = false;

  // the balloon under an element, and its part number
  const balloonOf = (el) => el?.closest?.('[data-role="balloon"], #ov [data-part], .v3-stage [data-part]');
  // the balloon at a point: look through transparent drag targets (a sheet's hit rectangles lie over
  // its balloons in places), never through real geometry
  const balloonAt = (x, y) => {
    for (const el of document.elementsFromPoint(x, y)) {
      const b = balloonOf(el);
      if (b) return b;
      if (!el.matches?.("[data-drag], .hit")) return null;
    }
    return null;
  };
  const numberOf = (b) => {
    if (!b) return null;
    return partNo(b.dataset.target || b.dataset.part || b.querySelector("text")?.textContent);
  };
  // a second copy of a part ("3u" in a 3D scene) shares its card with the item number it starts with
  const partNo = (v) => {
    const raw = String(v ?? "").trim();
    const n = info[raw] ? raw : raw.match(/^\d+/)?.[0];
    return n && info[n] ? n : null;
  };

  function place(x, y) {
    const pad = 12;
    const w = card.offsetWidth;
    const h = card.offsetHeight;
    let left = x + 16;
    let top = y + 16;
    if (left + w > innerWidth - pad) left = x - w - 16;
    if (left < pad) left = pad;
    if (top + h > innerHeight - pad) top = y - h - 16;
    if (top < pad) top = pad;
    card.style.left = `${left + scrollX}px`;
    card.style.top = `${top + scrollY}px`;
  }

  function show(id, x, y) {
    const p = info[id];
    if (!p) return hide();
    if (shown !== id) {
      const sub = [p.spec, p.material, p.qty && p.qty !== "1" ? `× ${p.qty}` : ""].filter(Boolean).map(esc).join(" · ");
      const d = doorway(id);
      const door = !d
        ? ""
        : d.href
          ? (d.idea ? `<p class="bp-card-i">${esc(d.idea)}</p>` : "") + `<a class="bp-card-go" href="${esc(d.href)}" data-open="${esc(id)}">${esc(info[id].openLabel || "Look inside")} →</a>`
          : `<div class="bp-card-wip">Inside: drawing in progress</div>`;
      card.innerHTML =
        `<div class="bp-card-h"><span class="bp-card-n">${esc(id)}</span><b>${esc(p.name)}</b></div>` +
        (sub ? `<div class="bp-card-s">${sub}</div>` : "") +
        (p.note ? `<p>${esc(p.note)}</p>` : "") +
        door +
        (pinned ? `<div class="bp-card-x">Esc or click elsewhere to close</div>` : "");
      card.hidden = false;
      shown = id;
      light(id);
    }
    place(x, y);
  }

  function hide() {
    card.hidden = true;
    shown = null;
    pinned = false;
    light(null);
  }

  card.addEventListener("click", (e) => {
    const a = e.target.closest?.("[data-open]");
    if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return; // a new tab: let the link be a link
    e.preventDefault();
    go(a.dataset.open);
  });

  // hover (pointer): follow whatever balloon is under the pointer; the 3D overlay is re-drawn each
  // frame, so ask the document what is under the pointer rather than trusting enter/leave events
  addEventListener("pointermove", (e) => {
    if (pinned || e.pointerType === "touch") return;
    const id = numberOf(balloonAt(e.clientX, e.clientY));
    if (id) show(id, e.clientX, e.clientY);
    else if (shown) hide();
  }, { passive: true });

  // click or tap pins the card; it must not start an orbit or a drag underneath
  addEventListener("pointerdown", (e) => {
    const b = balloonAt(e.clientX, e.clientY);
    const id = numberOf(b);
    if (id) {
      e.stopPropagation();
      e.preventDefault();
      pinned = false;
      shown = null;
      pinned = true;
      show(id, e.clientX, e.clientY);
    } else if (pinned && !card.contains(e.target)) hide();
  }, true);
  // double-click a doorway's balloon: straight in
  addEventListener("dblclick", (e) => {
    const id = numberOf(balloonAt(e.clientX, e.clientY));
    if (id && doorway(id)?.href) {
      e.preventDefault();
      go(id);
    }
  });
  // double-click on a doorway part in 3D: kit/solid3d.mjs names the part under the pointer
  document.addEventListener("bp:dblpart", (e) => {
    const id = partNo(e.detail?.id);
    if (id && doorway(id)?.href) {
      e.preventDefault();
      go(id);
    }
  });

  addEventListener("keydown", (e) => {
    if (e.key === "Escape" && shown) hide();
  });

  // keyboard: static (2D) balloons are focusable buttons; focus shows the card, Enter or Space pins
  // it, and Enter on a doorway's balloon looks inside
  for (const b of root.querySelectorAll('[data-role="balloon"]')) {
    const id = numberOf(b);
    if (!id) continue;
    const d = doorway(id);
    b.setAttribute("tabindex", "0");
    b.setAttribute("role", "button");
    b.setAttribute("aria-label", `Part ${id}: ${info[id].name}${d?.href ? `. Enter to look inside: ${d.title}` : d ? ". Inside: drawing in progress" : ""}`);
    const at = () => { const r = b.getBoundingClientRect(); return [r.right, r.top]; };
    b.addEventListener("focus", () => show(id, ...at()));
    b.addEventListener("blur", () => { if (!pinned) hide(); });
    b.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && d?.href) { e.preventDefault(); go(id); return; }
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pinned = true; shown = null; show(id, ...at()); }
    });
  }

  // keyboard on a 3D page: its balloons are drawn afresh every frame and can't hold focus, so the
  // doorways get a short list of real buttons, out of sight until focused; each shows its card at
  // its balloon, Enter looks inside
  const doors = Object.keys(info).filter((id) => doorway(id));
  const stage = document.getElementById("stage");
  if (is3d && stage && doors.length) {
    const nav = document.createElement("nav");
    nav.className = "bp-doors";
    nav.setAttribute("aria-label", "Look inside a part");
    nav.innerHTML = doors.map((id) => { const d = doorway(id); return `<button type="button" data-door="${esc(id)}"${d.href ? "" : " aria-disabled=\"true\""}>${esc(id)} ${esc(info[id].name)}${d.href ? " →" : " · in progress"}</button>`; }).join("");
    stage.before(nav); // not inside the stage: it is role="img", whose children are presentational
    const where = (id, btn) => {
      const g = document.querySelector(`#ov [data-part="${CSS.escape(id)}"]`);
      const r = (g ?? btn).getBoundingClientRect();
      return [r.right, r.top];
    };
    nav.addEventListener("focusin", (e) => { const id = e.target.dataset?.door; if (id) { shown = null; show(id, ...where(id, e.target)); } });
    nav.addEventListener("focusout", () => { if (!pinned) hide(); });
    nav.addEventListener("click", (e) => { const id = e.target.closest?.("[data-door]")?.dataset.door; if (id) go(id); });
    nav.addEventListener("keydown", (e) => e.stopPropagation()); // its keys are its own, not the stage's
  }

  addEventListener("scroll", () => { if (shown && !pinned) hide(); }, { passive: true });
  return { show, hide, go };
}

aterial":"Aluminium","qty":"3","note":"Long pointer hundreds, short pointer thousands, thin pointer with the triangle tens of thousands: misreading them by 10 000 ft is a classic error."},"22":{"name":"Baro knob, ring gear and scale","spec":"Knob lower left, Kollsman scale 950–1050 hPa","material":"Brass / aluminium","qty":"1","note":"Set the day's sea-level pressure (QNH) in the window and the altimeter reads height above the sea. Each hectopascal wrong is about 27 ft wrong."},"23":{"name":"VSI case, glass and dial","spec":"3⅛ in case, its only opening the metering unit","material":"A380 / glass","qty":"1","note":"The case's air lags the static pressure; the capsule's does not. Zero at nine o'clock, up clockwise, ±1000 ft/min at the vertical, compressed to ±2000."},"24":{"name":"VSI diaphragm capsule","spec":"Ø46, open to static through the fitting","material":"Beryllium copper","qty":"1","note":"In a climb static falls, the capsule's air with it at once, but the case's air is still higher: the capsule shrinks and the pointer shows the climb."},"25":{"name":"Metering unit","spec":"Capillary Ø0.25×10 into a 300 cm³ case","material":"Brass / ruby jewel","qty":"1","note":"The calibrated leak: Hagen–Poiseuille flow makes the case a first-order lag, τ = 8μLV/πr⁴p, about 5.5 s at sea level, so the pressure difference measures the climb rate."},"26":{"name":"VSI movement and pointer","spec":"As the ASI's: crank, rocking shaft, sector 10.3:1, pinion, hairspring","material":"Brass / stainless","qty":"1","note":"The case lags by τ, so a steady climb holds a steady Δp = ρgwτ. The reading lags too: it needs about three τ to settle after any change."}}, links: BP_LINKS, atlas: BP_ATLAS });
