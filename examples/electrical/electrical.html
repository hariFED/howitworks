<!doctype html>
<html lang="en" data-theme="blueprint">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>28 V Aircraft Electrical System</title>
<meta name="description" content="A live engineering drawing of a light aircraft's 28 V DC electrical system: the alternator with its claw-pole rotor, slip rings and diode bridge, the regulator, the battery, the starter's Bendix pinion at the ring gear, the master switch, contactors, buses, ammeter, low-voltage light and push-pull thermal breakers, from one model.">
<style>
/* Blueprint sheet styles. Every colour a drawing uses is one of these tokens. */

:root,
[data-theme="blueprint"] {
  --bp-page: #0a2747;
  --bp-paper: #123b69;
  --bp-ink: #e9f1ff;
  --bp-hatch: rgba(214, 230, 255, 0.72);
  --bp-muted: #95b3da;
  --bp-grid: rgba(190, 215, 255, 0.07);
  --bp-accent: #ffc94d;
  --bp-accent-ink: #ffd77a;
  --bp-ui: rgba(233, 241, 255, 0.12);
  /* 3D mode (solid3d.mjs): uncut surfaces in three tones, lit, mid and shadow */
  --bp3-lit: #2a5a93;
  --bp3-mid: #1d4a7e;
  --bp3-dark: #133864;
}
[data-theme="paper"] {
  --bp-page: #e4dfd1;
  --bp-paper: #f7f3e8;
  --bp-ink: #1c2633;
  --bp-hatch: rgba(28, 38, 51, 0.78);
  --bp-muted: #616b78;
  --bp-grid: rgba(28, 38, 51, 0.045);
  --bp-accent: #d4472c;
  --bp-accent-ink: #b8361e;
  --bp-ui: rgba(28, 38, 51, 0.08);
  --bp3-lit: #ece6d8;
  --bp3-mid: #d9d0bc;
  --bp3-dark: #bdb29b;
}
[data-theme="white"] {
  --bp-page: #fafafa;
  --bp-paper: #fafafa;
  --bp-ink: #262626;
  --bp-hatch: rgba(38, 38, 38, 0.42);
  --bp-muted: #8f8f8f;
  --bp-grid: rgba(0, 0, 0, 0);
  --bp-accent: #e2552c;
  --bp-accent-ink: #c8442b;
  --bp-ui: rgba(0, 0, 0, 0.07);
  --bp3-lit: #f1f1f0;
  --bp3-mid: #e0e0de;
  --bp3-dark: #c4c4c1;
}
[data-theme="dark"] {
  --bp-page: #0d0f12;
  --bp-paper: #15181c;
  --bp-ink: #dde3ea;
  --bp-hatch: rgba(221, 227, 234, 0.62);
  --bp-muted: #86919d;
  --bp-grid: rgba(221, 227, 234, 0.035);
  --bp-accent: #f29f3d;
  --bp-accent-ink: #f6b462;
  --bp-ui: rgba(221, 227, 234, 0.08);
  --bp3-lit: #353b43;
  --bp3-mid: #272c32;
  --bp3-dark: #1b1e22;
}

:root {
  --bp-thick: 1.15px;
  --bp-thin: 0.55px;
  --bp-font: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}

html,
body {
  margin: 0;
  background: var(--bp-page);
  color: var(--bp-ink);
  font-family: var(--bp-font);
}
.bp-page {
  max-width: 1480px;
  margin: 0 auto;
  padding: 24px 16px 40px;
  box-sizing: border-box;
}
.bp-figure {
  margin: 0;
}
.bp-sheet {
  display: block;
  width: 100%;
  height: auto;
  outline: none;
  border-radius: 2px;
}
.bp-sheet:focus-visible {
  box-shadow: 0 0 0 2px var(--bp-accent);
}
.bp-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  font-size: 12px;
  color: var(--bp-muted);
  letter-spacing: 0.03em;
}
.bp-bar kbd {
  font: inherit;
  color: var(--bp-ink);
  border: 1px solid var(--bp-ui);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 0 4px;
}
.bp-themes {
  display: flex;
  gap: 4px;
}
.bp-themes button {
  font: inherit;
  color: var(--bp-muted);
  background: transparent;
  border: 1px solid var(--bp-ui);
  border-radius: 3px;
  padding: 3px 9px;
  cursor: pointer;
}
.bp-themes button[aria-pressed="true"] {
  color: var(--bp-ink);
  background: var(--bp-ui);
}
.bp-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Zoom mode (?zoom=x,y,w,h): the region fills the window, for close-up checks. */
body.bp-zoom .bp-page {
  max-width: none;
  padding: 0;
}
body.bp-zoom .bp-sheet {
  width: 100vw;
  height: 100vh;
}
body.bp-zoom .bp-bar {
  display: none;
}

/* ---- the drawing */
.bp-sheet .sheet-bg {
  fill: var(--bp-paper);
}
.bp-sheet .grid {
  fill: none;
  stroke: var(--bp-grid);
  stroke-width: 0.5px;
}
.bp-sheet .vis,
.bp-sheet .thin,
.bp-sheet .hid,
.bp-sheet .ctr,
.bp-sheet .phan {
  fill: none;
  stroke: var(--bp-ink);
  stroke-linejoin: round;
  stroke-linecap: round;
}
.bp-sheet .vis {
  stroke-width: var(--bp-thick);
}
.bp-sheet .thin,
.bp-sheet .hid,
.bp-sheet .ctr,
.bp-sheet .phan {
  stroke-width: var(--bp-thin);
}
.bp-sheet .hid {
  stroke-dasharray: 4 2.2;
  stroke-linecap: butt;
}
.bp-sheet .ctr {
  stroke-dasharray: 15 2.6 2 2.6;
  stroke-linecap: butt;
}
.bp-sheet .phan {
  stroke-dasharray: 13 2.4 1.8 2.4 1.8 2.4;
  stroke-linecap: butt;
}
.bp-sheet .vis.spring {
  stroke-width: var(--bp-thin);
}
.bp-sheet .paper,
.bp-sheet .balloon {
  fill: var(--bp-paper);
}
.bp-sheet .balloon {
  stroke: var(--bp-ink);
  stroke-width: var(--bp-thin);
}
.bp-sheet .solid,
.bp-sheet .head,
.bp-sheet .dot {
  fill: var(--bp-ink);
}
.bp-sheet .hl {
  fill: none;
  stroke: var(--bp-hatch);
  stroke-width: 0.5px;
}
.bp-sheet .hl-dash {
  stroke-dasharray: 1.3 1.3;
}
.bp-sheet .hd {
  fill: var(--bp-hatch);
}
.bp-sheet .tint {
  fill: var(--bp-accent);
}
.bp-sheet .accent {
  stroke: var(--bp-accent);
}
.bp-sheet .accent-fill {
  fill: var(--bp-accent);
}
.bp-sheet .t {
  font-family: var(--bp-font);
  font-size: 9.5px;
  fill: var(--bp-ink);
  letter-spacing: 0.02em;
}
.bp-sheet .t-sm {
  font-size: 7.6px;
}
.bp-sheet .t-lg {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
}
.bp-sheet .t-xl {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.05em;
}
.bp-sheet .t-cap {
  font-size: 6.2px;
  fill: var(--bp-muted);
  letter-spacing: 0.08em;
}
.bp-sheet .t-head {
  font-weight: 600;
  letter-spacing: 0.06em;
}
.bp-sheet .t-mute {
  fill: var(--bp-muted);
}
.bp-sheet .t-accent {
  fill: var(--bp-accent-ink);
}
.bp-sheet [data-drag] {
  cursor: ns-resize;
  touch-action: none;
}

/* ---- part cards (kit/info.mjs): hover, tap or focus a balloon */
[data-role="balloon"][tabindex], #ov g[data-part] { cursor: pointer; }
#ov g[data-part] { pointer-events: auto; }
[data-role="balloon"]:hover .balloon, [data-role="balloon"]:focus .balloon, #ov g[data-part]:hover .balloon { stroke: var(--bp-accent); stroke-width: 1.6px; }
[data-role="balloon"]:focus { outline: none; }
.bp-hl .vis, .bp-hl .thin, .bp-hl path, .bp-hl circle, .bp-hl polygon, .bp-hl rect { stroke: var(--bp-accent) !important; }
.bp-hl .vis { stroke-width: calc(var(--bp-thick) * 1.8) !important; }
.bp-card {
  position: absolute; z-index: 50; max-width: 280px; padding: 10px 12px 11px; box-sizing: border-box;
  background: var(--bp-paper); color: var(--bp-ink); border: 1px solid var(--bp-ink); border-radius: 3px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, .14); font: 12px/1.45 var(--bp-font); pointer-events: auto;
}
.bp-card[hidden] { display: none; }
.bp-card-h { display: flex; gap: 8px; align-items: center; }
.bp-card-h b { font-weight: 600; letter-spacing: .02em; text-transform: uppercase; font-size: 11.5px; }
.bp-card-n { flex: none; display: inline-grid; place-items: center; width: 20px; height: 20px; border: 1px solid var(--bp-ink); border-radius: 50%; font-size: 10.5px; }
.bp-card-s { margin: 4px 0 0 28px; color: var(--bp-muted); font-size: 10.5px; letter-spacing: .02em; }
.bp-card p { margin: 7px 0 0; font-size: 11.5px; line-height: 1.5; }
.bp-card-x { margin-top: 7px; color: var(--bp-muted); font-size: 9.5px; letter-spacing: .03em; }

/* ---- the sheet's link to its 3D view */
.bp-3d { font: inherit; color: var(--bp-paper); background: var(--bp-ink); text-decoration: none; border-radius: 3px; padding: 4px 10px; letter-spacing: .03em; white-space: nowrap; }
.bp-3d:hover, .bp-3d:focus-visible { background: var(--bp-accent); color: #fff; outline: none; }

/* ---- atlas (references/atlas.md): doorways, breadcrumb */
.bp-card-i { font-family: var(--bp-font); font-style: italic; color: var(--bp-muted); }
.bp-card-go { display: inline-block; margin-top: 8px; color: var(--bp-paper); background: var(--bp-ink); text-decoration: none; border-radius: 3px; padding: 3px 9px; font-size: 11px; letter-spacing: .03em; }
.bp-card-go:hover, .bp-card-go:focus-visible { background: var(--bp-accent); color: #fff; outline: none; }
.bp-card-wip { margin-top: 7px; color: var(--bp-muted); font-size: 10.5px; letter-spacing: .03em; }
.bp-crumbs { display: flex; flex-wrap: wrap; gap: 4px 7px; align-items: center; letter-spacing: .04em; }
.bp-crumbs a { color: var(--bp-ink); text-decoration: none; border-bottom: 1px solid var(--bp-ui); }
.bp-crumbs a:hover, .bp-crumbs a:focus-visible { color: var(--bp-accent); border-color: currentColor; outline: none; }
.bp-crumbs i { font-style: normal; color: var(--bp-muted); }
.bp-crumbs [aria-current] { color: var(--bp-ink); }
.bp-doors { position: fixed; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); z-index: 40; }
.bp-doors:focus-within { width: auto; height: auto; clip-path: none; left: 22px; top: 54px; display: flex; flex-direction: column; gap: 3px; padding: 6px; background: var(--bp-paper); border: 1px solid var(--bp-ink); border-radius: 3px; }
.bp-doors button { font: 11px/1.3 var(--bp-font); text-align: left; color: var(--bp-ink); background: transparent; border: 1px solid var(--bp-ui); border-radius: 3px; padding: 3px 8px; cursor: pointer; }
.bp-doors button:focus-visible { outline: none; border-color: var(--bp-accent); color: var(--bp-accent); }
.bp-doors button[aria-disabled="true"] { color: var(--bp-muted); }
.bp-flying { pointer-events: none; }

.bp-sheet .hit{fill:transparent}.bp-sheet [data-cb],.bp-sheet [data-sw],.bp-sheet [data-key]{cursor:pointer}.bp-sheet [data-drag]{cursor:ew-resize}.bp-sheet .tint.acid{fill:url(#acid)}.bp-sheet .acid-dot{fill:var(--bp-muted)}.bp-sheet .tint.lit,.bp-sheet .cu{fill:url(#lit)}.bp-sheet .lit-dot{fill:var(--bp-accent)}.bp-sheet .grid-line{stroke:var(--bp-grid);stroke-width:.6px}.bp-sheet .paper-fill{fill:var(--bp-paper)}.bp-sheet .paper-line{stroke:var(--bp-paper);stroke-width:.3px;fill:none}.bp-sheet .wire{fill:none;stroke-width:.8px;stroke-linejoin:round}.bp-sheet .bus{fill:var(--bp-ink)}.bp-sheet .thick2{stroke-width:2.4px}.bp-sheet .cur{fill:none;stroke:var(--bp-accent);stroke-width:3.2px;stroke-linejoin:round;stroke-dasharray:2.2 3.2}.bp-sheet .accent-line{stroke:var(--bp-accent);fill:none}.bp-sheet polyline.accent-line{stroke-width:1.1px}
</style>
</head>

<script>
"use strict";
const K = (() => {
// Blueprint drafting kit: orthographic views, sections, hatching, dimensions and sheet furniture.
// Every function here is pure and returns SVG markup strings, so the same code runs in the build
// and, inlined, in the page (live dimensions, moving springs, needles).
//
// Units. World geometry is in millimetres of the real object: u to the right, v up (a front view),
// or u right, v away from the viewer (a plan view). The sheet is an A2 drawing, 594 mm wide, drawn
// 1200 units wide; a view maps world mm to sheet units through its drawing scale.

const SHEET = { w: 1200, h: 848 };
const PX_PER_MM = SHEET.w / 594;

// ISO 128 line widths and ISO 3098 lettering, in sheet units (A2: 0.5 / 0.25 mm lines, 3.5 mm text).
const THICK = 1.15;
const THIN = 0.55;
const TEXT = 9.5;
const ARROW = 7;
const GAP = 2.2; // extension lines start this far from the object
const OVER = 3.5; // and run this far past the dimension line

const r2 = (n) => Math.round(n * 100) / 100;

function fmt(n, digits = 1) {
  const near = Math.round(n);
  if (Math.abs(n - near) < 0.05) return String(near);
  return n.toFixed(digits);
}

// ---------------------------------------------------------------- views

// A view is a window from world mm onto the sheet. scale is the drawing scale (1/2.5 for "1:2.5").
function view({ x, y, scale, name = "" }) {
  const k = scale * PX_PER_MM;
  return { x, y, scale, k, name, p: ([u, v]) => [r2(x + u * k), r2(y - v * k)] };
}

const scaleLabel = (scale) => (scale >= 1 ? `${fmt(scale)}:1` : `1:${fmt(1 / scale)}`);

function d(V, pts, closed = true) {
  let out = "";
  for (let i = 0; i < pts.length; i++) {
    const [x, y] = V.p(pts[i]);
    out += `${i ? "L" : "M"}${x} ${y}`;
  }
  return closed ? out + "Z" : out;
}

// ---------------------------------------------------------------- world geometry (point lists)

const rect = (u0, v0, u1, v1) => [[u0, v0], [u1, v0], [u1, v1], [u0, v1]];

function arc(cu, cv, r, a0, a1, steps) {
  const n = steps ?? Math.max(3, Math.ceil(Math.abs(a1 - a0) / 7.5));
  const out = [];
  for (let i = 0; i <= n; i++) {
    const a = ((a0 + ((a1 - a0) * i) / n) * Math.PI) / 180;
    out.push([cu + r * Math.cos(a), cv + r * Math.sin(a)]);
  }
  return out;
}

const circle = (cu, cv, r, steps = 48) => arc(cu, cv, r, 0, 360 - 360 / steps, steps - 1);

// A rectangle with filleted corners.
function rrect(u0, v0, u1, v1, r, steps = 4) {
  const q = Math.min(r, (u1 - u0) / 2, (v1 - v0) / 2);
  return [
    ...arc(u1 - q, v0 + q, q, -90, 0, steps),
    ...arc(u1 - q, v1 - q, q, 0, 90, steps),
    ...arc(u0 + q, v1 - q, q, 90, 180, steps),
    ...arc(u0 + q, v0 + q, q, 180, 270, steps),
  ];
}

const move = (pts, du, dv) => pts.map(([u, v]) => [u + du, v + dv]);
const flipU = (pts, about = 0) => pts.map(([u, v]) => [2 * about - u, v]).reverse();
const flipV = (pts, about = 0) => pts.map(([u, v]) => [u, 2 * about - v]).reverse();

function inside([u, v], poly) {
  let hit = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [ui, vi] = poly[i];
    const [uj, vj] = poly[j];
    if (vi > v !== vj > v && u < ((uj - ui) * (v - vi)) / (vj - vi) + ui) hit = !hit;
  }
  return hit;
}

// A body of revolution cut through its axis.
// loop is the half-profile as [r, s] pairs: r >= 0 measured from the axis, s along the axis.
// axis "v" is a vertical axis at u = at; axis "u" a horizontal axis at v = at.
// Returns the cut faces (hatched) and the edges seen through the bore behind the cutting plane:
// every circle on an inner surface shows edge-on as a straight line across the bore.
function revolve(loop, { axis = "v", at = 0 } = {}) {
  const place = axis === "v" ? (r, s) => [at + r, s] : (r, s) => [s, at + r];
  const n = loop.length;
  const onAxis = loop.findIndex(([r], i) => r === 0 && loop[(i + 1) % n][0] === 0);
  let cuts;
  if (onAxis >= 0) {
    const chain = Array.from({ length: n }, (_, j) => loop[(onAxis + 1 + j) % n]);
    const right = chain.map(([r, s]) => place(r, s));
    const left = chain.slice(1, -1).reverse().map(([r, s]) => place(-r, s));
    cuts = [[...right, ...left]];
  } else {
    cuts = [loop.map(([r, s]) => place(r, s)), loop.map(([r, s]) => place(-r, s)).reverse()];
  }
  const eps = 1e-3;
  const across = new Map();
  const clear = (r, s) => [0.02, 0.25, 0.5, 0.75, 0.98].every((t) => !inside([t * r, s], loop));
  for (const [r, s] of loop) {
    if (r <= 0) continue;
    if (clear(r, s + eps) && clear(r, s - eps)) across.set(s, Math.max(across.get(s) ?? 0, r));
  }
  const edges = [...across].map(([s, r]) => [place(-r, s), place(r, s)]);
  return { cuts, edges };
}

// ---------------------------------------------------------------- hatching

// ANSI/ISO-style material hatches. Spacing is in sheet units and never scales with the view,
// so a detail at 2:1 shows the same density as the main view, as on a real drawing.
const MATERIALS = {
  steel: { kind: "lines", gap: 3.4 },
  iron: { kind: "lines", gap: 5.6 },
  alu: { kind: "pairs", gap: 5.2, pair: 1.5 },
  brass: { kind: "dashed", gap: 4.6 },
  bronze: { kind: "dashed", gap: 3.6 },
  rubber: { kind: "cross", gap: 3.2 },
  plastic: { kind: "lines", gap: 2.3 },
  foam: { kind: "dots", gap: 2.6 },
  wood: { kind: "grain", gap: 4 },
};
const ANGLES = [45, 135, 30, 60];

function hatchDefs() {
  let out = "";
  for (const [name, m] of Object.entries(MATERIALS)) {
    for (const angle of ANGLES) {
      const g = m.gap;
      let body = "";
      if (m.kind === "lines") body = `<path class="hl" d="M0 -1V${g + 1}"/>`;
      if (m.kind === "pairs") body = `<path class="hl" d="M0 -1V${g + 1}M${m.pair} -1V${g + 1}"/>`;
      if (m.kind === "dashed") body = `<path class="hl" d="M0 -1V${g + 1}"/><path class="hl hl-dash" d="M${g / 2} -1V${g + 1}"/>`;
      if (m.kind === "cross") body = `<path class="hl" d="M0 -1V${g + 1}M-1 0H${g + 1}"/>`;
      if (m.kind === "dots") body = `<circle class="hd" cx="${g / 2}" cy="${g / 2}" r="0.42"/>`;
      if (m.kind === "grain") body = `<path class="hl" d="M0 -1V${g + 1}"/><path class="hl" d="M${g * 0.55} -1C${g * 0.75} ${g * 0.3} ${g * 0.35} ${g * 0.7} ${g * 0.55} ${g + 1}"/>`;
      out += `<pattern id="h-${name}-${angle}" patternUnits="userSpaceOnUse" width="${g}" height="${g}" patternTransform="rotate(${angle})">${body}</pattern>`;
    }
  }
  return out;
}

// ---------------------------------------------------------------- drawing parts

// A cut face: paper underneath (it hides what is behind), the material hatch, a thick outline.
// mat "solid" blacks the section in, the ISO convention for sections too thin to hatch.
function cut(V, pts, { mat = "steel", angle = 45 } = {}) {
  const dd = d(V, pts);
  if (mat === "solid") return `<path class="solid" d="${dd}"/>`;
  return `<path class="paper" d="${dd}"/><path fill="url(#h-${mat}-${angle})" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

// A body of revolution in section, with the edges behind the cut.
function section(V, rev, opts) {
  return rev.cuts.map((c) => cut(V, c, opts)).join("") + rev.edges.map((e) => line(V, e)).join("");
}

// An unsectioned solid (shafts, rods, pins, balls, nuts and ribs are never hatched in a section).
function body(V, pts) {
  const dd = d(V, pts);
  return `<path class="paper" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

const line = (V, pts, cls = "vis", closed = false) => `<path class="${cls}" d="${d(V, pts, closed)}"/>`;
const lines = (V, list, cls = "vis") => `<path class="${cls}" d="${list.map((pts) => d(V, pts, false)).join("")}"/>`;

// A centre line, run a little past the outline at both ends.
function centerline(V, a, b, over = 6) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  return `<path class="ctr" d="M${r2(ax - ux * over)} ${r2(ay - uy * over)}L${r2(bx + ux * over)} ${r2(by + uy * over)}"/>`;
}

// Centre mark for a circle in a view: two crossed centre lines.
function centerMark(V, [cu, cv], r, over = 5) {
  return centerline(V, [cu - r, cv], [cu + r, cv], over) + centerline(V, [cu, cv - r], [cu, cv + r], over);
}

// A compression spring cut along its axis: wire sections (blacked in) on both sides, half a pitch
// apart, joined by the back half of each turn. from/to are positions along the axis.
function springSection(V, { from, to, radius, wire, turns, axis = "u", at = 0 }) {
  const place = axis === "u" ? (s, r) => [s, at + r] : (s, r) => [at + r, s];
  const pitch = (to - from - wire) / turns;
  const start = from + wire / 2;
  const back = [];
  let sections = "";
  for (let i = 0; i <= turns; i++) {
    const sTop = start + i * pitch;
    sections += cut(V, circle(...place(sTop, radius), wire / 2, 12), { mat: "solid" });
    if (i < turns) {
      const sBot = sTop + pitch / 2;
      sections += cut(V, circle(...place(sBot, -radius), wire / 2, 12), { mat: "solid" });
      back.push([place(sTop, radius), place(sBot, -radius)]);
    }
  }
  return lines(V, back, "vis spring") + sections;
}

// ---------------------------------------------------------------- annotation

function arrowHead([x, y], [dx, dy]) {
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len;
  const uy = dy / len;
  const bx = x - ux * ARROW;
  const by = y - uy * ARROW;
  const half = ARROW * 0.25;
  return `M${r2(x)} ${r2(y)}L${r2(bx - uy * half)} ${r2(by + ux * half)}L${r2(bx + uy * half)} ${r2(by - ux * half)}Z`;
}

const textWidth = (s, size = TEXT) => String(s).length * size * 0.6;

// A linear dimension between two world points, measured along dir ("h" or "v").
// off is the sheet distance from point a to the dimension line (negative: up or left).
// The value is measured from the geometry unless text is given, so a dimension cannot lie.
function dim(V, a, b, { dir = "h", off = 18, text, prefix = "", suffix = "", id = "", cls = "" } = {}) {
  const A = V.p(a);
  const B = V.p(b);
  const value = text ?? prefix + fmt(Math.abs(dir === "h" ? b[0] - a[0] : b[1] - a[1])) + suffix;
  const h = dir === "h";
  const main = h ? 0 : 1; // the axis the dimension measures along
  const side = 1 - main;
  const at = A[side] + off; // where the dimension line sits
  const pt = (m, s) => (h ? [m, s] : [s, m]);
  let ext = "";
  for (const P of [A, B]) {
    const gapTo = at - P[side];
    if (Math.abs(gapTo) <= GAP) continue;
    const sgn = Math.sign(gapTo);
    const [x1, y1] = pt(P[main], P[side] + sgn * GAP);
    const [x2, y2] = pt(P[main], at + sgn * OVER);
    ext += `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
  }
  const lo = Math.min(A[main], B[main]);
  const hi = Math.max(A[main], B[main]);
  const span = hi - lo;
  const tw = textWidth(value);
  const arrowsIn = span >= ARROW * 2 + 3;
  const textIn = span >= tw + ARROW * 2 + 6;
  let lineD;
  let heads;
  let tm; // text position along the measured axis
  let anchor = "middle";
  if (arrowsIn) {
    const [x1, y1] = pt(lo, at);
    const [x2, y2] = pt(hi, at);
    lineD = `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
    heads = arrowHead(pt(lo, at), pt(-1, 0)) + arrowHead(pt(hi, at), pt(1, 0));
  } else {
    const [x1, y1] = pt(lo - ARROW - 7, at);
    const [x2, y2] = pt(hi + ARROW + 7, at);
    lineD = `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
    heads = arrowHead(pt(lo, at), pt(1, 0)) + arrowHead(pt(hi, at), pt(-1, 0));
  }
  if (textIn) tm = (lo + hi) / 2;
  else {
    tm = hi + ARROW + 10 + tw / 2;
    const [x2, y2] = pt(tm + tw / 2, at);
    lineD += `L${r2(x2)} ${r2(y2)}`;
  }
  // ISO: text sits just above a horizontal line and reads from the right on a vertical one.
  const [tx, ty] = pt(tm, at - 3);
  const textEl = h
    ? `<text class="t" x="${r2(tx)}" y="${r2(ty)}" text-anchor="${anchor}">${value}</text>`
    : `<text class="t" x="${r2(tx)}" y="${r2(ty)}" text-anchor="${anchor}" transform="rotate(-90 ${r2(tx)} ${r2(ty)})">${value}</text>`;
  return `<g data-role="dim"${id ? ` id="${id}"` : ""}${cls ? ` class="${cls}"` : ""}><path class="thin" d="${ext}${lineD}"/><path class="head" d="${heads}"/>${textEl}</g>`;
}

// A part balloon: a dot on the part, a thin leader, a circled item number.
function balloon(V, at, [bx, by], n, { target = "", r = 8.5 } = {}) {
  const [ax, ay] = V.p(at);
  const a = Math.atan2(ay - by, ax - bx);
  const ex = r2(bx + r * Math.cos(a));
  const ey = r2(by + r * Math.sin(a));
  return (
    `<g data-role="balloon" data-target="${target}" data-at="${ax} ${ay}">` +
    `<path class="thin" d="M${ex} ${ey}L${ax} ${ay}"/><circle class="dot" cx="${ax}" cy="${ay}" r="1.5"/>` +
    `<circle class="balloon" cx="${bx}" cy="${by}" r="${r}"/>` +
    `<text class="t" x="${bx}" y="${r2(by + 3.3)}" text-anchor="middle">${n}</text></g>`
  );
}

// A view title: SECTION A-A over its scale, centred under the view.
function viewLabel(x, y, title, sub = "") {
  return (
    `<g data-role="label"><text class="t t-lg" x="${x}" y="${y}" text-anchor="middle">${title}</text>` +
    (sub ? `<text class="t t-sm" x="${x}" y="${y + 12}" text-anchor="middle">${sub}</text>` : "") +
    `</g>`
  );
}

// The circle that marks a detail in its parent view, with its letter.
function detailMark(V, [cu, cv], r, letter, angle = 45) {
  const [x, y] = V.p([cu, cv]);
  const R = r * V.k;
  const a = (-angle * Math.PI) / 180;
  const lx = r2(x + (R + 9) * Math.cos(a));
  const ly = r2(y + (R + 9) * Math.sin(a) + 4);
  return `<g data-role="label"><circle class="thin mark" cx="${x}" cy="${y}" r="${r2(R)}"/><text class="t t-lg" x="${lx}" y="${ly}" text-anchor="middle">${letter}</text></g>`;
}

// A viewing-direction arrow (VIEW C): a thick-tipped arrow pointing at the surface, with its letter.
function viewArrow(V, at, [dx, dy], letter, len = 26) {
  const [x, y] = V.p(at);
  const n = Math.hypot(dx, dy) || 1;
  const ux = dx / n;
  const uy = dy / n;
  const sx = r2(x - ux * len);
  const sy = r2(y - uy * len);
  return (
    `<g data-role="label"><path class="vis" d="M${sx} ${sy}L${r2(x - ux * ARROW)} ${r2(y - uy * ARROW)}"/>` +
    `<path class="head" d="${arrowHead([x, y], [ux, uy])}"/>` +
    `<text class="t t-lg" x="${r2(sx - uy * 10)}" y="${r2(sy + ux * 10 + 4)}" text-anchor="middle">${letter}</text></g>`
  );
}

// A long-break line across a part (thin, with one zigzag), for parts that run out of the view.
function breakLine(V, a, b) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const mx = (ax + bx) / 2;
  const my = (ay + by) / 2;
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  const z = 3.5;
  const p = (t, s) => `${r2(mx + ux * t - uy * s)} ${r2(my + uy * t + ux * s)}`;
  return `<path class="thin" d="M${r2(ax - ux * 4)} ${r2(ay - uy * 4)}L${p(-z, 0)}L${p(-z / 2, z * 1.6)}L${p(z / 2, -z * 1.6)}L${p(z, 0)}L${r2(bx + ux * 4)} ${r2(by + uy * 4)}"/>`;
}

// ---------------------------------------------------------------- sheet furniture

// The drawing frame: trimmed edge, a thick border, zone references and centring marks.
function frame({ w = SHEET.w, h = SHEET.h, trim = 8, m = 24, cols = 8, rows = 6 } = {}) {
  let out = `<g data-role="frame"><rect class="thin" x="${trim}" y="${trim}" width="${w - trim * 2}" height="${h - trim * 2}"/>`;
  out += `<rect class="vis" x="${m}" y="${m}" width="${w - m * 2}" height="${h - m * 2}"/>`;
  const cw = (w - m * 2) / cols;
  const rh = (h - m * 2) / rows;
  let ticks = "";
  let labels = "";
  for (let i = 0; i <= cols; i++) {
    const x = r2(m + i * cw);
    if (i > 0 && i < cols) ticks += `M${x} ${trim}V${m}M${x} ${h - m}V${h - trim}`;
    if (i < cols) {
      const cx = r2(m + (i + 0.5) * cw);
      labels += `<text class="t t-sm" x="${cx}" y="${r2((trim + m) / 2 + 3)}" text-anchor="middle">${i + 1}</text>`;
      labels += `<text class="t t-sm" x="${cx}" y="${r2(h - (trim + m) / 2 + 3)}" text-anchor="middle">${i + 1}</text>`;
    }
  }
  for (let j = 0; j <= rows; j++) {
    const y = r2(m + j * rh);
    if (j > 0 && j < rows) ticks += `M${trim} ${y}H${m}M${w - m} ${y}H${w - trim}`;
    if (j < rows) {
      const cy = r2(m + (j + 0.5) * rh + 3);
      const letter = String.fromCharCode(65 + j);
      labels += `<text class="t t-sm" x="${r2((trim + m) / 2)}" y="${cy}" text-anchor="middle">${letter}</text>`;
      labels += `<text class="t t-sm" x="${r2(w - (trim + m) / 2)}" y="${cy}" text-anchor="middle">${letter}</text>`;
    }
  }
  const cm = `M${w / 2} ${trim}V${m + 10}M${w / 2} ${h - trim}V${h - m - 10}M${trim} ${h / 2}H${m + 10}M${w - trim} ${h / 2}H${w - m - 10}`;
  out += `<path class="thin" d="${ticks}"/><path class="vis" d="${cm}"/>${labels}</g>`;
  return out;
}

// A ruled table (parts list). cols: [{ w, align, title }]. rows: arrays of cell strings.
// Item numbers count up from the bottom, as a parts list sits on top of the title block.
function table(x, y, cols, rows, { rowH = 16, role = "bom", headH = 18 } = {}) {
  const w = cols.reduce((s, c) => s + c.w, 0);
  const h = headH + rows.length * rowH;
  let rules = "";
  let text = "";
  let cx = x;
  for (const [i, c] of cols.entries()) {
    if (i > 0) rules += `M${r2(cx)} ${y}V${y + h}`;
    const tx = c.align === "center" ? cx + c.w / 2 : c.align === "right" ? cx + c.w - 4 : cx + 4;
    const anchor = c.align === "center" ? "middle" : c.align === "right" ? "end" : "start";
    text += `<text class="t t-sm t-head" x="${r2(tx)}" y="${y + h - 5.5}" text-anchor="${anchor}">${c.title}</text>`;
    rows.forEach((row, j) => {
      text += `<text class="t t-sm" x="${r2(tx)}" y="${r2(y + (rows.length - 1 - j) * rowH + rowH - 4.8)}" text-anchor="${anchor}">${row[i]}</text>`;
    });
    cx += c.w;
  }
  for (let j = 1; j <= rows.length; j++) rules += `M${x} ${r2(y + j * rowH)}H${x + w}`;
  return `<g data-role="${role}"><rect class="paper" x="${x}" y="${y}" width="${w}" height="${h}"/><path class="thin" d="${rules}"/><rect class="vis" x="${x}" y="${y}" width="${w}" height="${h}"/>${text}</g>`;
}

// A title-block cell: a small caption over a value. size: "sm" | "md" | "lg".
function cell({ x, y, w, h, label, value = "", size = "md", id = "" }) {
  const cls = size === "lg" ? "t t-xl" : size === "sm" ? "t t-sm" : "t";
  const vy = size === "lg" ? y + h - 7 : y + h - 5;
  return (
    `<rect class="thin" x="${x}" y="${y}" width="${w}" height="${h}"/>` +
    `<text class="t t-cap" x="${x + 4}" y="${y + 9}">${label}</text>` +
    `<text class="${cls}" x="${x + 4}" y="${vy}"${id ? ` id="${id}"` : ""}>${value}</text>`
  );
}

function titleBlock(x, y, w, h, cells) {
  return `<g data-role="title"><rect class="paper" x="${x}" y="${y}" width="${w}" height="${h}"/>${cells.map((c) => cell({ ...c, x: x + c.x, y: y + c.y })).join("")}<rect class="vis" x="${x}" y="${y}" width="${w}" height="${h}"/></g>`;
}

// A notes block: a heading and numbered lines.
function notes(x, y, heading, items, lead = 13) {
  let out = `<g data-role="notes"><text class="t t-head" x="${x}" y="${y}">${heading}</text>`;
  items.forEach((s, i) => {
    out += `<text class="t t-sm" x="${x}" y="${r2(y + lead * (i + 1) + 2)}">${i + 1}. ${s}</text>`;
  });
  return out + `</g>`;
}

return { SHEET, PX_PER_MM, THICK, THIN, TEXT, ARROW, GAP, OVER, r2, fmt, view, scaleLabel, d, rect, arc, circle, rrect, move, flipU, flipV, inside, revolve, MATERIALS, ANGLES, hatchDefs, cut, section, body, line, lines, centerline, centerMark, springSection, textWidth, dim, balloon, viewLabel, detailMark, viewArrow, breakLine, frame, table, cell, titleBlock, notes };
})();

const L = (() => {
// Live runtime for a blueprint sheet: one time-based loop, an idle tour, input wake-ups,
// offscreen and hidden-tab pauses, reduced motion, and deterministic frames for checks.
//
// URL parameters (all optional):
//   ?t=6.5            render the tour at 6.5 s, deterministically, and stop (for screenshots)
//   ?theme=paper      blueprint | paper | white | dark
//   ?zoom=x,y,w,h     show only this sheet region, filling the window (for 4x close-ups)
//   ?mask=x,y,w,h     blank everything outside this box, so one view stands alone
//   ?check=1          run the layout self-check after the first frame (see selfcheck.mjs)

function params() {
  const q = new URLSearchParams(location.search);
  return {
    t: q.has("t") ? Number(q.get("t")) : null,
    theme: q.get("theme"),
    zoom: q.get("zoom"),
    mask: q.get("mask"),
    check: q.has("check"),
  };
}

const THEMES = ["blueprint", "paper", "white", "dark"];

function setupPage(svg) {
  const q = params();
  // the page's own default (writePage's `theme`), then a saved choice, then ?theme=, which wins but isn't saved
  const fallback = document.documentElement.dataset.theme || "blueprint";
  const pick = (name, save) => {
    if (!THEMES.includes(name)) return;
    document.documentElement.dataset.theme = name;
    for (const b of document.querySelectorAll("[data-theme-pick]")) b.setAttribute("aria-pressed", String(b.dataset.themePick === name));
    if (save) {
      try {
        localStorage.setItem("bp-theme", name);
      } catch {}
    }
  };
  let saved = null;
  try {
    saved = localStorage.getItem("bp-theme");
  } catch {}
  pick(q.theme ?? saved ?? fallback, false);
  for (const b of document.querySelectorAll("[data-theme-pick]")) b.addEventListener("click", () => pick(b.dataset.themePick, true));
  // ?mask=x,y,w,h paints the page colour over everything outside one box, so a view stands alone
  if (q.mask) {
    const [x, y, w, h] = q.mask.split(",").map(Number);
    if ([x, y, w, h].every(Number.isFinite)) {
      const m = document.createElementNS("http://www.w3.org/2000/svg", "path");
      m.setAttribute("d", `M-9999 -9999H9999V9999H-9999Z M${x} ${y}V${y + h}H${x + w}V${y}Z`);
      m.setAttribute("fill-rule", "evenodd");
      m.setAttribute("style", "fill:var(--bp-page);pointer-events:none");
      m.dataset.role = "mask";
      svg.appendChild(m);
    }
  }
  // The sheet's keys listen on the svg. Make them work without clicking the sheet first: a press on the
  // sheet focuses it (drag handlers cancel pointerdown, which would otherwise skip focus), and a key typed
  // while nothing is focused is passed on to the sheet.
  svg.addEventListener("pointerdown", (e) => {
    if (document.activeElement !== svg && !e.target.closest?.("[tabindex]:not(svg), a, button, input, select, textarea")) svg.focus({ preventScroll: true });
  });
  window.addEventListener("keydown", (e) => {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || svg.contains(e.target)) return;
    const a = document.activeElement;
    if (a && a !== document.body && a !== document.documentElement) return;
    const fwd = new KeyboardEvent("keydown", { key: e.key, code: e.code, shiftKey: e.shiftKey, repeat: e.repeat, bubbles: true, cancelable: true });
    if (!svg.dispatchEvent(fwd)) e.preventDefault();
  });
  if (q.zoom) {
    const box = q.zoom.split(",").map(Number);
    if (box.length === 4 && box.every(Number.isFinite)) {
      svg.setAttribute("viewBox", box.join(" "));
      document.body.classList.add("bp-zoom");
    }
  }
  return q;
}

// Critically damped follow toward a target: calm, no overshoot, frame-rate independent.
function follow(at, want, rate, dt) {
  return want + (at - want) * Math.exp(-rate * dt);
}

const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, t)));

// run({ root, step, render, idleAfter })
//   step(dt, live) advances the model; live.touring says whether the idle tour drives it.
//   It returns true while something is still settling, so a reduced-motion page can sleep.
//   render(live) writes attributes; it never rebuilds static geometry.
function run({ root, step, render, idleAfter = 4, onFrozen }) {
  const q = params();
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const live = { clock: 0, slow: 1, lastInput: -Infinity, reduced, touring: !reduced, frozen: q.t != null };
  live.input = () => {
    live.lastInput = live.clock;
    live.touring = false;
    wake();
  };

  if (live.frozen) {
    const dt = 1 / 240;
    for (let t = 0; t < q.t; t += dt) {
      live.clock = t;
      live.touring = true;
      step(dt, live);
    }
    render(live);
    onFrozen?.(live);
    return live;
  }

  let raf = 0;
  let last = 0;
  let visible = true;
  function frame(now) {
    raf = 0;
    const real = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    live.clock += real;
    live.touring = !reduced && live.clock - live.lastInput > idleAfter;
    // the first frame (and the first after a pause) has no elapsed time: models that divide by the step
    // (a speed from two positions) would turn NaN and stay NaN, so a zero step is not taken
    const busy = real > 0 ? step(real * live.slow, live) : true;
    render(live);
    if (visible && !document.hidden && (!reduced || busy)) raf = requestAnimationFrame(frame);
    else last = 0;
  }
  function wake() {
    if (!raf && visible && !document.hidden) raf = requestAnimationFrame(frame);
  }
  live.wake = wake;
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(([entry]) => {
      visible = entry.isIntersecting;
      if (visible) wake();
    }).observe(root);
  }
  document.addEventListener("visibilitychange", wake);
  render(live);
  wake();
  return live;
}

// Vertical drag on an element, reported as a sheet-unit delta since the press.
function dragY(svg, el, { start, move, end }) {
  let id = null;
  let y0 = 0;
  const toSheet = (e) => {
    const m = svg.getScreenCTM();
    return m ? (e.clientY - m.f) / m.d : e.clientY;
  };
  el.addEventListener("pointerdown", (e) => {
    id = e.pointerId;
    el.setPointerCapture(id);
    y0 = toSheet(e);
    start?.();
    e.preventDefault();
  });
  el.addEventListener("pointermove", (e) => {
    if (e.pointerId === id) move(toSheet(e) - y0);
  });
  const stop = (e) => {
    if (e.pointerId !== id) return;
    id = null;
    end?.();
  };
  el.addEventListener("pointerup", stop);
  el.addEventListener("pointercancel", stop);
}

// Announce a readout to screen readers at most every `every` seconds.
function announcer(el, every = 1.5) {
  let lastAt = -Infinity;
  let lastText = "";
  return (text, clock) => {
    if (text === lastText || clock - lastAt < every) return;
    lastAt = clock;
    lastText = text;
    el.textContent = text;
  };
}

return { params, THEMES, setupPage, follow, ease, run, dragY, announcer };
})();

const C = (() => {
// Layout self-check, run in the page with ?check=1 (scripts/check.mjs drives it headlessly).
// It writes a JSON report into <pre id="bp-check"> and to the console. A clean sheet reports
// zero failures in every category.
//
//   text-overlap      two pieces of lettering touch
//   text-on-geometry  lettering sits on a part or on another annotation's lines
//   outside-frame     an annotation or a view crosses the drawing frame
//   balloon-target    a balloon's dot is not on the part it names
//   balloon-on-geom   a balloon circle sits on a part
//   hard-colour       a fill or stroke is a literal colour instead of a token
//   sideways-scroll   the page scrolls horizontally

const roleOf = (el) => el.closest("[data-role]")?.dataset.role ?? "";

// A clipped group's box is its clip region's box (getBoundingClientRect ignores clipping).
function clippedBox(el) {
  const ref = el.getAttribute("clip-path")?.match(/url\(#([^)]+)\)/)?.[1];
  const shape = ref && document.getElementById(ref)?.firstElementChild;
  if (!shape) return el.getBoundingClientRect();
  const b = shape.getBBox();
  const m = shape.ownerSVGElement.getScreenCTM();
  const x0 = m.a * b.x + m.e;
  const y0 = m.d * b.y + m.f;
  return { left: x0, top: y0, right: x0 + m.a * b.width, bottom: y0 + m.d * b.height };
}

function selfCheck(svg) {
  const fails = [];
  const fail = (kind, what) => fails.push({ kind, what });
  const label = (el) => {
    const g = el.closest("[data-role],[data-part],[data-geom]");
    const name = g?.id || g?.dataset.part || g?.dataset.target || g?.dataset.role || g?.dataset.geom || el.tagName;
    return `${name}: "${(el.textContent || "").trim().slice(0, 24)}"`;
  };
  const shown = (el) => {
    const b = el.getBoundingClientRect();
    if (b.width < 0.5 || b.height < 0.5) return false;
    const cs = getComputedStyle(el);
    return cs.visibility !== "hidden" && cs.display !== "none" && Number(cs.opacity) > 0.05;
  };
  const texts = [...svg.querySelectorAll("text")].filter(shown);
  const boxes = texts.map((t) => t.getBoundingClientRect());
  const grow = 0.4;
  const hit = (a, b) => a.left < b.right - grow && b.left < a.right - grow && a.top < b.bottom - grow && b.top < a.bottom - grow;

  for (let i = 0; i < texts.length; i++)
    for (let j = i + 1; j < texts.length; j++) if (hit(boxes[i], boxes[j])) fail("text-overlap", `${label(texts[i])} × ${label(texts[j])}`);

  const geomOf = (el) => el.closest("[data-geom]");
  for (const [i, t] of texts.entries()) {
    const role = roleOf(t);
    if (role === "engraved" || role === "frame") continue;
    const own = t.closest("[data-role]");
    const b = boxes[i];
    const seen = new Set();
    for (let ix = 0; ix < 4; ix++)
      for (let iy = 0; iy < 2; iy++) {
        const x = b.left + b.width * (0.15 + ix * 0.233);
        const y = b.top + b.height * (0.3 + iy * 0.4);
        for (const el of document.elementsFromPoint(x, y)) {
          if (el === t || el.tagName === "text" || el.tagName === "svg" || el.closest("defs")) continue;
          if (el.classList.contains("tint") || el.classList.contains("hit") || el.closest('[data-role="phantom"]')) continue;
          if (own && own.contains(el)) continue;
          const g = geomOf(el);
          const other = el.closest("[data-role]");
          const bad = (g && !g.contains(t)) || (other && other !== own && other.dataset.role !== "frame" && other.dataset.role !== "chart-bg");
          if (bad && !el.classList.contains("sheet-bg") && !el.classList.contains("grid")) {
            const key = el.closest("[data-part],[data-role],[data-geom]");

const DF = (TANK.fs1 - TANK.fs0) / NF;
const CELLS = [];
for (let i = 0; i < NW; i++)
  for (let j = 0; j < NF; j++) {
    const ws = TANK.ws0 + (i + 0.5) * DW;
    const fs = TANK.fs0 + (j + 0.5) * DF;
    CELLS.push([tankLo(fs, ws), tankHi(fs, ws)]);
  }
const TANK_BOTTOM = Math.min(...CELLS.map((c) => c[0]));
const TANK_TOP = Math.max(...CELLS.map((c) => c[1]));
const volBelow = (h) => (CELLS.reduce((s, [lo, hi]) => s + Math.max(0, Math.min(h, hi) - lo), 0) * DW * DF) / 1e6;
const HTAB = [];
for (let h = Math.floor(TANK_BOTTOM); h <= Math.ceil(TANK_TOP) + 1; h += 1) HTAB.push([h, volBelow(h)]);

const FULL = 106; // L, filled to the bottom of the filler neck (published total)
function volumeAt(h) {

  const [h0, v0] = HTAB[i];
  const [, v1] = HTAB[i + 1];
  return v0 + (v1 - v0) * Math.min(1, h - h0);
}
function levelAt(v) {

  let i = 0;
  while (i < HTAB.length - 2 && HTAB[i + 1][1] < v) i++;

// Section B-B cuts the tank spanwise at FS 1150, near the bay's lowest line (the aerofoil's lower
// surface, tilted by the incidence, is lowest about a third of the chord back). The outlet leaves
// through the inboard end wall (the dihedral makes that end the low one), a finger strainer reaching
// out from it into the tank with its lowest slots PICKUP above the floor: fuel below them is unusable,
// and the sump under them is where water and sediment settle, over the drain.
const FS_B = 1150;
const OUTLET = { fs: FS_B, ws: 920 };
const OUTLET_FLOOR = tankLo(FS_B, 925);
const PICKUP = 24; // mm above the floor at the outlet: the strainer's lowest slots
const STRAINER_R = 9.5; // the finger strainer, Ø19
const OUTLET_WL = OUTLET_FLOOR + PICKUP + STRAINER_R; // its axis
const UNUSABLE = volumeAt(OUTLET_FLOOR + PICKUP);
const USABLE = FULL - UNUSABLE;

const WS_C = (TANK.ws0 + TANK.ws1) / 2;
const FILLER = { fs: FS_B, ws: 1250, r: 30 };
// the vent: from the tank's high (outboard) end, down through a check valve to a forward-facing tube
// under the wing (it catches ram air: CP of the dynamic pressure)
const VENT = { ws: 1840, cp: 0.8 };
const SENDER = { ws: 1800, arm: 330 }; // pivot on the outboard end wall, float on the arm

// ---------------------------------------------------------------- the lines (route in FS, BL, WL)
// 3/8 in × 0.035 in 5052-O tube.
const D_OUT = 9.525;
const D_LINE = 9.525 - 2 * 0.889; // 7.747 mm
const A_LINE = (Math.PI / 4) * (D_LINE / 1000) ** 2; // m²
// Route of the port branch (the starboard is its mirror): outlet, along the root rib inboard, forward
// along the root to the front door post, down it, inboard under the floor to the selector's port.
// Each point: [FS, BL, WL, K] where K is the minor loss at that fitting.
const SELECTOR = { fs: 720, bl: 0, wl: 830 }; // the ports' plane, under the floorboards
const STRAINER = { fs: -60, bl: -110, wl: 805 }; // inlet port, on the firewall's forward face
const CARB = { fs: -250, bl: -40, wl: 850 }; // the float valve's inlet
const FLOORBOARD = 880;
const FIREWALL = [0, 20];
const PANEL_FS = 300;
const branchRoute = (sg) => [
  [OUTLET.fs, sg * (OUTLET.ws + 60), OUTLET_WL, 1.5], // the finger strainer's tip: entry and screen
  [OUTLET.fs, sg * 640, OUTLET_WL, 0.3],
  [660, sg * 600, 1995, 0.3], // top of the front door post
  [660, sg * 600, SELECTOR.wl + 40, 0.3], // bottom of the post
  [660, sg * 70, SELECTOR.wl, 0.3],
  [SELECTOR.fs, sg * 20, SELECTOR.wl, 0], // the selector port (its loss is the rotor's, below)
];
const ROUTE = { L: branchRoute(-1), R: branchRoute(1) };
// the common line: down out of the selector, forward to the shut-off at the firewall, through it to
// the strainer, then up and forward to the carburettor
const COMMON = [
  [SELECTOR.fs, 0, SELECTOR.wl, 1.0], // the selector's body: turns down to the outlet
  [SELECTOR.fs, 0, 790, 0.3],
  [80, 0, 790, 0.5], // the shut-off valve, open
  [30, 0, 790, 0.3],
  [STRAINER.fs, STRAINER.bl, STRAINER.wl, 3.0], // the strainer: in, down round the screen, through it, up
  [-120, STRAINER.bl, 840, 0.3],
  [CARB.fs, CARB.bl, CARB.wl, 0.6], // the carburettor's inlet fitting and its small screen
];
const segLen = (pts) => pts.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1], p[2] - pts[i][2]), 0) / 1000;
const L_BRANCH = segLen(ROUTE.L); // m
const L_COMMON = segLen(COMMON); // m
const kSum = (pts) => pts.reduce((s, p) => s + p[3], 0);
const K_BRANCH = kSum(ROUTE.L);
const K_COMMON = kSum(COMMON);

// Darcy friction factor: laminar (Hagen–Poiseuille), Blasius when turbulent, blended across transition
function friction(re) {
  const lam = 64 / Math.max(re, 1e-6);
  const tur = 0.3164 / Math.max(re, 1) ** 0.25;
  if (re < 2300) return lam;
  if (re > 4000) return tur;
  const w = (re - 2300) / 1700;
  return (1 - w) * (64 / 2300) + w * (0.3164 / 4000 ** 0.25);
}
const reynolds = (q) => (RHO * (Math.abs(q) / A_LINE) * (D_LINE / 1000)) / MU;
// pressure loss (Pa, signed with the flow) along L metres of line with minor losses K, at flow q (m³/s)
function lineLoss(q, L, K) {
  const v = Math.abs(q) / A_LINE;
  if (v < 1e-9) return 0;
  const f = friction(reynolds(q));
  return Math.sign(q) * (f * (L / (D_LINE / 1000)) + K) * 0.5 * RHO * v * v;
}

// ---------------------------------------------------------------- the selector valve
// A brass rotor turns in the body. The two inlet ports enter the bore 45° either side of forward; the
// rotor's window spans WINDOW either side of where the handle points; a port is open by the share of
// its width the window overlaps. Handle positions (degrees, clockwise from forward, seen from above):
const POS = { LEFT: -90, BOTH: 0, RIGHT: 90, OFF: 180 };
const PORT_ANGLE = { L: -45, R: 45 };
const WINDOW = 60; // half-angle of the rotor's window
const PORT_HALF = 12; // half-angle the port's Ø7.75 bore subtends at the Ø36 rotor face
const ROTOR_R = 18;
const K_PORT = 1.2; // a fully open port, with the turn into the rotor
const wrap = (a) => ((((a + 180) % 360) + 360) % 360) - 180;
function portOpen(theta, port) {
  const c = wrap(PORT_ANGLE[port] - theta); // the port's angle in the rotor's frame
  const lo = Math.max(c - PORT_HALF, -WINDOW);
  const hi = Math.min(c + PORT_HALF, WINDOW);
  return Math.max(0, hi - lo) / (2 * PORT_HALF);
}
const ROTATE_RATE = 240; // deg/s, a hand turning it
function posName(theta) {
  for (const [k, v] of Object.entries(POS)) if (Math.abs(theta - v) < 3) return k;
  return "TURNING";
}

// ---------------------------------------------------------------- the carburettor's float valve
// A Ø3.2 seat (Cd 0.62): the float lifts the needle into it as the bowl fills, so the valve passes
// what the engine draws as long as the head can push that much through it wide open.
const SEAT_D = 3.2;
const A_SEAT = (Math.PI / 4) * (SEAT_D / 1000) ** 2;
const CD_SEAT = 0.62;
const BOWL_FULL = 60; // mL in the float bowl at the float's level
const BOWL_BAND = 4; // mL: the needle goes from shut to wide open over this much fall
const BOWL_LEAN = 30; // mL: below this the main jet starts to suck air: the engine runs lean

// ---------------------------------------------------------------- the network
// Each tank's driving pressure at the junction (Pa gauge, with no flow): its ullage pressure plus the
// head from its surface down to the selector, with the lateral share of a sideslip's apparent gravity.
const slipHead = (sg, slipDeg) => sg * WS_C * Math.tan(slipDeg * rad); // mm, sg −1 port
function sourceP(tank, sg, slipDeg) {
  const z = levelAt(tank.v) + slipHead(sg, slipDeg);
  return tank.pu - P_ATM + RHO * G * ((z - SELECTOR.wl) / 1000);
}
// The flow (m³/s) a line of L metres with minor losses K (and an orifice's kq·q|q| at its end) passes
// under a pressure difference dp: exact for laminar flow plus the quadratic losses, then a few Newton
// steps where the friction turns turbulent.
const A_HP = (128 * MU) / (Math.PI * (D_LINE / 1000) ** 4); // Pa per (m³/s) per metre: Hagen–Poiseuille
function pipeQ(dp, L, K, kq = 0) {
  if (Math.abs(dp) < 1e-9) return 0;
  const sg = Math.sign(dp);
  const P = Math.abs(dp);
  const a = A_HP * L;
  const b = (K * 0.5 * RHO) / (A_LINE * A_LINE) + kq;
  let q = b > 0 ? (-a + Math.sqrt(a * a + 4 * b * P)) / (2 * b) : P / a;
  const F = (x) => lineLoss(x, L, K) + kq * x * x - P;
  for (let i = 0; i < 6; i++) {
    const f = F(q);
    if (Math.abs(f) < 1e-3) break;
    const h = Math.max(1e-10, q * 1e-4);
    const d = (F(q + h) - f) / h;
    if (!(d > 0)) break;
    q = Math.max(q * 0.2, q - f / d);
  }

}
// the flow out of one branch when the junction is at pj
function branchQ(src, open, pj) {
  if (open < 0.01) return 0;
  return pipeQ(src - pj, L_BRANCH, K_BRANCH + K_PORT / (open * open));
}
// the flow down the common line into the bowl when the junction is at pj and the needle `needle` open
const DZ_COMMON = (SELECTOR.wl - CARB.wl) / 1000;

  if (shut || needle < 1e-4) return 0;
  const dp = pj + RHO * G * DZ_COMMON;

  return pipeQ(dp, L_COMMON, K_COMMON, kNeedle(needle));

// Solve the junction: the branches' flows must add up to the common line's (or to demandQ). Returns
// flows in m³/s and pressures in Pa gauge. Illinois false position on the junction pressure.
function solve(s, { needle = 1, demandQ = null } = {}) {
  const open = { L: portOpen(s.theta, "L"), R: portOpen(s.theta, "R") };
  const src = { L: sourceP(s.tanks.L, -1, s.slip), R: sourceP(s.tanks.R, 1, s.slip) };
  const any = open.L >= 0.01 || open.R >= 0.01;
  const shut = s.shut && demandQ == null;
  const net = (pj) => branchQ(src.L, open.L, pj) + branchQ(src.R, open.R, pj) - (demandQ ?? commonQ(pj, needle, shut));
  let pj = 0;
  if (any) {
    let a = Math.min(src.L, src.R) - 4e4;
    let b = Math.max(src.L, src.R) + 1;
    let fa = net(a);
    let fb = net(b);
    let side = 0;
    for (let i = 0; i < 60; i++) {
      pj = (a * fb - b * fa) / (fb - fa);
      const f = net(pj);
      if (Math.abs(f) < 1e-10 || Math.abs(b - a) < 0.01) break;
      if (f > 0) {
        a = pj;
        fa = f;
        if (side === 1) fb /= 2;
        side = 1;
      } else {
        b = pj;
        fb = f;
        if (side === -1) fa /= 2;
        side = -1;
      }
    }
  }
  const qL = branchQ(src.L, open.L, pj);
  const qR = branchQ(src.R, open.R, pj);
  const q = any ? qL + qR : 0;
  return { qL, qR, q, pj, src, open, pc: pj + RHO * G * DZ_COMMON - lineLoss(q, L_COMMON, K_COMMON) };

// ---------------------------------------------------------------- the strainer (gascolator)
// Fuel enters at the top, falls round the screen into the bowl, turns and passes in through the
// screen to the outlet. Water is 38 % heavier than the fuel: a drop settles at its terminal speed
// (drag by Schiller–Naumann), and the fuel's own speed in the bowl is far slower, so it stays there.
const BOWL = { r: 26.5, depth: 72, screenR: 13 }; // inside radius, depth below the casting, screen
const A_BOWL = Math.PI * ((BOWL.r / 1000) ** 2 - (BOWL.screenR / 1000) ** 2);
function settleSpeed(d) {
  // d in m; returns m/s
  const dRho = RHO_W - RHO;
  let v = (dRho * G * d * d) / (18 * MU);
  for (let i = 0; i < 30; i++) {
    const re = Math.max(1e-6, (RHO * v * d) / MU);
    const cd = (24 / re) * (1 + 0.15 * re ** 0.687);
    v = Math.sqrt((4 * dRho * G * d) / (3 * cd * RHO));
  }
  return v;
}
// the smallest drop that still settles against the fuel's speed down through the bowl at flow q
function dCrit(q) {
  const up = Math.abs(q) / A_BOWL;
  let lo = 1e-6;
  let hi = 2e-3;
  for (let i = 0; i < 40; i++) {
    const m = (lo + hi) / 2;
    if (settleSpeed(m) < up) lo = m;

  }
  return hi;
}
// the drain: a spring-closed poppet at the bowl's lowest point, Ø3 when pulled open
const DRAIN_D = 3;
const A_DRAIN = (Math.PI / 4) * (DRAIN_D / 1000) ** 2;
const STRAINER_BOTTOM = STRAINER.wl - 40 - BOWL.depth; // WL of the bowl's floor
// representative water drops after refuelling: diameter (mm), start height above the bowl floor (mm)
const DROPS = Array.from({ length: 16 }, (_, i) => {
  const r = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
  const f = r - Math.floor(r);
  return { d: 0.28 + 0.34 * f, h0: 8 + ((i * 37) % 54), x: -19 + ((i * 23) % 38) };
});
const WATER0 = 6; // mL of water settling out after refuelling

// ---------------------------------------------------------------- the primer
// A plunger pump on the panel: pulled out it draws fuel from the strainer's top port past one ball
// check valve; pushed in it sends it through the other to the cylinders' intake ports.
const PRIMER = { bore: 14.3, stroke: 45 };
const A_PRIMER = (Math.PI / 4) * PRIMER.bore ** 2; // mm²
const PRIMER_ML = (A_PRIMER * PRIMER.stroke) / 1000; // mL a stroke

// ---------------------------------------------------------------- the engine
const FLOW = { idle: 8, takeoff: 48, cruise: 38 }; // L/h
const RPM = { idle: 700, takeoff: 2700, cruise: 2450 };
const V_CRUISE = 110; // kt
const qDyn = (kt) => 0.5 * RHO_AIR * (kt * 0.514444) ** 2;

// ---------------------------------------------------------------- state and step
function system() {
  const tank = () => ({ v: FULL, pu: P_ATM, air: 0 });
  const s = {
    t: 0, // tour time (s)
    ft: 0, // flight time (s): runs faster than t when the tour fast-forwards
    tanks: { L: tank(), R: tank() },
    theta: POS.BOTH,
    shut: false,
    vent: { L: true, R: true }, // open
    slip: 0,
    kt: 0,
    run: false,
    demand: 0, // L/h the engine wants
    burn: 0, // L/h it gets
    bowl: BOWL_FULL,
    needle: 0,
    q: 0, qL: 0, qR: 0, pj: 0, pc: 0, qMax: 0,
    water: 0, // mL settled on the bowl floor
    drops: [], // heights above the floor (mm) of the drops still falling; null once settled
    drained: { water: 0, fuel: 0 },
    drain: 0, // 0 shut … 1 open
    primer: 0, // plunger out (mm)
    primerV: 0, // its speed (mm/s): + drawing in
    primed: 0, // mL sent to the cylinders
    rpm: 0,
    waterH: 0,
  };
  for (const k of ["L", "R"]) s.tanks[k].air = s.tanks[k].pu * (TANK_VOL - s.tanks[k].v);
  return s;
}
function refuel(s) {
  s.tanks.L.v = s.tanks.R.v = FULL;
  for (const k of ["L", "R"]) s.tanks[k].air = s.tanks[k].pu * (TANK_VOL - s.tanks[k].v);
  s.drops = DROPS.map((d) => d.h0);
  s.water = 0;
  s.drained = { water: 0, fuel: 0 };
}

// Advance by dt real seconds, with the tanks' processes fast-forwarded by `warp`. ctl: { sel (deg),
// vent: { L, R }, shut, slip (deg), kt, run, demand (L/h), primer (target mm), drain (0..1) }.
function stepSystem(s, dt, ctl, warp = 1) {
  s.t += dt;
  const dtf = dt * warp;
  s.ft += dtf;
  // the hand on the selector
  const d = ctl.sel - s.theta;
  s.theta += Math.sign(d) * Math.min(Math.abs(d), ROTATE_RATE * dt);
  s.shut = !!ctl.shut;
  s.slip = ctl.slip ?? 0;
  s.kt = ctl.kt ?? 0;
  s.vent = ctl.vent ?? s.vent;
  s.run = !!ctl.run;
  s.demand = s.run ? ctl.demand : 0;
  // ullage: open vents hold it at ambient plus the ram the forward-facing tube catches
  const ram = VENT.cp * qDyn(s.kt);
  for (const k of ["L", "R"]) {
    const T = s.tanks[k];
    const vu = Math.max(0.05, TANK_VOL - T.v); // litres
    if (s.vent[k]) {
      T.pu = P_ATM + ram;
      T.air = T.pu * vu;
    } else T.pu = T.air / vu; // a sealed ullage: Boyle, p·V constant
  }
  // the float valve: open by how far the bowl has fallen below its level
  const needle = Math.min(1, Math.max(0, (BOWL_FULL - s.bowl) / BOWL_BAND));
  const sol = solve(s, { needle });
  s.needle = needle;
  // the engine draws from the bowl; the bowl takes what the valve passes
  const want = s.demand * LPH;
  const lean = Math.min(1, Math.max(0, s.bowl / BOWL_LEAN));
  const draw = want * lean;
  s.bowl = Math.min(BOWL_FULL, Math.max(0, s.bowl + (sol.q - draw) * 1e6 * dt));
  s.burn = draw / LPH;
  s.q = sol.q;
  s.qL = sol.qL;
  s.qR = sol.qR;
  s.pj = sol.pj;
  s.pc = sol.pc;
  // what the line could pass with the needle wide open (the margin over demand)
  s.qMax = solve(s, { needle: 1 }).q;
  const target = s.run ? (s.demand >= FLOW.takeoff - 1 ? RPM.takeoff : s.demand <= FLOW.idle + 1 ? RPM.idle : RPM.cruise) : 0;
  s.rpm += (target * Math.min(1, lean * 1.15) ** 0.5 - s.rpm) * Math.min(1, dt * 3);
  // the strainer's drain and the primer draw a little more through the lines
  const drainOpen = (s.drain = s.drain + (Math.min(1, Math.max(0, ctl.drain ?? 0)) - s.drain) * Math.min(1, dt * 20));
  let extra = 0;
  if (drainOpen > 0.02) {
    const dpBottom = Math.max(0, sol.pj + RHO * G * ((SELECTOR.wl - STRAINER_BOTTOM) / 1000));
    const rhoOut = s.water > 0 ? RHO_W : RHO;
    const qd = 0.6 * A_DRAIN * drainOpen * Math.sqrt((2 * dpBottom) / rhoOut) * 1e6; // mL/s
    if (s.water > 0) {
      const w = Math.min(s.water, qd * dt);
      s.water -= w;
      s.drained.water += w;
      s.drained.fuel += qd * dt - w;
    } else s.drained.fuel += qd * dt;
    extra += qd * dt;

  const want_p = Math.min(PRIMER.stroke, Math.max(0, ctl.primer ?? 0));
  const p0 = s.primer;
  s.primer += Math.sign(want_p - p0) * Math.min(Math.abs(want_p - p0), 110 * dt);
  s.primerV = (s.primer - p0) / Math.max(dt, 1e-9);
  if (s.primer < p0) s.primed += ((p0 - s.primer) * A_PRIMER) / 1000;
  else extra += ((s.primer - p0) * A_PRIMER) / 1000;
  // water drops settle at their terminal speed less the fuel's speed down the bowl (here, slower)
  const up = (Math.abs(s.q) / A_BOWL) * 1000; // mm/s
  s.drops = s.drops.map((h, i) => {
    if (h == null) return null;
    const v = settleSpeed(DROPS[i].d / 1000) * 1000 + up * 0.2;
    const nh = h - v * dt;
    if (nh <= s.waterH) {
      s.water += WATER0 / DROPS.length;
      return null;
    }
    return nh;
  });
  s.waterH = waterHeight(s.water);
  // the tanks: each gives what its branch carries. The steady part (what the engine burns, and any
  // cross-feed) runs at the fast-forward; the bowl refilling is a real-time transient, drawn from the
  // feeding tanks in proportion to what each gives.
  const excess = Math.max(0, sol.q - draw); // m³/s refilling the bowl
  const pos = Math.max(0, sol.qL) + Math.max(0, sol.qR);
  for (const k of ["L", "R"]) {
    const qk = k === "L" ? sol.qL : sol.qR;
    const share = pos > 1e-12 ? Math.max(0, qk) / pos : 0;
    const out = qk * 1000 * dtf - share * excess * 1000 * (dtf - dt) + share * (extra / 1000);
    s.tanks[k].v = Math.max(0, Math.min(TANK_VOL - 0.05, s.tanks[k].v - out));
  }
  return s;
}
// height (mm) of the water layer on the bowl's floor for w mL (the floor is flat, the bowl round)
const waterHeight = (w) => (w * 1000) / (Math.PI * BOWL.r ** 2);

// ---------------------------------------------------------------- the tour (loops)
// The tanks' processes are fast-forwarded in flight (×120, ×40 while the vent is blocked); the
// valves, the primer, the strainer and the engine's response run in real time.
//  0.0  refuelled, engine off, BOTH: water drops settle in the strainer bowl
//  4.4  the strainer drain is pulled: water out first, then clear fuel; released
//  6.4  two strokes of the primer
//  9.6  start, idle; 11 take-off and climb at full power; 14 cruise at 75 % on BOTH, in a slight
//       sideslip: the tanks drain unevenly until their surfaces stand level in the tilted gravity
// 20.5  the selector to LEFT: the right port closes, the left tank feeds alone
// 25.0  the left vent is blocked (ice, an insect's nest): the ullage pressure falls as fuel leaves,
//       the flow falls with it, the bowl empties and the engine starves
// 34.6  the selector to RIGHT (through BOTH): the right tank feeds, the engine recovers
// 40.0  loop
const TOUR = 40;
const ramp = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));

const T = { drain: [4.4, 6.0], prime: [6.4, 9.0], start: 9.6, takeoff: 11, cruise: 14, left: 20.5, block: 25, right: 34.6 };

const c1y = (i) => K.r2(C1.y1 - (Math.min(C1.iMax, Math.max(0, i)) / C1.iMax) * (C1.y1 - C1.y0));
const c2x = (r) => K.r2(C2.x0 + ((Math.log10(Math.max(1, Math.min(20, r))) - C2.lx[0]) / (C2.lx[1] - C2.lx[0])) * (C2.x1 - C2.x0));
const c2y = (t) => K.r2(C2.y1 - ((Math.min(C2.ly[1], Math.max(C2.ly[0], Math.log10(Math.max(1e-3, t)))) - C2.ly[0]) / (C2.ly[1] - C2.ly[0])) * (C2.y1 - C2.y0));
const c3x = (t) => K.r2(C3.x0 + (Math.min(C3.tMax, Math.max(0, t)) / C3.tMax) * (C3.x1 - C3.x0));
const c3v = (v) => K.r2(C3.y1 - ((Math.min(C3.vMax, Math.max(C3.vMin, v)) - C3.vMin) / (C3.vMax - C3.vMin)) * (C3.y1 - C3.y0));
const c3i = (i) => K.r2((C3.y0 + C3.y1) / 2 - (Math.min(C3.iLim, Math.max(-C3.iLim, i)) / C3.iLim) * ((C3.y1 - C3.y0) / 2));
const RANGE = Array.from({ length: 41 }, (_, i) => (i * C1.rMax) / 40);
const signed = (x, d = 1) => `${x >= 0 ? "+" : "−"}${Math.abs(x).toFixed(d)}`;
const mmss = (min) => (!isFinite(min) || min >= 600 ? "> 10 h" : min < 60 ? `${Math.round(min)} min` : `${Math.floor(min / 60)} h ${String(Math.floor(min % 60)).padStart(2, "0")}`);
const closedOf = (id) => ({ alt: s.sw.alt, bat: s.sw.bat, avn: s.sw.avn, start: s.sw.start, nav: s.sw.nav, land: s.sw.land, pitot: s.sw.pitot })[id];
// the breaker to show in Detail G and Diagram 2: one that has tripped, else the hottest
function focusBreaker() {
  let best = 0;
  for (let i = 1; i < M.CB.length; i++) {
    const a = s.cb[i];
    const b = s.cb[best];
    if ((a.open && !b.open) || (a.open === b.open && a.th > b.th)) best = i;
  }
  return best;
}

function render(live) {
  // ---- the schematic: each wire's current in the accent, its dashes running with it
  for (const [id, node, key] of el.wires) {
    const I = Math.abs(current(key));
    node.setAttribute("stroke-opacity", I < 0.02 ? 0 : K.r2(Math.min(1, 0.25 + Math.sqrt(I / 40))));
    node.setAttribute("stroke-dashoffset", K.r2(phase[id] % 54));
  }
  const swState = Object.keys(SWP).map((id) => (closedOf(id) ? 1 : 0)).join("") + (s.batCont ? 1 : 0) + (s.st.cont ? 1 : 0);
  if (swState !== shown.sw) {
    for (const [id, [x, y]] of Object.entries(SWP)) el.swBlade[id].setAttribute("d", `M${x + 1.6} ${y}L${x + 19} ${closedOf(id) ? y : y - 8}`);
    el.bcBar.setAttribute("d", s.batCont ? `M${BC.x0} ${BC.y - 2.4}H${BC.x1}` : `M${BC.x0} ${BC.y - 6}H${BC.x1}`);
    el.scBar.setAttribute("d", s.st.cont ? `M${NODE[0] + 2.4} ${SC.y0}V${SC.y1}` : `M${NODE[0] + 7} ${SC.y0}V${SC.y1}`);
    shown.sw = swState;
  }
  const cbState = s.cb.map((k) => (k.open ? 2 : k.pulled ? 1 : 0)).join("");
  if (cbState !== shown.cb) {
    M.CB.forEach((c, i) => {
      const [x, y] = CBP[c.id] ?? [];
      const off = s.cb[i].open || s.cb[i].pulled;
      if (el.cbLine[c.id]) el.cbLine[c.id].setAttribute("d", off ? `M${x} ${y}H${x + 6}M${x + 14} ${y}H${x + 20}` : `M${x} ${y}H${x + 20}`);
      el.cbFace[i].innerHTML = P.breakerFace(V.F, i, off);
    });
    shown.cb = cbState;
  }
  // the regulator's switching: a few periods of its square wave at the duty it holds
  {
    const x0 = REG.x + 8;
    const x1 = REG.x + REG.w - 8;
    const hi = REG.y + 19;
    const lo = REG.y + 31;
    const per = (x1 - x0) / 4;
    let d = `M${x0} ${lo}`;
    for (let i = 0; i < 4; i++) {
      const a = x0 + i * per;
      const on = Math.max(0, Math.min(1, s.D)) * per;
      if (on > 0.3) d += `L${K.r2(a)} ${hi}L${K.r2(a + on)} ${hi}L${K.r2(a + on)} ${lo}`;
      d += `L${K.r2(a + per)} ${lo}`;
    }
    el.pwm.setAttribute("d", d);
  }
  // ---- Section A-A: the belt; Section B-B: the rotor turns (slowed 1:250), the slots carry the phases
  // a broken belt is gone: its place in the groove in phantom
  if (s.fault.belt !== shown.belt) {
    el.belt.innerHTML = s.fault.belt ? `<g data-role="phantom">${K.line(V.A, P.AL.belt, "phan", true)}<path class="hit" d="${K.d(V.A, P.AL.belt)}"/></g>` : P.beltA(V.A);
    shown.belt = s.fault.belt;
  }
  const th = s.rot / SLOW.rotor;
  const c0 = V.B.p([0, 0]);
  el.rotorB.setAttribute("transform", `rotate(${K.r2((-th * 180) / Math.PI)} ${c0[0]} ${c0[1]})`);
  const amp = Math.min(1, s.Ialt / 50);
  el.slots.forEach((node, k) => {
    const a = (P.slotAngle(k) * Math.PI) / 180;
    // each slot's current follows the claw passing it: the stator's field turns with the rotor
    node.setAttribute("fill-opacity", K.r2(amp * Math.abs(Math.cos(M.ALT.pairs * (a - th - Math.PI / 2)))));
  });
  // ---- Section D-D: the Bendix pinion screws into the ring gear
  if (!(Math.abs(s.st.pin - shown.pin) < 0.004)) {
    el.drive.innerHTML = P.part(20, P.pinion(V.D, s.st.pin) + P.driveSpring(V.D, s.st.pin));
    el.lb20.innerHTML = K.balloon(V.D, [P.pinionShift(s.st.pin) + 7, -P.ST.pinion.rTip + 1.5], LIVE[20].at, 20, { target: 20 });
    shown.pin = s.st.pin;
  }
  // ---- View H: the ring gear turns with the crank; the pinion meshes only once it has screwed in
  {
    const phi = s.eng.theta / SLOW.ring;
    const meshed = s.st.pin > 0.97;
    el.hRing.innerHTML = K.body(VH, P.ringArc(phi));
    // out of mesh the pinion stands 2 mm behind the ring's face, idle: drawn in phantom
    const pin = P.pinionGear(meshed ? phi : 0);
    el.hPinion.innerHTML = meshed ? P.part(20, K.body(VH, pin) + K.body(VH, K.circle(0, 0, 7, 24))) : `<g data-role="phantom">${K.line(VH, pin, "phan", true)}${K.line(VH, K.circle(0, 0, 7, 24), "phan", true)}</g>`;
  }
  // ---- Section E-E: the electrolyte's density follows its specific gravity
  const sg = M.sg(s.soc);
  if (!(Math.abs(sg - shown.acid) < 0.0005)) {
    const op = K.r2(0.25 + 0.75 * Math.min(1, Math.max(0, (sg - 1.11) / 0.175)));
    for (const node of el.acid) node.setAttribute("fill-opacity", op);

  }
  // ---- Detail G: the focused breaker's bimetal bends with its heat; tripped, the button pops
  const fi = focusBreaker();
  const fk = s.cb[fi];
  const lift = P.plungerLift(fk.open || fk.pulled);
  const plKey = `${lift}`;
  if (plKey !== shown.plunger) {
    el.plunger.innerHTML = P.plunger(V.G, lift);
    shown.plunger = plKey;
  }
  if (!(Math.abs(fk.th - shown.bimetal) < 0.004)) {
    el.bimetal.innerHTML = P.bimetal(V.G, fk.th);
    shown.bimetal = fk.th;
  }
  // ---- View F: switches, the key, the ammeter, the annunciator
  const rk = `${s.sw.alt}${s.sw.bat}${s.sw.avn}`;
  if (rk !== shown.rock) {
    el.rock.alt.innerHTML = P.rocker(V.F, P.PF.sw.alt, P.PF.sw.v, s.sw.alt);
    el.rock.bat.innerHTML = P.rocker(V.F, P.PF.sw.bat, P.PF.sw.v, s.sw.bat);
    el.rock.avn.innerHTML = P.rocker(V.F, P.PF.sw.avn, P.PF.sw.v, s.sw.avn);
    shown.rock = rk;
  }
  const kp = s.sw.start ? "START" : s.eng.run ? "BOTH" : "OFF";
  if (kp !== shown.key) {
    el.key.innerHTML = P.keySwitch(V.F, kp);
    shown.key = kp;
  }
  el.needle.innerHTML = P.ammeterNeedle(V.F, s.Iamm);
  el.lv.style.display = s.lv ? "" : "none";
  // ---- Diagram 1: the alternator's operating point, and its curve at the present field
  el.c1dot.setAttribute("cx", c1x(s.altN / M.ALT_RATIO));
  el.c1dot.setAttribute("cy", c1y(s.Ialt));
  el.c1now.setAttribute("points", s.If > 0.02 ? RANGE.map((r) => `${c1x(r)},${c1y(M.altCurrent(r * M.ALT_RATIO, s.If, M.REG.set))}`).join(" ") : "");
  // ---- Diagram 2: the focused breaker's clock: how long its present current has heated it, and
  // where it will trip
  {

    el.c2dot.setAttribute("cx", x);
    el.c2dot.setAttribute("cy", c2y(fk.open ? M.tripTime(Math.max(1.3, ratio)) : Math.max(0.1, te)));

  }

  const onTour = mode === "tour";
  for (const node of [el.c3cur, el.c3v, el.c3i]) node.style.display = onTour ? "" : "none";
  if (onTour) {
    el.c3cur.setAttribute("d", `M${c3x(s.t)} ${C3.y0}V${C3.y1}`);
    el.c3v.setAttribute("cx", c3x(s.t));
    el.c3v.setAttribute("cy", c3v(s.V));
    el.c3i.setAttribute("cx", c3x(s.t));
    el.c3i.setAttribute("cy", c3i(s.Iamm));
  }
  // ---- readouts
  const heating = !fk.open && fk.th > 0.12 && (fk.I ?? 0) > M.BREAKER.k * M.CB[fi].In;
  const ph = heating ? `${M.CB[fi].name} BREAKER AT ${Math.round(fk.th * 100)} %` : M.phase(s);
  const end = s.Ibat > 0.3 && s.eng.run ? ` · ${mmss(M.endurance(s.soc, s.Ibat))} LEFT` : "";
  el.readout.textContent = `BUS ${s.V.toFixed(1)} V · ${s.st.cont ? `STARTER ${Math.round(s.Ist)} A` : `LOAD ${s.Itot.toFixed(1)} A`} · ALT ${s.Ialt.toFixed(1)} A · FIELD ${s.If.toFixed(2)} A ${Math.round(s.D * 100)} % · ${Math.round(s.eng.rpm)} rpm`;
  el.readout2.textContent = `AMMETER ${signed(s.Iamm)} A · SG ${sg.toFixed(3)}${end} · ${ph}`;
  say(`Bus ${s.V.toFixed(1)} volts, ammeter ${s.Iamm >= 0 ? "plus" : "minus"} ${Math.abs(s.Iamm).toFixed(0)} amps; ${ph.toLowerCase()}.`, live.clock);
}

// ---------------------------------------------------------------- input
const live = L.run({
  root: svg,
  step,
  render,
  idleAfter: 8,
  onFrozen: () => q.check && C.selfCheck(svg),
});

if (live.reduced && !live.frozen) {
  // a still, true moment: the alternator's belt has broken, the battery carries the loads
  const fake = { touring: true, reduced: false, clock: 0 };
  for (let t = 0; t < 23; t += 1 / 120) step(1 / 120, fake);
  render(live);
}

function toFree() {
  if (mode === "tour") {
    ctl = M.tourCtl(s.t, s);
    ctl.pull = ctl.pull.slice();
    ctl.start = false;
    mode = "free";
  }
}
function toggleBreaker(i) {
  toFree();
  const k = s.cb[i];
  if (k.open) M.resetBreaker(s, i);
  else ctl.pull[i] = !ctl.pull[i];
}
const svgPt = (e) => {
  const p = svg.createSVGPoint();
  p.x = e.clientX;
  p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
};
for (const hit of svg.querySelectorAll("[data-cb]")) hit.addEventListener("click", () => (toggleBreaker(Number(hit.dataset.cb)), live.input()));
for (const hit of svg.querySelectorAll("[data-sw]")) hit.addEventListener("click", () => (toFree(), (ctl[hit.dataset.sw] = !ctl[hit.dataset.sw]), live.input()));
for (const hit of svg.querySelectorAll("[data-key]")) {
  hit.addEventListener("pointerdown", (e) => {
    toFree();
    keyHeld = true;
    hit.setPointerCapture(e.pointerId);
    live.input();
  });
  const up = () => ((keyHeld = false), live.input());
  hit.addEventListener("pointerup", up);
  hit.addEventListener("pointercancel", up);
}
for (const hit of svg.querySelectorAll("[data-drag]")) {
  const set = (e) => {
    const r = ((svgPt(e).x - C1.x0) / (C1.x1 - C1.x0)) * C1.rMax;
    ctl.throttle = Math.min(M.RPM.max, Math.max(M.RPM.idle, r));
    live.input();
  };
  hit.addEventListener("pointerdown", (e) => {
    toFree();
    dragRpm = true;
    hit.setPointerCapture(e.pointerId);
    set(e);
  });
  hit.addEventListener("pointermove", (e) => dragRpm && set(e));
  const end = () => ((dragRpm = false), live.input());
  hit.addEventListener("pointerup", end);
  hit.addEventListener("pointercancel", end);
}

const CB_KEYS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "-"];
svg.addEventListener("keydown", (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === " ") {
    mode = "tour";
    s = M.tourStart();
    e.preventDefault();
    live.input();
    live.touring = true;
    return;
  }
  if (k === "s") live.slow = live.slow === 1 ? 0.25 : live.slow === 0.25 ? 0.06 : 1;
  else if (k === "b" || k === "a" || k === "v" || k === "n" || k === "l" || k === "p") {
    toFree();
    const name = { b: "bat", a: "alt", v: "avn", n: "nav", l: "land", p: "pitot" }[k];
    ctl[name] = !ctl[name];
  } else if (k === "k") {
    if (!e.repeat) {
      toFree();
      keyHeld = true;
    }
  } else if (k === "f") {
    toFree();
    ctl.flapSel = (ctl.flapSel + 10) % 40;
  } else if (k === "z") {
    toFree();
    ctl.belt = !ctl.belt;
  } else if (k === "x") {
    toFree();
    ctl.short = !ctl.short;
  } else if (k === "ArrowUp" || k === "ArrowDown") {
    toFree();
    const now = STEPS.reduce((b, v, i) => (Math.abs(v - ctl.throttle) < Math.abs(STEPS[b] - ctl.throttle) ? i : b), 0);
    ctl.throttle = STEPS[Math.min(STEPS.length - 1, Math.max(0, now + (k === "ArrowUp" ? 1 : -1)))];
  } else if (CB_KEYS.includes(k)) toggleBreaker(CB_KEYS.indexOf(k));
  else return;
  e.preventDefault();
  live.input();
});
svg.addEventListener("keyup", (e) => {
  if (e.key.toLowerCase() === "k") {
    keyHeld = false;
    live.input();
  }
});
svg.addEventListener("blur", () => (keyHeld = false));

if (q.check && !live.frozen) setTimeout(() => C.selfCheck(svg), 400);

</script>
<script>
"use strict";
const BP_LINKS = {"circuit-breaker":{"title":"Circuit breaker","idea":"The circuit breaker pattern: closed, open, half-open","has3d":true,"href":"../circuit-breaker/circuit-breaker.html","href2d":"../circuit-breaker/circuit-breaker.html","href3d":"../circuit-breaker/circuit-breaker-3d.html"}};
const BP_ATLAS = {"slug":"electrical","kind":"2d","level":1,"parent":"light-aircraft","parentPart":"19","atlas":false};
const BP_CARDS = (() => {
// Part cards: hover, tap or focus a balloon and a small card names the part, gives its size and
// material, and says in a sentence what it does. The part it points to lights up in the accent.
//
// Works on both pages: a 2D sheet's balloons are <g data-role="balloon" data-target="n">, a 3D page's
// are <g data-part="n"> in its overlay (re-drawn every frame, so everything here is delegated and
// keyed on the number, never on the element). The data comes from examples/<slug>/info.json, which
// kit/page.mjs inlines as BP_INFO when it exists:
//   { "4": { "name": "O-ring", "spec": "33 × 2", "material": "NBR 70", "note": "Seals the barrel..." } }
// 2D: the part's [data-part] groups get the class bp-hl.  3D: a "bp:part" event (detail.id, or null)
// that kit/solid3d.mjs answers by tinting the part.
//
// Atlas (references/atlas.md): a part with "open": "<slug>" is a doorway into another example. Its card
// adds the child's idea and a "Look inside →" link (or "drawing in progress" while the child is not
// drawn). Activating it (the link, Enter on the focused balloon, double-click on the part in 3D) flies
// in and then navigates: a "bp:open" event (detail { id, href, go }) that kit/solid3d.mjs takes over
// by calling preventDefault (it flies the camera, then calls go); on a 2D sheet the viewBox eases in on
// the part here. links: page.mjs's BP_LINKS; atlas: BP_ATLAS, the page's own slug and place.
// The page also answers ?focus=<part> (start zoomed on that part, ease out) and ?from=<slug> (a short
// zoom-out on arrival); on a 3D page kit/solid3d.mjs does both.

function attach({ info = {}, links = null, atlas = null, root = document }) {
  info = info || {};
  const has = Object.keys(info).length > 0;
  const Q = new URLSearchParams(location.search);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const is3d = !!document.getElementById("gl");
  // no flights in a deterministic frame, a sheet's ?zoom= close-up or a check run
  const still = reduced || Q.has("t") || Q.has("check") || (!is3d && Q.has("zoom"));
  const sheet = is3d ? null : root.querySelector("svg.bp-sheet");
  if (!has && !atlas) return null;

  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

  function light(id) {
    for (const el of document.querySelectorAll(".bp-hl")) el.classList.remove("bp-hl");
    if (id != null) for (const el of document.querySelectorAll(`svg [data-part="${CSS.escape(id)}"]`)) if (!el.closest("#ov")) el.classList.add("bp-hl");
    document.dispatchEvent(new CustomEvent("bp:part", { detail: { id } }));
  }

  // ---- atlas: where a doorway leads, and the flight there
  // { slug, href } for a doorway whose child is drawn, { slug, wip: true } while it is not, else null
  const doorway = (id) => {
    const slug = info[id]?.open;
    if (!slug) return null;
    const l = links?.[slug];
    const href = l ? (is3d ? l.href3d || l.href2d : l.href2d) || l.href : null;
    if (!href) return { slug, wip: true };
    const from = atlas?.slug ? `${href.includes("?") ? "&" : "?"}from=${encodeURIComponent(atlas.slug)}` : "";
    return { slug, href: href + from, title: l.title, idea: l.idea };
  };
  let going = false;
  function go(id) {
    const d = doorway(id);
    if (!d?.href || going) return;
    going = true;
    // inside a frame (a landing-page hero) the whole window goes, not the little frame
    const nav = () => {
      const abs = new URL(d.href, location.href).href;
      try { if (window.top !== window) return window.top.location.assign(abs); } catch {}

    const ev = new CustomEvent("bp:open", { cancelable: true, detail: { id, href: d.href, go: nav } });
    if (!document.dispatchEvent(ev)) return;
    if (sheet) flySheet(id, nav);

  const full = sheet ? (sheet.getAttribute("viewBox") || "0 0 1200 848").split(/[\s,]+/).map(Number) : null;

      const r = el.getBoundingClientRect();
      if (!r.width && !r.height) continue;
      const a = pt(r.left, r.top);
      const b = pt(r.right, r.bottom);
      const key = el.closest("[data-geom]") ?? sheet;
      const g = groups.get(key) ?? [Infinity, Infinity, -Infinity, -Infinity];
      groups.set(key, [Math.min(g[0], a.x), Math.min(g[1], a.y), Math.max(g[2], b.x), Math.max(g[3], b.y)]);
    }
    if (!groups.size) return null;
