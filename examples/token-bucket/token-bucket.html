<!doctype html>
<html lang="en" data-theme="blueprint">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cistern Token Bucket</title>
<meta name="description" content="A live engineering drawing of a WC cistern working as a token bucket rate limiter: a fixed refill orifice adds tokens, each request drains one dose, and a pull is refused when less than one token is left.">
<style>
/* Blueprint sheet styles. Every colour a drawing uses is one of these tokens. */

:root,
[data-theme="blueprint"] {
  --bp-page: #0a2747;
  --bp-paper: #123b69;
  --bp-ink: #e9f1ff;
  --bp-hatch: rgba(214, 230, 255, 0.72);
  --bp-muted: #95b3da;
  --bp-grid: rgba(190, 215, 255, 0.07);
  --bp-accent: #ffc94d;
  --bp-accent-ink: #ffd77a;
  --bp-ui: rgba(233, 241, 255, 0.12);
  /* 3D mode (solid3d.mjs): uncut surfaces in three tones, lit, mid and shadow */
  --bp3-lit: #2a5a93;
  --bp3-mid: #1d4a7e;
  --bp3-dark: #133864;
}
[data-theme="paper"] {
  --bp-page: #e4dfd1;
  --bp-paper: #f7f3e8;
  --bp-ink: #1c2633;
  --bp-hatch: rgba(28, 38, 51, 0.78);
  --bp-muted: #616b78;
  --bp-grid: rgba(28, 38, 51, 0.045);
  --bp-accent: #d4472c;
  --bp-accent-ink: #b8361e;
  --bp-ui: rgba(28, 38, 51, 0.08);
  --bp3-lit: #ece6d8;
  --bp3-mid: #d9d0bc;
  --bp3-dark: #bdb29b;
}
[data-theme="white"] {
  --bp-page: #fafafa;
  --bp-paper: #fafafa;
  --bp-ink: #262626;
  --bp-hatch: rgba(38, 38, 38, 0.42);
  --bp-muted: #8f8f8f;
  --bp-grid: rgba(0, 0, 0, 0);
  --bp-accent: #e2552c;
  --bp-accent-ink: #c8442b;
  --bp-ui: rgba(0, 0, 0, 0.07);
  --bp3-lit: #f1f1f0;
  --bp3-mid: #e0e0de;
  --bp3-dark: #c4c4c1;
}
[data-theme="dark"] {
  --bp-page: #0d0f12;
  --bp-paper: #15181c;
  --bp-ink: #dde3ea;
  --bp-hatch: rgba(221, 227, 234, 0.62);
  --bp-muted: #86919d;
  --bp-grid: rgba(221, 227, 234, 0.035);
  --bp-accent: #f29f3d;
  --bp-accent-ink: #f6b462;
  --bp-ui: rgba(221, 227, 234, 0.08);
  --bp3-lit: #353b43;
  --bp3-mid: #272c32;
  --bp3-dark: #1b1e22;
}

:root {
  --bp-thick: 1.15px;
  --bp-thin: 0.55px;
  --bp-font: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}

html,
body {
  margin: 0;
  background: var(--bp-page);
  color: var(--bp-ink);
  font-family: var(--bp-font);
}
.bp-page {
  max-width: 1480px;
  margin: 0 auto;
  padding: 24px 16px 40px;
  box-sizing: border-box;
}
.bp-figure {
  margin: 0;
}
.bp-sheet {
  display: block;
  width: 100%;
  height: auto;
  outline: none;
  border-radius: 2px;
}
.bp-sheet:focus-visible {
  box-shadow: 0 0 0 2px var(--bp-accent);
}
.bp-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  font-size: 12px;
  color: var(--bp-muted);
  letter-spacing: 0.03em;
}
.bp-bar kbd {
  font: inherit;
  color: var(--bp-ink);
  border: 1px solid var(--bp-ui);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 0 4px;
}
.bp-themes {
  display: flex;
  gap: 4px;
}
.bp-themes button {
  font: inherit;
  color: var(--bp-muted);
  background: transparent;
  border: 1px solid var(--bp-ui);
  border-radius: 3px;
  padding: 3px 9px;
  cursor: pointer;
}
.bp-themes button[aria-pressed="true"] {
  color: var(--bp-ink);
  background: var(--bp-ui);
}
.bp-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Zoom mode (?zoom=x,y,w,h): the region fills the window, for close-up checks. */
body.bp-zoom .bp-page {
  max-width: none;
  padding: 0;
}
body.bp-zoom .bp-sheet {
  width: 100vw;
  height: 100vh;
}
body.bp-zoom .bp-bar {
  display: none;
}

/* ---- the drawing */
.bp-sheet .sheet-bg {
  fill: var(--bp-paper);
}
.bp-sheet .grid {
  fill: none;
  stroke: var(--bp-grid);
  stroke-width: 0.5px;
}
.bp-sheet .vis,
.bp-sheet .thin,
.bp-sheet .hid,
.bp-sheet .ctr,
.bp-sheet .phan {
  fill: none;
  stroke: var(--bp-ink);
  stroke-linejoin: round;
  stroke-linecap: round;
}
.bp-sheet .vis {
  stroke-width: var(--bp-thick);
}
.bp-sheet .thin,
.bp-sheet .hid,
.bp-sheet .ctr,
.bp-sheet .phan {
  stroke-width: var(--bp-thin);
}
.bp-sheet .hid {
  stroke-dasharray: 4 2.2;
  stroke-linecap: butt;
}
.bp-sheet .ctr {
  stroke-dasharray: 15 2.6 2 2.6;
  stroke-linecap: butt;
}
.bp-sheet .phan {
  stroke-dasharray: 13 2.4 1.8 2.4 1.8 2.4;
  stroke-linecap: butt;
}
.bp-sheet .vis.spring {
  stroke-width: var(--bp-thin);
}
.bp-sheet .paper,
.bp-sheet .balloon {
  fill: var(--bp-paper);
}
.bp-sheet .balloon {
  stroke: var(--bp-ink);
  stroke-width: var(--bp-thin);
}
.bp-sheet .solid,
.bp-sheet .head,
.bp-sheet .dot {
  fill: var(--bp-ink);
}
.bp-sheet .hl {
  fill: none;
  stroke: var(--bp-hatch);
  stroke-width: 0.5px;
}
.bp-sheet .hl-dash {
  stroke-dasharray: 1.3 1.3;
}
.bp-sheet .hd {
  fill: var(--bp-hatch);
}
.bp-sheet .tint {
  fill: var(--bp-accent);
}
.bp-sheet .accent {
  stroke: var(--bp-accent);
}
.bp-sheet .accent-fill {
  fill: var(--bp-accent);
}
.bp-sheet .t {
  font-family: var(--bp-font);
  font-size: 9.5px;
  fill: var(--bp-ink);
  letter-spacing: 0.02em;
}
.bp-sheet .t-sm {
  font-size: 7.6px;
}
.bp-sheet .t-lg {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
}
.bp-sheet .t-xl {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.05em;
}
.bp-sheet .t-cap {
  font-size: 6.2px;
  fill: var(--bp-muted);
  letter-spacing: 0.08em;
}
.bp-sheet .t-head {
  font-weight: 600;
  letter-spacing: 0.06em;
}
.bp-sheet .t-mute {
  fill: var(--bp-muted);
}
.bp-sheet .t-accent {
  fill: var(--bp-accent-ink);
}
.bp-sheet [data-drag] {
  cursor: ns-resize;
  touch-action: none;
}

/* ---- part cards (kit/info.mjs): hover, tap or focus a balloon */
[data-role="balloon"][tabindex], #ov g[data-part] { cursor: pointer; }
#ov g[data-part] { pointer-events: auto; }
[data-role="balloon"]:hover .balloon, [data-role="balloon"]:focus .balloon, #ov g[data-part]:hover .balloon { stroke: var(--bp-accent); stroke-width: 1.6px; }
[data-role="balloon"]:focus { outline: none; }
.bp-hl .vis, .bp-hl .thin, .bp-hl path, .bp-hl circle, .bp-hl polygon, .bp-hl rect { stroke: var(--bp-accent) !important; }
.bp-hl .vis { stroke-width: calc(var(--bp-thick) * 1.8) !important; }
.bp-card {
  position: absolute; z-index: 50; max-width: 280px; padding: 10px 12px 11px; box-sizing: border-box;
  background: var(--bp-paper); color: var(--bp-ink); border: 1px solid var(--bp-ink); border-radius: 3px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, .14); font: 12px/1.45 var(--bp-font); pointer-events: auto;
}
.bp-card[hidden] { display: none; }
.bp-card-h { display: flex; gap: 8px; align-items: center; }
.bp-card-h b { font-weight: 600; letter-spacing: .02em; text-transform: uppercase; font-size: 11.5px; }
.bp-card-n { flex: none; display: inline-grid; place-items: center; width: 20px; height: 20px; border: 1px solid var(--bp-ink); border-radius: 50%; font-size: 10.5px; }
.bp-card-s { margin: 4px 0 0 28px; color: var(--bp-muted); font-size: 10.5px; letter-spacing: .02em; }
.bp-card p { margin: 7px 0 0; font-size: 11.5px; line-height: 1.5; }
.bp-card-x { margin-top: 7px; color: var(--bp-muted); font-size: 9.5px; letter-spacing: .03em; }

/* ---- the sheet's link to its 3D view */
.bp-3d { font: inherit; color: var(--bp-paper); background: var(--bp-ink); text-decoration: none; border-radius: 3px; padding: 4px 10px; letter-spacing: .03em; white-space: nowrap; }
.bp-3d:hover, .bp-3d:focus-visible { background: var(--bp-accent); color: #fff; outline: none; }

/* ---- atlas (references/atlas.md): doorways, breadcrumb */
.bp-card-i { font-family: var(--bp-font); font-style: italic; color: var(--bp-muted); }
.bp-card-go { display: inline-block; margin-top: 8px; color: var(--bp-paper); background: var(--bp-ink); text-decoration: none; border-radius: 3px; padding: 3px 9px; font-size: 11px; letter-spacing: .03em; }
.bp-card-go:hover, .bp-card-go:focus-visible { background: var(--bp-accent); color: #fff; outline: none; }
.bp-card-wip { margin-top: 7px; color: var(--bp-muted); font-size: 10.5px; letter-spacing: .03em; }
.bp-crumbs { display: flex; flex-wrap: wrap; gap: 4px 7px; align-items: center; letter-spacing: .04em; }
.bp-crumbs a { color: var(--bp-ink); text-decoration: none; border-bottom: 1px solid var(--bp-ui); }
.bp-crumbs a:hover, .bp-crumbs a:focus-visible { color: var(--bp-accent); border-color: currentColor; outline: none; }
.bp-crumbs i { font-style: normal; color: var(--bp-muted); }
.bp-crumbs [aria-current] { color: var(--bp-ink); }
.bp-doors { position: fixed; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); z-index: 40; }
.bp-doors:focus-within { width: auto; height: auto; clip-path: none; left: 22px; top: 54px; display: flex; flex-direction: column; gap: 3px; padding: 6px; background: var(--bp-paper); border: 1px solid var(--bp-ink); border-radius: 3px; }
.bp-doors button { font: 11px/1.3 var(--bp-font); text-align: left; color: var(--bp-ink); background: transparent; border: 1px solid var(--bp-ui); border-radius: 3px; padding: 3px 8px; cursor: pointer; }
.bp-doors button:focus-visible { outline: none; border-color: var(--bp-accent); color: var(--bp-accent); }
.bp-doors button[aria-disabled="true"] { color: var(--bp-muted); }
.bp-flying { pointer-events: none; }

.bp-sheet .hit{fill:transparent}.bp-sheet .dry{fill:var(--bp-paper)}.bp-sheet [data-drag]{cursor:pointer}.bp-sheet .water{fill:url(#water)}.bp-sheet .water-dash{fill:none;stroke:var(--bp-accent);stroke-width:.7px}.bp-sheet .grid-line{stroke:var(--bp-grid);stroke-width:.6px}.bp-sheet .hl-dot{stroke-dasharray:.5 1.6}.bp-sheet .cut-plane{stroke-width:2.2px}.bp-sheet .mark-x{fill:none;stroke:var(--bp-ink);stroke-width:1px}
</style>
</head>
