<style>
/* Blueprint sheet styles. Every colour a drawing uses is one of these tokens. */

:root,
[data-theme="blueprint"] {
  --bp-page: #0a2747;
  --bp-paper: #123b69;
  --bp-ink: #e9f1ff;
  --bp-hatch: rgba(214, 230, 255, 0.72);
  --bp-muted: #95b3da;
  --bp-grid: rgba(190, 215, 255, 0.07);
  --bp-accent: #ffc94d;
  --bp-accent-ink: #ffd77a;
  --bp-ui: rgba(233, 241, 255, 0.12);
}
[data-theme="paper"] {
  --bp-page: #e4dfd1;
  --bp-paper: #f7f3e8;
  --bp-ink: #1c2633;
  --bp-hatch: rgba(28, 38, 51, 0.78);
  --bp-muted: #616b78;
  --bp-grid: rgba(28, 38, 51, 0.045);
  --bp-accent: #d4472c;
  --bp-accent-ink: #b8361e;
  --bp-ui: rgba(28, 38, 51, 0.08);
}
[data-theme="white"] {
  --bp-page: #fafafa;
  --bp-paper: #fafafa;
  --bp-ink: #262626;
  --bp-hatch: rgba(38, 38, 38, 0.42);
  --bp-muted: #8f8f8f;
  --bp-grid: rgba(0, 0, 0, 0);
  --bp-accent: #e2552c;
  --bp-accent-ink: #c8442b;
  --bp-ui: rgba(0, 0, 0, 0.07);
}
[data-theme="dark"] {
  --bp-page: #0d0f12;
  --bp-paper: #15181c;
  --bp-ink: #dde3ea;
  --bp-hatch: rgba(221, 227, 234, 0.62);
  --bp-muted: #86919d;
  --bp-grid: rgba(221, 227, 234, 0.035);
  --bp-accent: #f29f3d;
  --bp-accent-ink: #f6b462;
  --bp-ui: rgba(221, 227, 234, 0.08);
}

:root {
  --bp-thick: 1.15px;
  --bp-thin: 0.55px;
  --bp-font: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}

html,
body {
  margin: 0;
  background: var(--bp-page);
  color: var(--bp-ink);
  font-family: var(--bp-font);
}
.bp-page {
  max-width: 1480px;
  margin: 0 auto;
  padding: 24px 16px 40px;
  box-sizing: border-box;
}
.bp-figure {
  margin: 0;
}
.bp-sheet {
  display: block;
  width: 100%;
  height: auto;
  outline: none;
  border-radius: 2px;
}
.bp-sheet:focus-visible {
  box-shadow: 0 0 0 2px var(--bp-accent);
}
.bp-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  font-size: 12px;
  color: var(--bp-muted);
  letter-spacing: 0.03em;
}
.bp-bar kbd {
  font: inherit;
  color: var(--bp-ink);
  border: 1px solid var(--bp-ui);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 0 4px;
}
.bp-themes {
  display: flex;
  gap: 4px;
}
.bp-themes button {
  font: inherit;
  color: var(--bp-muted);
  background: transparent;
  border: 1px solid var(--bp-ui);
  border-radius: 3px;
  padding: 3px 9px;
  cursor: pointer;
}
.bp-themes button[aria-pressed="true"] {
  color: var(--bp-ink);
  background: var(--bp-ui);
}
.bp-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Zoom mode (?zoom=x,y,w,h): the region fills the window, for close-up checks. */
body.bp-zoom .bp-page {
  max-width: none;
  padding: 0;
}
body.bp-zoom .bp-sheet {
  width: 100vw;
  height: 100vh;
}
body.bp-zoom .bp-bar {
  display: none;
}

/* ---- the drawing */
.bp-sheet .sheet-bg {
  fill: var(--bp-paper);
}
.bp-sheet .grid {
  fill: none;
  stroke: var(--bp-grid);
  stroke-width: 0.5px;
}
.bp-sheet .vis,
.bp-sheet .thin,
.bp-sheet .hid,
.bp-sheet .ctr,
.bp-sheet .phan {
  fill: none;
  stroke: var(--bp-ink);
  stroke-linejoin: round;
  stroke-linecap: round;
}
.bp-sheet .vis {
  stroke-width: var(--bp-thick);
}
.bp-sheet .thin,
.bp-sheet .hid,
.bp-sheet .ctr,
.bp-sheet .phan {
  stroke-width: var(--bp-thin);
}
.bp-sheet .hid {
  stroke-dasharray: 4 2.2;
  stroke-linecap: butt;
}
.bp-sheet .ctr {
  stroke-dasharray: 15 2.6 2 2.6;
  stroke-linecap: butt;
}
.bp-sheet .phan {
  stroke-dasharray: 13 2.4 1.8 2.4 1.8 2.4;
  stroke-linecap: butt;
}
.bp-sheet .vis.spring {
  stroke-width: var(--bp-thin);
}
.bp-sheet .paper,
.bp-sheet .balloon {
  fill: var(--bp-paper);
}
.bp-sheet .balloon {
  stroke: var(--bp-ink);
  stroke-width: var(--bp-thin);
}
.bp-sheet .solid,
.bp-sheet .head,
.bp-sheet .dot {
  fill: var(--bp-ink);
}
.bp-sheet .hl {
  fill: none;
  stroke: var(--bp-hatch);
  stroke-width: 0.5px;
}
.bp-sheet .hl-dash {
  stroke-dasharray: 1.3 1.3;
}
.bp-sheet .hd {
  fill: var(--bp-hatch);
}
.bp-sheet .tint {
  fill: var(--bp-accent);
}
.bp-sheet .accent {
  stroke: var(--bp-accent);
}
.bp-sheet .accent-fill {
  fill: var(--bp-accent);
}
.bp-sheet .t {
  font-family: var(--bp-font);
  font-size: 9.5px;
  fill: var(--bp-ink);
  letter-spacing: 0.02em;
}
.bp-sheet .t-sm {
  font-size: 7.6px;
}
.bp-sheet .t-lg {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
}
.bp-sheet .t-xl {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.05em;
}
.bp-sheet .t-cap {
  font-size: 6.2px;
  fill: var(--bp-muted);
  letter-spacing: 0.08em;
}
.bp-sheet .t-head {
  font-weight: 600;
  letter-spacing: 0.06em;
}
.bp-sheet .t-mute {
  fill: var(--bp-muted);
}
.bp-sheet .t-accent {
  fill: var(--bp-accent-ink);
}
.bp-sheet [data-drag] {
  cursor: ns-resize;
  touch-action: none;
}

.bp-sheet .hit{fill:transparent}.bp-sheet .tint-c{fill:url(#w-c)}.bp-sheet .tint-in{fill:url(#w-in)}.bp-sheet .tint-out{fill:url(#w-out)}.bp-sheet .water-dot{fill:var(--bp-accent)}.bp-sheet .grid-line{stroke:var(--bp-grid);stroke-width:.6px}.bp-sheet [data-drag]{cursor:pointer}
</style>

<script>
"use strict";
const K = (() => {
// Blueprint drafting kit: orthographic views, sections, hatching, dimensions and sheet furniture.
// Every function here is pure and returns SVG markup strings, so the same code runs in the build
// and, inlined, in the page (live dimensions, moving springs, needles).
//
// Units. World geometry is in millimetres of the real object: u to the right, v up (a front view),
// or u right, v away from the viewer (a plan view). The sheet is an A2 drawing, 594 mm wide, drawn
// 1200 units wide; a view maps world mm to sheet units through its drawing scale.

const SHEET = { w: 1200, h: 848 };
const PX_PER_MM = SHEET.w / 594;

// ISO 128 line widths and ISO 3098 lettering, in sheet units (A2: 0.5 / 0.25 mm lines, 3.5 mm text).
const THICK = 1.15;
const THIN = 0.55;
const TEXT = 9.5;
const ARROW = 7;
const GAP = 2.2; // extension lines start this far from the object
const OVER = 3.5; // and run this far past the dimension line

const r2 = (n) => Math.round(n * 100) / 100;

function fmt(n, digits = 1) {
  const near = Math.round(n);
  if (Math.abs(n - near) < 0.05) return String(near);
  return n.toFixed(digits);
}

// ---------------------------------------------------------------- views

// A view is a window from world mm onto the sheet. scale is the drawing scale (1/2.5 for "1:2.5").
function view({ x, y, scale, name = "" }) {
  const k = scale * PX_PER_MM;
  return { x, y, scale, k, name, p: ([u, v]) => [r2(x + u * k), r2(y - v * k)] };
}

const scaleLabel = (scale) => (scale >= 1 ? `${fmt(scale)}:1` : `1:${fmt(1 / scale)}`);

function d(V, pts, closed = true) {
  let out = "";
  for (let i = 0; i < pts.length; i++) {
    const [x, y] = V.p(pts[i]);
    out += `${i ? "L" : "M"}${x} ${y}`;
  }
  return closed ? out + "Z" : out;
}

// ---------------------------------------------------------------- world geometry (point lists)

const rect = (u0, v0, u1, v1) => [[u0, v0], [u1, v0], [u1, v1], [u0, v1]];

function arc(cu, cv, r, a0, a1, steps) {
  const n = steps ?? Math.max(3, Math.ceil(Math.abs(a1 - a0) / 7.5));
  const out = [];
  for (let i = 0; i <= n; i++) {
    const a = ((a0 + ((a1 - a0) * i) / n) * Math.PI) / 180;
    out.push([cu + r * Math.cos(a), cv + r * Math.sin(a)]);
  }
  return out;
}

const circle = (cu, cv, r, steps = 48) => arc(cu, cv, r, 0, 360 - 360 / steps, steps - 1);

// A rectangle with filleted corners.
function rrect(u0, v0, u1, v1, r, steps = 4) {
  const q = Math.min(r, (u1 - u0) / 2, (v1 - v0) / 2);
  return [
    ...arc(u1 - q, v0 + q, q, -90, 0, steps),
    ...arc(u1 - q, v1 - q, q, 0, 90, steps),
    ...arc(u0 + q, v1 - q, q, 90, 180, steps),
    ...arc(u0 + q, v0 + q, q, 180, 270, steps),
  ];
}

const move = (pts, du, dv) => pts.map(([u, v]) => [u + du, v + dv]);
const flipU = (pts, about = 0) => pts.map(([u, v]) => [2 * about - u, v]).reverse();
const flipV = (pts, about = 0) => pts.map(([u, v]) => [u, 2 * about - v]).reverse();

function inside([u, v], poly) {
  let hit = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [ui, vi] = poly[i];
    const [uj, vj] = poly[j];
    if (vi > v !== vj > v && u < ((uj - ui) * (v - vi)) / (vj - vi) + ui) hit = !hit;
  }
  return hit;
}

// A body of revolution cut through its axis.
// loop is the half-profile as [r, s] pairs: r >= 0 measured from the axis, s along the axis.
// axis "v" is a vertical axis at u = at; axis "u" a horizontal axis at v = at.
// Returns the cut faces (hatched) and the edges seen through the bore behind the cutting plane:
// every circle on an inner surface shows edge-on as a straight line across the bore.
function revolve(loop, { axis = "v", at = 0 } = {}) {
  const place = axis === "v" ? (r, s) => [at + r, s] : (r, s) => [s, at + r];
  const n = loop.length;
  const onAxis = loop.findIndex(([r], i) => r === 0 && loop[(i + 1) % n][0] === 0);
  let cuts;
  if (onAxis >= 0) {
    const chain = Array.from({ length: n }, (_, j) => loop[(onAxis + 1 + j) % n]);
    const right = chain.map(([r, s]) => place(r, s));
    const left = chain.slice(1, -1).reverse().map(([r, s]) => place(-r, s));
    cuts = [[...right, ...left]];
  } else {
    cuts = [loop.map(([r, s]) => place(r, s)), loop.map(([r, s]) => place(-r, s)).reverse()];
  }
  const eps = 1e-3;
  const across = new Map();
  const clear = (r, s) => [0.02, 0.25, 0.5, 0.75, 0.98].every((t) => !inside([t * r, s], loop));
  for (const [r, s] of loop) {
    if (r <= 0) continue;
    if (clear(r, s + eps) && clear(r, s - eps)) across.set(s, Math.max(across.get(s) ?? 0, r));
  }
  const edges = [...across].map(([s, r]) => [place(-r, s), place(r, s)]);
  return { cuts, edges };
}

// ---------------------------------------------------------------- hatching

// ANSI/ISO-style material hatches. Spacing is in sheet units and never scales with the view,
// so a detail at 2:1 shows the same density as the main view, as on a real drawing.
const MATERIALS = {
  steel: { kind: "lines", gap: 3.4 },
  iron: { kind: "lines", gap: 5.6 },
  alu: { kind: "pairs", gap: 5.2, pair: 1.5 },
  brass: { kind: "dashed", gap: 4.6 },
  bronze: { kind: "dashed", gap: 3.6 },
  rubber: { kind: "cross", gap: 3.2 },
  plastic: { kind: "lines", gap: 2.3 },
  foam: { kind: "dots", gap: 2.6 },
  wood: { kind: "grain", gap: 4 },
};
const ANGLES = [45, 135, 30, 60];

function hatchDefs() {
  let out = "";
  for (const [name, m] of Object.entries(MATERIALS)) {
    for (const angle of ANGLES) {
      const g = m.gap;
      let body = "";
      if (m.kind === "lines") body = `<path class="hl" d="M0 -1V${g + 1}"/>`;
      if (m.kind === "pairs") body = `<path class="hl" d="M0 -1V${g + 1}M${m.pair} -1V${g + 1}"/>`;
      if (m.kind === "dashed") body = `<path class="hl" d="M0 -1V${g + 1}"/><path class="hl hl-dash" d="M${g / 2} -1V${g + 1}"/>`;
      if (m.kind === "cross") body = `<path class="hl" d="M0 -1V${g + 1}M-1 0H${g + 1}"/>`;
      if (m.kind === "dots") body = `<circle class="hd" cx="${g / 2}" cy="${g / 2}" r="0.42"/>`;
      if (m.kind === "grain") body = `<path class="hl" d="M0 -1V${g + 1}"/><path class="hl" d="M${g * 0.55} -1C${g * 0.75} ${g * 0.3} ${g * 0.35} ${g * 0.7} ${g * 0.55} ${g + 1}"/>`;
      out += `<pattern id="h-${name}-${angle}" patternUnits="userSpaceOnUse" width="${g}" height="${g}" patternTransform="rotate(${angle})">${body}</pattern>`;
    }
  }
  return out;
}

// ---------------------------------------------------------------- drawing parts

// A cut face: paper underneath (it hides what is behind), the material hatch, a thick outline.
// mat "solid" blacks the section in, the ISO convention for sections too thin to hatch.
function cut(V, pts, { mat = "steel", angle = 45 } = {}) {
  const dd = d(V, pts);
  if (mat === "solid") return `<path class="solid" d="${dd}"/>`;
  return `<path class="paper" d="${dd}"/><path fill="url(#h-${mat}-${angle})" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

// A body of revolution in section, with the edges behind the cut.
function section(V, rev, opts) {
  return rev.cuts.map((c) => cut(V, c, opts)).join("") + rev.edges.map((e) => line(V, e)).join("");
}

// An unsectioned solid (shafts, rods, pins, balls, nuts and ribs are never hatched in a section).
function body(V, pts) {
  const dd = d(V, pts);
  return `<path class="paper" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

const line = (V, pts, cls = "vis", closed = false) => `<path class="${cls}" d="${d(V, pts, closed)}"/>`;
const lines = (V, list, cls = "vis") => `<path class="${cls}" d="${list.map((pts) => d(V, pts, false)).join("")}"/>`;

// A centre line, run a little past the outline at both ends.
function centerline(V, a, b, over = 6) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  return `<path class="ctr" d="M${r2(ax - ux * over)} ${r2(ay - uy * over)}L${r2(bx + ux * over)} ${r2(by + uy * over)}"/>`;
}

// Centre mark for a circle in a view: two crossed centre lines.
function centerMark(V, [cu, cv], r, over = 5) {
  return centerline(V, [cu - r, cv], [cu + r, cv], over) + centerline(V, [cu, cv - r], [cu, cv + r], over);
}

// A compression spring cut along its axis: wire sections (blacked in) on both sides, half a pitch
// apart, joined by the back half of each turn. from/to are positions along the axis.
function springSection(V, { from, to, radius, wire, turns, axis = "u", at = 0 }) {
  const place = axis === "u" ? (s, r) => [s, at + r] : (s, r) => [at + r, s];
  const pitch = (to - from - wire) / turns;
  const start = from + wire / 2;
  const back = [];
  let sections = "";
  for (let i = 0; i <= turns; i++) {
    const sTop = start + i * pitch;
    sections += cut(V, circle(...place(sTop, radius), wire / 2, 12), { mat: "solid" });
    if (i < turns) {
      const sBot = sTop + pitch / 2;
      sections += cut(V, circle(...place(sBot, -radius), wire / 2, 12), { mat: "solid" });
      back.push([place(sTop, radius), place(sBot, -radius)]);
    }
  }
  return lines(V, back, "vis spring") + sections;
}

// ---------------------------------------------------------------- annotation

function arrowHead([x, y], [dx, dy]) {
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len;
  const uy = dy / len;
  const bx = x - ux * ARROW;
  const by = y - uy * ARROW;
  const half = ARROW * 0.25;
  return `M${r2(x)} ${r2(y)}L${r2(bx - uy * half)} ${r2(by + ux * half)}L${r2(bx + uy * half)} ${r2(by - ux * half)}Z`;
}

const textWidth = (s, size = TEXT) => String(s).length * size * 0.6;

// A linear dimension between two world points, measured along dir ("h" or "v").
// off is the sheet distance from point a to the dimension line (negative: up or left).
// The value is measured from the geometry unless text is given, so a dimension cannot lie.
function dim(V, a, b, { dir = "h", off = 18, text, prefix = "", suffix = "", id = "", cls = "" } = {}) {
  const A = V.p(a);
  const B = V.p(b);
  const value = text ?? prefix + fmt(Math.abs(dir === "h" ? b[0] - a[0] : b[1] - a[1])) + suffix;
  const h = dir === "h";
  const main = h ? 0 : 1; // the axis the dimension measures along
  const side = 1 - main;
  const at = A[side] + off; // where the dimension line sits
  const pt = (m, s) => (h ? [m, s] : [s, m]);
  let ext = "";
  for (const P of [A, B]) {
    const gapTo = at - P[side];
    if (Math.abs(gapTo) <= GAP) continue;
    const sgn = Math.sign(gapTo);
    const [x1, y1] = pt(P[main], P[side] + sgn * GAP);
    const [x2, y2] = pt(P[main], at + sgn * OVER);
    ext += `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
  }
  const lo = Math.min(A[main], B[main]);
  const hi = Math.max(A[main], B[main]);
  const span = hi - lo;
  const tw = textWidth(value);
  const arrowsIn = span >= ARROW * 2 + 3;
  const textIn = span >= tw + ARROW * 2 + 6;
  let lineD;
  let heads;
  let tm; // text position along the measured axis
  let anchor = "middle";
  if (arrowsIn) {
    const [x1, y1] = pt(lo, at);
    const [x2, y2] = pt(hi, at);
    lineD = `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
    heads = arrowHead(pt(lo, at), pt(-1, 0)) + arrowHead(pt(hi, at), pt(1, 0));
  } else {
    const [x1, y1] = pt(lo - ARROW - 7, at);
    const [x2, y2] = pt(hi + ARROW + 7, at);
    lineD = `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
    heads = arrowHead(pt(lo, at), pt(1, 0)) + arrowHead(pt(hi, at), pt(-1, 0));
  }
  if (textIn) tm = (lo + hi) / 2;
  else {
    tm = hi + ARROW + 10 + tw / 2;
    const [x2, y2] = pt(tm + tw / 2, at);
    lineD += `L${r2(x2)} ${r2(y2)}`;
  }
  // ISO: text sits just above a horizontal line and reads from the right on a vertical one.
  const [tx, ty] = pt(tm, at - 3);
  const textEl = h
    ? `<text class="t" x="${r2(tx)}" y="${r2(ty)}" text-anchor="${anchor}">${value}</text>`
    : `<text class="t" x="${r2(tx)}" y="${r2(ty)}" text-anchor="${anchor}" transform="rotate(-90 ${r2(tx)} ${r2(ty)})">${value}</text>`;
  return `<g data-role="dim"${id ? ` id="${id}"` : ""}${cls ? ` class="${cls}"` : ""}><path class="thin" d="${ext}${lineD}"/><path class="head" d="${heads}"/>${textEl}</g>`;
}

// A part balloon: a dot on the part, a thin leader, a circled item number.
function balloon(V, at, [bx, by], n, { target = "", r = 8.5 } = {}) {
  const [ax, ay] = V.p(at);
  const a = Math.atan2(ay - by, ax - bx);
  const ex = r2(bx + r * Math.cos(a));
  const ey = r2(by + r * Math.sin(a));
  return (
    `<g data-role="balloon" data-target="${target}" data-at="${ax} ${ay}">` +
    `<path class="thin" d="M${ex} ${ey}L${ax} ${ay}"/><circle class="dot" cx="${ax}" cy="${ay}" r="1.5"/>` +
    `<circle class="balloon" cx="${bx}" cy="${by}" r="${r}"/>` +
    `<text class="t" x="${bx}" y="${r2(by + 3.3)}" text-anchor="middle">${n}</text></g>`
  );
}

// A view title: SECTION A-A over its scale, centred under the view.
function viewLabel(x, y, title, sub = "") {
  return (
    `<g data-role="label"><text class="t t-lg" x="${x}" y="${y}" text-anchor="middle">${title}</text>` +
    (sub ? `<text class="t t-sm" x="${x}" y="${y + 12}" text-anchor="middle">${sub}</text>` : "") +
    `</g>`
  );
}

// The circle that marks a detail in its parent view, with its letter.
function detailMark(V, [cu, cv], r, letter, angle = 45) {
  const [x, y] = V.p([cu, cv]);
  const R = r * V.k;
  const a = (-angle * Math.PI) / 180;
  const lx = r2(x + (R + 9) * Math.cos(a));
  const ly = r2(y + (R + 9) * Math.sin(a) + 4);
  return `<g data-role="label"><circle class="thin mark" cx="${x}" cy="${y}" r="${r2(R)}"/><text class="t t-lg" x="${lx}" y="${ly}" text-anchor="middle">${letter}</text></g>`;
}

// A viewing-direction arrow (VIEW C): a thick-tipped arrow pointing at the surface, with its letter.
function viewArrow(V, at, [dx, dy], letter, len = 26) {
  const [x, y] = V.p(at);
  const n = Math.hypot(dx, dy) || 1;
  const ux = dx / n;
  const uy = dy / n;
  const sx = r2(x - ux * len);
  const sy = r2(y - uy * len);
  return (
    `<g data-role="label"><path class="vis" d="M${sx} ${sy}L${r2(x - ux * ARROW)} ${r2(y - uy * ARROW)}"/>` +
    `<path class="head" d="${arrowHead([x, y], [ux, uy])}"/>` +
    `<text class="t t-lg" x="${r2(sx - uy * 10)}" y="${r2(sy + ux * 10 + 4)}" text-anchor="middle">${letter}</text></g>`
  );
}

// A long-break line across a part (thin, with one zigzag), for parts that run out of the view.
function breakLine(V, a, b) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const mx = (ax + bx) / 2;
  const my = (ay + by) / 2;
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  const z = 3.5;
  const p = (t, s) => `${r2(mx + ux * t - uy * s)} ${r2(my + uy * t + ux * s)}`;
  return `<path class="thin" d="M${r2(ax - ux * 4)} ${r2(ay - uy * 4)}L${p(-z, 0)}L${p(-z / 2, z * 1.6)}L${p(z / 2, -z * 1.6)}L${p(z, 0)}L${r2(bx + ux * 4)} ${r2(by + uy * 4)}"/>`;
}

// ---------------------------------------------------------------- sheet furniture

// The drawing frame: trimmed edge, a thick border, zone references and centring marks.
function frame({ w = SHEET.w, h = SHEET.h, trim = 8, m = 24, cols = 8, rows = 6 } = {}) {
  let out = `<g data-role="frame"><rect class="thin" x="${trim}" y="${trim}" width="${w - trim * 2}" height="${h - trim * 2}"/>`;
  out += `<rect class="vis" x="${m}" y="${m}" width="${w - m * 2}" height="${h - m * 2}"/>`;
  const cw = (w - m * 2) / cols;
  const rh = (h - m * 2) / rows;
  let ticks = "";
  let labels = "";
  for (let i = 0; i <= cols; i++) {
    const x = r2(m + i * cw);
    if (i > 0 && i < cols) ticks += `M${x} ${trim}V${m}M${x} ${h - m}V${h - trim}`;
    if (i < cols) {
      const cx = r2(m + (i + 0.5) * cw);
      labels += `<text class="t t-sm" x="${cx}" y="${r2((trim + m) / 2 + 3)}" text-anchor="middle">${i + 1}</text>`;
      labels += `<text class="t t-sm" x="${cx}" y="${r2(h - (trim + m) / 2 + 3)}" text-anchor="middle">${i + 1}</text>`;
    }
  }
  for (let j = 0; j <= rows; j++) {
    const y = r2(m + j * rh);
    if (j > 0 && j < rows) ticks += `M${trim} ${y}H${m}M${w - m} ${y}H${w - trim}`;
    if (j < rows) {
      const cy = r2(m + (j + 0.5) * rh + 3);
      const letter = String.fromCharCode(65 + j);
      labels += `<text class="t t-sm" x="${r2((trim + m) / 2)}" y="${cy}" text-anchor="middle">${letter}</text>`;
      labels += `<text class="t t-sm" x="${r2(w - (trim + m) / 2)}" y="${cy}" text-anchor="middle">${letter}</text>`;
    }
  }
  const cm = `M${w / 2} ${trim}V${m + 10}M${w / 2} ${h - trim}V${h - m - 10}M${trim} ${h / 2}H${m + 10}M${w - trim} ${h / 2}H${w - m - 10}`;
  out += `<path class="thin" d="${ticks}"/><path class="vis" d="${cm}"/>${labels}</g>`;
  return out;
}

// A ruled table (parts list). cols: [{ w, align, title }]. rows: arrays of cell strings.
// Item numbers count up from the bottom, as a parts list sits on top of the title block.
function table(x, y, cols, rows, { rowH = 16, role = "bom", headH = 18 } = {}) {
  const w = cols.reduce((s, c) => s + c.w, 0);
  const h = headH + rows.length * rowH;
  let rules = "";
  let text = "";
  let cx = x;
  for (const [i, c] of cols.entries()) {
    if (i > 0) rules += `M${r2(cx)} ${y}V${y + h}`;
    const tx = c.align === "center" ? cx + c.w / 2 : c.align === "right" ? cx + c.w - 4 : cx + 4;
    const anchor = c.align === "center" ? "middle" : c.align === "right" ? "end" : "start";
    text += `<text class="t t-sm t-head" x="${r2(tx)}" y="${y + h - 5.5}" text-anchor="${anchor}">${c.title}</text>`;
    rows.forEach((row, j) => {
      text += `<text class="t t-sm" x="${r2(tx)}" y="${r2(y + (rows.length - 1 - j) * rowH + rowH - 4.8)}" text-anchor="${anchor}">${row[i]}</text>`;
    });
    cx += c.w;
  }
  for (let j = 1; j <= rows.length; j++) rules += `M${x} ${r2(y + j * rowH)}H${x + w}`;
  return `<g data-role="${role}"><rect class="paper" x="${x}" y="${y}" width="${w}" height="${h}"/><path class="thin" d="${rules}"/><rect class="vis" x="${x}" y="${y}" width="${w}" height="${h}"/>${text}</g>`;
}

// A title-block cell: a small caption over a value. size: "sm" | "md" | "lg".
function cell({ x, y, w, h, label, value = "", size = "md", id = "" }) {
  const cls = size === "lg" ? "t t-xl" : size === "sm" ? "t t-sm" : "t";
  const vy = size === "lg" ? y + h - 7 : y + h - 5;
  return (
    `<rect class="thin" x="${x}" y="${y}" width="${w}" height="${h}"/>` +
    `<text class="t t-cap" x="${x + 4}" y="${y + 9}">${label}</text>` +
    `<text class="${cls}" x="${x + 4}" y="${vy}"${id ? ` id="${id}"` : ""}>${value}</text>`
  );
}

function titleBlock(x, y, w, h, cells) {
  return `<g data-role="title"><rect class="paper" x="${x}" y="${y}" width="${w}" height="${h}"/>${cells.map((c) => cell({ ...c, x: x + c.x, y: y + c.y })).join("")}<rect class="vis" x="${x}" y="${y}" width="${w}" height="${h}"/></g>`;
}

// A notes block: a heading and numbered lines.
function notes(x, y, heading, items, lead = 13) {
  let out = `<g data-role="notes"><text class="t t-head" x="${x}" y="${y}">${heading}</text>`;
  items.forEach((s, i) => {
    out += `<text class="t t-sm" x="${x}" y="${r2(y + lead * (i + 1) + 2)}">${i + 1}. ${s}</text>`;
  });
  return out + `</g>`;
}

return { SHEET, PX_PER_MM, THICK, THIN, TEXT, ARROW, GAP, OVER, r2, fmt, view, scaleLabel, d, rect, arc, circle, rrect, move, flipU, flipV, inside, revolve, MATERIALS, ANGLES, hatchDefs, cut, section, body, line, lines, centerline, centerMark, springSection, textWidth, dim, balloon, viewLabel, detailMark, viewArrow, breakLine, frame, table, cell, titleBlock, notes };
})();

const L = (() => {
// Live runtime for a blueprint sheet: one time-based loop, an idle tour, input wake-ups,
// offscreen and hidden-tab pauses, reduced motion, and deterministic frames for checks.
//
// URL parameters (all optional):
//   ?t=6.5            render the tour at 6.5 s, deterministically, and stop (for screenshots)
//   ?theme=paper      blueprint | paper | white | dark
//   ?zoom=x,y,w,h     show only this sheet region, filling the window (for 4x close-ups)
//   ?mask=x,y,w,h     blank everything outside this box, so one view stands alone
//   ?check=1          run the layout self-check after the first frame (see selfcheck.mjs)

function params() {
  const q = new URLSearchParams(location.search);
  return {
    t: q.has("t") ? Number(q.get("t")) : null,
    theme: q.get("theme"),
    zoom: q.get("zoom"),
    mask: q.get("mask"),
    check: q.has("check"),
  };
}

const THEMES = ["blueprint", "paper", "white", "dark"];

function setupPage(svg) {
  const q = params();
  // the page's own default (writePage's `theme`), then a saved choice, then ?theme=, which wins but isn't saved
  const fallback = document.documentElement.dataset.theme || "blueprint";
  const pick = (name, save) => {
    if (!THEMES.includes(name)) return;
    document.documentElement.dataset.theme = name;
    for (const b of document.querySelectorAll("[data-theme-pick]")) b.setAttribute("aria-pressed", String(b.dataset.themePick === name));
    if (save) {
      try {
        localStorage.setItem("bp-theme", name);
      } catch {}
    }
  };
  let saved = null;
  try {
    saved = localStorage.getItem("bp-theme");
  } catch {}
  pick(q.theme ?? saved ?? fallback, false);
  for (const b of document.querySelectorAll("[data-theme-pick]")) b.addEventListener("click", () => pick(b.dataset.themePick, true));
  // ?mask=x,y,w,h paints the page colour over everything outside one box, so a view stands alone
  if (q.mask) {
    const [x, y, w, h] = q.mask.split(",").map(Number);
    if ([x, y, w, h].every(Number.isFinite)) {
      const m = document.createElementNS("http://www.w3.org/2000/svg", "path");
      m.setAttribute("d", `M-9999 -9999H9999V9999H-9999Z M${x} ${y}V${y + h}H${x + w}V${y}Z`);
      m.setAttribute("fill-rule", "evenodd");
      m.setAttribute("style", "fill:var(--bp-page);pointer-events:none");
      m.dataset.role = "mask";
      svg.appendChild(m);
    }
  }
  if (q.zoom) {
    const box = q.zoom.split(",").map(Number);
    if (box.length === 4 && box.every(Number.isFinite)) {
      svg.setAttribute("viewBox", box.join(" "));
      document.body.classList.add("bp-zoom");
    }
  }
  return q;
}

// Critically damped follow toward a target: calm, no overshoot, frame-rate independent.
function follow(at, want, rate, dt) {
  return want + (at - want) * Math.exp(-rate * dt);
}

const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, t)));

// run({ root, step, render, idleAfter })
//   step(dt, live) advances the model; live.touring says whether the idle tour drives it.
//   It returns true while something is still settling, so a reduced-motion page can sleep.
//   render(live) writes attributes; it never rebuilds static geometry.
function run({ root, step, render, idleAfter = 4, onFrozen }) {
  const q = params();
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const live = { clock: 0, slow: 1, lastInput: -Infinity, reduced, touring: !reduced, frozen: q.t != null };
  live.input = () => {
    live.lastInput = live.clock;
    live.touring = false;
    wake();
  };

  if (live.frozen) {
    const dt = 1 / 240;
    for (let t = 0; t < q.t; t += dt) {
      live.clock = t;
      live.touring = true;
      step(dt, live);
    }
    render(live);
    onFrozen?.(live);
    return live;
  }

  let raf = 0;
  let last = 0;
  let visible = true;
  function frame(now) {
    raf = 0;
    const real = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    live.clock += real;
    live.touring = !reduced && live.clock - live.lastInput > idleAfter;
    const busy = step(real * live.slow, live);
    render(live);
    if (visible && !document.hidden && (!reduced || busy)) raf = requestAnimationFrame(frame);
    else last = 0;
  }
  function wake() {
    if (!raf && visible && !document.hidden) raf = requestAnimationFrame(frame);
  }
  live.wake = wake;
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(([entry]) => {
      visible = entry.isIntersecting;
      if (visible) wake();
    }).observe(root);
  }
  document.addEventListener("visibilitychange", wake);
  render(live);
  wake();

// Vertical drag on an element, reported as a sheet-unit delta since the press.
function dragY(svg, el, { start, move, end }) {
  let id = null;
  let y0 = 0;
  const toSheet = (e) => {
    const m = svg.getScreenCTM();
    return m ? (e.clientY - m.f) / m.d : e.clientY;
  };

    id = e.pointerId;
    el.setPointerCapture(id);
    y0 = toSheet(e);
    start?.();
    e.preventDefault();
  });
  el.addEventListener("pointermove", (e) => {
    if (e.pointerId === id) move(toSheet(e) - y0);
  });
  const stop = (e) => {
    if (e.pointerId !== id) return;
    id = null;
    end?.();
  };

  el.addEventListener("pointercancel", stop);

// Announce a readout to screen readers at most every `every` seconds.

  let lastAt = -Infinity;
  let lastText = "";
  return (text, clock) => {
    if (text === lastText || clock - lastAt < every) return;

    lastText = text;

const C = (() => {
// Layout self-check, run in the page with ?check=1 (scripts/check.mjs drives it headlessly).
// It writes a JSON report into <pre id="bp-check"> and to the console. A clean sheet reports
// zero failures in every category.
//
//   text-overlap      two pieces of lettering touch
//   text-on-geometry  lettering sits on a part or on another annotation's lines
//   outside-frame     an annotation or a view crosses the drawing frame
//   balloon-target    a balloon's dot is not on the part it names
//   balloon-on-geom   a balloon circle sits on a part
//   hard-colour       a fill or stroke is a literal colour instead of a token
//   sideways-scroll   the page scrolls horizontally

const roleOf = (el) => el.closest("[data-role]")?.dataset.role ?? "";

// A clipped group's box is its clip region's box (getBoundingClientRect ignores clipping).
function clippedBox(el) {
  const ref = el.getAttribute("clip-path")?.match(/url\(#([^)]+)\)/)?.[1];
  const shape = ref && document.getElementById(ref)?.firstElementChild;
  if (!shape) return el.getBoundingClientRect();
  const b = shape.getBBox();
  const m = shape.ownerSVGElement.getScreenCTM();
  const x0 = m.a * b.x + m.e;
  const y0 = m.d * b.y + m.f;
  return { left: x0, top: y0, right: x0 + m.a * b.width, bottom: y0 + m.d * b.height };
}

function selfCheck(svg) {
  const fails = [];
  const fail = (kind, what) => fails.push({ kind, what });
  const label = (el) => {
    const g = el.closest("[data-role],[data-part],[data-geom]");
    const name = g?.id || g?.dataset.part || g?.dataset.target || g?.dataset.role || g?.dataset.geom || el.tagName;
    return `${name}: "${(el.textContent || "").trim().slice(0, 24)}"`;
  };
  const shown = (el) => {
    const b = el.getBoundingClientRect();
    if (b.width < 0.5 || b.height < 0.5) return false;
    const cs = getComputedStyle(el);
    return cs.visibility !== "hidden" && cs.display !== "none" && Number(cs.opacity) > 0.05;
  };
  const texts = [...svg.querySelectorAll("text")].filter(shown);
  const boxes = texts.map((t) => t.getBoundingClientRect());
  const grow = 0.4;
  const hit = (a, b) => a.left < b.right - grow && b.left < a.right - grow && a.top < b.bottom - grow && b.top < a.bottom - grow;

  for (let i = 0; i < texts.length; i++)
    for (let j = i + 1; j < texts.length; j++) if (hit(boxes[i], boxes[j])) fail("text-overlap", `${label(texts[i])} × ${label(texts[j])}`);

  const geomOf = (el) => el.closest("[data-geom]");
  for (const [i, t] of texts.entries()) {
    const role = roleOf(t);
    if (role === "engraved" || role === "frame") continue;
    const own = t.closest("[data-role]");
    const b = boxes[i];
    const seen = new Set();
    for (let ix = 0; ix < 4; ix++)
      for (let iy = 0; iy < 2; iy++) {
        const x = b.left + b.width * (0.15 + ix * 0.233);
        const y = b.top + b.height * (0.3 + iy * 0.4);
        for (const el of document.elementsFromPoint(x, y)) {
          if (el === t || el.tagName === "text" || el.tagName === "svg" || el.closest("defs")) continue;
          if (el.classList.contains("tint") || el.classList.contains("hit") || el.closest('[data-role="phantom"]')) continue;
          if (own && own.contains(el)) continue;
          const g = geomOf(el);
          const other = el.closest("[data-role]");
          const bad = (g && !g.contains(t)) || (other && other !== own && other.dataset.role !== "frame" && other.dataset.role !== "chart-bg");
          if (bad && !el.classList.contains("sheet-bg") && !el.classList.contains("grid")) {
            const key = el.closest("[data-part],[data-role],[data-geom]");
            if (!seen.has(key)) {
              seen.add(key);
              fail("text-on-geometry", `${label(t)} on ${key?.dataset.part || key?.id || key?.dataset.role || key?.dataset.geom || el.tagName}`);
            }
          }
        }
      }
  }

  const frameRect = svg.querySelector('[data-role="frame"] rect.vis')?.getBoundingClientRect();
  if (frameRect) {
    for (const el of svg.querySelectorAll("[data-role]:not([data-role=frame]), [data-geom]")) {
      if (el.parentElement?.closest("[data-role]:not([data-role=frame]), [data-geom]")) continue;
      if (!shown(el)) continue;
      const b = clippedBox(el);
      const tol = 0.5;
      if (b.left < frameRect.left - tol || b.right > frameRect.right + tol || b.top < frameRect.top - tol || b.bottom > frameRect.bottom + tol)
        fail("outside-frame", el.id || el.dataset.geom || el.dataset.role);
    }
  }

  for (const g of svg.querySelectorAll('[data-role="balloon"]')) {
    if (!shown(g)) continue;
    const dot = g.querySelector("circle.dot").getBoundingClientRect();
    const x = dot.left + dot.width / 2;
    const y = dot.top + dot.height / 2;
    const target = g.dataset.target;
    const under = document.elementsFromPoint(x, y).some((el) => el.closest(`[data-part="${target}"]`));
    if (!under) fail("balloon-target", `balloon ${g.textContent.trim()} → ${target}`);
    const c = g.querySelector("circle.balloon").getBoundingClientRect();
    const pts = [
      [c.left + c.width * 0.5, c.top + c.height * 0.5],
      [c.left + c.width * 0.2, c.top + c.height * 0.5],
      [c.left + c.width * 0.8, c.top + c.height * 0.5],
      [c.left + c.width * 0.5, c.top + c.height * 0.2],
      [c.left + c.width * 0.5, c.top + c.height * 0.8],
    ];
    if (pts.some(([px, py]) => document.elementsFromPoint(px, py).some((el) => geomOf(el) && !el.classList.contains("tint") && !el.closest('[data-role="phantom"]'))))
      fail("balloon-on-geom", `balloon ${g.textContent.trim()}`);
  }

  for (const el of svg.querySelectorAll("[fill],[stroke]")) {
    if (el.closest("defs") && el.tagName !== "path" && el.tagName !== "circle") continue;
    for (const a of ["fill", "stroke"]) {
      const v = el.getAttribute(a);
      if (v && v !== "none" && !v.startsWith("url(") && v !== "currentColor") fail("hard-colour", `${el.tagName} ${a}=${v}`);
    }
  }

  if (document.documentElement.scrollWidth > window.innerWidth + 1) fail("sideways-scroll", `${document.documentElement.scrollWidth} > ${window.innerWidth}`);

  const kinds = ["text-overlap", "text-on-geometry", "outside-frame", "balloon-target", "balloon-on-geom", "hard-colour", "sideways-scroll"];
  const counts = Object.fromEntries(kinds.map((k) => [k, fails.filter((f) => f.kind === k).length]));
  const report = { ok: fails.length === 0, counts, fails, texts: texts.length, parts: svg.querySelectorAll("[data-part]").length };
  let pre = document.getElementById("bp-check");
  if (!pre) {
    pre = document.createElement("pre");
    pre.id = "bp-check";
    pre.hidden = true;
    document.body.append(pre);
  }
  pre.textContent = JSON.stringify(report);
  console.log("bp-check", JSON.stringify(report.counts));
  return report;
}

return { selfCheck };
})();

const M = (() => {
// Truth first: a 2/2-way normally closed pilot-operated (servo-assisted) solenoid valve, G1/2.
// Pure, no imports, no DOM. The geometry, the dimensions, the readout and both diagrams read this.
//
// Three coupled models, stepped together:
//  1. Coil.      d(lambda)/dt = V - R*i. The flux linkage lambda = N*phi; the current needed for a
//                flux phi is N*i = phi*(R0 + Rgap(g)) + l_fe*H(B), so the inductance falls as the
//                air gap g opens. When the plunger moves, the back-EMF dips the current.
//  2. Plunger.   m*a = F_mag - F_spring - (pC - p2)*A_pilot - c*v. F_mag = phi^2 / (2*mu0*A).
//  3. Diaphragm. Water is stiff, so the diaphragm moves only as fast as water leaves the chamber
//                above it: A_d * dz/dt = Q_pilot - Q_bleed. While it moves, the chamber pressure pC
//                is whatever balances the forces on it. The pilot (Ø1.6) drains the chamber faster
//                than the bleed (Ø0.8) refills it, so it lifts; it rises until it nearly shuts the
//                pilot against the plunger, which is why it follows the plunger (servo).
// Pressures are gauge (above atmosphere) in Pa inside; the sheet shows bar.

const MU0 = 4e-7 * Math.PI;
const RHO = 998; // water, kg/m³
const G = 9.81;

// ---------------------------------------------------------------- geometry (mm)
const PORT_V = 14; // port axis height above the body's underside
const SEAT_TOP = 34; // the main seat's lip
const SEAT_R = 6.5; // main orifice Ø13 (DN13)
const SEAT_OR = 8.5; // seat lip outside
const SEAT_EFF = 7.0; // effective sealing radius on the lip
const DIA_EFF = 13.25; // diaphragm effective radius (free span 2.5 to 15, convolution 12 to 15)
const WEB = 1.5; // diaphragm thickness
const PILOT_D = 1.6; // pilot orifice in the sleeve
const PILOT_SEAL_R = 1.15; // mean radius of the pilot lip the seal lands on
const BLEED_D = 0.8; // bleed orifice through the diaphragm
const BLEED_U = 10.5; // bleed hole radius on the diaphragm
const PLUNGER_R = 5.6; // Ø11.2
const TUBE_RI = 6.0; // armature tube Ø13×0.5
const TUBE_RO = 6.5;
const POLE_FACE = 83; // the pole piece's face, the top of the air gap
const STROKE = 3.2; // plunger stroke, mm (gap closed, plunger on the pole)
const G_RES = 0.1; // residual magnetic gap when pulled in (Cr plating), mm
const SEAL_LOW = 37.6; // pilot-seal face when shut, closed valve
const PLUNGER_TOP = POLE_FACE - STROKE; // plunger top when shut

// ---------------------------------------------------------------- coil
const V_SUPPLY = 24; // V DC
const TURNS = 2700;
const WIRE_D = 0.28; // mm, Cu grade 2 enamel
const WIND_RI = 7.6;
const WIND_RO = 16;
const WIND = { ri: WIND_RI, ro: WIND_RO, v0: 57, v1: 93 };
const MLT = Math.PI * (WIND_RI + WIND_RO); // mean length of turn, mm
const R_COIL = (1.72e-8 * TURNS * MLT * 1e-3) / ((Math.PI / 4) * (WIRE_D * 1e-3) ** 2); // Ω at 20 °C
const I_RATED = V_SUPPLY / R_COIL;
const POWER = V_SUPPLY * I_RATED;
const A_POLE = Math.PI * (PLUNGER_R * 1e-3) ** 2; // m²
// Fixed reluctance: the flux crosses the tube wall and the clearance radially at the 3 mm yoke plate.
const RADIAL = (TUBE_RO - PLUNGER_R) * 1e-3;
const R_FIXED = RADIAL / (MU0 * 2 * Math.PI * ((TUBE_RO + PLUNGER_R) / 2) * 1e-3 * 3e-3);
const L_FE = 0.12; // iron path, m
const B_SAT = 1.55; // T, 1.4105 ferritic stainless
const H0 = B_SAT / (MU0 * 1800); // H(B) = H0*atanh(B/Bsat): μr ≈ 1800 at low B, saturating at Bsat
const V_DIODE = 0.8; // freewheel diode in the plug
const gapOf = (x) => STROKE - x + G_RES; // magnetic gap, mm, for plunger lift x mm
const rGap = (gmm) => (gmm * 1e-3) / (MU0 * A_POLE);
const ironH = (B) => H0 * Math.atanh(Math.min(0.9995, Math.abs(B) / B_SAT)) * Math.sign(B);
const currentOf = (lambda, gmm) => {
  const phi = lambda / TURNS;
  return (phi * (R_FIXED + rGap(gmm)) + L_FE * ironH(phi / A_POLE)) / TURNS;
};
const forceOfPhi = (phi) => (phi * phi) / (2 * MU0 * A_POLE); // N
// Steady flux for a current at a gap: solve N*i = phi*R + l*H(phi/A) by bisection.
function fluxAt(i, gmm) {
  let lo = 0;
  let hi = B_SAT * A_POLE * 0.9995;
  for (let k = 0; k < 60; k++) {
    const mid = (lo + hi) / 2;
    if (currentOf(mid * TURNS, gmm) < i) lo = mid;
    else hi = mid;
  }
  return (lo + hi) / 2;
}
const pullAt = (i, gmm) => forceOfPhi(fluxAt(i, gmm)); // magnet pull, N
const inductance = (gmm) => (TURNS * TURNS) / (R_FIXED + rGap(gmm)); // small-signal, H
const TAU_OPEN = inductance(gapOf(0)) / R_COIL;
const TAU_SHUT = inductance(gapOf(STROKE)) / R_COIL;

// ---------------------------------------------------------------- plunger and its spring
const PLUNGER_MASS = 0.021; // kg (Ø11.2 × 42, 1.4105, with the spring bore)
const SPRING_D = 3.5; // mean coil diameter, mm
const SPRING_WIRE = 0.4;
const SPRING_TURNS = 8;
const SPRING_RATE = (70000 * SPRING_WIRE ** 4) / (8 * SPRING_D ** 3 * SPRING_TURNS); // N/mm (G = 70 GPa)
const SPRING_SHUT = 14.4; // installed length with the valve shut, mm
const SPRING_PRELOAD = 2.5; // N
const springForce = (x) => SPRING_PRELOAD + SPRING_RATE * x;
const DAMP = 1.2; // N·s/m, water in the armature tube
const A_PILOT = Math.PI * (PILOT_SEAL_R * 1e-3) ** 2;
const pilotLoad = (dpPa) => Math.max(0, dpPa) * A_PILOT; // N holding the seal on the lip

// ---------------------------------------------------------------- water
const CD = 0.62;
const A_D = Math.PI * (DIA_EFF * 1e-3) ** 2;
const A_S = Math.PI * (SEAT_EFF * 1e-3) ** 2;
const A_PORT = Math.PI * (SEAT_R * 1e-3) ** 2;
const A_PILOT_HOLE = (Math.PI / 4) * (PILOT_D * 1e-3) ** 2;
const A_BLEED = (Math.PI / 4) * (BLEED_D * 1e-3) ** 2;
const CDA_DOWN = 25e-6; // what the valve feeds: 12 m of 22×1 copper and an open tap, as one orifice, m²
const PIPE_L = 12; // m, the supply line that would hammer
const PIPE_ID = 20; // mm
const WAVE = 1250; // m/s, pressure wave speed in water-filled copper
const P_SUPPLY = 3e5; // Pa gauge, mains
const bar = (pa) => pa / 1e5;

const orifice = (cda, dp) => cda * Math.sign(dp) * Math.sqrt((2 * Math.abs(dp)) / RHO);
const valveArea = (z) => CD * Math.min(Math.PI * 2 * SEAT_R * 1e-3 * Math.max(0, z) * 1e-3, A_PORT);
const pilotArea = (gap) => CD * Math.min(Math.PI * PILOT_D * 1e-3 * Math.max(0, gap) * 1e-3, A_PILOT_HOLE);
const bleedArea = CD * A_BLEED;

// Main flow through the seat and on through the downstream line; p2 is the outlet pressure.
function mainFlow(z, p1) {
  const av = valveArea(z);
  if (av <= 0) return { q: 0, p2: 0 };
  const q = Math.sqrt(((2 * p1) / RHO) / (1 / av ** 2 + 1 / CDA_DOWN ** 2));
  return { q, p2: (RHO / 2) * (q / CDA_DOWN) ** 2 };
}
const lpm = (q) => q * 60000;
const Q_FULL = mainFlow(STROKE, P_SUPPLY).q;
const V_PIPE = Q_FULL / (Math.PI * (PIPE_ID * 1e-3 / 2) ** 2);
const JOUKOWSKY = RHO * WAVE * V_PIPE; // Pa, for an instant shut-off
// Michaud: a valve that closes in Tc > 2L/a lets the wave come back and cancel; the surge falls as 2·L·v/Tc.
const surge = (tc) => (tc <= (2 * PIPE_L) / WAVE ? JOUKOWSKY : (2 * RHO * PIPE_L * V_PIPE) / tc);

// ---------------------------------------------------------------- state and step
function valve(p1 = P_SUPPLY) {
  return { t: 0, on: false, lam: 0, i: 0, x: 0, v: 0, z: 0, pc: p1, p1, p2: 0, q: 0, f: 0, seated: true, pilot: 0, onAt: -1, offAt: -1, shutAt: -1, tc: 0 };
}

function setCoil(s, on) {
  if (on === s.on) return;
  s.on = on;
  if (on) s.onAt = s.t;
  else {
    s.offAt = s.t;
    s.shutAt = -1;
  }
}

// Advance h seconds (keep h ≤ 1e-4 s).
function step(s, h) {
  const g = gapOf(s.x);
  // coil
  s.i = currentOf(s.lam, g);
  let dl = (s.on ? V_SUPPLY : 0) - R_COIL * s.i;
  if (!s.on && s.i > 0) dl -= V_DIODE; // freewheeling through the plug's diode
  s.lam = Math.max(0, s.lam + dl * h);
  s.i = currentOf(s.lam, g);
  s.f = forceOfPhi(s.lam / TURNS);

  // water: main flow and outlet pressure follow the diaphragm
  const { q, p2 } = mainFlow(s.z, s.p1);
  s.q = q;
  s.p2 = p2;
  const gap = s.x - s.z; // pilot opening, mm
  s.pilot = gap;
  const ap = pilotArea(gap);
  const dpPilot = s.pc - p2;
  // pressure on the seal falls off as the pilot opens past a quarter of its diameter
  const fPress = gap < 0.02 ? pilotLoad(dpPilot) : pilotLoad(dpPilot) * Math.max(0, 1 - gap / (PILOT_D / 4));

  // plunger
  const fNet = s.f - springForce(s.x) - PLUNGER_MASS * G - fPress;
  const resting = s.x <= s.z + 1e-6;
  let load = 0; // what the plunger presses down on the diaphragm with, N
  if (resting && fNet <= 0) {
    load = -fNet;
    s.v = 0;
  } else {
    s.v += ((fNet - DAMP * s.v) / PLUNGER_MASS) * h;
    s.x += s.v * 1000 * h;
    if (s.x >= STROKE) {
      s.x = STROKE;
      s.v = Math.min(0, s.v);
    }
  }

  // diaphragm: force balance gives the chamber pressure while it moves
  const pEq = (s.p1 * (A_D - A_S) + p2 * A_S - load) / A_D;
  const pss = (s.p1 * bleedArea ** 2 + p2 * ap ** 2) / (bleedArea ** 2 + ap ** 2);
  const net = (pc) => orifice(ap, pc - p2) - orifice(bleedArea, s.p1 - pc); // m³/s out of the chamber
  if (s.z <= 0 && pss >= pEq) {
    s.seated = true;
    s.pc += (pss - s.pc) * Math.min(1, 300 * h); // the chamber's own compliance (rubber, trapped air)
  } else {
    s.seated = false;
    s.pc = pEq;
    s.z += (net(pEq) / A_D) * 1000 * h;
    if (s.z <= 0) {
      s.z = 0;
      s.seated = true;
    }
  }
  if (s.z > s.x) s.z = s.x; // it cannot pass the plunger: the pilot shuts
  if (s.x < s.z) {
    s.x = s.z;
    s.v = Math.max(0, s.v);
  }
  if (resting && fNet <= 0) s.x = s.z; // riding down on the diaphragm
  if (!s.on && s.offAt >= 0 && s.shutAt < 0 && s.z <= 0) {
    s.shutAt = s.t;
    s.tc = s.t - s.offAt;
  }
  s.t += h;
  return s;
}

function advance(s, dt) {
  const n = Math.max(1, Math.ceil(dt / 5e-5));
  for (let k = 0; k < n; k++) step(s, dt / n);
  return s;
}

// The tour's switching programme, in model seconds.
const TOUR = { on: 0.06, off: 0.5, end: 1.4 };

// A whole programme, sampled, for the notes (closing time, surge) and to size the chart.
function simulate(p1 = P_SUPPLY, dt = 1e-3) {
  const s = valve(p1);
  const out = [];
  for (let t = 0; t < TOUR.end; t += dt) {
    setCoil(s, t >= TOUR.on && t < TOUR.off);
    advance(s, dt);
    out.push({ t: s.t, i: s.i, x: s.x, z: s.z, q: s.q, pc: s.pc, p2: s.p2, f: s.f });
  }

}

// Maximum operating pressure differential: the magnet at full gap must beat spring, weight and the pilot.
const MOPD = (pullAt(I_RATED, gapOf(0)) - springForce(0) - PLUNGER_MASS * G) / A_PILOT;
// Flow factor of the open valve: Kv = Q[m³/h] / sqrt(Δp[bar]).
const KV = (() => {
  const { q, p2 } = mainFlow(STROKE, P_SUPPLY);
  return (q * 3600) / Math.sqrt(bar(P_SUPPLY - p2));
})();

return { MU0, RHO, G, PORT_V, SEAT_TOP, SEAT_R, SEAT_OR, SEAT_EFF, DIA_EFF, WEB, PILOT_D, PILOT_SEAL_R, BLEED_D, BLEED_U, PLUNGER_R, TUBE_RI, TUBE_RO, POLE_FACE, STROKE, G_RES, SEAL_LOW, PLUNGER_TOP, V_SUPPLY, TURNS, WIRE_D, WIND, R_COIL, I_RATED, POWER, V_DIODE, gapOf, currentOf, forceOfPhi, fluxAt, pullAt, inductance, TAU_OPEN, TAU_SHUT, PLUNGER_MASS, SPRING_TURNS, SPRING_RATE, SPRING_SHUT, SPRING_PRELOAD, springForce, pilotLoad, CDA_DOWN, PIPE_L, PIPE_ID, WAVE, P_SUPPLY, bar, valveArea, mainFlow, lpm, Q_FULL, V_PIPE, JOUKOWSKY, surge, valve, setCoil, step, advance, TOUR, simulate, MOPD, KV };
})();

const P = (() => {
// The solenoid valve's parts, in world mm (u right, v up; the valve's axis at u = 0, the body's
// underside at v = 0). Each function draws one part into a view, so the main section and Detail P
// draw the same geometry at their own scale. Parts that move are drawn at rest (valve shut) and
// moved with a transform: the plunger and its seal by x, the pilot sleeve, washer and bleed bush by z.
// The diaphragm and the spring change shape, so they are drawn for a given lift.



const part = (id, inner, extra = "") => `<g data-part="${id}"${extra}>${inner}</g>`;

const PV = M.PORT_V;
const RT = 9.32; // G1/2 minor radius (thread crests in the bore)
const RM = 10.48; // G1/2 major radius (thread roots, thin)
const ST = M.SEAT_TOP;

// ---------------------------------------------------------------- 1 body, cut through both ports
function body(V) {
  const topLeft = [
    [-36, PV + 10.8], [-34.52, PV + RT], [-23, PV + RT], [-23, 21], [-15, 21], [-15, 34], [-17.5, 34], [-17.5, 36],
    [-24.5, 36], [-25, 35.5], [-25, 28], [-35.5, 28], [-36, 27.5],
  ];
  const bottom = [
    [-36, PV - 10.8], [-34.52, PV - RT], [-23, PV - RT], [-23, 7], [-8.5, 7], [-8.5, ST - 0.5], [-8, ST], [-6.5, ST], [-6.5, 7],
    [23, 7], [23, PV - RT], [34.52, PV - RT], [36, PV - 10.8], [36, 0.5], [35.5, 0], [-35.5, 0], [-36, 0.5],
  ];
  const right = [
    [6.5, 21], [23, 21], [23, PV + RT], [34.52, PV + RT], [36, PV + 10.8], [36, 27.5], [35.5, 28], [25, 28], [25, 35.5],
    [24.5, 36], [17.5, 36], [17.5, 34], [15, 34], [15, 24], [8.5, 24], [8.5, ST - 0.5], [8, ST], [6.5, ST],
  ];
  const roots = [-1, 1].flatMap((side) => [
    [[side * 34.9, PV + RM], [side * 23, PV + RM]],
    [[side * 34.9, PV - RM], [side * 23, PV - RM]],
  ]);
  return part(
    1,
    [topLeft, bottom, right].map((p) => K.cut(V, p, { mat: "brass", angle: 45 })).join("") +
      K.lines(V, roots, "thin") +
      // the 118° drill point at the bottom of the seat bore, seen through the cut
      K.line(V, [[-6.5, 7], [0, 5.05], [6.5, 7]], "thin")
  );
}

// ---------------------------------------------------------------- 2 diaphragm, for lift z
const CONV = { r0: 12, r1: 15, sag: 1.4 };
const midAt = (t, z) => (ST + M.WEB / 2 + z) * (1 - t) + 35.0 * t - CONV.sag * Math.sin(Math.PI * t);
function convolution(z, side) {
  const pts = [];
  for (let i = 0; i <= 12; i++) {
    const t = i / 12;
    pts.push([CONV.r0 + (CONV.r1 - CONV.r0) * t, midAt(t, z) + (side * M.WEB) / 2]);
  }
  return pts;
}
const bead = [[15, 34], [17.1, 34], [17.5, 34.4], [17.5, 35.6], [17.1, 36], [15, 36]];
// The half-profile from r0 outwards: underside out to the bead, round the bead, top side back.
function diaphragmLoop(z, r0) {
  return [
    [r0, ST + z],
    [CONV.r0, ST + z],
    ...convolution(z, -1).slice(1),
    ...bead,
    ...convolution(z, 1).reverse().slice(0, -1),
    [CONV.r0, ST + M.WEB + z],
    [r0, ST + M.WEB + z],
  ];
}
const BLEED_HOLE = 0.9; // the bush's outside radius
const underside = (z) => [[2.5, ST + z], [CONV.r0, ST + z], ...convolution(z, -1).slice(1)];
function diaphragm(V, z) {
  const full = diaphragmLoop(z, 2.5);
  const left = full.map(([r, v]) => [-r, v]);
  const web = [[2.5, ST + z], [M.BLEED_U - BLEED_HOLE, ST + z], [M.BLEED_U - BLEED_HOLE, ST + M.WEB + z], [2.5, ST + M.WEB + z]];
  const outer = diaphragmLoop(z, M.BLEED_U + BLEED_HOLE);
  return part(2, [left, web, outer].map((p) => K.cut(V, p, { mat: "rubber" })).join(""));
}

// ---------------------------------------------------------------- 3 pilot sleeve, 4 washer, 5 bleed bush (drawn shut, moved by z)
const sleeveLoop = [
  [M.PILOT_D / 2, 32.2], [3.0, 32.2], [3.2, 32.4], [3.2, 33], [2.5, 33], [2.5, 35.5], [4.3, 35.5], [4.5, 35.7], [4.5, 37],
  [1.5, 37], [1.5, 37.4], [1.3, M.SEAL_LOW], [M.PILOT_D / 2, M.SEAL_LOW],
];
function sleeve(V) {
  return part(3, K.section(V, K.revolve(sleeveLoop), { mat: "brass", angle: 135 }));
}
function washer(V) {
  const rev = K.revolve([[2.5, 33], [6.0, 33], [6.0, 34], [2.5, 34]]);
  return part(4, K.section(V, { ...rev, edges: [] }, { mat: "brass", angle: 30 }));
}
function bleedBush(V) {
  const loop = [[0.4, 33.7], [1.3, 33.7], [1.3, 34], [0.9, 34], [0.9, 35.5], [1.3, 35.5], [1.3, 35.8], [0.4, 35.8]];
  return part(5, K.section(V, { ...K.revolve(loop, { at: M.BLEED_U }), edges: [] }, { mat: "solid" }));
}

// ---------------------------------------------------------------- 6 cover, 8 O-ring, 9 tube base, 10 armature tube
function cover(V) {
  const right = [
    [6.0, 39.5], [15, 39.5], [15, 36], [24.5, 36], [25, 36.5], [25, 47.5], [24.5, 48], [11.2, 48], [11.2, 46.2], [9, 46.2], [9, 42], [6.0, 42],
  ];
  return part(6, K.cut(V, right, { mat: "brass", angle: 135 }) + K.cut(V, K.flipU(right), { mat: "brass", angle: 135 }));
}

function oring(V) {
  const s = K.rrect(9.15, 46.3, 11.05, 47.95, 0.8);
  return part(8, K.cut(V, s, { mat: "rubber" }) + K.cut(V, K.flipU(s), { mat: "rubber" }));
}

function tubeBase(V) {
  const rev = K.revolve([[6.0, 42], [8.5, 42], [9, 42.5], [9, 48], [11, 48], [11, 50.6], [10.6, 51], [6.5, 51], [6.5, 49], [6.0, 49]]);
  const roots = [[[-8.45, 42.6], [-8.45, 46]], [[8.45, 42.6], [8.45, 46]]];
  return part(9, K.section(V, { ...rev, edges: [] }, { mat: "brass", angle: 30 }) + K.lines(V, roots, "thin"));
}

function tube(V) {
  return part(10, K.section(V, { ...K.revolve([[M.TUBE_RI, 49], [M.TUBE_RO, 49], [M.TUBE_RO, 94], [M.TUBE_RI, 94]]), edges: [] }, { mat: "solid" }));
}

// ---------------------------------------------------------------- 11 pole piece with its M6 stud (not cut: a solid pin)
function pole(V) {
  const f = M.POLE_FACE;
  const outline = [
    [-5.6, f], [5.6, f], [6, f + 0.4], [6, 94], [6.5, 94], [6.5, 96], [3, 96], [3, 105.5], [2.5, 106],
    [-2.5, 106], [-3, 105.5], [-3, 96], [-6.5, 96], [-6.5, 94], [-6, 94], [-6, f + 0.4],
  ];
  return part(11, K.body(V, outline) + K.lines(V, [[[-2.46, 96.6], [-2.46, 105.6]], [[2.46, 96.6], [2.46, 105.6]]], "thin"));
}

// ---------------------------------------------------------------- 12 plunger, 13 pilot seal (drawn shut, moved by x)
const PT = M.PLUNGER_TOP;
const POCKET = PT - 11.2; // bottom of the spring bore
function plunger(V) {
  const loop = [
    [0, 39.6], [2.0, 39.6], [2.0, 37.8], [2.8, 37.8], [2.8, 41], [M.PLUNGER_R, 43.5], [M.PLUNGER_R, PT - 0.5], [M.PLUNGER_R - 0.5, PT],
    [2.0, PT], [2.0, POCKET], [0, POCKET - 1.2],
  ];
  const rev = K.revolve(loop);
  const mouth = [[[-2.0, PT], [2.0, PT]], [[-2.0, POCKET], [2.0, POCKET]]];
  return part(12, K.section(V, { ...rev, edges: [] }, { mat: "iron", angle: 45 }) + K.lines(V, mouth, "thin"));
}
function seal(V) {
  return part(13, K.cut(V, K.rect(-2.0, M.SEAL_LOW, 2.0, 39.6), { mat: "rubber" }));
}

// ---------------------------------------------------------------- 14 plunger spring, for plunger lift x
function spring(V, x) {
  return part(14, K.springSection(V, { from: POCKET + x, to: M.POLE_FACE, radius: 1.75, wire: 0.4, turns: M.SPRING_TURNS, axis: "v", at: 0 }));
}

// ---------------------------------------------------------------- the coil: 15 bobbin, 16 winding, 17 frame, 18 yoke plate, 19 housing
function housing(V) {
  const right = [[6.6, 51], [20.5, 51], [21, 51.5], [21, 97.5], [20.5, 98], [3.2, 98], [3.2, 96], [6.6, 96]];
  return part(19, K.cut(V, right, { mat: "plastic", angle: 45 }) + K.cut(V, K.flipU(right), { mat: "plastic", angle: 45 }));
}
function frame(V) {
  const right = [[6.6, 94], [17, 94], [17, 53], [19, 53], [19, 96], [6.6, 96]];
  return part(17, K.cut(V, right, { mat: "steel", angle: 135 }) + K.cut(V, K.flipU(right), { mat: "steel", angle: 135 }));
}
function yoke(V) {
  const right = K.rect(6.6, 53, 17, 56);
  return part(18, K.cut(V, right, { mat: "steel", angle: 30 }) + K.cut(V, K.flipU(right), { mat: "steel", angle: 30 }));
}
function bobbin(V) {
  const right = [[6.6, 56], [16.4, 56], [16.4, 57], [7.6, 57], [7.6, 93], [16.4, 93], [16.4, 94], [6.6, 94]];
  return part(15, K.cut(V, right, { mat: "plastic", angle: 60 }) + K.cut(V, K.flipU(right), { mat: "plastic", angle: 60 }));
}
function winding(V) {
  const w = M.WIND;
  const right = K.rect(w.ri, w.v0, w.ro, w.v1);
  return part(16, K.cut(V, right, { mat: "bronze", angle: 135 }) + K.cut(V, K.flipU(right), { mat: "bronze", angle: 135 }));
}

// ---------------------------------------------------------------- 20 washer, 21 nut (bolt joint: not cut)
function coilWasher(V) {
  return part(20, K.body(V, K.rect(3.2, 98, 6, 99.6)) + K.body(V, K.rect(-6, 98, -3.2, 99.6)));
}
function nut(V) {
  const h0 = 99.6;
  const outline = [[-5, h0], [5, h0], [5, h0 + 4.6], [4.4, h0 + 5.2], [-4.4, h0 + 5.2], [-5, h0 + 4.6]];
  return part(21, K.body(V, outline) + K.lines(V, [[[-2.6, h0 + 0.3], [-2.6, h0 + 4.9]], [[2.6, h0 + 0.3], [2.6, h0 + 4.9]]]));
}

// ---------------------------------------------------------------- water (the accent)
// Above the diaphragm: the control chamber, the cover bore and the armature tube, at pC.
const chamberWater = [K.rect(-15, 33, 15, 39.5), K.rect(-6, 39.5, 6, 49), K.rect(-6, 49, 6, M.POLE_FACE)];
// Inlet side: port, passage, the annulus round the seat, and the curtain over the seat lip.
function inletWater(z) {
  const under = underside(z).filter(([r]) => r >= 6.5);
  const curtain = [[6.5, ST], [8.5, ST], [8.5, 33], [15, 33], ...under.slice().reverse(), [6.5, ST + z]];
  return [
    K.rect(-36, PV - RT, -23, PV + RT),
    K.rect(-23.01, 7, -8.5, 21),
    K.rect(-15, 20.99, -8.5, 34),
    K.rect(8.5, 24, 15, 34),
    curtain,
    K.flipU(curtain),
  ];
}
// Outlet side: the seat bore, the outlet passage and port, and the pilot bore.
function outletWater(z) {
  return [
    K.rect(-6.5, 7, 6.5, ST + z),
    K.rect(6.49, 7, 23, 21),
    K.rect(22.99, PV - RT, 36, PV + RT),
    K.rect(-M.PILOT_D / 2, 32, M.PILOT_D / 2, M.SEAL_LOW + z),
  ];
}
const waterPath = (V, shapes) => shapes.map((s) => K.d(V, s)).join("");

// ---------------------------------------------------------------- the open position, in phantom (Detail P)
function phantomOpen(V, z, x) {
  const sl = K.revolve(sleeveLoop).cuts.map((c) => K.line(V, K.move(c, 0, z), "phan", true)).join("");
  const web = K.line(V, K.rect(-12, ST + z, 12, ST + M.WEB + z), "phan", true);
  const nose = [[-2.0, M.SEAL_LOW + x], [2.0, M.SEAL_LOW + x], [2.0, 37.8 + x], [2.8, 37.8 + x], [2.8, 41 + x], [M.PLUNGER_R, 43.5 + x], [M.PLUNGER_R, 46 + x]];
  const noseL = nose.map(([u, v]) => [-u, v]).reverse();
  return web + sl + K.line(V, [...noseL.slice(0, -1), ...nose.slice(1)], "phan");
}

// ---------------------------------------------------------------- VIEW C, from above
function plan(V) {
  const hexEdges = [-1, 1].flatMap((s) => [[[s * 36, 8.08], [s * 25, 8.08]], [[s * 36, -8.08], [s * 25, -8.08]]]);
  const bosses = [-1, 1].map((s) => K.body(V, s < 0 ? K.rect(-36, -16.17, -25, 16.17) : K.rect(25, -16.17, 36, 16.17))).join("");
  const screwAt = [[-19, -19], [19, -19], [19, 19], [-19, 19]];
  const hex = (cu, cv, r, a0 = 0) => Array.from({ length: 6 }, (_, i) => {
    const a = ((a0 + 60 * i) * Math.PI) / 180;
    return [cu + r * Math.cos(a), cv + r * Math.sin(a)];
  });
  const screws = screwAt.map(([u, w]) => K.body(V, K.circle(u, w, 4.25, 40)) + K.line(V, hex(u, w, 2.31), "vis", true)).join("");
  return (
    part(1, bosses + K.lines(V, hexEdges, "vis")) +
    part(6, K.body(V, K.rrect(-25, -25, 25, 25, 1.5))) +
    part(7, screws) +
    part(19, K.body(V, K.rrect(-21, -17, 21, 17, 2))) +
    part(20, K.body(V, K.circle(0, 0, 6, 48))) +
    part(21, K.body(V, hex(0, 0, 5.77, 30)) + K.line(V, K.circle(0, 0, 4.7, 40), "thin", true)) +
    part(11, K.body(V, K.circle(0, 0, 3, 32)) + K.line(V, K.circle(0, 0, 2.5, 28), "thin", true))
  );
}

// ---------------------------------------------------------------- Detail P's balloons on moving parts
// The circles stay where they are; the leaders follow the parts (x: plunger lift, z: diaphragm lift).
const PILOT_BALLOONS = [
  { n: 13, at: (x, z) => [-1.0, 38.6 + x], c: [472, 404] },
  { n: 3, at: (x, z) => [3.9, 36.3 + z], c: [728, 418] },
  { n: 2, at: (x, z) => [7.6, 34.75 + z], c: [764, 500] },
  { n: 5, at: (x, z) => [11.15, 34.75 + z], c: [764, 562] },
  { n: 4, at: (x, z) => [-4.5, 33.5 + z], c: [472, 688] },
];
const pilotBalloon = (V, b, x, z) => K.balloon(V, b.at(x, z), b.c, b.n, { target: b.n });

return { part, body, underside, diaphragm, sleeveLoop, sleeve, washer, bleedBush, cover, oring, tubeBase, tube, pole, POCKET, plunger, seal, spring, housing, frame, yoke, bobbin, winding, coilWasher, nut, chamberWater, inletWater, outletWater, waterPath, phantomOpen, plan, PILOT_BALLOONS, pilotBalloon };
})();

// Page code for solenoid-valve.html. K (kit), L (runtime), C (self-check), M (model) and P (parts)
// are inlined above this script as namespaces.

const svg = document.querySelector(".bp-sheet");
const q = L.setupPage(svg);
const specs = JSON.parse(svg.dataset.views);
const VM = K.view(specs.main);
const VP = K.view(specs.P);
const CH = {"x0":470,"x1":760,"y0":52,"y1":212,"tMax":1400,"iMax":0.5,"lMax":4,"qMax":50,"strip":46,"gap":11};
const FG = {"x0":832,"x1":1160,"y0":52,"y1":192,"gMax":3.5,"fMax":30};
const $ = (id) => document.getElementById(id);
const SLOW = 0.1; // the sheet runs ten times slower than the valve
const P_NOMINAL = M.P_SUPPLY;

const views = [["main", VM], ["P", VP]].map(([id, V]) => ({
  V,
  mx: $(`mx-${id}`),
  mz: $(`mz-${id}`),
  dia: $(`dia-${id}`),
  spring: $(`spring-${id}`),
  wc: $(`w-c-${id}`),
  win: $(`w-in-${id}`),
  wout: $(`w-out-${id}`),
}));
const el = {
  gap: $("dim-gap-wrap"),
  lift: $("dim-lift-wrap"),
  pb: P.PILOT_BALLOONS.map((b) => [b, $(`pb-${b.n}`)]),
  patIn: $("w-in"),
  patOut: $("w-out"),
  tr: Object.fromEntries(["i", "x", "z", "q"].map((k) => [k, [$(`tr-${k}`), $(`tr-${k}-prev`)]])),
  cursor: $("cursor"),
  qdot: $("q-dot"),
  evOn: [$("ev-on"), $("ev-on-t")],
  evOff: [$("ev-off"), $("ev-off-t")],
  fgTrace: $("fg-trace"),
  fgDot: $("fg-dot"),
  load: $("load-line"),
  readout: $("readout"),
};
const say = L.announcer($("sr"), 2);

// ---------------------------------------------------------------- state
const s = M.valve(P_NOMINAL);
let pTarget = P_NOMINAL;
let cyc = 0; // time into the current sweep, model s
let cycleStart = 0;
let now = [];
let prev = [];
let fg = [];
let lastSample = -1;
let phase = 0; // the water's drift along the ports, sheet units
let wasTouring = true;

function sweep() {
  prev = now;
  now = [];
  fg = [];
  lastSample = -1;
  cyc = 0;
  cycleStart = s.t;
}

// ---------------------------------------------------------------- step and render
function step(dt, live) {
  const h = dt * SLOW;
  const before = [s.x, s.z, s.i, s.p1];
  if (live.touring) {
    if (!wasTouring) sweep(); // the tour starts its programme from the top
    pTarget = P_NOMINAL;
    M.setCoil(s, cyc >= M.TOUR.on && cyc < M.TOUR.off);
  }
  wasTouring = live.touring;
  s.p1 = L.follow(s.p1, pTarget, 4, dt);
  M.advance(s, h);
  cyc += h;
  phase = (phase + (M.lpm(s.q) / 35) * 14 * dt) % 2.8;
  if (cyc - lastSample >= 0.002) {
    lastSample = cyc;
    now.push([cyc * 1000, s.i, s.x, s.z, M.lpm(s.q)]);
  }
  const lastFg = fg[fg.length - 1];
  if (fg.length < 1500 && (!lastFg || Math.abs(lastFg[0] - M.gapOf(s.x)) > 0.02 || Math.abs(lastFg[1] - s.f) > 0.25)) fg.push([M.gapOf(s.x), s.f]);
  if (cyc >= M.TOUR.end) sweep();
  const after = [s.x, s.z, s.i, s.p1];
  return after.some((v, k) => Math.abs(v - before[k]) > 1e-6) || s.lam > 0 !== s.on;
}

const tX = (ms) => K.r2(CH.x0 + (Math.min(CH.tMax, ms) / CH.tMax) * (CH.x1 - CH.x0));
const stripY = (k, v, max) => {
  const bot = CH.y0 + k * (CH.strip + CH.gap) + CH.strip;
  return K.r2(bot - (Math.min(max, Math.max(0, v)) / max) * CH.strip);
};
const series = [
  ["i", 1, 0, CH.iMax],
  ["x", 2, 1, CH.lMax],
  ["z", 3, 1, CH.lMax],
  ["q", 4, 2, CH.qMax],
];
const gX = (g) => K.r2(FG.x0 + (g / FG.gMax) * (FG.x1 - FG.x0));
const fY = (f) => K.r2(FG.y1 - (Math.min(FG.fMax, Math.max(0, f)) / FG.fMax) * (FG.y1 - FG.y0));
const tint = (pa) => K.r2(0.14 + 0.66 * Math.min(1, Math.max(0, M.bar(pa) / 4)));
let shown = { x: -1, z: -1, p1: -1 };

function marker([line, text], at) {
  const t = (at - cycleStart) * 1000;
  const on = at >= 0 && t >= 0 && t <= CH.tMax;
  line.setAttribute("visibility", on ? "visible" : "hidden");
  text.setAttribute("visibility", on ? "visible" : "hidden");
  if (!on) return;
  line.setAttribute("d", `M${tX(t)} ${CH.y0}V${CH.y1}`);
  text.setAttribute("x", tX(t));
}

function render(live) {
  const { x, z } = s;
  for (const v of views) {
    v.mx.setAttribute("transform", `translate(0 ${K.r2(-x * v.V.k)})`);
    v.mz.setAttribute("transform", `translate(0 ${K.r2(-z * v.V.k)})`);
    if (Math.abs(z - shown.z) > 0.002) {
      v.dia.innerHTML = P.diaphragm(v.V, z);
      v.win.setAttribute("d", P.waterPath(v.V, P.inletWater(z)));
      v.wout.setAttribute("d", P.waterPath(v.V, P.outletWater(z)));
    }
    if (Math.abs(x - shown.x) > 0.002) v.spring.innerHTML = P.spring(v.V, x);
    v.wc.setAttribute("fill-opacity", tint(s.pc));
    v.win.setAttribute("fill-opacity", tint(s.p1));
    v.wout.setAttribute("fill-opacity", tint(s.p2));
  }
  if (Math.abs(z - shown.z) > 0.002) {
    el.lift.innerHTML = K.dim(VP, [-8, M.SEAT_TOP], [-8, M.SEAT_TOP + z], { dir: "v", off: 432 - VP.p([-8, 0])[0], text: `h=${z.toFixed(2)}`, id: "dim-lift" });
    shown.z = z;
  }
  if (Math.abs(x - shown.x) > 0.002) {
    el.gap.innerHTML = K.dim(VM, [M.PLUNGER_R, M.POLE_FACE], [M.PLUNGER_R, M.PLUNGER_TOP + x], { dir: "v", off: 312 - VM.p([M.PLUNGER_R, 0])[0], text: (M.STROKE - x).toFixed(2), id: "dim-gap" });
    shown.x = x;
  }
  for (const [b, node] of el.pb) node.innerHTML = P.pilotBalloon(VP, b, x, z);
  el.patIn.setAttribute("patternTransform", `translate(${K.r2(phase)} 0)`);
  el.patOut.setAttribute("patternTransform", `translate(${K.r2(phase)} 0)`);

  // DIAGRAM 1: this sweep in full, the last one thin where this one has not reached yet
  const tNow = cyc * 1000;
  for (const [key, col, strip, max] of series) {
    const pts = (list) => list.map((r) => `${tX(r[0])},${stripY(strip, r[col], max)}`).join(" ");
    const [cur, old] = el.tr[key];
    cur.setAttribute("points", pts(now));
    old.setAttribute("points", pts(prev.filter((r) => r[0] > tNow + 8)));
  }
  el.cursor.setAttribute("d", `M${tX(tNow)} ${CH.y0}V${CH.y1}`);
  el.qdot.setAttribute("cx", tX(tNow));
  el.qdot.setAttribute("cy", stripY(2, M.lpm(s.q), CH.qMax));
  marker(el.evOn, s.onAt);
  marker(el.evOff, s.offAt);

  // DIAGRAM 2: where the plunger is on its force–gap map
  el.fgTrace.setAttribute("points", fg.map(([g, f]) => `${gX(g)},${fY(f)}`).join(" "));
  el.fgDot.setAttribute("cx", gX(M.gapOf(x)));
  el.fgDot.setAttribute("cy", fY(s.f));
  if (Math.abs(s.p1 - shown.p1) > 500) {
    const pts = [];
    for (let xx = 0; xx <= M.STROKE + 1e-9; xx += 0.1) pts.push(`${gX(M.gapOf(xx))},${fY(M.springForce(xx) + M.PLUNGER_MASS * M.G + (xx < 0.05 ? M.pilotLoad(s.p1) : 0))}`);
    el.load.setAttribute("points", pts.join(" "));
    shown.p1 = s.p1;
  }

  const text = `t ${Math.round(tNow)} ms · ${s.i.toFixed(2)} A · LIFT ${x.toFixed(2)}/${z.toFixed(2)} mm · p ${M.bar(s.p1).toFixed(1)}/${M.bar(s.pc).toFixed(2)} bar · ${Math.round(M.lpm(s.q))} L/min`;
  el.readout.textContent = text;
  say(
    `Coil ${s.on ? "on" : "off"}, ${s.i.toFixed(2)} amps. Plunger lift ${x.toFixed(1)} millimetres, diaphragm ${z.toFixed(1)}. Supply ${M.bar(s.p1).toFixed(1)} bar, flow ${Math.round(M.lpm(s.q))} litres a minute.`,
    live.clock
  );
}

// ---------------------------------------------------------------- input
const live = L.run({
  root: svg,
  step,
  render,
  idleAfter: 6,
  onFrozen: () => q.check && C.selfCheck(svg),
});

if (live.reduced && !live.frozen) {
  // A still, true moment: the tour played to 4 s (the valve wide open), drawn once.
  const fake = { touring: true, reduced: false, clock: 0 };
  for (let t = 0; t < 4; t += 1 / 240) step(1 / 240, fake);
  render(live);
}

const clampP = (p) => Math.min(8e5, Math.max(0.5e5, p));
const toggle = () => {
  M.setCoil(s, !s.on);
  live.input();
};
for (const hit of svg.querySelectorAll("[data-drag]")) {
  let p0 = 0;
  let moved = false;
  L.dragY(svg, hit, {
    start: () => {
      p0 = pTarget;
      moved = false;
      live.input();
    },
    move: (dy) => {
      if (Math.abs(dy) > 4) moved = true;
      if (moved) pTarget = clampP(p0 - dy * 2000);
      live.input();
    },
    end: () => {
      if (!moved) toggle();
      live.input();
    },
  });
}

svg.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === " " || k === "Enter") toggle();
  else if (k === "ArrowUp" || k === "ArrowDown") pTarget = clampP(pTarget + (k === "ArrowUp" ? 0.5e5 : -0.5e5));
  else if (k === "s" || k === "S") live.slow = live.slow === 1 ? 0.25 : live.slow === 0.25 ? 0.05 : 1;
  else return;
  e.preventDefault();
  live.input();
});

if (q.check && !live.frozen) setTimeout(() => C.selfCheck(svg), 400);

</script>
</body>
</html>
