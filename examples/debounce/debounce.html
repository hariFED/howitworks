<style>
/* Blueprint sheet styles. Every colour a drawing uses is one of these tokens. */

:root,
[data-theme="blueprint"] {
  --bp-page: #0a2747;
  --bp-paper: #123b69;
  --bp-ink: #e9f1ff;
  --bp-hatch: rgba(214, 230, 255, 0.72);
  --bp-muted: #95b3da;
  --bp-grid: rgba(190, 215, 255, 0.07);
  --bp-accent: #ffc94d;
  --bp-accent-ink: #ffd77a;
  --bp-ui: rgba(233, 241, 255, 0.12);
  /* 3D mode (solid3d.mjs): uncut surfaces in three tones, lit, mid and shadow */
  --bp3-lit: #2a5a93;
  --bp3-mid: #1d4a7e;
  --bp3-dark: #133864;
}
[data-theme="paper"] {
  --bp-page: #e4dfd1;
  --bp-paper: #f7f3e8;
  --bp-ink: #1c2633;
  --bp-hatch: rgba(28, 38, 51, 0.78);

  --bp-grid: rgba(28, 38, 51, 0.045);
  --bp-accent: #d4472c;
  --bp-accent-ink: #b8361e;
  --bp-ui: rgba(28, 38, 51, 0.08);
  --bp3-lit: #ece6d8;
  --bp3-mid: #d9d0bc;
  --bp3-dark: #bdb29b;
}
[data-theme="white"] {
  --bp-page: #fafafa;
  --bp-paper: #fafafa;
  --bp-ink: #262626;
  --bp-hatch: rgba(38, 38, 38, 0.42);
  --bp-muted: #8f8f8f;
  --bp-grid: rgba(0, 0, 0, 0);
  --bp-accent: #e2552c;
  --bp-accent-ink: #c8442b;
  --bp-ui: rgba(0, 0, 0, 0.07);
  --bp3-lit: #f1f1f0;
  --bp3-mid: #e0e0de;
  --bp3-dark: #c4c4c1;
}
[data-theme="dark"] {
  --bp-page: #0d0f12;
  --bp-paper: #15181c;
  --bp-ink: #dde3ea;
  --bp-hatch: rgba(221, 227, 234, 0.62);
  --bp-muted: #86919d;
  --bp-grid: rgba(221, 227, 234, 0.035);
  --bp-accent: #f29f3d;
  --bp-accent-ink: #f6b462;
  --bp-ui: rgba(221, 227, 234, 0.08);
  --bp3-lit: #353b43;
  --bp3-mid: #272c32;
  --bp3-dark: #1b1e22;
}

:root {
  --bp-thick: 1.15px;
  --bp-thin: 0.55px;
  --bp-font: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}

html,
body {
  margin: 0;
  background: var(--bp-page);
  color: var(--bp-ink);
  font-family: var(--bp-font);
}
.bp-page {
  max-width: 1480px;
  margin: 0 auto;
  padding: 24px 16px 40px;
  box-sizing: border-box;
}
.bp-figure {
  margin: 0;
}
.bp-sheet {
  display: block;
  width: 100%;
  height: auto;
  outline: none;
  border-radius: 2px;
}
.bp-sheet:focus-visible {
  box-shadow: 0 0 0 2px var(--bp-accent);
}
.bp-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  font-size: 12px;
  color: var(--bp-muted);
  letter-spacing: 0.03em;
}
.bp-bar kbd {
  font: inherit;
  color: var(--bp-ink);
  border: 1px solid var(--bp-ui);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 0 4px;
}
.bp-themes {
  display: flex;
  gap: 4px;
}
.bp-themes button {
  font: inherit;
  color: var(--bp-muted);
  background: transparent;
  border: 1px solid var(--bp-ui);
  border-radius: 3px;
  padding: 3px 9px;
  cursor: pointer;
}
.bp-themes button[aria-pressed="true"] {
  color: var(--bp-ink);
  background: var(--bp-ui);
}
.bp-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Zoom mode (?zoom=x,y,w,h): the region fills the window, for close-up checks. */
body.bp-zoom .bp-page {
  max-width: none;
  padding: 0;
}
body.bp-zoom .bp-sheet {
  width: 100vw;
  height: 100vh;
}
body.bp-zoom .bp-bar {
  display: none;
}

/* ---- the drawing */
.bp-sheet .sheet-bg {
  fill: var(--bp-paper);
}
.bp-sheet .grid {
  fill: none;
  stroke: var(--bp-grid);
  stroke-width: 0.5px;
}
.bp-sheet .vis,
.bp-sheet .thin,
.bp-sheet .hid,
.bp-sheet .ctr,
.bp-sheet .phan {
  fill: none;
  stroke: var(--bp-ink);
  stroke-linejoin: round;
  stroke-linecap: round;
}
.bp-sheet .vis {
  stroke-width: var(--bp-thick);
}
.bp-sheet .thin,
.bp-sheet .hid,
.bp-sheet .ctr,
.bp-sheet .phan {
  stroke-width: var(--bp-thin);
}
.bp-sheet .hid {
  stroke-dasharray: 4 2.2;
  stroke-linecap: butt;
}
.bp-sheet .ctr {
  stroke-dasharray: 15 2.6 2 2.6;
  stroke-linecap: butt;
}
.bp-sheet .phan {
  stroke-dasharray: 13 2.4 1.8 2.4 1.8 2.4;
  stroke-linecap: butt;
}
.bp-sheet .vis.spring {
  stroke-width: var(--bp-thin);
}
.bp-sheet .paper,
.bp-sheet .balloon {
  fill: var(--bp-paper);
}
.bp-sheet .balloon {
  stroke: var(--bp-ink);
  stroke-width: var(--bp-thin);
}
.bp-sheet .solid,
.bp-sheet .head,
.bp-sheet .dot {
  fill: var(--bp-ink);
}
.bp-sheet .hl {
  fill: none;
  stroke: var(--bp-hatch);
  stroke-width: 0.5px;
}
.bp-sheet .hl-dash {
  stroke-dasharray: 1.3 1.3;
}
.bp-sheet .hd {
  fill: var(--bp-hatch);
}
.bp-sheet .tint {
  fill: var(--bp-accent);
}
.bp-sheet .accent {
  stroke: var(--bp-accent);
}
.bp-sheet .accent-fill {
  fill: var(--bp-accent);
}
.bp-sheet .t {
  font-family: var(--bp-font);
  font-size: 9.5px;
  fill: var(--bp-ink);
  letter-spacing: 0.02em;
}
.bp-sheet .t-sm {
  font-size: 7.6px;
}
.bp-sheet .t-lg {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
}
.bp-sheet .t-xl {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.05em;
}
.bp-sheet .t-cap {
  font-size: 6.2px;
  fill: var(--bp-muted);
  letter-spacing: 0.08em;
}
.bp-sheet .t-head {
  font-weight: 600;
  letter-spacing: 0.06em;
}
.bp-sheet .t-mute {
  fill: var(--bp-muted);
}
.bp-sheet .t-accent {
  fill: var(--bp-accent-ink);
}
.bp-sheet [data-drag] {
  cursor: ns-resize;
  touch-action: none;
}

</style>

<script>
"use strict";
const K = (() => {
// Blueprint drafting kit: orthographic views, sections, hatching, dimensions and sheet furniture.
// Every function here is pure and returns SVG markup strings, so the same code runs in the build
// and, inlined, in the page (live dimensions, moving springs, needles).
//
// Units. World geometry is in millimetres of the real object: u to the right, v up (a front view),
// or u right, v away from the viewer (a plan view). The sheet is an A2 drawing, 594 mm wide, drawn
// 1200 units wide; a view maps world mm to sheet units through its drawing scale.

const SHEET = { w: 1200, h: 848 };
const PX_PER_MM = SHEET.w / 594;

// ISO 128 line widths and ISO 3098 lettering, in sheet units (A2: 0.5 / 0.25 mm lines, 3.5 mm text).
const THICK = 1.15;
const THIN = 0.55;
const TEXT = 9.5;
const ARROW = 7;
const GAP = 2.2; // extension lines start this far from the object
const OVER = 3.5; // and run this far past the dimension line

const r2 = (n) => Math.round(n * 100) / 100;

function fmt(n, digits = 1) {
  const near = Math.round(n);
  if (Math.abs(n - near) < 0.05) return String(near);
  return n.toFixed(digits);
}

// ---------------------------------------------------------------- views

// A view is a window from world mm onto the sheet. scale is the drawing scale (1/2.5 for "1:2.5").
function view({ x, y, scale, name = "" }) {
  const k = scale * PX_PER_MM;
  return { x, y, scale, k, name, p: ([u, v]) => [r2(x + u * k), r2(y - v * k)] };
}

const scaleLabel = (scale) => (scale >= 1 ? `${fmt(scale)}:1` : `1:${fmt(1 / scale)}`);

function d(V, pts, closed = true) {
  let out = "";
  for (let i = 0; i < pts.length; i++) {
    const [x, y] = V.p(pts[i]);
    out += `${i ? "L" : "M"}${x} ${y}`;
  }
  return closed ? out + "Z" : out;
}

// ---------------------------------------------------------------- world geometry (point lists)

const rect = (u0, v0, u1, v1) => [[u0, v0], [u1, v0], [u1, v1], [u0, v1]];

function arc(cu, cv, r, a0, a1, steps) {
  const n = steps ?? Math.max(3, Math.ceil(Math.abs(a1 - a0) / 7.5));
  const out = [];
  for (let i = 0; i <= n; i++) {
    const a = ((a0 + ((a1 - a0) * i) / n) * Math.PI) / 180;
    out.push([cu + r * Math.cos(a), cv + r * Math.sin(a)]);
  }
  return out;
}

const circle = (cu, cv, r, steps = 48) => arc(cu, cv, r, 0, 360 - 360 / steps, steps - 1);

// A rectangle with filleted corners.
function rrect(u0, v0, u1, v1, r, steps = 4) {
  const q = Math.min(r, (u1 - u0) / 2, (v1 - v0) / 2);
  return [
    ...arc(u1 - q, v0 + q, q, -90, 0, steps),
    ...arc(u1 - q, v1 - q, q, 0, 90, steps),
    ...arc(u0 + q, v1 - q, q, 90, 180, steps),
    ...arc(u0 + q, v0 + q, q, 180, 270, steps),
  ];
}

const move = (pts, du, dv) => pts.map(([u, v]) => [u + du, v + dv]);
const flipU = (pts, about = 0) => pts.map(([u, v]) => [2 * about - u, v]).reverse();
const flipV = (pts, about = 0) => pts.map(([u, v]) => [u, 2 * about - v]).reverse();

function inside([u, v], poly) {
  let hit = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [ui, vi] = poly[i];
    const [uj, vj] = poly[j];
    if (vi > v !== vj > v && u < ((uj - ui) * (v - vi)) / (vj - vi) + ui) hit = !hit;
  }
  return hit;
}

// A body of revolution cut through its axis.
// loop is the half-profile as [r, s] pairs: r >= 0 measured from the axis, s along the axis.
// axis "v" is a vertical axis at u = at; axis "u" a horizontal axis at v = at.
// Returns the cut faces (hatched) and the edges seen through the bore behind the cutting plane:
// every circle on an inner surface shows edge-on as a straight line across the bore.
function revolve(loop, { axis = "v", at = 0 } = {}) {
  const place = axis === "v" ? (r, s) => [at + r, s] : (r, s) => [s, at + r];
  const n = loop.length;
  const onAxis = loop.findIndex(([r], i) => r === 0 && loop[(i + 1) % n][0] === 0);
  let cuts;
  if (onAxis >= 0) {
    const chain = Array.from({ length: n }, (_, j) => loop[(onAxis + 1 + j) % n]);
    const right = chain.map(([r, s]) => place(r, s));
    const left = chain.slice(1, -1).reverse().map(([r, s]) => place(-r, s));
    cuts = [[...right, ...left]];
  } else {
    cuts = [loop.map(([r, s]) => place(r, s)), loop.map(([r, s]) => place(-r, s)).reverse()];
  }
  const eps = 1e-3;
  const across = new Map();
  const clear = (r, s) => [0.02, 0.25, 0.5, 0.75, 0.98].every((t) => !inside([t * r, s], loop));
  for (const [r, s] of loop) {
    if (r <= 0) continue;
    if (clear(r, s + eps) && clear(r, s - eps)) across.set(s, Math.max(across.get(s) ?? 0, r));
  }
  const edges = [...across].map(([s, r]) => [place(-r, s), place(r, s)]);
  return { cuts, edges };
}

// ---------------------------------------------------------------- hatching

// ANSI/ISO-style material hatches. Spacing is in sheet units and never scales with the view,
// so a detail at 2:1 shows the same density as the main view, as on a real drawing.
const MATERIALS = {
  steel: { kind: "lines", gap: 3.4 },
  iron: { kind: "lines", gap: 5.6 },
  alu: { kind: "pairs", gap: 5.2, pair: 1.5 },
  brass: { kind: "dashed", gap: 4.6 },
  bronze: { kind: "dashed", gap: 3.6 },
  rubber: { kind: "cross", gap: 3.2 },
  plastic: { kind: "lines", gap: 2.3 },
  foam: { kind: "dots", gap: 2.6 },
  wood: { kind: "grain", gap: 4 },
};
const ANGLES = [45, 135, 30, 60];

function hatchDefs() {
  let out = "";
  for (const [name, m] of Object.entries(MATERIALS)) {
    for (const angle of ANGLES) {
      const g = m.gap;
      let body = "";
      if (m.kind === "lines") body = `<path class="hl" d="M0 -1V${g + 1}"/>`;
      if (m.kind === "pairs") body = `<path class="hl" d="M0 -1V${g + 1}M${m.pair} -1V${g + 1}"/>`;
      if (m.kind === "dashed") body = `<path class="hl" d="M0 -1V${g + 1}"/><path class="hl hl-dash" d="M${g / 2} -1V${g + 1}"/>`;
      if (m.kind === "cross") body = `<path class="hl" d="M0 -1V${g + 1}M-1 0H${g + 1}"/>`;
      if (m.kind === "dots") body = `<circle class="hd" cx="${g / 2}" cy="${g / 2}" r="0.42"/>`;
      if (m.kind === "grain") body = `<path class="hl" d="M0 -1V${g + 1}"/><path class="hl" d="M${g * 0.55} -1C${g * 0.75} ${g * 0.3} ${g * 0.35} ${g * 0.7} ${g * 0.55} ${g + 1}"/>`;
      out += `<pattern id="h-${name}-${angle}" patternUnits="userSpaceOnUse" width="${g}" height="${g}" patternTransform="rotate(${angle})">${body}</pattern>`;
    }
  }
  return out;
}

// ---------------------------------------------------------------- drawing parts

// A cut face: paper underneath (it hides what is behind), the material hatch, a thick outline.
// mat "solid" blacks the section in, the ISO convention for sections too thin to hatch.
function cut(V, pts, { mat = "steel", angle = 45 } = {}) {
  const dd = d(V, pts);
  if (mat === "solid") return `<path class="solid" d="${dd}"/>`;
  return `<path class="paper" d="${dd}"/><path fill="url(#h-${mat}-${angle})" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

// A body of revolution in section, with the edges behind the cut.
function section(V, rev, opts) {
  return rev.cuts.map((c) => cut(V, c, opts)).join("") + rev.edges.map((e) => line(V, e)).join("");
}

// An unsectioned solid (shafts, rods, pins, balls, nuts and ribs are never hatched in a section).
function body(V, pts) {
  const dd = d(V, pts);
  return `<path class="paper" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

const line = (V, pts, cls = "vis", closed = false) => `<path class="${cls}" d="${d(V, pts, closed)}"/>`;
const lines = (V, list, cls = "vis") => `<path class="${cls}" d="${list.map((pts) => d(V, pts, false)).join("")}"/>`;

// A centre line, run a little past the outline at both ends.
function centerline(V, a, b, over = 6) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  return `<path class="ctr" d="M${r2(ax - ux * over)} ${r2(ay - uy * over)}L${r2(bx + ux * over)} ${r2(by + uy * over)}"/>`;
}

// Centre mark for a circle in a view: two crossed centre lines.
function centerMark(V, [cu, cv], r, over = 5) {
  return centerline(V, [cu - r, cv], [cu + r, cv], over) + centerline(V, [cu, cv - r], [cu, cv + r], over);
}

// A compression spring cut along its axis: wire sections (blacked in) on both sides, half a pitch
// apart, joined by the back half of each turn. from/to are positions along the axis.
function springSection(V, { from, to, radius, wire, turns, axis = "u", at = 0 }) {
  const place = axis === "u" ? (s, r) => [s, at + r] : (s, r) => [at + r, s];
  const pitch = (to - from - wire) / turns;
  const start = from + wire / 2;
  const back = [];
  let sections = "";
  for (let i = 0; i <= turns; i++) {
    const sTop = start + i * pitch;
    sections += cut(V, circle(...place(sTop, radius), wire / 2, 12), { mat: "solid" });
    if (i < turns) {
      const sBot = sTop + pitch / 2;
      sections += cut(V, circle(...place(sBot, -radius), wire / 2, 12), { mat: "solid" });
      back.push([place(sTop, radius), place(sBot, -radius)]);
    }
  }
  return lines(V, back, "vis spring") + sections;
}

// ---------------------------------------------------------------- annotation

function arrowHead([x, y], [dx, dy]) {
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len;
  const uy = dy / len;
  const bx = x - ux * ARROW;
  const by = y - uy * ARROW;
  const half = ARROW * 0.25;
  return `M${r2(x)} ${r2(y)}L${r2(bx - uy * half)} ${r2(by + ux * half)}L${r2(bx + uy * half)} ${r2(by - ux * half)}Z`;
}

const textWidth = (s, size = TEXT) => String(s).length * size * 0.6;

// A linear dimension between two world points, measured along dir ("h" or "v").
// off is the sheet distance from point a to the dimension line (negative: up or left).
// The value is measured from the geometry unless text is given, so a dimension cannot lie.
function dim(V, a, b, { dir = "h", off = 18, text, prefix = "", suffix = "", id = "", cls = "" } = {}) {
  const A = V.p(a);
  const B = V.p(b);
  const value = text ?? prefix + fmt(Math.abs(dir === "h" ? b[0] - a[0] : b[1] - a[1])) + suffix;
  const h = dir === "h";
  const main = h ? 0 : 1; // the axis the dimension measures along
  const side = 1 - main;
  const at = A[side] + off; // where the dimension line sits
  const pt = (m, s) => (h ? [m, s] : [s, m]);
  let ext = "";
  for (const P of [A, B]) {
    const gapTo = at - P[side];
    if (Math.abs(gapTo) <= GAP) continue;
    const sgn = Math.sign(gapTo);
    const [x1, y1] = pt(P[main], P[side] + sgn * GAP);
    const [x2, y2] = pt(P[main], at + sgn * OVER);
    ext += `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
  }
  const lo = Math.min(A[main], B[main]);
  const hi = Math.max(A[main], B[main]);
  const span = hi - lo;
  const tw = textWidth(value);
  const arrowsIn = span >= ARROW * 2 + 3;
  const textIn = span >= tw + ARROW * 2 + 6;
  let lineD;
  let heads;
  let tm; // text position along the measured axis
  let anchor = "middle";
  if (arrowsIn) {
    const [x1, y1] = pt(lo, at);
    const [x2, y2] = pt(hi, at);
    lineD = `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
    heads = arrowHead(pt(lo, at), pt(-1, 0)) + arrowHead(pt(hi, at), pt(1, 0));
  } else {
    const [x1, y1] = pt(lo - ARROW - 7, at);
    const [x2, y2] = pt(hi + ARROW + 7, at);
    lineD = `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
    heads = arrowHead(pt(lo, at), pt(1, 0)) + arrowHead(pt(hi, at), pt(-1, 0));
  }
  if (textIn) tm = (lo + hi) / 2;
  else {
    tm = hi + ARROW + 10 + tw / 2;
    const [x2, y2] = pt(tm + tw / 2, at);
    lineD += `L${r2(x2)} ${r2(y2)}`;
  }
  // ISO: text sits just above a horizontal line and reads from the right on a vertical one.
  const [tx, ty] = pt(tm, at - 3);
  const textEl = h
    ? `<text class="t" x="${r2(tx)}" y="${r2(ty)}" text-anchor="${anchor}">${value}</text>`
    : `<text class="t" x="${r2(tx)}" y="${r2(ty)}" text-anchor="${anchor}" transform="rotate(-90 ${r2(tx)} ${r2(ty)})">${value}</text>`;
  return `<g data-role="dim"${id ? ` id="${id}"` : ""}${cls ? ` class="${cls}"` : ""}><path class="thin" d="${ext}${lineD}"/><path class="head" d="${heads}"/>${textEl}</g>`;
}

// A part balloon: a dot on the part, a thin leader, a circled item number.
function balloon(V, at, [bx, by], n, { target = "", r = 8.5 } = {}) {
  const [ax, ay] = V.p(at);
  const a = Math.atan2(ay - by, ax - bx);
  const ex = r2(bx + r * Math.cos(a));
  const ey = r2(by + r * Math.sin(a));
  return (
    `<g data-role="balloon" data-target="${target}" data-at="${ax} ${ay}">` +
    `<path class="thin" d="M${ex} ${ey}L${ax} ${ay}"/><circle class="dot" cx="${ax}" cy="${ay}" r="1.5"/>` +
    `<circle class="balloon" cx="${bx}" cy="${by}" r="${r}"/>` +
    `<text class="t" x="${bx}" y="${r2(by + 3.3)}" text-anchor="middle">${n}</text></g>`
  );
}

// A view title: SECTION A-A over its scale, centred under the view.
function viewLabel(x, y, title, sub = "") {
  return (
    `<g data-role="label"><text class="t t-lg" x="${x}" y="${y}" text-anchor="middle">${title}</text>` +
    (sub ? `<text class="t t-sm" x="${x}" y="${y + 12}" text-anchor="middle">${sub}</text>` : "") +
    `</g>`
  );
}

// The circle that marks a detail in its parent view, with its letter.
function detailMark(V, [cu, cv], r, letter, angle = 45) {
  const [x, y] = V.p([cu, cv]);
  const R = r * V.k;
  const a = (-angle * Math.PI) / 180;
  const lx = r2(x + (R + 9) * Math.cos(a));
  const ly = r2(y + (R + 9) * Math.sin(a) + 4);
  return `<g data-role="label"><circle class="thin mark" cx="${x}" cy="${y}" r="${r2(R)}"/><text class="t t-lg" x="${lx}" y="${ly}" text-anchor="middle">${letter}</text></g>`;
}

// A viewing-direction arrow (VIEW C): a thick-tipped arrow pointing at the surface, with its letter.
function viewArrow(V, at, [dx, dy], letter, len = 26) {
  const [x, y] = V.p(at);
  const n = Math.hypot(dx, dy) || 1;
  const ux = dx / n;
  const uy = dy / n;
  const sx = r2(x - ux * len);
  const sy = r2(y - uy * len);
  return (
    `<g data-role="label"><path class="vis" d="M${sx} ${sy}L${r2(x - ux * ARROW)} ${r2(y - uy * ARROW)}"/>` +
    `<path class="head" d="${arrowHead([x, y], [ux, uy])}"/>` +
    `<text class="t t-lg" x="${r2(sx - uy * 10)}" y="${r2(sy + ux * 10 + 4)}" text-anchor="middle">${letter}</text></g>`
  );
}

// A long-break line across a part (thin, with one zigzag), for parts that run out of the view.
function breakLine(V, a, b) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const mx = (ax + bx) / 2;
  const my = (ay + by) / 2;
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  const z = 3.5;
  const p = (t, s) => `${r2(mx + ux * t - uy * s)} ${r2(my + uy * t + ux * s)}`;
  return `<path class="thin" d="M${r2(ax - ux * 4)} ${r2(ay - uy * 4)}L${p(-z, 0)}L${p(-z / 2, z * 1.6)}L${p(z / 2, -z * 1.6)}L${p(z, 0)}L${r2(bx + ux * 4)} ${r2(by + uy * 4)}"/>`;
}

// ---------------------------------------------------------------- sheet furniture

// The drawing frame: trimmed edge, a thick border, zone references and centring marks.
function frame({ w = SHEET.w, h = SHEET.h, trim = 8, m = 24, cols = 8, rows = 6 } = {}) {
  let out = `<g data-role="frame"><rect class="thin" x="${trim}" y="${trim}" width="${w - trim * 2}" height="${h - trim * 2}"/>`;
  out += `<rect class="vis" x="${m}" y="${m}" width="${w - m * 2}" height="${h - m * 2}"/>`;
  const cw = (w - m * 2) / cols;
  const rh = (h - m * 2) / rows;
  let ticks = "";
  let labels = "";
  for (let i = 0; i <= cols; i++) {
    const x = r2(m + i * cw);
    if (i > 0 && i < cols) ticks += `M${x} ${trim}V${m}M${x} ${h - m}V${h - trim}`;
    if (i < cols) {
      const cx = r2(m + (i + 0.5) * cw);
      labels += `<text class="t t-sm" x="${cx}" y="${r2((trim + m) / 2 + 3)}" text-anchor="middle">${i + 1}</text>`;
      labels += `<text class="t t-sm" x="${cx}" y="${r2(h - (trim + m) / 2 + 3)}" text-anchor="middle">${i + 1}</text>`;
    }
  }
  for (let j = 0; j <= rows; j++) {
    const y = r2(m + j * rh);
    if (j > 0 && j < rows) ticks += `M${trim} ${y}H${m}M${w - m} ${y}H${w - trim}`;
    if (j < rows) {
      const cy = r2(m + (j + 0.5) * rh + 3);
      const letter = String.fromCharCode(65 + j);
      labels += `<text class="t t-sm" x="${r2((trim + m) / 2)}" y="${cy}" text-anchor="middle">${letter}</text>`;
      labels += `<text class="t t-sm" x="${r2(w - (trim + m) / 2)}" y="${cy}" text-anchor="middle">${letter}</text>`;
    }
  }
  const cm = `M${w / 2} ${trim}V${m + 10}M${w / 2} ${h - trim}V${h - m - 10}M${trim} ${h / 2}H${m + 10}M${w - trim} ${h / 2}H${w - m - 10}`;
  out += `<path class="thin" d="${ticks}"/><path class="vis" d="${cm}"/>${labels}</g>`;
  return out;
}

// A ruled table (parts list). cols: [{ w, align, title }]. rows: arrays of cell strings.
// Item numbers count up from the bottom, as a parts list sits on top of the title block.
function table(x, y, cols, rows, { rowH = 16, role = "bom", headH = 18 } = {}) {
  const w = cols.reduce((s, c) => s + c.w, 0);
  const h = headH + rows.length * rowH;
  let rules = "";
  let text = "";
  let cx = x;
  for (const [i, c] of cols.entries()) {
    if (i > 0) rules += `M${r2(cx)} ${y}V${y + h}`;
    const tx = c.align === "center" ? cx + c.w / 2 : c.align === "right" ? cx + c.w - 4 : cx + 4;
    const anchor = c.align === "center" ? "middle" : c.align === "right" ? "end" : "start";
    text += `<text class="t t-sm t-head" x="${r2(tx)}" y="${y + h - 5.5}" text-anchor="${anchor}">${c.title}</text>`;
    rows.forEach((row, j) => {
      text += `<text class="t t-sm" x="${r2(tx)}" y="${r2(y + (rows.length - 1 - j) * rowH + rowH - 4.8)}" text-anchor="${anchor}">${row[i]}</text>`;
    });
    cx += c.w;
  }
  for (let j = 1; j <= rows.length; j++) rules += `M${x} ${r2(y + j * rowH)}H${x + w}`;
  return `<g data-role="${role}"><rect class="paper" x="${x}" y="${y}" width="${w}" height="${h}"/><path class="thin" d="${rules}"/><rect class="vis" x="${x}" y="${y}" width="${w}" height="${h}"/>${text}</g>`;
}

// A title-block cell: a small caption over a value. size: "sm" | "md" | "lg".
function cell({ x, y, w, h, label, value = "", size = "md", id = "" }) {
  const cls = size === "lg" ? "t t-xl" : size === "sm" ? "t t-sm" : "t";
  const vy = size === "lg" ? y + h - 7 : y + h - 5;
  return (
    `<rect class="thin" x="${x}" y="${y}" width="${w}" height="${h}"/>` +
    `<text class="t t-cap" x="${x + 4}" y="${y + 9}">${label}</text>` +
    `<text class="${cls}" x="${x + 4}" y="${vy}"${id ? ` id="${id}"` : ""}>${value}</text>`
  );
}

function titleBlock(x, y, w, h, cells) {
  return `<g data-role="title"><rect class="paper" x="${x}" y="${y}" width="${w}" height="${h}"/>${cells.map((c) => cell({ ...c, x: x + c.x, y: y + c.y })).join("")}<rect class="vis" x="${x}" y="${y}" width="${w}" height="${h}"/></g>`;
}

// A notes block: a heading and numbered lines.
function notes(x, y, heading, items, lead = 13) {
  let out = `<g data-role="notes"><text class="t t-head" x="${x}" y="${y}">${heading}</text>`;
  items.forEach((s, i) => {
    out += `<text class="t t-sm" x="${x}" y="${r2(y + lead * (i + 1) + 2)}">${i + 1}. ${s}</text>`;
  });
  return out + `</g>`;
}

return { SHEET, PX_PER_MM, THICK, THIN, TEXT, ARROW, GAP, OVER, r2, fmt, view, scaleLabel, d, rect, arc, circle, rrect, move, flipU, flipV, inside, revolve, MATERIALS, ANGLES, hatchDefs, cut, section, body, line, lines, centerline, centerMark, springSection, textWidth, dim, balloon, viewLabel, detailMark, viewArrow, breakLine, frame, table, cell, titleBlock, notes };
})();

const L = (() => {
// Live runtime for a blueprint sheet: one time-based loop, an idle tour, input wake-ups,
// offscreen and hidden-tab pauses, reduced motion, and deterministic frames for checks.
//
// URL parameters (all optional):
//   ?t=6.5            render the tour at 6.5 s, deterministically, and stop (for screenshots)
//   ?theme=paper      blueprint | paper | white | dark
//   ?zoom=x,y,w,h     show only this sheet region, filling the window (for 4x close-ups)
//   ?mask=x,y,w,h     blank everything outside this box, so one view stands alone
//   ?check=1          run the layout self-check after the first frame (see selfcheck.mjs)

function params() {
  const q = new URLSearchParams(location.search);
  return {
    t: q.has("t") ? Number(q.get("t")) : null,
    theme: q.get("theme"),
    zoom: q.get("zoom"),
    mask: q.get("mask"),
    check: q.has("check"),
  };
}

const THEMES = ["blueprint", "paper", "white", "dark"];

function setupPage(svg) {
  const q = params();
  // the page's own default (writePage's `theme`), then a saved choice, then ?theme=, which wins but isn't saved
  const fallback = document.documentElement.dataset.theme || "blueprint";
  const pick = (name, save) => {
    if (!THEMES.includes(name)) return;
    document.documentElement.dataset.theme = name;
    for (const b of document.querySelectorAll("[data-theme-pick]")) b.setAttribute("aria-pressed", String(b.dataset.themePick === name));
    if (save) {
      try {
        localStorage.setItem("bp-theme", name);
      } catch {}
    }
  };
  let saved = null;
  try {
    saved = localStorage.getItem("bp-theme");
  } catch {}
  pick(q.theme ?? saved ?? fallback, false);
  for (const b of document.querySelectorAll("[data-theme-pick]")) b.addEventListener("click", () => pick(b.dataset.themePick, true));
  // ?mask=x,y,w,h paints the page colour over everything outside one box, so a view stands alone
  if (q.mask) {
    const [x, y, w, h] = q.mask.split(",").map(Number);
    if ([x, y, w, h].every(Number.isFinite)) {
      const m = document.createElementNS("http://www.w3.org/2000/svg", "path");
      m.setAttribute("d", `M-9999 -9999H9999V9999H-9999Z M${x} ${y}V${y + h}H${x + w}V${y}Z`);
      m.setAttribute("fill-rule", "evenodd");
      m.setAttribute("style", "fill:var(--bp-page);pointer-events:none");
      m.dataset.role = "mask";
      svg.appendChild(m);
    }
  }
  if (q.zoom) {
    const box = q.zoom.split(",").map(Number);
    if (box.length === 4 && box.every(Number.isFinite)) {
      svg.setAttribute("viewBox", box.join(" "));
      document.body.classList.add("bp-zoom");
    }
  }
  return q;
}

// Critically damped follow toward a target: calm, no overshoot, frame-rate independent.
function follow(at, want, rate, dt) {
  return want + (at - want) * Math.exp(-rate * dt);
}

const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, t)));

// run({ root, step, render, idleAfter })
//   step(dt, live) advances the model; live.touring says whether the idle tour drives it.
//   It returns true while something is still settling, so a reduced-motion page can sleep.
//   render(live) writes attributes; it never rebuilds static geometry.
function run({ root, step, render, idleAfter = 4, onFrozen }) {
  const q = params();
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const live = { clock: 0, slow: 1, lastInput: -Infinity, reduced, touring: !reduced, frozen: q.t != null };
  live.input = () => {
    live.lastInput = live.clock;
    live.touring = false;
    wake();
  };

  if (live.frozen) {
    const dt = 1 / 240;
    for (let t = 0; t < q.t; t += dt) {
      live.clock = t;
      live.touring = true;
      step(dt, live);
    }
    render(live);
    onFrozen?.(live);
    return live;
  }

  let raf = 0;
  let last = 0;
  let visible = true;
  function frame(now) {
    raf = 0;
    const real = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    live.clock += real;
    live.touring = !reduced && live.clock - live.lastInput > idleAfter;
    const busy = step(real * live.slow, live);
    render(live);
    if (visible && !document.hidden && (!reduced || busy)) raf = requestAnimationFrame(frame);
    else last = 0;
  }
  function wake() {
    if (!raf && visible && !document.hidden) raf = requestAnimationFrame(frame);
  }
  live.wake = wake;
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(([entry]) => {
      visible = entry.isIntersecting;
      if (visible) wake();
    }).observe(root);
  }
  document.addEventListener("visibilitychange", wake);
  render(live);
  wake();
  return live;
}

// Vertical drag on an element, reported as a sheet-unit delta since the press.
function dragY(svg, el, { start, move, end }) {
  let id = null;
  let y0 = 0;
  const toSheet = (e) => {
    const m = svg.getScreenCTM();
    return m ? (e.clientY - m.f) / m.d : e.clientY;
  };
  el.addEventListener("pointerdown", (e) => {
    id = e.pointerId;
    el.setPointerCapture(id);
    y0 = toSheet(e);
    start?.();
    e.preventDefault();
  });
  el.addEventListener("pointermove", (e) => {
    if (e.pointerId === id) move(toSheet(e) - y0);
  });
  const stop = (e) => {
    if (e.pointerId !== id) return;
    id = null;
    end?.();
  };
  el.addEventListener("pointerup", stop);
  el.addEventListener("pointercancel", stop);
}

// Announce a readout to screen readers at most every `every` seconds.
function announcer(el, every = 1.5) {
  let lastAt = -Infinity;
  let lastText = "";
  return (text, clock) => {
    if (text === lastText || clock - lastAt < every) return;
    lastAt = clock;
    lastText = text;
    el.textContent = text;
  };
}

return { params, THEMES, setupPage, follow, ease, run, dragY, announcer };
})();

const C = (() => {
// Layout self-check, run in the page with ?check=1 (scripts/check.mjs drives it headlessly).
// It writes a JSON report into <pre id="bp-check"> and to the console. A clean sheet reports
// zero failures in every category.
//
//   text-overlap      two pieces of lettering touch
//   text-on-geometry  lettering sits on a part or on another annotation's lines
//   outside-frame     an annotation or a view crosses the drawing frame
//   balloon-target    a balloon's dot is not on the part it names
//   balloon-on-geom   a balloon circle sits on a part
//   hard-colour       a fill or stroke is a literal colour instead of a token
//   sideways-scroll   the page scrolls horizontally

const roleOf = (el) => el.closest("[data-role]")?.dataset.role ?? "";

// A clipped group's box is its clip region's box (getBoundingClientRect ignores clipping).
function clippedBox(el) {
  const ref = el.getAttribute("clip-path")?.match(/url\(#([^)]+)\)/)?.[1];
  const shape = ref && document.getElementById(ref)?.firstElementChild;
  if (!shape) return el.getBoundingClientRect();
  const b = shape.getBBox();
  const m = shape.ownerSVGElement.getScreenCTM();
  const x0 = m.a * b.x + m.e;
  const y0 = m.d * b.y + m.f;
  return { left: x0, top: y0, right: x0 + m.a * b.width, bottom: y0 + m.d * b.height };
}

function selfCheck(svg) {
  const fails = [];
  const fail = (kind, what) => fails.push({ kind, what });
  const label = (el) => {
    const g = el.closest("[data-role],[data-part],[data-geom]");
    const name = g?.id || g?.dataset.part || g?.dataset.target || g?.dataset.role || g?.dataset.geom || el.tagName;
    return `${name}: "${(el.textContent || "").trim().slice(0, 24)}"`;
  };
  const shown = (el) => {
    const b = el.getBoundingClientRect();
    if (b.width < 0.5 || b.height < 0.5) return false;
    const cs = getComputedStyle(el);
    return cs.visibility !== "hidden" && cs.display !== "none" && Number(cs.opacity) > 0.05;
  };
  const texts = [...svg.querySelectorAll("text")].filter(shown);
  const boxes = texts.map((t) => t.getBoundingClientRect());
  const grow = 0.4;
  const hit = (a, b) => a.left < b.right - grow && b.left < a.right - grow && a.top < b.bottom - grow && b.top < a.bottom - grow;

  for (let i = 0; i < texts.length; i++)
    for (let j = i + 1; j < texts.length; j++) if (hit(boxes[i], boxes[j])) fail("text-overlap", `${label(texts[i])} × ${label(texts[j])}`);

  const geomOf = (el) => el.closest("[data-geom]");
  for (const [i, t] of texts.entries()) {
    const role = roleOf(t);
    if (role === "engraved" || role === "frame") continue;
    const own = t.closest("[data-role]");
    const b = boxes[i];
    const seen = new Set();
    for (let ix = 0; ix < 4; ix++)
      for (let iy = 0; iy < 2; iy++) {
        const x = b.left + b.width * (0.15 + ix * 0.233);
        const y = b.top + b.height * (0.3 + iy * 0.4);
        for (const el of document.elementsFromPoint(x, y)) {
          if (el === t || el.tagName === "text" || el.tagName === "svg" || el.closest("defs")) continue;
          if (el.classList.contains("tint") || el.classList.contains("hit") || el.closest('[data-role="phantom"]')) continue;
          if (own && own.contains(el)) continue;
          const g = geomOf(el);
          const other = el.closest("[data-role]");
          const bad = (g && !g.contains(t)) || (other && other !== own && other.dataset.role !== "frame" && other.dataset.role !== "chart-bg");
          if (bad && !el.classList.contains("sheet-bg") && !el.classList.contains("grid")) {
            const key = el.closest("[data-part],[data-role],[data-geom]");
            if (!seen.has(key)) {
              seen.add(key);
              fail("text-on-geometry", `${label(t)} on ${key?.dataset.part || key?.id || key?.dataset.role || key?.dataset.geom || el.tagName}`);
            }
          }
        }
      }
  }

  const frameRect = svg.querySelector('[data-role="frame"] rect.vis')?.getBoundingClientRect();
  if (frameRect) {
    for (const el of svg.querySelectorAll("[data-role]:not([data-role=frame]), [data-geom]")) {
      if (el.parentElement?.closest("[data-role]:not([data-role=frame]), [data-geom]")) continue;
      if (!shown(el)) continue;
      const b = clippedBox(el);
      const tol = 0.5;
      if (b.left < frameRect.left - tol || b.right > frameRect.right + tol || b.top < frameRect.top - tol || b.bottom > frameRect.bottom + tol)
        fail("outside-frame", el.id || el.dataset.geom || el.dataset.role);
    }
  }

  for (const g of svg.querySelectorAll('[data-role="balloon"]')) {
    if (!shown(g)) continue;
    const dot = g.querySelector("circle.dot").getBoundingClientRect();
    const x = dot.left + dot.width / 2;
    const y = dot.top + dot.height / 2;
    const target = g.dataset.target;
    const under = document.elementsFromPoint(x, y).some((el) => el.closest(`[data-part="${target}"]`));
    if (!under) fail("balloon-target", `balloon ${g.textContent.trim()} → ${target}`);
    const c = g.querySelector("circle.balloon").getBoundingClientRect();
    const pts = [
      [c.left + c.width * 0.5, c.top + c.height * 0.5],
      [c.left + c.width * 0.2, c.top + c.height * 0.5],
      [c.left + c.width * 0.8, c.top + c.height * 0.5],
      [c.left + c.width * 0.5, c.top + c.height * 0.2],
      [c.left + c.width * 0.5, c.top + c.height * 0.8],
    ];
    if (pts.some(([px, py]) => document.elementsFromPoint(px, py).some((el) => geomOf(el) && !el.classList.contains("tint") && !el.closest('[data-role="phantom"]'))))
      fail("balloon-on-geom", `balloon ${g.textContent.trim()}`);
  }

  for (const el of svg.querySelectorAll("[fill],[stroke]")) {
    if (el.closest("defs") && el.tagName !== "path" && el.tagName !== "circle") continue;
    for (const a of ["fill", "stroke"]) {
      const v = el.getAttribute(a);
      if (v && v !== "none" && !v.startsWith("url(") && v !== "currentColor") fail("hard-colour", `${el.tagName} ${a}=${v}`);
    }
  }

  if (document.documentElement.scrollWidth > window.innerWidth + 1) fail("sideways-scroll", `${document.documentElement.scrollWidth} > ${window.innerWidth}`);

  const kinds = ["text-overlap", "text-on-geometry", "outside-frame", "balloon-target", "balloon-on-geom", "hard-colour", "sideways-scroll"];
  const counts = Object.fromEntries(kinds.map((k) => [k, fails.filter((f) => f.kind === k).length]));
  const report = { ok: fails.length === 0, counts, fails, texts: texts.length, parts: svg.querySelectorAll("[data-part]").length };
  let pre = document.getElementById("bp-check");
  if (!pre) {
    pre = document.createElement("pre");
    pre.id = "bp-check";
    pre.hidden = true;
    document.body.append(pre);
  }
  pre.textContent = JSON.stringify(report);
  console.log("bp-check", JSON.stringify(report.counts));
  return report;
}

return { selfCheck };
})();

const M = (() => {
// Truth first: an overhead door closer, rack and pinion, EN 1154 size 3. Pure, no imports, no DOM.
// The geometry, the dimensions, the readout, the plan view and the chart all read this.
//
// Kinematics. Plan view, hinge axis at the origin, the closed door pointing to -u, opening into +v.
// The pinion spindle rides on the door; the main arm (L1) and forearm (L2) tie it to a shoe on the
// frame head. Opening the door turns the spindle by φ relative to the body; the pinion drives the
// rack and the piston x = r·φ into the spring.
//
// Hydraulics. Closing, the spring drives the piston back and pushes oil out of the pressure chamber.
// The oil can only return to the spring side through two needle valves: SWEEP (its port is in the
// bore and the piston face covers it in the last ~15°) and LATCH (its port is never covered). Each
// is a sharp-edged orifice, Q = Cd·A·√(2p/ρ), and p = F_spring / A_piston, so the piston speed and
// the door speed follow from the spring and the valve settings. Opening, the ball check valve in
// the piston lets the oil back freely.
//
// The debounce. A push reopens the door and restarts the whole closing. The door latches only after
// a quiet spell as long as the closing time from where it was left.

const rad = Math.PI / 180;

// ---------------------------------------------------------------- linkage (plan, mm)
const DOOR_W = 950; // leaf width, EN 1154 size 3: doors up to 950 mm
const DOOR_T = 44;
const SPINDLE_A = 215; // spindle from the hinge axis, along the leaf
const SPINDLE_S = 32; // spindle from the leaf face (half the body depth)
const L1 = 250; // main arm, spindle to elbow
const L2 = 220; // forearm, elbow to shoe
const SHOE = [-250, 10]; // forearm shoe on the frame head
const THETA_MAX = 110; // door stop, degrees
const PUSH_TO = 90; // a push opens the door this far

// ---------------------------------------------------------------- body, bore, piston (section, mm)
const BORE = 40;
const R_BORE = BORE / 2;
const AREA = Math.PI * R_BORE ** 2; // mm², the pressure face of the piston
const MODULE = 2.5;
const Z = 10;
const R_P = (MODULE * Z) / 2; // pinion pitch radius, 12.5 mm
const SHIFT = 0.3; // profile shift: ten teeth would undercut without it
const FACE_R = 62; // the piston's pressure face at x = 0 (door shut)
const PLUG_R = 67; // inner face of the pressure-side end plug
const PLUG_L = -160; // inner face of the spring-side end plug
const HEAD_L = -32; // the piston's spring face at x = 0

// ---------------------------------------------------------------- spring
const WIRE = 6; // EN 10270-1 SH
const COIL_D = 31; // mean diameter
const COILS = 14; // active
const G = 79300; // N/mm²
const K = (G * WIRE ** 4) / (8 * COIL_D ** 3 * COILS); // N/mm
const PRELOAD = 35; // compression at x = 0, mm
const springForce = (x) => K * (PRELOAD + x); // N
const springLength = (x) => HEAD_L - x - PLUG_L;

// ---------------------------------------------------------------- oil and valves
const RHO = 870; // kg/m³, ISO VG 15 hydraulic oil
const CD = 0.62;
const SEAT_D = 2.5; // needle seat, the end of the Ø2.5 drilling
const NEEDLE_HALF = 8; // needle half-angle, degrees
const PITCH = 0.5; // M5×0.5 regulating screws
const PORT_D = 2.5;
const SWEEP_U = 59.5; // sweep port centre: the piston face covers it near the end
const LATCH_U = 64.5; // latch port centre: between the piston and the plug, never covered
const SWEEP_SEAT = 56; // seat edges (where Ø3.5 steps to Ø2.5)
const LATCH_SEAT = 60;
const SWEEP_TURNS = 0.24; // screw 1 backed off from shut
const LATCH_TURNS = 0.1; // screw 2

// The annular throat between a cone of half-angle α lifted h off a sharp seat of diameter d.
function needleArea(h, d = SEAT_D, a = NEEDLE_HALF * rad) {
  if (h <= 0) return 0;
  const s = h * Math.sin(a);
  return Math.PI * s * (d - s * Math.cos(a));
}
const lift = (turns) => turns * PITCH;

// The part of a port of radius r whose centre is c to the left of the piston face that the face
// leaves open (the circular segment on the pressure side).
function portOpen(c, r = PORT_D / 2) {
  if (c >= r) return Math.PI * r * r;
  if (c <= -r) return 0;
  const k = -c;
  return r * r * Math.acos(k / r) - k * Math.sqrt(r * r - k * k);
}

const faceU = (x) => FACE_R - x;

// Flow areas (mm²) at piston position x: the latch valve always, the sweep valve while its port is
// open, the port and needle in series.
function areas(x, sweepTurns = SWEEP_TURNS, latchTurns = LATCH_TURNS) {
  const aS = needleArea(lift(sweepTurns));
  const aL = needleArea(lift(latchTurns));
  const port = portOpen(SWEEP_U - faceU(x));
  const sweep = port > 1e-9 && aS > 0 ? 1 / Math.sqrt(1 / aS ** 2 + 1 / port ** 2) : 0;
  return { sweep, latch: aL, total: sweep + aL, port };
}

const pressure = (x) => springForce(x) / AREA; // N/mm² = MPa
// Oil flow out of the pressure chamber, mm³/s, per valve and in total.
function flow(x, sweepTurns, latchTurns) {
  const a = areas(x, sweepTurns, latchTurns);
  const v = Math.sqrt((2 * pressure(x) * 1e6) / RHO) * 1000; // jet speed, mm/s
  return { sweep: CD * a.sweep * v, latch: CD * a.latch * v, total: CD * a.total * v, jet: v / 1000 };
}

// ---------------------------------------------------------------- linkage
function rawLink(theta, prevE) {
  const t = theta * rad;
  const d = [-Math.cos(t), Math.sin(t)];
  const n = [Math.sin(t), Math.cos(t)];
  const S = [SPINDLE_A * d[0] + SPINDLE_S * n[0], SPINDLE_A * d[1] + SPINDLE_S * n[1]];
  const dx = SHOE[0] - S[0];
  const dy = SHOE[1] - S[1];
  const D = Math.hypot(dx, dy);
  const a = (L1 * L1 - L2 * L2 + D * D) / (2 * D);
  const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const mx = S[0] + (a * dx) / D;
  const my = S[1] + (a * dy) / D;
  const E1 = [mx + (h * dy) / D, my - (h * dx) / D];
  const E2 = [mx - (h * dy) / D, my + (h * dx) / D];
  const near = (E) => (prevE ? Math.hypot(E[0] - prevE[0], E[1] - prevE[1]) : -E[1]);
  const E = near(E1) <= near(E2) ? E1 : E2;
  return { S, E, d, n, armDeg: Math.atan2(E[1] - S[1], E[0] - S[0]) / rad };
}

// Tabulate once (0.05° steps), following the elbow continuously from the shut door.
const STEP = 0.05;
const TABLE = (() => {
  const out = [];
  let prev = null;
  let last = null;
  for (let th = 0; th <= THETA_MAX + 1e-9; th += STEP) {
    const L = rawLink(th, prev);
    let rel = L.armDeg + th; // arm angle relative to the leaf (whose world angle is 180° − θ)
    if (last != null) {
      while (rel - last > 180) rel -= 360;
      while (rel - last < -180) rel += 360;
    }
    last = rel;
    prev = L.E;
    out.push(rel);
  }
  const r0 = out[0];
  return out.map((v) => v - r0);
})();

// Spindle rotation φ (degrees) for a door angle θ (degrees), and its slope dφ/dθ.
function phi(theta) {
  const f = Math.min(TABLE.length - 1.001, Math.max(0, theta / STEP));
  const i = Math.floor(f);
  return TABLE[i] + (TABLE[i + 1] - TABLE[i]) * (f - i);
}
function ratio(theta) {
  const t = Math.min(THETA_MAX - 0.1, Math.max(0.05, theta));
  return (phi(t + 0.05) - phi(t - 0.05)) / 0.1;
}
// The inverse: door angle for a spindle rotation.
function thetaOf(phiDeg) {
  let lo = 0;
  let hi = THETA_MAX;
  for (let i = 0; i < 40; i++) {
    const mid = (lo + hi) / 2;
    if (phi(mid) < phiDeg) lo = mid;
    else hi = mid;
  }
  return (lo + hi) / 2;
}
const xOf = (theta) => R_P * phi(theta) * rad; // rack travel, mm
const X_MAX = xOf(THETA_MAX);

// Elbow and spindle in plan for a door angle.
function link(theta) {
  let prev = null;
  // follow the branch from shut in coarse steps so the elbow is the same one the table used
  for (let th = 0; th < theta; th += 5) prev = rawLink(th, prev).E;
  return rawLink(theta, prev);
}

// Closing moment at the door, N·m: spring force on the pinion pitch circle, through the linkage.
const springTorque = (x) => (springForce(x) * R_P) / 1000;
const doorMoment = (theta) => springTorque(xOf(theta)) * ratio(theta);

// Door speed while closing, deg/s (negative): piston speed from the oil flow, through r and dφ/dθ.
function closingRate(theta, sweepTurns, latchTurns) {
  const x = xOf(theta);
  const v = flow(x, sweepTurns, latchTurns).total / AREA; // mm/s
  const dphi = v / R_P / rad; // deg/s at the spindle
  return -dphi / ratio(theta);
}

// Time to shut from θ with no further pushes (the debounce interval), s. Tabulated.
const CLOSE = (() => {
  const out = [0];
  let t = 0;
  const h = 0.05;
  for (let th = h; th <= THETA_MAX + 1e-9; th += h) {
    const mid = th - h / 2;
    t += h / -closingRate(Math.max(0.02, mid));
    out.push(t);
  }
  return out;
})();
function closeTime(theta) {
  const f = Math.min(CLOSE.length - 1.001, Math.max(0, theta / 0.05));
  const i = Math.floor(f);
  return CLOSE[i] + (CLOSE[i + 1] - CLOSE[i]) * (f - i);
}
// The angle at which the piston face starts to cover the sweep port (the latch zone below it).
const LATCH_ZONE = (() => {
  const xs = FACE_R - SWEEP_U + PORT_D / 2;
  return thetaOf((xs / R_P) / rad);
})();

// ---------------------------------------------------------------- the door, stepped in time
function door() {
  return { theta: 0, x: 0, push: false, sinceStop: 0, latched: true, q: { sweep: 0, latch: 0, total: 0 }, p: 0, opening: 0 };
}

// Advance h seconds. want: the angle a hand holds the door at, or null when nobody touches it.
function advance(s, h, want, rate = 260) {
  const before = s.theta;
  if (want != null && want > s.theta - 0.01) {
    // a hand opens the door (or holds it): the check valve lets the oil back, no damping
    s.theta = Math.min(want, s.theta + rate * h);
    if (want < s.theta) s.theta = want;
    s.q = { sweep: 0, latch: 0, total: 0, jet: 0 };
  } else if (s.theta > 0) {
    const r = closingRate(s.theta);
    s.theta = Math.max(0, s.theta + r * h);
    if (want != null) s.theta = Math.max(s.theta, want);
    s.q = flow(xOf(s.theta));
  } else {
    s.q = { sweep: 0, latch: 0, total: 0, jet: 0 };
  }
  s.theta = Math.min(THETA_MAX, s.theta);
  s.x = xOf(s.theta);
  s.opening = (s.theta - before) / h; // deg/s, + opening
  s.p = s.theta > 0 && s.opening <= 0 ? pressure(s.x) : 0;
  s.latched = s.theta <= 0;
  return s;
}

return { DOOR_W, DOOR_T, SPINDLE_A, SPINDLE_S, L1, L2, SHOE, THETA_MAX, PUSH_TO, BORE, R_BORE, AREA, MODULE, Z, R_P, SHIFT, FACE_R, PLUG_R, PLUG_L, HEAD_L, WIRE, COIL_D, COILS, G, K, PRELOAD, springForce, springLength, RHO, CD, SEAT_D, NEEDLE_HALF, PITCH, PORT_D, SWEEP_U, LATCH_U, SWEEP_SEAT, LATCH_SEAT, SWEEP_TURNS, LATCH_TURNS, needleArea, lift, portOpen, faceU, areas, pressure, flow, phi, ratio, thetaOf, xOf, X_MAX, link, springTorque, doorMoment, closingRate, closeTime, LATCH_ZONE, door, advance };
})();

const X = (() => {
// Local helpers the shared kit lacks: an involute pinion, a rack, an angular dimension and a
// cutting-plane line. Pure, world mm in, SVG strings or point lists out, like kit/draft.mjs.


const rad = Math.PI / 180;
const inv = (a) => Math.tan(a) - a;

// Spur gear outline (world points), z teeth of module m, 20° pressure angle, centre (cu, cv),
// one tooth centred at angle rot (degrees, counter-clockwise). shift: profile shift coefficient;
// the tip stays at rp + m (tip shortened), the root moves out with the shift.
function gear(cu, cv, z, m, rot = 90, shift = 0, steps = 6) {
  const rp = (m * z) / 2;
  const rb = rp * Math.cos(20 * rad);
  const ra = rp + m;
  const rf = rp - (1.25 - shift) * m;
  const half = (r) => Math.PI / (2 * z) + (2 * shift * Math.tan(20 * rad)) / z + inv(20 * rad) - inv(Math.acos(Math.min(1, rb / r)));
  const pts = [];
  const at = (r, a) => [cu + r * Math.cos(a), cv + r * Math.sin(a)];
  const pitch = (2 * Math.PI) / z;
  for (let i = 0; i < z; i++) {
    const c = rot * rad + i * pitch;
    const hb = half(rb);
    // root arc from the middle of the gap before this tooth
    const g0 = c - pitch / 2;
    for (let j = 0; j <= 2; j++) pts.push(at(rf, g0 + ((c - hb - g0) * j) / 2));
    // right flank up (clockwise side), tip, left flank down
    for (let j = 0; j <= steps; j++) {
      const r = rb + ((ra - rb) * j) / steps;
      pts.push(at(r, c - half(r)));
    }
    for (let j = steps; j >= 0; j--) {
      const r = rb + ((ra - rb) * j) / steps;
      pts.push(at(r, c + half(r)));
    }
    for (let j = 0; j <= 2; j++) pts.push(at(rf, c + hb + ((c + pitch / 2 - c - hb) * j) / 2));
  }
  return pts;
}

// A rack along u, teeth pointing to -v (toward a pinion below), pitch line at v = vp.
// Returns the toothed edge from u0 to u1 on the root line, gaps centred at u = 0 + k·p.
function rackEdge(u0, u1, vp, m) {
  const p = Math.PI * m;
  const tan = Math.tan(20 * rad);
  const ha = m;
  const hf = 1.25 * m;
  const tipHalf = p / 4 - ha * tan;
  const rootHalf = p / 4 + hf * tan;
  const out = [[u0, vp + hf]];
  for (let k = Math.floor(u0 / p) - 1; k <= Math.ceil(u1 / p) + 1; k++) {
    const c = p / 2 + k * p; // tooth centre
    if (c - rootHalf < u0 + 0.3 || c + rootHalf > u1 - 0.3) continue;
    out.push([c - rootHalf, vp + hf], [c - tipHalf, vp - ha], [c + tipHalf, vp - ha], [c + rootHalf, vp + hf]);
  }
  out.push([u1, vp + hf]);
  return out;
}

// An angular dimension: an arc of sheet radius R about world point c from world angle a0 to a1
// (degrees, counter-clockwise), arrows at both ends, text centred outside the arc. When the arc is
// too short the arrows go outside pointing in and the text sits beyond a1.
function angleDim(V, c, R, a0, a1, text, { id = "" } = {}) {
  // text that does not fit goes beyond the a0 end
  const [cx, cy] = V.p(c);
  const pt = (a, r = R) => [K.r2(cx + r * Math.cos(-a * rad)), K.r2(cy + r * Math.sin(-a * rad))];
  const lo = Math.min(a0, a1);
  const hi = Math.max(a0, a1);
  const span = ((hi - lo) * rad) * R;
  const tw = K.textWidth(text);
  const inside = span >= K.ARROW * 2 + 4;
  const textIn = span >= tw + K.ARROW * 2 + 10;
  const arcPts = (from, to) => {
    const n = Math.max(2, Math.ceil(Math.abs(to - from) / 3));
    let s = "";
    for (let i = 0; i <= n; i++) {
      const [x, y] = pt(from + ((to - from) * i) / n);
      s += `${i ? "L" : "M"}${x} ${y}`;
    }
    return s;
  };
  const ext = (K.ARROW + 6) / R / rad;
  const textGap = (tw / 2 + K.ARROW + 12) / R / rad;
  let path = inside ? arcPts(lo, hi) : arcPts(lo - ext, hi + ext);
  const head = (a, dir) => {
    // tangent direction on the sheet for increasing angle is (-sin, -cos) of the world angle
    const [x, y] = pt(a);
    const t = [-Math.sin(a * rad) * dir, -Math.cos(a * rad) * dir];
    const ux = t[0];
    const uy = t[1];
    const bx = x - ux * K.ARROW;
    const by = y - uy * K.ARROW;
    const h = K.ARROW * 0.25;
    return `M${x} ${y}L${K.r2(bx - uy * h)} ${K.r2(by + ux * h)}L${K.r2(bx + uy * h)} ${K.r2(by - ux * h)}Z`;
  };
  const heads = inside ? head(lo, -1) + head(hi, 1) : head(lo, 1) + head(hi, -1);
  let ta = (lo + hi) / 2;
  if (!textIn) {
    const sgn = a0 <= a1 ? -1 : 1;
    ta = a0 + sgn * textGap;
    path += arcPts(a0 + sgn * ext, ta + sgn * textGap * 0.6);
  }
  const [tx, ty] = pt(ta, R + 8);
  return (
    `<g data-role="dim"${id ? ` id="${id}"` : ""}><path class="thin" d="${path}"/><path class="head" d="${heads}"/>` +
    `<text class="t" x="${tx}" y="${K.r2(ty + 3.4)}" text-anchor="middle">${text}</text></g>`
  );
}

// A cutting-plane line across a view: thin chain, thick at the ends, arrows giving the direction
// of view, a letter at each end. a, b: world end points; dir: the sheet direction of the arrows.
function cuttingPlane(V, a, b, [dx, dy], letter) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const len = Math.hypot(bx - ax, by - ay);
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  const thick = 12;
  const arrowLen = 16;
  let out = `<path class="ctr" d="M${ax} ${ay}L${bx} ${by}"/>`;
  out += `<path class="vis" d="M${ax} ${ay}L${K.r2(ax + ux * thick)} ${K.r2(ay + uy * thick)}M${bx} ${by}L${K.r2(bx - ux * thick)} ${K.r2(by - uy * thick)}"/>`;
  let heads = "";
  let letters = "";
  for (const [x, y, end] of [[ax + ux * 4, ay + uy * 4, -1], [bx - ux * 4, by - uy * 4, 1]]) {
    const tx = x + dx * arrowLen;
    const ty = y + dy * arrowLen;
    out += `<path class="thin" d="M${K.r2(x)} ${K.r2(y)}L${K.r2(tx - dx * K.ARROW)} ${K.r2(ty - dy * K.ARROW)}"/>`;
    const h = K.ARROW * 0.25;
    const bx2 = tx - dx * K.ARROW;
    const by2 = ty - dy * K.ARROW;
    heads += `M${K.r2(tx)} ${K.r2(ty)}L${K.r2(bx2 - dy * h)} ${K.r2(by2 + dx * h)}L${K.r2(bx2 + dy * h)} ${K.r2(by2 - dx * h)}Z`;
    // the letter sits beside the arrow, beyond the end of the line
    letters += `<text class="t t-lg" x="${K.r2(x + dx * arrowLen * 0.55 + ux * end * 9)}" y="${K.r2(y + dy * arrowLen * 0.55 + uy * end * 9 + 4.2)}" text-anchor="middle">${letter}</text>`;
  }

let offS = 0; // flow-line dash offsets, from the volume through each needle
let offL = 0;
let quiet = 0; // seconds since the last touch
let chartT = 0; // time on DIAGRAM 1
let now = [];
let prev = [];
let marks = [];
let held = false;

// The tour: three quick pushes 2.4 s apart, then quiet; the door shuts, waits, and it repeats.
const PERIOD = 15;
const PUSHES = [0.5, 2.9, 5.3];
let tourT = 0;
let wasTouring = true;

function startPush() {
  push = { phase: "open", t: 0 };
  marks.push(chartT);
  quiet = 0;
}

function shutNow() {
  s.theta = 0;
  M.advance(s, 1e-3, null);
  push = null;
  hand = null;
}

// ---------------------------------------------------------------- step
function step(dt, live) {
  const n = Math.max(1, Math.ceil(dt * 480));
  const h = dt / n;
  if (live.touring && !wasTouring) {
    // the tour takes over again: start its cycle and the diagram afresh
    tourT = 0;
    chartT = 0;
    prev = now;
    now = [];
    marks = [];
  }
  wasTouring = live.touring;
  for (let i = 0; i < n; i++) {
    if (live.touring && !dragging) {
      const before = tourT;
      tourT += h;
      if (tourT >= PERIOD) {
        tourT -= PERIOD;
        chartT = 0;
        prev = now;
        now = [];
        marks = [];
      }
      for (const tp of PUSHES) if (before < tp && tourT >= tp) startPush();
    }
    // a push opens the door to PUSH_TO, holds it a moment and lets go
    if (push) {
      push.t += h;
      if (push.phase === "open" && s.theta >= M.PUSH_TO - 0.05) push = { phase: "hold", t: 0 };
      else if (push.phase === "hold" && push.t > 0.25) push = null;
    }
    const want = dragging ? hand : push ? M.PUSH_TO : null;
    M.advance(s, h, want);
    held = want != null;
    if (held) quiet = 0;
    else quiet += h;
    lift = L.follow(lift, s.opening > 1 ? Math.min(1, s.opening / 120) : 0, s.opening > 1 ? 50 : 25, h);
    const sc = 0.004; // sheet units of dash travel per mm³ of oil
    offS += s.q.sweep * h * sc;
    offL += s.q.latch * h * sc;
    chartT += h;
  }
  if (!live.touring && chartT >= PERIOD) {
    chartT -= PERIOD;
    prev = now;
    now = [];
    marks = [];
  }
  const mode = held ? 1 : s.theta > 0 ? 2 : 0;
  const last = now[now.length - 1];
  if (!last || chartT - last[0] > 0.03 || last[2] !== mode) now.push([chartT, s.theta, mode]);
  return held || s.theta > 0 || lift > 1e-3;
}

// ---------------------------------------------------------------- render
const cx = (t) => K.r2(CH.x0 + (Math.min(CH.tMax, t) / CH.tMax) * (CH.x1 - CH.x0));
const cy = (a) => K.r2(CH.y1 - (Math.min(CH.aMax, Math.max(0, a)) / CH.aMax) * (CH.y1 - CH.y0));
function tracePaths(list) {
  // split the trace into held (thick ink) and oil-closing (accent) runs; shut runs go with closing
  let push = "";
  let close = "";
  for (let i = 1; i < list.length; i++) {
    const [t0, a0] = list[i - 1];
    const [t1, a1, m1] = list[i];
    if (t1 < t0) continue;
    const seg = `M${cx(t0)} ${cy(a0)}L${cx(t1)} ${cy(a1)}`;
    if (m1 === 1) push += seg;
    else close += seg;
  }
  return { push, close };
}
const all = (list) => list.map(([t, a], i) => `${i ? "L" : "M"}${cx(t)} ${cy(a)}`).join("");

let shown = { theta: -1, x: -1, lift: -1 };
function render(live) {
  const x = s.x;
  const phi = M.phi(s.theta);
  if (Math.abs(x - shown.x) > 1e-4) {
    for (const [node, V] of el.mv) node.setAttribute("transform", `translate(${K.r2(-x * V.k)} 0)`);
    el.mvb.setAttribute("transform", `translate(${K.r2(-x * VM.k)} 0)`);
    el.spring.innerHTML = P.spring(VM, x);
    el.pinion.setAttribute("transform", `rotate(${K.r2(-phi)} ${pcx} ${pcy})`);
    for (const [node, V] of el.oilHi) node.setAttribute("d", P.oilPath(V, P.oilHigh(x)));
    for (const [node, V] of el.oilLo) node.setAttribute("d", P.oilPath(V, P.oilLow(x)));
    for (const [node, V] of el.flowS) node.setAttribute("d", K.d(V, P.flowSweep(x), false));
    el.dimX.innerHTML = K.dim(VM, [M.FACE_R, 20], [M.FACE_R - x, 20], { dir: "h", off: -40, text: `x=${x.toFixed(1)}`, id: "dim-x" });
    shown.x = x;
  }
  if (Math.abs(s.theta - shown.theta) > 1e-3) {
    el.plan.innerHTML = P.planMoving(VE, s.theta);
    el.theta.innerHTML = X.angleDim(VE, [0, 0], 150, 180 - s.theta, 180, `θ=${Math.round(s.theta)}°`, { id: "dim-theta" });
    el.planB.innerHTML = planBalloons(s.theta);
    shown.theta = s.theta;
  }
  if (Math.abs(lift - shown.lift) > 0.003) {
    for (const [node, V] of el.balls) node.innerHTML = P.ball(V, lift);
    shown.lift = lift;
  }
  const pMax = M.pressure(M.X_MAX);
  const op = K.r2(0.16 + 0.84 * Math.min(1, s.p / pMax));
  for (const [node] of el.oilHi) node.setAttribute("fill-opacity", op);
  el.oilHiF.setAttribute("fill-opacity", op);
  const qs = M.flow(M.X_MAX).sweep;
  const ql = M.flow(M.X_MAX).latch;
  for (const [node] of el.flowS) {
    node.setAttribute("stroke-opacity", K.r2(Math.min(1, s.q.sweep / (0.6 * qs))));
    node.style.strokeDashoffset = K.r2(-offS);
  }
  for (const node of el.flowL) {
    node.setAttribute("stroke-opacity", K.r2(Math.min(1, s.q.latch / (0.6 * ql))));
    node.style.strokeDashoffset = K.r2(-offL);
  }

  // DIAGRAM 1
  const tp = tracePaths(now);
  el.c1push.setAttribute("d", tp.push);
  el.c1close.setAttribute("d", tp.close);
  el.c1prev.setAttribute("d", all(prev.filter(([t]) => t > chartT + 0.4)));
  el.c1marks.setAttribute("d", marks.map((t) => `M${cx(t)} ${CH.y0 - 1.5}l-3.2 -5.6h6.4Z`).join(""));
  el.c1dot.setAttribute("cx", cx(chartT));
  el.c1dot.setAttribute("cy", cy(s.theta));
  const left = M.closeTime(s.theta);
  const due = chartT + left;
  el.c1due.setAttribute("d", !held && s.theta > 0 && due <= CH.tMax ? `M${cx(due)} ${CH.y0}V${CH.y1}` : "");
  // DIAGRAM 2
  el.d2dot.setAttribute("cx", K.r2(D2.x0 + (s.theta / D2.aMax) * (D2.x1 - D2.x0)));
  el.d2dot.setAttribute("cy", K.r2(D2.y1 - (left / D2.tMax) * (D2.y1 - D2.y0)));

  const state = held ? "HELD" : s.theta > 0.05 ? (s.x < M.FACE_R - M.SWEEP_U + M.PORT_D / 2 ? "LATCH" : "SWEEP") : "SHUT";
  const qcm = s.q.total / 1000;
  const text =
    s.theta > 0.05
      ? `θ ${Math.round(s.theta)}° · x ${x.toFixed(1)} mm · p ${(s.p * 10).toFixed(1)} bar · Q ${qcm.toFixed(1)} cm³/s · ${state} · SHUT IN ${held ? "—" : left.toFixed(1) + " s"}`
      : `SHUT · QUIET ${Math.min(99, quiet).toFixed(1)} s · SPRING ${Math.round(M.springForce(0))} N · ${Math.round(M.doorMoment(0))} N·m`;
  el.readout.textContent = text;
  say(s.theta > 0 ? `Door at ${Math.round(s.theta)} degrees, ${held ? "held open" : `shuts in ${left.toFixed(1)} seconds`}.` : "Door shut.", live.clock);
}

const PB = [[21,648],[16,676],[17,704],[20,732],[19,760]];
function planBalloons(theta) {
  const Lk = M.link(theta);
  const along = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  const at = {
    21: P.doorFrame(theta)([330, -22]),
    16: along(Lk.S, Lk.E, 0.62),
    17: along(Lk.E, M.SHOE, 0.5),
    20: [Lk.E[0] + 2, Lk.E[1] + 1],
    19: [Lk.S[0] + 1.5, Lk.S[1] + 1.5],
  };
  return PB.map(([n, y]) => K.balloon(VE, at[n], [414, y], n, { target: n })).join("");
}

// ---------------------------------------------------------------- input
const live = L.run({
  root: svg,
  step,
  render,
  idleAfter: 8,
  onFrozen: () => q.check && C.selfCheck(svg),
});

if (live.reduced && !live.frozen) {
  // A still, true moment: the tour played to 6.4 s (after the last push, closing), drawn once.
  const fake = { touring: true, reduced: false, clock: 0 };
  for (let t = 0; t < 6.4; t += 1 / 240) step(1 / 240, fake);
  render(live);
}

const toSheet = (e) => {
  const m = svg.getScreenCTM();
  if (!m) return [0, 0];
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
  return [p.x, p.y];
};
const [hx, hy] = VE.p([0, 0]);
const angleAt = (e) => {
  const [x, y] = toSheet(e);
  const a = (Math.atan2(hy - y, hx - x) * 180) / Math.PI;
  return Math.min(M.THETA_MAX, Math.max(0, a < -90 ? a + 360 : a));
};

const planHit = svg.querySelector('[data-drag="plan"]');
let pid = null;
planHit.addEventListener("pointerdown", (e) => {
  pid = e.pointerId;
  planHit.setPointerCapture(pid);
  dragging = true;
  push = null;
  hand = angleAt(e);
  if (hand > s.theta + 0.5) marks.push(chartT);
  live.input();
  e.preventDefault();
});
planHit.addEventListener("pointermove", (e) => {
  if (e.pointerId !== pid) return;
  hand = angleAt(e);
  live.input();
});
const release = (e) => {
  if (e.pointerId !== pid) return;
  pid = null;
  dragging = false;
  hand = null;
  live.input();
};
planHit.addEventListener("pointerup", release);
planHit.addEventListener("pointercancel", release);

svg.querySelector("[data-push]").addEventListener("click", () => {
  startPush();
  live.input();
});

svg.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === " " || k === "Enter") startPush();
  else if (k === "r" || k === "R") shutNow();
  else if (k === "s" || k === "S") live.slow = live.slow === 1 ? 0.25 : live.slow === 0.25 ? 0.06 : 1;
  else return;
  e.preventDefault();
  live.input();
});

if (q.check && !live.frozen) setTimeout(() => C.selfCheck(svg), 400);

</script>
</body>
</html>
