<!doctype html>
<html lang="en" data-theme="blueprint">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wing Flaps</title>
<meta name="description" content="A live engineering drawing of a light aircraft's electric single-slotted flaps: the wing cut through a flap track whose curved slot first slides the flap aft and then turns it down, opening the slot; the 28 V actuator, jackscrew and limit switches in section; the bellcranks, rods and crossed cables in plan; the cockpit selector's follow-up; and the lift curves and stall speeds the flap buys, all from one model.">
<style>
/* Blueprint sheet styles. Every colour a drawing uses is one of these tokens. */

:root,
[data-theme="blueprint"] {
  --bp-page: #0a2747;
  --bp-paper: #123b69;
  --bp-ink: #e9f1ff;
  --bp-hatch: rgba(214, 230, 255, 0.72);
  --bp-muted: #95b3da;
  --bp-grid: rgba(190, 215, 255, 0.07);
  --bp-accent: #ffc94d;
  --bp-accent-ink: #ffd77a;
  --bp-ui: rgba(233, 241, 255, 0.12);
  /* 3D mode (solid3d.mjs): uncut surfaces in three tones, lit, mid and shadow */
  --bp3-lit: #2a5a93;
  --bp3-mid: #1d4a7e;
  --bp3-dark: #133864;
}
[data-theme="paper"] {
  --bp-page: #e4dfd1;
  --bp-paper: #f7f3e8;
  --bp-ink: #1c2633;
  --bp-hatch: rgba(28, 38, 51, 0.78);
  --bp-muted: #616b78;
  --bp-grid: rgba(28, 38, 51, 0.045);
  --bp-accent: #d4472c;
  --bp-accent-ink: #b8361e;
  --bp-ui: rgba(28, 38, 51, 0.08);
  --bp3-lit: #ece6d8;
  --bp3-mid: #d9d0bc;
  --bp3-dark: #bdb29b;
}
[data-theme="white"] {
  --bp-page: #fafafa;
  --bp-paper: #fafafa;
  --bp-ink: #262626;
  --bp-hatch: rgba(38, 38, 38, 0.42);
  --bp-muted: #8f8f8f;
  --bp-grid: rgba(0, 0, 0, 0);
  --bp-accent: #e2552c;
  --bp-accent-ink: #c8442b;
  --bp-ui: rgba(0, 0, 0, 0.07);
  --bp3-lit: #f1f1f0;
  --bp3-mid: #e0e0de;
  --bp3-dark: #c4c4c1;
}
[data-theme="dark"] {
  --bp-page: #0d0f12;
  --bp-paper: #15181c;
  --bp-ink: #dde3ea;
  --bp-hatch: rgba(221, 227, 234, 0.62);
  --bp-muted: #86919d;
  --bp-grid: rgba(221, 227, 234, 0.035);
  --bp-accent: #f29f3d;
  --bp-accent-ink: #f6b462;
  --bp-ui: rgba(221, 227, 234, 0.08);
  --bp3-lit: #353b43;
  --bp3-mid: #272c32;
  --bp3-dark: #1b1e22;
}

:root {
  --bp-thick: 1.15px;
  --bp-thin: 0.55px;
  --bp-font: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}

html,
body {
  margin: 0;
  background: var(--bp-page);
  color: var(--bp-ink);
  font-family: var(--bp-font);
}
.bp-page {
  max-width: 1480px;
  margin: 0 auto;
  padding: 24px 16px 40px;
  box-sizing: border-box;
}
.bp-figure {
  margin: 0;
}
.bp-sheet {
  display: block;
  width: 100%;
  height: auto;
  outline: none;
  border-radius: 2px;
}
.bp-sheet:focus-visible {
  box-shadow: 0 0 0 2px var(--bp-accent);
}
.bp-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  font-size: 12px;
  color: var(--bp-muted);
  letter-spacing: 0.03em;
}
.bp-bar kbd {
  font: inherit;
  color: var(--bp-ink);
  border: 1px solid var(--bp-ui);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 0 4px;
}
.bp-themes {
  display: flex;
  gap: 4px;
}
.bp-themes button {
  font: inherit;
  color: var(--bp-muted);
  background: transparent;
  border: 1px solid var(--bp-ui);
  border-radius: 3px;
  padding: 3px 9px;
  cursor: pointer;
}
.bp-themes button[aria-pressed="true"] {
  color: var(--bp-ink);
  background: var(--bp-ui);
}
.bp-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Zoom mode (?zoom=x,y,w,h): the region fills the window, for close-up checks. */
body.bp-zoom .bp-page {
  max-width: none;
  padding: 0;
}
body.bp-zoom .bp-sheet {
  width: 100vw;
  height: 100vh;
}
body.bp-zoom .bp-bar {
  display: none;
}

/* ---- the drawing */
.bp-sheet .sheet-bg {
  fill: var(--bp-paper);
}
.bp-sheet .grid {
  fill: none;
  stroke: var(--bp-grid);
  stroke-width: 0.5px;
}
.bp-sheet .vis,
.bp-sheet .thin,
.bp-sheet .hid,
.bp-sheet .ctr,
.bp-sheet .phan {
  fill: none;
  stroke: var(--bp-ink);
  stroke-linejoin: round;
  stroke-linecap: round;
}
.bp-sheet .vis {
  stroke-width: var(--bp-thick);
}
.bp-sheet .thin,
.bp-sheet .hid,
.bp-sheet .ctr,
.bp-sheet .phan {
  stroke-width: var(--bp-thin);
}
.bp-sheet .hid {
  stroke-dasharray: 4 2.2;
  stroke-linecap: butt;
}
.bp-sheet .ctr {
  stroke-dasharray: 15 2.6 2 2.6;
  stroke-linecap: butt;
}
.bp-sheet .phan {
  stroke-dasharray: 13 2.4 1.8 2.4 1.8 2.4;
  stroke-linecap: butt;
}
.bp-sheet .vis.spring {
  stroke-width: var(--bp-thin);
}
.bp-sheet .paper,
.bp-sheet .balloon {
  fill: var(--bp-paper);
}
.bp-sheet .balloon {
  stroke: var(--bp-ink);
  stroke-width: var(--bp-thin);
}
.bp-sheet .solid,
.bp-sheet .head,
.bp-sheet .dot {
  fill: var(--bp-ink);
}
.bp-sheet .hl {
  fill: none;
  stroke: var(--bp-hatch);
  stroke-width: 0.5px;
}
.bp-sheet .hl-dash {
  stroke-dasharray: 1.3 1.3;
}
.bp-sheet .hd {
  fill: var(--bp-hatch);
}
.bp-sheet .tint {
  fill: var(--bp-accent);
}
.bp-sheet .accent {
  stroke: var(--bp-accent);
}
.bp-sheet .accent-fill {
  fill: var(--bp-accent);
}
.bp-sheet .t {
  font-family: var(--bp-font);
  font-size: 9.5px;
  fill: var(--bp-ink);
  letter-spacing: 0.02em;
}
.bp-sheet .t-sm {
  font-size: 7.6px;
}
.bp-sheet .t-lg {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
}
.bp-sheet .t-xl {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.05em;
}
.bp-sheet .t-cap {
  font-size: 6.2px;
  fill: var(--bp-muted);
  letter-spacing: 0.08em;
}
.bp-sheet .t-head {
  font-weight: 600;
  letter-spacing: 0.06em;
}
.bp-sheet .t-mute {
  fill: var(--bp-muted);
}
.bp-sheet .t-accent {
  fill: var(--bp-accent-ink);
}
.bp-sheet [data-drag] {
  cursor: ns-resize;
  touch-action: none;
}

/* ---- part cards (kit/info.mjs): hover, tap or focus a balloon */
[data-role="balloon"][tabindex], #ov g[data-part] { cursor: pointer; }
#ov g[data-part] { pointer-events: auto; }
[data-role="balloon"]:hover .balloon, [data-role="balloon"]:focus .balloon, #ov g[data-part]:hover .balloon { stroke: var(--bp-accent); stroke-width: 1.6px; }
[data-role="balloon"]:focus { outline: none; }
.bp-hl .vis, .bp-hl .thin, .bp-hl path, .bp-hl circle, .bp-hl polygon, .bp-hl rect { stroke: var(--bp-accent) !important; }
.bp-hl .vis { stroke-width: calc(var(--bp-thick) * 1.8) !important; }
.bp-card {
  position: absolute; z-index: 50; max-width: 280px; padding: 10px 12px 11px; box-sizing: border-box;
  background: var(--bp-paper); color: var(--bp-ink); border: 1px solid var(--bp-ink); border-radius: 3px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, .14); font: 12px/1.45 var(--bp-font); pointer-events: auto;
}
.bp-card[hidden] { display: none; }
.bp-card-h { display: flex; gap: 8px; align-items: center; }
.bp-card-h b { font-weight: 600; letter-spacing: .02em; text-transform: uppercase; font-size: 11.5px; }
.bp-card-n { flex: none; display: inline-grid; place-items: center; width: 20px; height: 20px; border: 1px solid var(--bp-ink); border-radius: 50%; font-size: 10.5px; }
.bp-card-s { margin: 4px 0 0 28px; color: var(--bp-muted); font-size: 10.5px; letter-spacing: .02em; }
.bp-card p { margin: 7px 0 0; font-size: 11.5px; line-height: 1.5; }
.bp-card-x { margin-top: 7px; color: var(--bp-muted); font-size: 9.5px; letter-spacing: .03em; }

/* ---- the sheet's link to its 3D view */
.bp-3d { font: inherit; color: var(--bp-paper); background: var(--bp-ink); text-decoration: none; border-radius: 3px; padding: 4px 10px; letter-spacing: .03em; white-space: nowrap; }
.bp-3d:hover, .bp-3d:focus-visible { background: var(--bp-accent); color: #fff; outline: none; }

/* ---- atlas (references/atlas.md): doorways, breadcrumb */
.bp-card-i { font-family: var(--bp-font); font-style: italic; color: var(--bp-muted); }
.bp-card-go { display: inline-block; margin-top: 8px; color: var(--bp-paper); background: var(--bp-ink); text-decoration: none; border-radius: 3px; padding: 3px 9px; font-size: 11px; letter-spacing: .03em; }
.bp-card-go:hover, .bp-card-go:focus-visible { background: var(--bp-accent); color: #fff; outline: none; }
.bp-card-wip { margin-top: 7px; color: var(--bp-muted); font-size: 10.5px; letter-spacing: .03em; }
.bp-crumbs { display: flex; flex-wrap: wrap; gap: 4px 7px; align-items: center; letter-spacing: .04em; }
.bp-crumbs a { color: var(--bp-ink); text-decoration: none; border-bottom: 1px solid var(--bp-ui); }
.bp-crumbs a:hover, .bp-crumbs a:focus-visible { color: var(--bp-accent); border-color: currentColor; outline: none; }
.bp-crumbs i { font-style: normal; color: var(--bp-muted); }
.bp-crumbs [aria-current] { color: var(--bp-ink); }
.bp-doors { position: fixed; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); z-index: 40; }
.bp-doors:focus-within { width: auto; height: auto; clip-path: none; left: 22px; top: 54px; display: flex; flex-direction: column; gap: 3px; padding: 6px; background: var(--bp-paper); border: 1px solid var(--bp-ink); border-radius: 3px; }
.bp-doors button { font: 11px/1.3 var(--bp-font); text-align: left; color: var(--bp-ink); background: transparent; border: 1px solid var(--bp-ui); border-radius: 3px; padding: 3px 8px; cursor: pointer; }
.bp-doors button:focus-visible { outline: none; border-color: var(--bp-accent); color: var(--bp-accent); }
.bp-doors button[aria-disabled="true"] { color: var(--bp-muted); }
.bp-flying { pointer-events: none; }

.bp-sheet .hit{fill:transparent}.bp-sheet [data-drag]{cursor:grab}.bp-sheet .grid-line{stroke:var(--bp-grid);stroke-width:.6px}.bp-sheet .flow{fill:none;stroke:var(--bp-accent);stroke-width:1px;stroke-linejoin:round}.bp-sheet .flow-head{fill:var(--bp-accent)}
</style>
</head>

<script>
"use strict";
const K = (() => {
// Blueprint drafting kit: orthographic views, sections, hatching, dimensions and sheet furniture.
// Every function here is pure and returns SVG markup strings, so the same code runs in the build
// and, inlined, in the page (live dimensions, moving springs, needles).
//
// Units. World geometry is in millimetres of the real object: u to the right, v up (a front view),
// or u right, v away from the viewer (a plan view). The sheet is an A2 drawing, 594 mm wide, drawn
// 1200 units wide; a view maps world mm to sheet units through its drawing scale.

const SHEET = { w: 1200, h: 848 };
const PX_PER_MM = SHEET.w / 594;

// ISO 128 line widths and ISO 3098 lettering, in sheet units (A2: 0.5 / 0.25 mm lines, 3.5 mm text).
const THICK = 1.15;
const THIN = 0.55;
const TEXT = 9.5;
const ARROW = 7;
const GAP = 2.2; // extension lines start this far from the object
const OVER = 3.5; // and run this far past the dimension line

const r2 = (n) => Math.round(n * 100) / 100;

function fmt(n, digits = 1) {
  const near = Math.round(n);
  if (Math.abs(n - near) < 0.05) return String(near);
  return n.toFixed(digits);
}

// ---------------------------------------------------------------- views

// A view is a window from world mm onto the sheet. scale is the drawing scale (1/2.5 for "1:2.5").
function view({ x, y, scale, name = "" }) {
  const k = scale * PX_PER_MM;
  return { x, y, scale, k, name, p: ([u, v]) => [r2(x + u * k), r2(y - v * k)] };
}

const scaleLabel = (scale) => (scale >= 1 ? `${fmt(scale)}:1` : `1:${fmt(1 / scale)}`);

function d(V, pts, closed = true) {
  let out = "";
  for (let i = 0; i < pts.length; i++) {
    const [x, y] = V.p(pts[i]);
    out += `${i ? "L" : "M"}${x} ${y}`;
  }
  return closed ? out + "Z" : out;
}

// ---------------------------------------------------------------- world geometry (point lists)

const rect = (u0, v0, u1, v1) => [[u0, v0], [u1, v0], [u1, v1], [u0, v1]];

function arc(cu, cv, r, a0, a1, steps) {
  const n = steps ?? Math.max(3, Math.ceil(Math.abs(a1 - a0) / 7.5));
  const out = [];
  for (let i = 0; i <= n; i++) {
    const a = ((a0 + ((a1 - a0) * i) / n) * Math.PI) / 180;
    out.push([cu + r * Math.cos(a), cv + r * Math.sin(a)]);
  }
  return out;
}

const circle = (cu, cv, r, steps = 48) => arc(cu, cv, r, 0, 360 - 360 / steps, steps - 1);

// A rectangle with filleted corners.
function rrect(u0, v0, u1, v1, r, steps = 4) {
  const q = Math.min(r, (u1 - u0) / 2, (v1 - v0) / 2);
  return [
    ...arc(u1 - q, v0 + q, q, -90, 0, steps),
    ...arc(u1 - q, v1 - q, q, 0, 90, steps),
    ...arc(u0 + q, v1 - q, q, 90, 180, steps),
    ...arc(u0 + q, v0 + q, q, 180, 270, steps),
  ];
}

const move = (pts, du, dv) => pts.map(([u, v]) => [u + du, v + dv]);
const flipU = (pts, about = 0) => pts.map(([u, v]) => [2 * about - u, v]).reverse();
const flipV = (pts, about = 0) => pts.map(([u, v]) => [u, 2 * about - v]).reverse();

function inside([u, v], poly) {
  let hit = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [ui, vi] = poly[i];
    const [uj, vj] = poly[j];
    if (vi > v !== vj > v && u < ((uj - ui) * (v - vi)) / (vj - vi) + ui) hit = !hit;
  }
  return hit;
}

// A body of revolution cut through its axis.
// loop is the half-profile as [r, s] pairs: r >= 0 measured from the axis, s along the axis.
// axis "v" is a vertical axis at u = at; axis "u" a horizontal axis at v = at.
// Returns the cut faces (hatched) and the edges seen through the bore behind the cutting plane:
// every circle on an inner surface shows edge-on as a straight line across the bore.
function revolve(loop, { axis = "v", at = 0 } = {}) {
  const place = axis === "v" ? (r, s) => [at + r, s] : (r, s) => [s, at + r];
  const n = loop.length;
  const onAxis = loop.findIndex(([r], i) => r === 0 && loop[(i + 1) % n][0] === 0);
  let cuts;
  if (onAxis >= 0) {
    const chain = Array.from({ length: n }, (_, j) => loop[(onAxis + 1 + j) % n]);
    const right = chain.map(([r, s]) => place(r, s));
    const left = chain.slice(1, -1).reverse().map(([r, s]) => place(-r, s));
    cuts = [[...right, ...left]];
  } else {
    cuts = [loop.map(([r, s]) => place(r, s)), loop.map(([r, s]) => place(-r, s)).reverse()];
  }
  const eps = 1e-3;
  const across = new Map();
  const clear = (r, s) => [0.02, 0.25, 0.5, 0.75, 0.98].every((t) => !inside([t * r, s], loop));
  for (const [r, s] of loop) {
    if (r <= 0) continue;
    if (clear(r, s + eps) && clear(r, s - eps)) across.set(s, Math.max(across.get(s) ?? 0, r));
  }
  const edges = [...across].map(([s, r]) => [place(-r, s), place(r, s)]);
  return { cuts, edges };
}

// ---------------------------------------------------------------- hatching

// ANSI/ISO-style material hatches. Spacing is in sheet units and never scales with the view,
// so a detail at 2:1 shows the same density as the main view, as on a real drawing.
const MATERIALS = {
  steel: { kind: "lines", gap: 3.4 },
  iron: { kind: "lines", gap: 5.6 },
  alu: { kind: "pairs", gap: 5.2, pair: 1.5 },
  brass: { kind: "dashed", gap: 4.6 },
  bronze: { kind: "dashed", gap: 3.6 },
  rubber: { kind: "cross", gap: 3.2 },
  plastic: { kind: "lines", gap: 2.3 },
  foam: { kind: "dots", gap: 2.6 },
  wood: { kind: "grain", gap: 4 },
};
const ANGLES = [45, 135, 30, 60];

function hatchDefs() {
  let out = "";
  for (const [name, m] of Object.entries(MATERIALS)) {
    for (const angle of ANGLES) {
      const g = m.gap;
      let body = "";
      if (m.kind === "lines") body = `<path class="hl" d="M0 -1V${g + 1}"/>`;
      if (m.kind === "pairs") body = `<path class="hl" d="M0 -1V${g + 1}M${m.pair} -1V${g + 1}"/>`;
      if (m.kind === "dashed") body = `<path class="hl" d="M0 -1V${g + 1}"/><path class="hl hl-dash" d="M${g / 2} -1V${g + 1}"/>`;
      if (m.kind === "cross") body = `<path class="hl" d="M0 -1V${g + 1}M-1 0H${g + 1}"/>`;
      if (m.kind === "dots") body = `<circle class="hd" cx="${g / 2}" cy="${g / 2}" r="0.42"/>`;
      if (m.kind === "grain") body = `<path class="hl" d="M0 -1V${g + 1}"/><path class="hl" d="M${g * 0.55} -1C${g * 0.75} ${g * 0.3} ${g * 0.35} ${g * 0.7} ${g * 0.55} ${g + 1}"/>`;
      out += `<pattern id="h-${name}-${angle}" patternUnits="userSpaceOnUse" width="${g}" height="${g}" patternTransform="rotate(${angle})">${body}</pattern>`;
    }
  }
  return out;
}

// ---------------------------------------------------------------- drawing parts

// A cut face: paper underneath (it hides what is behind), the material hatch, a thick outline.
// mat "solid" blacks the section in, the ISO convention for sections too thin to hatch.
function cut(V, pts, { mat = "steel", angle = 45 } = {}) {
  const dd = d(V, pts);
  if (mat === "solid") return `<path class="solid" d="${dd}"/>`;
  return `<path class="paper" d="${dd}"/><path fill="url(#h-${mat}-${angle})" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

// A body of revolution in section, with the edges behind the cut.
function section(V, rev, opts) {
  return rev.cuts.map((c) => cut(V, c, opts)).join("") + rev.edges.map((e) => line(V, e)).join("");
}

// An unsectioned solid (shafts, rods, pins, balls, nuts and ribs are never hatched in a section).
function body(V, pts) {
  const dd = d(V, pts);
  return `<path class="paper" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

const line = (V, pts, cls = "vis", closed = false) => `<path class="${cls}" d="${d(V, pts, closed)}"/>`;
const lines = (V, list, cls = "vis") => `<path class="${cls}" d="${list.map((pts) => d(V, pts, false)).join("")}"/>`;

// A centre line, run a little past the outline at both ends.
function centerline(V, a, b, over = 6) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  return `<path class="ctr" d="M${r2(ax - ux * over)} ${r2(ay - uy * over)}L${r2(bx + ux * over)} ${r2(by + uy * over)}"/>`;
}

// Centre mark for a circle in a view: two crossed centre lines.
function centerMark(V, [cu, cv], r, over = 5) {
  return centerline(V, [cu - r, cv], [cu + r, cv], over) + centerline(V, [cu, cv - r], [cu, cv + r], over);
}

// A compression spring cut along its axis: wire sections (blacked in) on both sides, half a pitch
// apart, joined by the back half of each turn. from/to are positions along the axis.
function springSection(V, { from, to, radius, wire, turns, axis = "u", at = 0 }) {
  const place = axis === "u" ? (s, r) => [s, at + r] : (s, r) => [at + r, s];
  const pitch = (to - from - wire) / turns;
  const start = from + wire / 2;
  const back = [];
  let sections = "";
  for (let i = 0; i <= turns; i++) {
    const sTop = start + i * pitch;
    sections += cut(V, circle(...place(sTop, radius), wire / 2, 12), { mat: "solid" });
    if (i < turns) {
      const sBot = sTop + pitch / 2;
      sections += cut(V, circle(...place(sBot, -radius), wire / 2, 12), { mat: "solid" });
      back.push([place(sTop, radius), place(sBot, -radius)]);
    }
  }
  return lines(V, back, "vis spring") + sections;
}

// ---------------------------------------------------------------- annotation

function arrowHead([x, y], [dx, dy]) {
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len;
  const uy = dy / len;
  const bx = x - ux * ARROW;
  const by = y - uy * ARROW;
  const half = ARROW * 0.25;
  return `M${r2(x)} ${r2(y)}L${r2(bx - uy * half)} ${r2(by + ux * half)}L${r2(bx + uy * half)} ${r2(by - ux * half)}Z`;
}

const textWidth = (s, size = TEXT) => String(s).length * size * 0.6;

// A linear dimension between two world points, measured along dir ("h" or "v").
// off is the sheet distance from point a to the dimension line (negative: up or left).
// The value is measured from the geometry unless text is given, so a dimension cannot lie.
function dim(V, a, b, { dir = "h", off = 18, text, prefix = "", suffix = "", id = "", cls = "" } = {}) {
  const A = V.p(a);
  const B = V.p(b);
  const value = text ?? prefix + fmt(Math.abs(dir === "h" ? b[0] - a[0] : b[1] - a[1])) + suffix;
  const h = dir === "h";
  const main = h ? 0 : 1; // the axis the dimension measures along
  const side = 1 - main;
  const at = A[side] + off; // where the dimension line sits
  const pt = (m, s) => (h ? [m, s] : [s, m]);
  let ext = "";
  for (const P of [A, B]) {
    const gapTo = at - P[side];
    if (Math.abs(gapTo) <= GAP) continue;
    const sgn = Math.sign(gapTo);
    const [x1, y1] = pt(P[main], P[side] + sgn * GAP);
    const [x2, y2] = pt(P[main], at + sgn * OVER);
    ext += `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
  }
  const lo = Math.min(A[main], B[main]);
  const hi = Math.max(A[main], B[main]);
  const span = hi - lo;
  const tw = textWidth(value);
  const arrowsIn = span >= ARROW * 2 + 3;
  const textIn = span >= tw + ARROW * 2 + 6;
  let lineD;
  let heads;
  let tm; // text position along the measured axis
  let anchor = "middle";
  if (arrowsIn) {
    const [x1, y1] = pt(lo, at);
    const [x2, y2] = pt(hi, at);
    lineD = `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
    heads = arrowHead(pt(lo, at), pt(-1, 0)) + arrowHead(pt(hi, at), pt(1, 0));
  } else {
    const [x1, y1] = pt(lo - ARROW - 7, at);
    const [x2, y2] = pt(hi + ARROW + 7, at);
    lineD = `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
    heads = arrowHead(pt(lo, at), pt(1, 0)) + arrowHead(pt(hi, at), pt(-1, 0));
  }
  if (textIn) tm = (lo + hi) / 2;
  else {
    tm = hi + ARROW + 10 + tw / 2;
    const [x2, y2] = pt(tm + tw / 2, at);
    lineD += `L${r2(x2)} ${r2(y2)}`;
  }
  // ISO: text sits just above a horizontal line and reads from the right on a vertical one.
  const [tx, ty] = pt(tm, at - 3);
  const textEl = h
    ? `<text class="t" x="${r2(tx)}" y="${r2(ty)}" text-anchor="${anchor}">${value}</text>`
    : `<text class="t" x="${r2(tx)}" y="${r2(ty)}" text-anchor="${anchor}" transform="rotate(-90 ${r2(tx)} ${r2(ty)})">${value}</text>`;
  return `<g data-role="dim"${id ? ` id="${id}"` : ""}${cls ? ` class="${cls}"` : ""}><path class="thin" d="${ext}${lineD}"/><path class="head" d="${heads}"/>${textEl}</g>`;
}

// A part balloon: a dot on the part, a thin leader, a circled item number.
function balloon(V, at, [bx, by], n, { target = "", r = 8.5 } = {}) {
  const [ax, ay] = V.p(at);
  const a = Math.atan2(ay - by, ax - bx);
  const ex = r2(bx + r * Math.cos(a));
  const ey = r2(by + r * Math.sin(a));
  return (
    `<g data-role="balloon" data-target="${target}" data-at="${ax} ${ay}">` +
    `<path class="thin" d="M${ex} ${ey}L${ax} ${ay}"/><circle class="dot" cx="${ax}" cy="${ay}" r="1.5"/>` +
    `<circle class="balloon" cx="${bx}" cy="${by}" r="${r}"/>` +
    `<text class="t" x="${bx}" y="${r2(by + 3.3)}" text-anchor="middle">${n}</text></g>`
  );
}

// A view title: SECTION A-A over its scale, centred under the view.
function viewLabel(x, y, title, sub = "") {
  return (
    `<g data-role="label"><text class="t t-lg" x="${x}" y="${y}" text-anchor="middle">${title}</text>` +
    (sub ? `<text class="t t-sm" x="${x}" y="${y + 12}" text-anchor="middle">${sub}</text>` : "") +
    `</g>`
  );
}

// The circle that marks a detail in its parent view, with its letter.
function detailMark(V, [cu, cv], r, letter, angle = 45) {
  const [x, y] = V.p([cu, cv]);
  const R = r * V.k;
  const a = (-angle * Math.PI) / 180;
  const lx = r2(x + (R + 9) * Math.cos(a));
  const ly = r2(y + (R + 9) * Math.sin(a) + 4);
  return `<g data-role="label"><circle class="thin mark" cx="${x}" cy="${y}" r="${r2(R)}"/><text class="t t-lg" x="${lx}" y="${ly}" text-anchor="middle">${letter}</text></g>`;
}

// A viewing-direction arrow (VIEW C): a thick-tipped arrow pointing at the surface, with its letter.
function viewArrow(V, at, [dx, dy], letter, len = 26) {
  const [x, y] = V.p(at);
  const n = Math.hypot(dx, dy) || 1;
  const ux = dx / n;
  const uy = dy / n;
  const sx = r2(x - ux * len);
  const sy = r2(y - uy * len);
  return (
    `<g data-role="label"><path class="vis" d="M${sx} ${sy}L${r2(x - ux * ARROW)} ${r2(y - uy * ARROW)}"/>` +
    `<path class="head" d="${arrowHead([x, y], [ux, uy])}"/>` +
    `<text class="t t-lg" x="${r2(sx - uy * 10)}" y="${r2(sy + ux * 10 + 4)}" text-anchor="middle">${letter}</text></g>`
  );
}

// A long-break line across a part (thin, with one zigzag), for parts that run out of the view.
function breakLine(V, a, b) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const mx = (ax + bx) / 2;
  const my = (ay + by) / 2;
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  const z = 3.5;
  const p = (t, s) => `${r2(mx + ux * t - uy * s)} ${r2(my + uy * t + ux * s)}`;
  return `<path class="thin" d="M${r2(ax - ux * 4)} ${r2(ay - uy * 4)}L${p(-z, 0)}L${p(-z / 2, z * 1.6)}L${p(z / 2, -z * 1.6)}L${p(z, 0)}L${r2(bx + ux * 4)} ${r2(by + uy * 4)}"/>`;
}

// ---------------------------------------------------------------- sheet furniture

// The drawing frame: trimmed edge, a thick border, zone references and centring marks.
function frame({ w = SHEET.w, h = SHEET.h, trim = 8, m = 24, cols = 8, rows = 6 } = {}) {
  let out = `<g data-role="frame"><rect class="thin" x="${trim}" y="${trim}" width="${w - trim * 2}" height="${h - trim * 2}"/>`;
  out += `<rect class="vis" x="${m}" y="${m}" width="${w - m * 2}" height="${h - m * 2}"/>`;
  const cw = (w - m * 2) / cols;
  const rh = (h - m * 2) / rows;
  let ticks = "";
  let labels = "";
  for (let i = 0; i <= cols; i++) {
    const x = r2(m + i * cw);
    if (i > 0 && i < cols) ticks += `M${x} ${trim}V${m}M${x} ${h - m}V${h - trim}`;
    if (i < cols) {
      const cx = r2(m + (i + 0.5) * cw);
      labels += `<text class="t t-sm" x="${cx}" y="${r2((trim + m) / 2 + 3)}" text-anchor="middle">${i + 1}</text>`;
      labels += `<text class="t t-sm" x="${cx}" y="${r2(h - (trim + m) / 2 + 3)}" text-anchor="middle">${i + 1}</text>`;
    }
  }
  for (let j = 0; j <= rows; j++) {
    const y = r2(m + j * rh);
    if (j > 0 && j < rows) ticks += `M${trim} ${y}H${m}M${w - m} ${y}H${w - trim}`;
    if (j < rows) {
      const cy = r2(m + (j + 0.5) * rh + 3);
      const letter = String.fromCharCode(65 + j);
      labels += `<text class="t t-sm" x="${r2((trim + m) / 2)}" y="${cy}" text-anchor="middle">${letter}</text>`;
      labels += `<text class="t t-sm" x="${r2(w - (trim + m) / 2)}" y="${cy}" text-anchor="middle">${letter}</text>`;
    }
  }
  const cm = `M${w / 2} ${trim}V${m + 10}M${w / 2} ${h - trim}V${h - m - 10}M${trim} ${h / 2}H${m + 10}M${w - trim} ${h / 2}H${w - m - 10}`;
  out += `<path class="thin" d="${ticks}"/><path class="vis" d="${cm}"/>${labels}</g>`;
  return out;
}

// A ruled table (parts list). cols: [{ w, align, title }]. rows: arrays of cell strings.
// Item numbers count up from the bottom, as a parts list sits on top of the title block.
function table(x, y, cols, rows, { rowH = 16, role = "bom", headH = 18 } = {}) {
  const w = cols.reduce((s, c) => s + c.w, 0);
  const h = headH + rows.length * rowH;
  let rules = "";
  let text = "";
  let cx = x;
  for (const [i, c] of cols.entries()) {
    if (i > 0) rules += `M${r2(cx)} ${y}V${y + h}`;
    const tx = c.align === "center" ? cx + c.w / 2 : c.align === "right" ? cx + c.w - 4 : cx + 4;
    const anchor = c.align === "center" ? "middle" : c.align === "right" ? "end" : "start";
    text += `<text class="t t-sm t-head" x="${r2(tx)}" y="${y + h - 5.5}" text-anchor="${anchor}">${c.title}</text>`;
    rows.forEach((row, j) => {
      text += `<text class="t t-sm" x="${r2(tx)}" y="${r2(y + (rows.length - 1 - j) * rowH + rowH - 4.8)}" text-anchor="${anchor}">${row[i]}</text>`;
    });
    cx += c.w;
  }
  for (let j = 1; j <= rows.length; j++) rules += `M${x} ${r2(y + j * rowH)}H${x + w}`;
  return `<g data-role="${role}"><rect class="paper" x="${x}" y="${y}" width="${w}" height="${h}"/><path class="thin" d="${rules}"/><rect class="vis" x="${x}" y="${y}" width="${w}" height="${h}"/>${text}</g>`;
}

// A title-block cell: a small caption over a value. size: "sm" | "md" | "lg".
function cell({ x, y, w, h, label, value = "", size = "md", id = "" }) {
  const cls = size === "lg" ? "t t-xl" : size === "sm" ? "t t-sm" : "t";
  const vy = size === "lg" ? y + h - 7 : y + h - 5;
  return (
    `<rect class="thin" x="${x}" y="${y}" width="${w}" height="${h}"/>` +
    `<text class="t t-cap" x="${x + 4}" y="${y + 9}">${label}</text>` +
    `<text class="${cls}" x="${x + 4}" y="${vy}"${id ? ` id="${id}"` : ""}>${value}</text>`
  );
}

function titleBlock(x, y, w, h, cells) {
  return `<g data-role="title"><rect class="paper" x="${x}" y="${y}" width="${w}" height="${h}"/>${cells.map((c) => cell({ ...c, x: x + c.x, y: y + c.y })).join("")}<rect class="vis" x="${x}" y="${y}" width="${w}" height="${h}"/></g>`;
}

// A notes block: a heading and numbered lines.
function notes(x, y, heading, items, lead = 13) {
  let out = `<g data-role="notes"><text class="t t-head" x="${x}" y="${y}">${heading}</text>`;
  items.forEach((s, i) => {
    out += `<text class="t t-sm" x="${x}" y="${r2(y + lead * (i + 1) + 2)}">${i + 1}. ${s}</text>`;
  });
  return out + `</g>`;
}

return { SHEET, PX_PER_MM, THICK, THIN, TEXT, ARROW, GAP, OVER, r2, fmt, view, scaleLabel, d, rect, arc, circle, rrect, move, flipU, flipV, inside, revolve, MATERIALS, ANGLES, hatchDefs, cut, section, body, line, lines, centerline, centerMark, springSection, textWidth, dim, balloon, viewLabel, detailMark, viewArrow, breakLine, frame, table, cell, titleBlock, notes };
})();

const L = (() => {
// Live runtime for a blueprint sheet: one time-based loop, an idle tour, input wake-ups,
// offscreen and hidden-tab pauses, reduced motion, and deterministic frames for checks.
//
// URL parameters (all optional):
//   ?t=6.5            render the tour at 6.5 s, deterministically, and stop (for screenshots)
//   ?theme=paper      blueprint | paper | white | dark
//   ?zoom=x,y,w,h     show only this sheet region, filling the window (for 4x close-ups)
//   ?mask=x,y,w,h     blank everything outside this box, so one view stands alone
//   ?check=1          run the layout self-check after the first frame (see selfcheck.mjs)

function params() {
  const q = new URLSearchParams(location.search);
  return {
    t: q.has("t") ? Number(q.get("t")) : null,
    theme: q.get("theme"),
    zoom: q.get("zoom"),
    mask: q.get("mask"),
    check: q.has("check"),
  };
}

const THEMES = ["blueprint", "paper", "white", "dark"];

function setupPage(svg) {
  const q = params();
  // the page's own default (writePage's `theme`), then a saved choice, then ?theme=, which wins but isn't saved
  const fallback = document.documentElement.dataset.theme || "blueprint";
  const pick = (name, save) => {
    if (!THEMES.includes(name)) return;
    document.documentElement.dataset.theme = name;
    for (const b of document.querySelectorAll("[data-theme-pick]")) b.setAttribute("aria-pressed", String(b.dataset.themePick === name));
    if (save) {
      try {
        localStorage.setItem("bp-theme", name);
      } catch {}
    }
  };
  let saved = null;
  try {
    saved = localStorage.getItem("bp-theme");
  } catch {}
  pick(q.theme ?? saved ?? fallback, false);
  for (const b of document.querySelectorAll("[data-theme-pick]")) b.addEventListener("click", () => pick(b.dataset.themePick, true));
  // ?mask=x,y,w,h paints the page colour over everything outside one box, so a view stands alone
  if (q.mask) {
    const [x, y, w, h] = q.mask.split(",").map(Number);
    if ([x, y, w, h].every(Number.isFinite)) {
      const m = document.createElementNS("http://www.w3.org/2000/svg", "path");
      m.setAttribute("d", `M-9999 -9999H9999V9999H-9999Z M${x} ${y}V${y + h}H${x + w}V${y}Z`);
      m.setAttribute("fill-rule", "evenodd");
      m.setAttribute("style", "fill:var(--bp-page);pointer-events:none");
      m.dataset.role = "mask";
      svg.appendChild(m);
    }
  }
  // The sheet's keys listen on the svg. Make them work without clicking the sheet first: a press on the
  // sheet focuses it (drag handlers cancel pointerdown, which would otherwise skip focus), and a key typed
  // while nothing is focused is passed on to the sheet.
  svg.addEventListener("pointerdown", (e) => {
    if (document.activeElement !== svg && !e.target.closest?.("[tabindex]:not(svg), a, button, input, select, textarea")) svg.focus({ preventScroll: true });
  });
  window.addEventListener("keydown", (e) => {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || svg.contains(e.target)) return;
    const a = document.activeElement;
    if (a && a !== document.body && a !== document.documentElement) return;
    const fwd = new KeyboardEvent("keydown", { key: e.key, code: e.code, shiftKey: e.shiftKey, repeat: e.repeat, bubbles: true, cancelable: true });
    if (!svg.dispatchEvent(fwd)) e.preventDefault();
  });
  if (q.zoom) {
    const box = q.zoom.split(",").map(Number);
    if (box.length === 4 && box.every(Number.isFinite)) {
      svg.setAttribute("viewBox", box.join(" "));
      document.body.classList.add("bp-zoom");
    }
  }
  return q;
}

// Critically damped follow toward a target: calm, no overshoot, frame-rate independent.
function follow(at, want, rate, dt) {
  return want + (at - want) * Math.exp(-rate * dt);
}

const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, t)));

// run({ root, step, render, idleAfter })
//   step(dt, live) advances the model; live.touring says whether the idle tour drives it.
//   It returns true while something is still settling, so a reduced-motion page can sleep.
//   render(live) writes attributes; it never rebuilds static geometry.
function run({ root, step, render, idleAfter = 4, onFrozen }) {
  const q = params();
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const live = { clock: 0, slow: 1, lastInput: -Infinity, reduced, touring: !reduced, frozen: q.t != null };
  live.input = () => {
    live.lastInput = live.clock;
    live.touring = false;
    wake();
  };

  if (live.frozen) {
    const dt = 1 / 240;
    for (let t = 0; t < q.t; t += dt) {
      live.clock = t;
      live.touring = true;
      step(dt, live);
    }
    render(live);
    onFrozen?.(live);
    return live;
  }

  let raf = 0;
  let last = 0;
  let visible = true;
  function frame(now) {
    raf = 0;
    const real = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    live.clock += real;
    live.touring = !reduced && live.clock - live.lastInput > idleAfter;
    // the first frame (and the first after a pause) has no elapsed time: models that divide by the step
    // (a speed from two positions) would turn NaN and stay NaN, so a zero step is not taken
    const busy = real > 0 ? step(real * live.slow, live) : true;
    render(live);
    if (visible && !document.hidden && (!reduced || busy)) raf = requestAnimationFrame(frame);
    else last = 0;
  }
  function wake() {
    if (!raf && visible && !document.hidden) raf = requestAnimationFrame(frame);
  }
  live.wake = wake;
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(([entry]) => {
      visible = entry.isIntersecting;
      if (visible) wake();
    }).observe(root);
  }
  document.addEventListener("visibilitychange", wake);
  render(live);
  wake();
  return live;
}

// Vertical drag on an element, reported as a sheet-unit delta since the press.
function dragY(svg, el, { start, move, end }) {
  let id = null;
  let y0 = 0;
  const toSheet = (e) => {
    const m = svg.getScreenCTM();
    return m ? (e.clientY - m.f) / m.d : e.clientY;
  };
  el.addEventListener("pointerdown", (e) => {
    id = e.pointerId;
    el.setPointerCapture(id);
    y0 = toSheet(e);
    start?.();
    e.preventDefault();
  });
  el.addEventListener("pointermove", (e) => {
    if (e.pointerId === id) move(toSheet(e) - y0);
  });
  const stop = (e) => {
    if (e.pointerId !== id) return;
    id = null;
    end?.();
  };
  el.addEventListener("pointerup", stop);
  el.addEventListener("pointercancel", stop);
}

// Announce a readout to screen readers at most every `every` seconds.
function announcer(el, every = 1.5) {
  let lastAt = -Infinity;
  let lastText = "";
  return (text, clock) => {
    if (text === lastText || clock - lastAt < every) return;
    lastAt = clock;
    lastText = text;
    el.textContent = text;
  };
}

return { params, THEMES, setupPage, follow, ease, run, dragY, announcer };
})();

const C = (() => {
// Layout self-check, run in the page with ?check=1 (scripts/check.mjs drives it headlessly).
// It writes a JSON report into <pre id="bp-check"> and to the console. A clean sheet reports
// zero failures in every category.
//
//   text-overlap      two pieces of lettering touch
//   text-on-geometry  lettering sits on a part or on another annotation's lines
//   outside-frame     an annotation or a view crosses the drawing frame
//   balloon-target    a balloon's dot is not on the part it names
//   balloon-on-geom   a balloon circle sits on a part
//   hard-colour       a fill or stroke is a literal colour instead of a token
//   sideways-scroll   the page scrolls horizontally

const roleOf = (el) => el.closest("[data-role]")?.dataset.role ?? "";

// A clipped group's box is its clip region's box (getBoundingClientRect ignores clipping).
function clippedBox(el) {
  const ref = el.getAttribute("clip-path")?.match(/url\(#([^)]+)\)/)?.[1];
  const shape = ref && document.getElementById(ref)?.firstElementChild;
  if (!shape) return el.getBoundingClientRect();
  const b = shape.getBBox();
  const m = shape.ownerSVGElement.getScreenCTM();
  const x0 = m.a * b.x + m.e;
  const y0 = m.d * b.y + m.f;
  return { left: x0, top: y0, right: x0 + m.a * b.width, bottom: y0 + m.d * b.height };
}

function selfCheck(svg) {
  const fails = [];
  const fail = (kind, what) => fails.push({ kind, what });
  const label = (el) => {
    const g = el.closest("[data-role],[data-part],[data-geom]");
    const name = g?.id || g?.dataset.part || g?.dataset.target || g?.dataset.role || g?.dataset.geom || el.tagName;
    return `${name}: "${(el.textContent || "").trim().slice(0, 24)}"`;
  };
  const shown = (el) => {
    const b = el.getBoundingClientRect();
    if (b.width < 0.5 || b.height < 0.5) return false;
    const cs = getComputedStyle(el);
    return cs.visibility !== "hidden" && cs.display !== "none" && Number(cs.opacity) > 0.05;
  };
  const texts = [...svg.querySelectorAll("text")].filter(shown);
  const boxes = texts.map((t) => t.getBoundingClientRect());
  const grow = 0.4;
  const hit = (a, b) => a.left < b.right - grow && b.left < a.right - grow && a.top < b.bottom - grow && b.top < a.bottom - grow;

  for (let i = 0; i < texts.length; i++)
    for (let j = i + 1; j < texts.length; j++) if (hit(boxes[i], boxes[j])) fail("text-overlap", `${label(texts[i])} × ${label(texts[j])}`);

  const geomOf = (el) => el.closest("[data-geom]");
  for (const [i, t] of texts.entries()) {
    const role = roleOf(t);
    if (role === "engraved" || role === "frame") continue;
    const own = t.closest("[data-role]");
    const b = boxes[i];
    const seen = new Set();
    for (let ix = 0; ix < 4; ix++)
      for (let iy = 0; iy < 2; iy++) {
        const x = b.left + b.width * (0.15 + ix * 0.233);
        const y = b.top + b.height * (0.3 + iy * 0.4);
        for (const el of document.elementsFromPoint(x, y)) {
          if (el === t || el.tagName === "text" || el.tagName === "svg" || el.closest("defs")) continue;
          if (el.classList.contains("tint") || el.classList.contains("hit") || el.closest('[data-role="phantom"]')) continue;
          if (own && own.contains(el)) continue;
          const g = geomOf(el);
          const other = el.closest("[data-role]");
          const bad = (g && !g.contains(t)) || (other && other !== own && other.dataset.role !== "frame" && other.dataset.role !== "chart-bg");
          if (bad && !el.classList.contains("sheet-bg") && !el.classList.contains("grid")) {
            const key = el.closest("[data-part],[data-role],[data-geom]");
            if (!seen.has(key)) {
              seen.add(key);
              fail("text-on-geometry", `${label(t)} on ${key?.dataset.part || key?.id || key?.dataset.role || key?.dataset.geom || el.tagName}`);
            }
          }
        }
      }
  }

  const frameRect = svg.querySelector('[data-role="frame"] rect.vis')?.getBoundingClientRect();
  if (frameRect) {
    for (const el of svg.querySelectorAll("[data-role]:not([data-role=frame]), [data-geom]")) {
      if (el.parentElement?.closest("[data-role]:not([data-role=frame]), [data-geom]")) continue;
      if (!shown(el)) continue;
      const b = clippedBox(el);
      const tol = 0.5;
      if (b.left < frameRect.left - tol || b.right > frameRect.right + tol || b.top < frameRect.top - tol || b.bottom > frameRect.bottom + tol)
        fail("outside-frame", el.id || el.dataset.geom || el.dataset.role);
    }
  }

  for (const g of svg.querySelectorAll('[data-role="balloon"]')) {
    if (!shown(g)) continue;
    const dot = g.querySelector("circle.dot").getBoundingClientRect();
    const x = dot.left + dot.width / 2;
    const y = dot.top + dot.height / 2;
    const target = g.dataset.target;
    const under = document.elementsFromPoint(x, y).some((el) => el.closest(`[data-part="${target}"]`));
    if (!under) fail("balloon-target", `balloon ${g.textContent.trim()} → ${target}`);
    const c = g.querySelector("circle.balloon").getBoundingClientRect();
    const pts = [
      [c.left + c.width * 0.5, c.top + c.height * 0.5],
      [c.left + c.width * 0.2, c.top + c.height * 0.5],

function planCables(V, s) {
  const b = M.betaOf(s);
  const S1 = M.holeOf(b, "C1");
  const S2 = M.holeOf(b, "C2");
  const P1 = M.mirror(S1);
  const P2 = M.mirror(S2);
  let out = "";
  for (const [a, c, k] of [[S1, P2, 0.25], [S2, P1, 0.75]]) {
    out += K.line(V, pln([a, c]), "vis");
    const m = [a[0] + (c[0] - a[0]) * k, a[1] + (c[1] - a[1]) * k];
    const L = Math.hypot(c[0] - a[0], c[1] - a[1]);
    const d = [(c[0] - a[0]) / L, (c[1] - a[1]) / L];
    out += K.body(V, pln(X.strip([[m[0] - d[0] * 40, m[1] - d[1] * 40], [m[0] + d[0] * 40, m[1] + d[1] * 40]], 10)));
  }
  return part(12, out);
}
// the follow-up cable: from the starboard bellcrank's hole F inboard to a pulley at WS 60, then down
// through the cabin roof to the selector
const FU_PULLEY = { w: 60, r: 25 };
function planFollowUp(V, s) {
  const b = M.betaOf(s);
  const F = M.holeOf(b, "F");
  const P0 = [F[0], FU_PULLEY.w];
  return part(13, K.line(V, pln([F, P0]), "vis") + K.body(V, pln(K.rect(P0[0] - FU_PULLEY.r, FU_PULLEY.w - 5, P0[0] + FU_PULLEY.r, FU_PULLEY.w + 5))));
}
// the actuator in plan, from its own frame (a along the screw, q across, + aft)
function actFrame(b) {
  const A = M.holeOf(b, "A");
  const m = M.ACT.mount;
  const L = Math.hypot(A[0] - m[0], A[1] - m[1]);
  const ax = [(A[0] - m[0]) / L, (A[1] - m[1]) / L];
  const nq = [ax[1], -ax[0]]; // + aft
  return { L, at: ([a, q]) => [m[0] + a * ax[0] + q * nq[0], m[1] + a * ax[1] + q * nq[1]] };
}
const ACT_BOX = { a0: 14, a1: 64, q0: -112, q1: 44 };
function planActuator(V, s) {
  const b = M.betaOf(s);
  const F = actFrame(b);
  const to = (pts) => pln(pts.map(F.at));
  let out = "";
  out += part(23, K.body(V, to(K.rect(-24, -24, 10, 24))));
  out += part(15, K.body(V, to(K.rrect(ACT_BOX.a0, ACT_BOX.q0, ACT_BOX.a1, ACT_BOX.q1, 6))) + K.body(V, to(K.rect(-12, -10, ACT_BOX.a0, 10))));
  out += part(14, K.body(V, to(K.rrect(64, -106, 176, -50, 5))));
  out += part(20, K.body(V, to(K.rect(64, -16, 262, 16))));
  out += part(22, K.body(V, to(K.rect(SW.up.a0, 26, SW.up.a1, 38))) + K.body(V, to(K.rect(SW.down.a0, 26, SW.down.a1, 38))));
  out += part(19, K.body(V, to(K.rect(262, -11, F.L - 16, 11))) + K.body(V, to(K.circle(F.L, 0, 12, 16))) + K.body(V, to(K.circle(F.L, 0, 3.2, 10))));
  out += K.body(V, to(K.circle(0, 0, 3.2, 10)));
  return out;
}

// ---------------------------------------------------------------- SECTION C-C: the actuator, from above
// (a, q) frame; the section plane holds the screw's, the idler's and the motor's axes.
const QI = M.Q_IDLER;
const QM = -M.QM;
const pitchR = (z) => (z * M.GEAR.m) / 2;
function actHousing(V) {
  const outer = K.rrect(ACT_BOX.a0, ACT_BOX.q0, ACT_BOX.a1, ACT_BOX.q1, 6);
  const lugO = [[-12, -10], [ACT_BOX.a0, -10], [ACT_BOX.a0, 10], [-12, 10]];
  const cavity = K.rrect(20, -106, 56, 38, 3);
  const holes = [
    cavity,
    K.rect(14, -8, 20.01, 8), // the screw's inboard bearing
    K.rect(14, QI - 6, 20.01, QI + 6), // the idler's bearings
    K.rect(55.99, QI - 6, 64, QI + 6),
    K.rect(55.99, -15, 64, 15), // the angular-contact pair
    K.rect(55.99, QM - 6, 64, QM + 6), // the motor's shaft
    K.circle(0, 0, 3.25, 14), // the mount pin
  ];
  const body = X.hull([...outer, ...lugO]);
  return part(15, X.cutHoles(V, act(body), holes.map(act), { mat: "alu", angle: 45 }));
}
// a spur gear cut through its axis: the web hatched, the teeth not (ISO), the pitch line chained
function gearSec(V, a0, a1, q0, z, hub, { mat = "steel", angle = 135 } = {}) {
  const r = pitchR(z);
  const ra = r + M.GEAR.m;
  const rf = r - 1.25 * M.GEAR.m;
  let out = "";
  for (const sg of [-1, 1]) {
    out += K.cut(V, act(K.rect(a0, q0 + sg * hub, a1, q0 + sg * rf)), { mat, angle });
    out += K.body(V, act(K.rect(a0, q0 + sg * rf, a1, q0 + sg * ra)));
    out += K.line(V, act([[a0 - 1.5, q0 + sg * r], [a1 + 1.5, q0 + sg * r]]), "ctr");
  }
  return out;
}
function actGears(V) {
  const g = M.GEAR;
  let out = "";
  out += gearSec(V, 26, 36, 0, g.z4, 5, { angle: 135 }); // screw gear
  out += gearSec(V, 40, 50, QI, g.z2, 5, { angle: 45 }); // idler gear
  // the idler pinion and the motor pinion are cut on their shafts: teeth and shaft, unhatched
  out += K.body(V, act(K.rect(26, QI - pitchR(g.z3) - g.m, 36, QI + pitchR(g.z3) + g.m)));
  out += K.line(V, act([[24.5, QI - pitchR(g.z3)], [37.5, QI - pitchR(g.z3)]]), "ctr") + K.line(V, act([[24.5, QI + pitchR(g.z3)], [37.5, QI + pitchR(g.z3)]]), "ctr");
  out += K.body(V, act(K.rect(40, QM - pitchR(g.z1) - g.m, 50, QM + pitchR(g.z1) + g.m)));
  out += K.line(V, act([[38.5, QM + pitchR(g.z1)], [51.5, QM + pitchR(g.z1)]]), "ctr");
  return part(16, out);
}
// shafts: the idler's (with its pinion), the motor's (with its pinion), drawn unhatched
function actShafts(V) {
  return part(16, K.body(V, act(K.rect(15, QI - 5, 63, QI + 5)))) + part(14, K.body(V, act(K.rect(38, QM - 3, 172, QM + 3))));
}
// bearings: a box with a ball (ISO simplified); the screw's angular-contact pair drawn as two
function bearing(V, a0, a1, q0, q1) {
  const lo = Math.min(q0, q1);
  const hi = Math.max(q0, q1);
  const c = [(a0 + a1) / 2, (lo + hi) / 2];
  const r = Math.min(a1 - a0, hi - lo) * 0.3;
  return K.body(V, act(K.rect(a0, lo, a1, hi))) + K.line(V, act(K.circle(c[0], c[1], r, 12)), "thin", true);
}
function actBearings(V) {
  let out = "";
  for (const sg of [-1, 1]) {
    out += bearing(V, 56, 60, sg * 5, sg * 15) + bearing(V, 60, 64, sg * 5, sg * 15);
    out += bearing(V, 14, 20, sg * 5, sg * 8);
    out += bearing(V, 14, 20, QI + sg * 5, QI + sg * 6) + bearing(V, 56, 64, QI + sg * 5, QI + sg * 6);
  }
  return part(21, out);
}
// the jackscrew: journal and threaded length, unhatched; its crests drawn as the helix's slanting
// lines, which run along it as it turns (spin, rad)
const SCREW_A = [12, 252];
function actScrew(V, spin) {
  const L0 = 66;
  let out = K.body(V, act([[SCREW_A[0], -5], [L0 - 2, -5], [L0, -8], [SCREW_A[1], -8], [SCREW_A[1], 8], [L0, 8], [L0 - 2, 5], [SCREW_A[0], 5]]));
  const p = M.SCREW.lead;
  const ph = ((((spin / (2 * Math.PI)) * p) % p) + p) % p;
  let crest = "";
  for (let a = L0 + ph; a < SCREW_A[1] - p / 2 - 0.5; a += p) crest += K.d(V, act([[a, -8], [a + p / 2, 8]]), false);
  out += `<path class="thin" d="${crest}"/>`;
  out += K.line(V, act([[L0, -6.4], [SCREW_A[1], -6.4]]), "thin") + K.line(V, act([[L0, 6.4], [SCREW_A[1], 6.4]]), "thin");
  return part(17, out);
}
// the motor: flange, can, magnets, armature, commutator and brushes
function actMotor(V) {
  let out = "";
  out += X.cutHoles(V, act(K.rect(64, QM - 32, 70, QM + 32)), [act(K.rect(63.99, QM - 6, 70.01, QM + 6))], { mat: "steel", angle: 135 });
  for (const sg of [-1, 1]) {
    out += K.cut(V, act(K.rect(70, QM + sg * 26.5, 176, QM + sg * 28)), { mat: "solid" });
    out += K.cut(V, act(K.rect(84, QM + sg * 20.5, 148, QM + sg * 26.5)), { mat: "iron", angle: 135 });
    out += K.cut(V, act(K.rect(86, QM + sg * 3, 146, QM + sg * 18.5)), { mat: "steel", angle: 45 });
    out += K.cut(V, act(K.rect(150, QM + sg * 3, 162, QM + sg * 9)), { mat: "brass", angle: 45 });
    out += K.cut(V, act(K.rect(153, QM + sg * 9.6, 159, QM + sg * 16)), { mat: "solid" });
  }
  out += K.cut(V, act(K.rect(174.5, QM - 26.5, 176, QM + 26.5)), { mat: "solid" });
  out += bearing(V, 166, 173, QM + 3, QM + 9) + bearing(V, 166, 173, QM - 9, QM - 3);
  return part(14, out);
}
// the housing tube with the striker's slot on its aft side, and the bronze bush at its end
const SLOT_A = [72, M.ACTL.nut0 + 26 + M.NUT_MAX];
function actTube(V) {
  let out = "";
  out += K.cut(V, act(K.rect(64, -16, 262, -14)), { mat: "solid" });
  out += K.cut(V, act(K.rect(64, 14, SLOT_A[0], 16)), { mat: "solid" }) + K.cut(V, act(K.rect(SLOT_A[1], 14, 262, 16)), { mat: "solid" });
  for (const sg of [-1, 1]) out += K.cut(V, act(K.rect(250, sg * 11.2, 262, sg * 14)), { mat: "bronze", angle: 45 });
  return part(20, out);
}
// the nut (bronze, threaded on the screw) with its striker key through the slot
const nutA = (n) => M.ACTL.nut0 + n;
function actNut(V, n) {
  const a = nutA(n);
  let out = "";
  for (const sg of [-1, 1]) out += K.cut(V, act(K.rect(a, sg * 8, a + M.ACTL.nutL, sg * 13.5)), { mat: "bronze", angle: 135 });
  out += K.body(V, act(K.rect(a + 8, 13.5, a + 22, 23)));
  return part(18, out);
}
// the actuating tube from the nut to the rod end
function actRod(V, n, L) {
  const a = nutA(n) + M.ACTL.nutL;
  const e = L;
  let out = "";
  for (const sg of [-1, 1]) out += K.cut(V, act(K.rect(a, sg * 9, e - 18, sg * 11)), { mat: "solid" });
  out += K.body(V, act(K.rect(e - 18, -6, e - 8, 6)));
  out += X.bodyHoles(V, act(K.circle(e, 0, 12, 24)), [act(K.circle(e, 0, 3.3, 12))]);
  return part(19, out);
}
// the limit switches: body, lever and roller; the striker presses a roller at the end of the travel
// rollers placed so the striker meets them exactly at the nut's two ends of travel (flap 0 and 30)
const ROLL_UP = M.ACTL.nut0 + 8 - 2.5;
const ROLL_DN = M.ACTL.nut0 + 22 + M.NUT_MAX + 2.5;
const SW = { up: { a0: 64.5, a1: ROLL_UP - 1.5, roll: ROLL_UP }, down: { a0: ROLL_DN + 1.5, a1: ROLL_DN + 19.5, roll: ROLL_DN } };
function limitPress(n) {
  const a = nutA(n);
  const up = Math.max(0, Math.min(2.5, SW.up.roll + 2.5 - (a + 8)));
  const dn = Math.max(0, Math.min(2.5, a + 22 - (SW.down.roll - 2.5)));
  return { up, dn };
}
function actSwitches(V, n) {
  const pr = limitPress(n);
  let out = "";
  for (const [k, s] of Object.entries(SW)) {
    out += K.cut(V, act(K.rect(s.a0, 26, s.a1, 38)), { mat: "plastic", angle: 60 });
    const push = k === "up" ? -pr.up : pr.dn;
    const r = [s.roll + push, 20.5];
    const pivot = [k === "up" ? s.a1 - 3 : s.a0 + 3, 26];
    out += K.line(V, act([pivot, [r[0] + (k === "up" ? 1.5 : -1.5), r[1] + 1.8]]), "vis");
    out += K.body(V, act(K.circle(r[0], r[1], 2.5, 12)));
  }
  return part(22, out);
}
// the mount: the bracket's clevis pin through the gearbox's lug
function actMount(V) {
  return part(23, K.cut(V, act(K.rect(-26, -22, -12.5, 22)), { mat: "steel", angle: 135 }) + K.body(V, act(K.circle(0, 0, 3.2, 12))));
}

// ---------------------------------------------------------------- VIEW D: the selector (u, v about the pivot)
const LEVER0 = 160; // the lever's direction (deg) at flaps 0; + turns the knob down
const SCALE0 = 250; // the pointer's direction at flaps 0
const PANEL_U = -72;
const leverDir = (lv) => LEVER0 + lv;
function selPanel(V) {
  const t = 1.6;
  const top = K.rect(PANEL_U, 38, PANEL_U + t, 96);
  const bot = K.rect(PANEL_U, -112, PANEL_U + t, -48);
  return part(24, K.cut(V, top, { mat: "solid" }) + K.cut(V, bot, { mat: "solid" }));
}
// the scale the pointer reads: marks at the carrier's angles for 0, 10, 20 and 30 (uneven)
function selScale(V) {
  let out = "";
  const arc = (r0, r1, a0, a1) => [...K.arc(0, 0, r1, a0, a1, 20), ...K.arc(0, 0, r0, a1, a0, 20)];
  out += K.body(V, arc(84, 98, SCALE0 - 8, SCALE0 + M.MARKS[30] + 8));
  for (const f of M.FLAP_STOPS) {
    const a = (SCALE0 + M.MARKS[f]) * rad;
    out += K.line(V, [[90 * Math.cos(a), 90 * Math.sin(a)], [98 * Math.cos(a), 98 * Math.sin(a)]], "vis");
  }
  return part(24, out);
}
function selScaleText(V) {
  let out = "";
  for (const f of M.FLAP_STOPS) {
    const a = (SCALE0 + M.MARKS[f]) * rad;
    const [x, y] = V.p([106 * Math.cos(a), 106 * Math.sin(a)]);
    out += `<text class="t t-sm" x="${x}" y="${K.r2(y + 2.6)}" text-anchor="middle">${f}</text>`;
  }
  return `<g data-role="engraved">${out}</g>`;
}
// the switch carrier: a disc with the follow-up cable's groove (R 60) and the pointer
function selCarrier(V, cv) {
  const r = M.PULLEY_R;
  const rotp = (pts) => X.rot(pts, [0, 0], cv);
  let out = "";
  out += K.body(V, rotp(K.circle(0, 0, r, 48)));
  out += K.line(V, rotp(K.circle(0, 0, r - 4, 48)), "thin", true);
  const pa = SCALE0 * rad;
  const ptr = [[r - 4, -3], [92, -1], [94, 0], [92, 1], [r - 4, 3]].map(([u, v]) => [u * Math.cos(pa) - v * Math.sin(pa), u * Math.sin(pa) + v * Math.cos(pa)]);
  out += K.body(V, rotp(ptr));
  return part(25, out);
}
// the carrier's DOWN and UP micro-switches either side of the lever's cam
const SW_R = 42; // the switches' rollers and the cam, on the lever's tail behind the pivot
const CAM_HALF = 2.6; // mm each side of the cam lobe
const ROLL_R = 2.4;
// the rollers sit so the cam meets one when the lever leads the carrier by DB_ON
const SW_GAP = ((CAM_HALF + ROLL_R) / SW_R) * (180 / Math.PI) + M.DB_ON;
function selSwitches(V, cv, lv) {
  let out = "";
  for (const sg of [1, -1]) {
    const a = LEVER0 + 180 + cv + sg * SW_GAP;
    const body = X.rot(K.rrect(SW_R + 4, -4.5, SW_R + 18, 4.5, 1.2), [0, 0], a);
    out += K.cut(V, body, { mat: "plastic", angle: 60 });
    // the cam pushes the roller round when the lever leads by more than DB_ON
    const lead = sg > 0 ? lv - cv : cv - lv;
    const push = Math.max(0, Math.min(2.5, lead - M.DB_ON));
    const rp = X.rot([[SW_R, 0]], [0, 0], a + sg * push)[0];
    const pv = X.rot([[SW_R + 4, sg * 3.5]], [0, 0], a)[0];
    out += K.line(V, [pv, rp], "vis");
    out += K.body(V, K.circle(rp[0], rp[1], ROLL_R, 12));
  }
  return part(25, out);
}
// the lever: hub, arm through the panel, flap-shaped knob; the tail behind the pivot with its cam
function selLever(V, lv) {
  const a = leverDir(lv);
  const rotp = (pts) => X.rot(pts, [0, 0], a);
  let out = "";
  out += K.body(V, rotp([[-SW_R + 4, -5], [0, -7], [114, -4], [114, 4], [0, 7], [-SW_R + 4, 5]]));
  const knob = [[112, -5], [118, -9], [128, -10.5], [140, -7], [146, -2], [146, 2], [134, 6], [118, 7], [112, 5]];
  out += K.body(V, rotp(knob));
  out += K.body(V, rotp([[-SW_R + 5, -CAM_HALF], [-SW_R - 4, -CAM_HALF], [-SW_R - 5.5, 0], [-SW_R - 4, CAM_HALF], [-SW_R + 5, CAM_HALF]]));
  out += K.body(V, K.circle(0, 0, 10, 24)) + K.line(V, K.circle(0, 0, 4, 12), "thin", true);
  return part(24, out);
}
function selDetent(V) {
  const notches = M.FLAP_STOPS.map((f) => LEVER0 + M.leverOf(f));
  const outer = [];
  const a0 = LEVER0 - M.OVER - 8;
  const a1 = LEVER0 + M.leverOf(30) + 8;
  for (let a = a0; a <= a1 + 0.01; a += 1) {
    const dmin = Math.min(...notches.map((n) => Math.abs(n - a)));
    const r = dmin < 2.1 ? 26 - (2.1 - dmin) * 1.6 : 26;
    outer.push([r * Math.cos(a * rad), r * Math.sin(a * rad)]);
  }
  const inner = K.arc(0, 0, 15, a1, a0, 30);
  return part(24, K.body(V, [...outer, ...inner]));
}
// the follow-up cable round the groove, leaving the bottom aft toward the wing; the return spring on top
function selCable(V, cv) {
  const r = M.PULLEY_R - 2;
  return part(13, K.line(V, [...K.arc(0, 0, r, 200 + cv, 270, 10), [118, -r]], "vis"));
}
function selSpring(V, cv) {
  const r = M.PULLEY_R - 2;
  return part(25, K.line(V, K.arc(0, 0, r, 130 + cv, 90, 8), "vis") + K.line(V, [[0, r], [8, r]], "vis") + K.springSection(V, { from: 8, to: 106, radius: 4, wire: 1.2, turns: 10, axis: "u", at: r }) + K.body(V, K.rect(106, r - 7, 114, r + 7)));
}
function selBreaker(V) {
  return part(26, K.body(V, K.rect(PANEL_U + 1.6, -82, PANEL_U + 30, -66)) + K.body(V, K.rect(PANEL_U - 13, -78.5, PANEL_U, -69.5)));
}

// ---------------------------------------------------------------- DIAGRAM 4: one branch of the circuit
// a limit switch (normally closed; open at its end of travel) over the selector's changeover switch
// (motor terminal to ground at rest, to the bus when it operates), at sheet x bx below the bus at y
function circuitBranch(bx, y, xMid, limClosed, swOn) {
  const out = bx < xMid ? -1 : 1;
  const lim = limClosed ? `M${bx} ${y + 44}V${y + 66}` : `M${bx} ${y + 44}V${y + 50}L${bx + 7 * out} ${y + 61}M${bx} ${y + 62}V${y + 66}`;
  const sw = swOn ? `M${bx} ${y + 66}V${y + 84}L${bx} ${y + 100}V${y + 112}` : `M${bx} ${y + 66}V${y + 84}M${bx} ${y + 100}V${y + 112}M${bx} ${y + 100}L${bx + 16 * out} ${y + 104}`;
  return `<path class="vis" d="${lim}${sw}"/><circle class="dot" cx="${bx}" cy="${y + 84}" r="1.4"/><circle class="dot" cx="${bx}" cy="${y + 100}" r="1.4"/>`;
}

// the same, horizontal: a branch from the split at x to the selector switch's common at x + 84. The
// changeover's rest contact (to ground) lies toward the ground bar: below the branch (side 1) or above
// it (side −1).
function circuitBranchH(x, y, side, limClosed, swOn) {
  const lim = limClosed ? `M${x + 4} ${y}H${x + 24}` : `M${x + 4} ${y}L${x + 21} ${y - 7}M${x + 24} ${y}H${x + 24}`;
  const nc = [x + 62, y + side * 12];
  const blade = swOn ? `M${x + 84} ${y}L${x + 62} ${y}` : `M${x + 84} ${y}L${nc[0] + 1} ${nc[1] - side * 1}`;
  const wires = `M${x} ${y}H${x + 4}M${x + 24} ${y}H${x + 62}M${nc[0]} ${nc[1]}V${y + side * 24}`;
  const dots = [[x + 4, y], [x + 24, y], [x + 62, y], [nc[0], nc[1]], [x + 84, y]].map(([a, b]) => `<circle class="dot" cx="${a}" cy="${b}" r="1.3"/>`).join("");
  return `<path class="vis" d="${wires}${lim}${blade}"/>${dots}`;
}

// ---------------------------------------------------------------- SECTION B-B: between the tracks
// The flap cut in full (no notch out here): its skin all round, its spar, the trailing edge's filler.
function flapFull(V, s) {
  const P = M.poseOfS(s);
  const t = tVis(V, M.SKIN);
  const pl = (pts) => sec(pts.map((p) => M.place(p, P)));
  const w = tVis(V, 1.0, 0.9);
  const FSx = M.FLAP.spar;
  const web = [[FSx, M.lo(FSx) + t], [FSx + w, M.lo(FSx) + t], [FSx + w, M.flapUp(FSx) - t], [FSx, M.flapUp(FSx) - t]];

// Page code for wing-flaps.html. K (kit), L (runtime), C (self-check), M (model), X (extra) and P
// (parts) are inlined above this script as namespaces. One state (model.mjs's system) drives every
// view: the selector lever leads, the switches decide, the motor turns the screw, the nut moves the
// bellcranks, the rods and cables move both flaps along their tracks, the follow-up turns the carrier.

const svg = document.querySelector(".bp-sheet");
const q = L.setupPage(svg);
const specs = JSON.parse(svg.dataset.views);
const LIVE = JSON.parse(svg.dataset.live);
const VA = K.view(specs.A);
const VB = K.view(specs.B);
const VC = K.view(specs.C);
const VP = K.view(specs.P);
const VD = K.view(specs.D);
const { CH, CV, CK, EC, DIM_TE_Y, DIM_C_Y, B } = {"CH":{"x0":690,"x1":890,"y0":48,"y1":190,"a0":-4,"a1":22,"c0":0,"c1":2},"CV":{"x0":948,"x1":1150,"y0":48,"y1":190,"f1":30,"v0":40,"v1":80},"CK":{"x0":524,"x1":812,"y0":540,"y1":700,"n1":135,"y1v":35,"c1":7},"EC":{"x":92,"y":712},"DIM_TE_Y":234,"DIM_C_Y":434,"B":{"cx":548,"cy":136,"r":92,"wx":1268,"wy":-6}};
const $ = (id) => document.getElementById(id);
const sec = P.sec;
const act = P.act;
const say = L.announcer($("sr"), 2);

// ---------------------------------------------------------------- state
let st = M.system(0, 0);
st.v = M.TOUR_V;
let mode = "tour"; // "tour": the tour moves the selector; "hand": the reader does
let tourT = 0;
let vTarget = M.TOUR_V;
let dragLever = null; // the lever's angle while the knob is dragged
const shown = { s: -1e9, spin: -1e9, lever: -1e9, carrier: -1e9, v: -1e9, run: "" };

function step(dt, live) {
  if (live.touring && mode !== "tour") {
    // the tour takes over from where the flaps are
    mode = "tour";
    const f = M.flapOf(M.sOfNut(st.n));
    tourT = f > 25 ? 13.6 : f > 15 ? 9.8 : f > 5 ? 5.8 : 0;
    vTarget = M.TOUR_V;
  }
  const n = Math.max(1, Math.ceil(dt * 480));
  const h = dt / n;
  for (let i = 0; i < n; i++) {
    if (mode === "tour") {
      tourT += h;
      if (tourT >= M.TOUR_PERIOD) tourT -= M.TOUR_PERIOD;
      st.sel = M.selAt(tourT);
    }
    st.leverAt = dragLever;
    st.v = live.reduced ? vTarget : L.follow(st.v, vTarget, 3, h);
    M.step(st, h);
  }
  return mode === "tour" || st.w > 0 || st.down || st.up || Math.abs(st.v - vTarget) > 0.05 || dragLever != null;
}

// ---------------------------------------------------------------- drawing helpers
const cx = (a) => K.r2(CH.x0 + ((a - CH.a0) / (CH.a1 - CH.a0)) * (CH.x1 - CH.x0));
const cy = (c) => K.r2(CH.y1 - ((Math.max(CH.c0, Math.min(CH.c1, c)) - CH.c0) / (CH.c1 - CH.c0)) * (CH.y1 - CH.y0));
const curvePts = (f) => {
  const out = [];
  for (let a = CH.a0; a <= Math.min(CH.a1, M.alphaPeak(f) + 4.5); a += 0.25) out.push(`${cx(a)},${cy(M.clCurve(a, f))}`);
  return out.join(" ");
};
const vx = (f) => K.r2(CV.x0 + (f / CV.f1) * (CV.x1 - CV.x0));
const vy = (v) => K.r2(CV.y1 - ((Math.max(CV.v0, Math.min(CV.v1, v)) - CV.v0) / (CV.v1 - CV.v0)) * (CV.y1 - CV.y0));
const kx = (n) => K.r2(CK.x0 + (Math.max(0, Math.min(CK.n1, n)) / CK.n1) * (CK.x1 - CK.x0));
const ky = (v) => K.r2(CK.y1 - (Math.max(0, Math.min(CK.y1v, v)) / CK.y1v) * (CK.y1 - CK.y0));

function sectionInto(V, pre, s) {
  $(`${pre}-act`).innerHTML = P.actuatorEnd(V, s);
  $(`${pre}-bc`).innerHTML = P.bellcrankEdge(V, s);
  $(`${pre}-nose`).innerHTML = P.flapNose(V, s);
  $(`${pre}-lug`).innerHTML = P.lug(V, s);
  $(`${pre}-rod`).innerHTML = P.rodSection(V, s);
  $(`${pre}-bracket`).innerHTML = P.bracket(V, s);
  $(`${pre}-aft`).innerHTML = P.flapAft(V, s);
  $(`${pre}-rollers`).innerHTML = P.rollers(V, s);
}
function flowInto(V, id, s) {
  const f = P.slotFlow(s);
  const k = P.flowStrength(f.gap);
  const node = $(id);
  node.innerHTML = k > 0 ? f.lines.map((l) => X.flowLine(V, sec(l))).join("") : "";
  node.setAttribute("opacity", K.r2(0.25 + 0.75 * k));
}
// where the moving balloons' dots go, in the section's world
function dotA(n, s) {
  const Pz = M.poseOfS(s);
  const b = M.betaOf(s);
  if (n === "4") return M.place([1450, M.lo(1450) + 0.6], Pz);
  if (n === "6") return M.place([1292, M.lo(1292) - 6], Pz);
  if (n === "7") return M.place([M.R2_0[0], M.R2_0[1] - 8], Pz);
  if (n === "8") return M.place([M.LUG[0] + 14, M.LUG[1] + 6], Pz);

    const a = M.lugAt(s);
    const h = M.holeOf(b, "R");
    return [h[0] + (a[0] - h[0]) * 0.55, M.ROD_Y + (a[1] - M.ROD_Y) * 0.55];
  }
  const xs = ["R", "A", "C1", "C2", "F"].map((k) => M.holeOf(b, k)[0]);
  return [Math.min(...xs) - 7, M.BC.y];
}
function dimsA(s) {
  const g = M.geometry(s);
  let out = "";
  const TE0 = M.geometry(0).te;
  if (g.te[0] - TE0[0] >= 1) out += K.dim(VA, sec([TE0])[0], sec([g.te])[0], { dir: "h", off: DIM_TE_Y - VA.p(sec([TE0])[0])[1], text: `${Math.round(g.te[0] - TE0[0])}`, id: "dim-te" });
  if (g.flap >= 12) out += X.angleDim(VA, sec([M.place(M.NOSE_C, g.P)])[0], 84, 180, 180 + g.flap, `${K.fmt(g.flap, 1)}°`, { id: "dim-ang" });

  let best = null;
  let bd = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i];
    const c = pts[(i + 1) % pts.length];
    const dx = c[0] - a[0];
    const dy = c[1] - a[1];
    const t = Math.max(0, Math.min(1, ((M.LIP[0] - a[0]) * dx + (M.LIP[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
    const p = [a[0] + t * dx, a[1] + t * dy];

    const n = st.n;
    const len = M.LEN0 + n;

    $("c-rod").innerHTML = P.actRod(VC, n, len);
    $("c-sw").innerHTML = P.actSwitches(VC, n);
    $("c-dyn").innerHTML = n >= 2 ? K.dim(VC, act([[M.LEN0, 0]])[0], act([[len, 0]])[0], { dir: "h", off: DIM_C_Y - VC.p(act([[M.LEN0, 0]])[0])[1], text: K.fmt(n, 1), id: "dim-stroke" }) : "";
    $("lb-18").innerHTML = K.balloon(VC, act([[P.nutA(n) + 15, -11]])[0], LIVE.C[18].at, 18, { target: 18 });
    $("lb-19").innerHTML = K.balloon(VC, act([[len - 4, -9]])[0], LIVE.C[19].at, 19, { target: 19 });
    // diagram 3
    $("k-cur").setAttribute("d", `M${kx(n)} ${CK.y0}V${CK.y1}`);
    $("k-dot").setAttribute("cx", kx(n));

  const lv = st.lever;
  const cv = st.carrier;
  if (Math.abs(lv - shown.lever) > 0.02 || Math.abs(cv - shown.carrier) > 0.02) {
    $("d-carrier").innerHTML = P.selCarrier(VD, cv);
    $("d-cable").innerHTML = P.selCable(VD, cv);
    $("d-spring").innerHTML = P.selSpring(VD, cv);
    $("d-sw").innerHTML = P.selSwitches(VD, cv, lv);
    $("d-lever").innerHTML = P.selLever(VD, lv);
    const a = ((P.LEVER0 + lv) * Math.PI) / 180;
    $("lb-24").innerHTML = K.balloon(VD, [80 * Math.cos(a), 80 * Math.sin(a)], LIVE.D[24].at, 24, { target: 24 });
    shown.lever = lv;
    shown.carrier = cv;

  $("cl-need").setAttribute("d", `M${CH.x0} ${cy(fl.cl)}H${CH.x1}`);

    shown.v = Math.round(st.v);
  }

  const run = st.w > 0 ? (st.dir > 0 ? "DOWN" : "UP") : "STOPPED";
  const key = `${st.limDown}${st.limUp}${st.down}${st.up}${run}`;
  if (key !== shown.run) {

  $("readout2").textContent = `${Math.round(st.v)} kt · C_L ${fl.cl.toFixed(2)} · α ${fl.alpha.toFixed(1)}° · V_S ${fl.vs.toFixed(1)} kt · SLOT ${Math.round(g.gap)} mm · CHORD +${((100 * (g.chord - M.C)) / M.C).toFixed(1)} %${fl.stalled ? " · STALLED" : ""}${st.v > M.V_FE && g.flap > 0.5 ? " · ABOVE V_FE" : ""}`;

    `Selector ${st.sel} degrees, flaps ${g.flap.toFixed(0)} degrees, motor ${run.toLowerCase()}. ${Math.round(st.v)} knots, angle of attack ${fl.alpha.toFixed(1)} degrees, stall speed ${fl.vs.toFixed(0)} knots.`,

// ---------------------------------------------------------------- input
const live = L.run({ root: svg, step, render, idleAfter: 8, onFrozen: () => q.check && C.selfCheck(svg) });

if (live.reduced && !live.frozen) {
  // a still, true moment: flaps 20° on the way to 30°
  const fake = { touring: true, reduced: false, clock: 0 };
  for (let t = 0; t < 12.6; t += 1 / 240) step(1 / 240, fake);
  render(live);
}

function toHand() {
  if (mode === "tour") mode = "hand";
}
const stops = M.FLAP_STOPS;
function select(f) {
  toHand();
  dragLever = null;
  st.sel = f;
}
// drag the knob: the lever follows the pointer; on release it drops into the nearest detent
const hitEl = svg.querySelector('[data-drag="knob"]');
let lv0 = 0;
L.dragY(svg, hitEl, {
  start: () => {
    toHand();
    lv0 = st.lever;
    dragLever = lv0;
    live.input();
  },
  move: (dy) => {
    // the knob sits about 146 mm out: a sheet distance down turns the lever by that much over the radius
    const d = (dy / VD.k / 146) * (180 / Math.PI);
    dragLever = Math.max(-M.OVER, Math.min(M.MARKS[30] + M.OVER, lv0 + d));
    live.input();
  },
  end: () => {
    const lvNow = dragLever ?? st.lever;
    const best = stops.reduce((a, f) => (Math.abs(M.leverOf(f) - lvNow) < Math.abs(M.leverOf(a) - lvNow) ? f : a), 0);
    select(best);
    live.input();
  },
});
svg.addEventListener("keydown", (e) => {
  const k = e.key;
  const i = stops.indexOf(st.sel);
  if (k === "ArrowDown") select(stops[Math.min(stops.length - 1, i + 1)]);
  else if (k === "ArrowUp") select(stops[Math.max(0, i - 1)]);
  else if (k >= "0" && k <= "3") select(stops[Number(k)]);
  else if (k === "ArrowLeft" || k === "ArrowRight") {
    toHand();

    mode = "tour";
    tourT = 0;
    st = M.system(0, 0);
    st.v = vTarget = M.TOUR_V;
  } else if (k === "s" || k === "S") live.slow = live.slow === 1 ? 0.25 : live.slow === 0.25 ? 0.06 : 1;

});

if (q.check && !live.frozen) setTimeout(() => C.selfCheck(svg), 400);

</script>
<script>
"use strict";
const BP_LINKS = {};
const BP_ATLAS = {"slug":"wing-flaps","kind":"2d","level":1,"parent":"light-aircraft","parentPart":"14","atlas":false};
const BP_CARDS = (() => {
// Part cards: hover, tap or focus a balloon and a small card names the part, gives its size and
// material, and says in a sentence what it does. The part it points to lights up in the accent.
//
// Works on both pages: a 2D sheet's balloons are <g data-role="balloon" data-target="n">, a 3D page's
// are <g data-part="n"> in its overlay (re-drawn every frame, so everything here is delegated and
// keyed on the number, never on the element). The data comes from examples/<slug>/info.json, which
// kit/page.mjs inlines as BP_INFO when it exists:
//   { "4": { "name": "O-ring", "spec": "33 × 2", "material": "NBR 70", "note": "Seals the barrel..." } }
// 2D: the part's [data-part] groups get the class bp-hl.  3D: a "bp:part" event (detail.id, or null)
// that kit/solid3d.mjs answers by tinting the part.
//
// Atlas (references/atlas.md): a part with "open": "<slug>" is a doorway into another example. Its card
// adds the child's idea and a "Look inside →" link (or "drawing in progress" while the child is not
// drawn). Activating it (the link, Enter on the focused balloon, double-click on the part in 3D) flies
// in and then navigates: a "bp:open" event (detail { id, href, go }) that kit/solid3d.mjs takes over
// by calling preventDefault (it flies the camera, then calls go); on a 2D sheet the viewBox eases in on
// the part here. links: page.mjs's BP_LINKS; atlas: BP_ATLAS, the page's own slug and place.
// The page also answers ?focus=<part> (start zoomed on that part, ease out) and ?from=<slug> (a short

function attach({ info = {}, links = null, atlas = null, root = document }) {
  info = info || {};

  const Q = new URLSearchParams(location.search);

  const sheet = is3d ? null : root.querySelector("svg.bp-sheet");
  if (!has && !atlas) return null;

  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

    for (const el of document.querySelectorAll(".bp-hl")) el.classList.remove("bp-hl");

  const doorway = (id) => {

    if (!href) return { slug, wip: true };
