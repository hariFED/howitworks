/* Blueprint sheet styles. Every colour a drawing uses is one of these tokens. */

:root,
[data-theme="blueprint"] {

  --bp-ui: rgba(233, 241, 255, 0.12);
}
[data-theme="paper"] {
  --bp-page: #e4dfd1;
  --bp-paper: #f7f3e8;
  --bp-ink: #1c2633;
  --bp-hatch: rgba(28, 38, 51, 0.78);
  --bp-muted: #616b78;
  --bp-grid: rgba(28, 38, 51, 0.045);
  --bp-accent: #d4472c;
  --bp-accent-ink: #b8361e;
  --bp-ui: rgba(28, 38, 51, 0.08);
}
[data-theme="dark"] {
  --bp-page: #0d0f12;
  --bp-paper: #15181c;
  --bp-ink: #dde3ea;
  --bp-hatch: rgba(221, 227, 234, 0.62);
  --bp-muted: #86919d;
  --bp-grid: rgba(221, 227, 234, 0.035);
  --bp-accent: #f29f3d;
  --bp-accent-ink: #f6b462;
  --bp-ui: rgba(221, 227, 234, 0.08);
}

:root {
  --bp-thick: 1.15px;

html,
body {
  margin: 0;
  background: var(--bp-page);
  color: var(--bp-ink);
  font-family: var(--bp-font);
}
.bp-page {
  max-width: 1480px;
  margin: 0 auto;
  padding: 24px 16px 40px;
  box-sizing: border-box;
}
.bp-figure {
  margin: 0;
}
.bp-sheet {
  display: block;
  width: 100%;
  height: auto;
  outline: none;
  border-radius: 2px;
}
.bp-sheet:focus-visible {
  box-shadow: 0 0 0 2px var(--bp-accent);
}
.bp-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  font-size: 12px;
  color: var(--bp-muted);
  letter-spacing: 0.03em;
}
.bp-bar kbd {
  font: inherit;
  color: var(--bp-ink);
  border: 1px solid var(--bp-ui);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 0 4px;
}
.bp-themes {
  display: flex;
  gap: 4px;
}
.bp-themes button {
  font: inherit;
  color: var(--bp-muted);
  background: transparent;
  border: 1px solid var(--bp-ui);
  border-radius: 3px;
  padding: 3px 9px;
  cursor: pointer;
}
.bp-themes button[aria-pressed="true"] {
  color: var(--bp-ink);
  background: var(--bp-ui);
}
.bp-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Zoom mode (?zoom=x,y,w,h): the region fills the window, for close-up checks. */
body.bp-zoom .bp-page {
  max-width: none;
  padding: 0;
}
body.bp-zoom .bp-sheet {
  width: 100vw;
  height: 100vh;
}
body.bp-zoom .bp-bar {
  display: none;
}

/* ---- the drawing */
.bp-sheet .sheet-bg {
  fill: var(--bp-paper);
}
.bp-sheet .grid {
  fill: none;
  stroke: var(--bp-grid);
  stroke-width: 0.5px;
}
.bp-sheet .vis,
.bp-sheet .thin,
.bp-sheet .hid,
.bp-sheet .ctr,
.bp-sheet .phan {
  fill: none;
  stroke: var(--bp-ink);
  stroke-linejoin: round;
  stroke-linecap: round;
}
.bp-sheet .vis {
  stroke-width: var(--bp-thick);
}
.bp-sheet .thin,
.bp-sheet .hid,
.bp-sheet .ctr,
.bp-sheet .phan {
  stroke-width: var(--bp-thin);
}
.bp-sheet .hid {
  stroke-dasharray: 4 2.2;
  stroke-linecap: butt;
}
.bp-sheet .ctr {
  stroke-dasharray: 15 2.6 2 2.6;
  stroke-linecap: butt;
}
.bp-sheet .phan {
  stroke-dasharray: 13 2.4 1.8 2.4 1.8 2.4;
  stroke-linecap: butt;
}
.bp-sheet .vis.spring {
  stroke-width: var(--bp-thin);
}
.bp-sheet .paper,
.bp-sheet .balloon {
  fill: var(--bp-paper);
}
.bp-sheet .balloon {
  stroke: var(--bp-ink);
  stroke-width: var(--bp-thin);
}
.bp-sheet .solid,
.bp-sheet .head,
.bp-sheet .dot {
  fill: var(--bp-ink);
}
.bp-sheet .hl {
  fill: none;
  stroke: var(--bp-hatch);
  stroke-width: 0.5px;
}
.bp-sheet .hl-dash {
  stroke-dasharray: 1.3 1.3;
}
.bp-sheet .hd {
  fill: var(--bp-hatch);
}
.bp-sheet .tint {
  fill: var(--bp-accent);
}
.bp-sheet .accent {
  stroke: var(--bp-accent);
}
.bp-sheet .accent-fill {
  fill: var(--bp-accent);
}
.bp-sheet .t {
  font-family: var(--bp-font);
  font-size: 9.5px;
  fill: var(--bp-ink);
  letter-spacing: 0.02em;
}
.bp-sheet .t-sm {
  font-size: 7.6px;
}
.bp-sheet .t-lg {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
}
.bp-sheet .t-xl {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.05em;
}
.bp-sheet .t-cap {
  font-size: 6.2px;
  fill: var(--bp-muted);
  letter-spacing: 0.08em;
}
.bp-sheet .t-head {
  font-weight: 600;
  letter-spacing: 0.06em;
}
.bp-sheet .t-mute {
  fill: var(--bp-muted);
}
.bp-sheet .t-accent {
  fill: var(--bp-accent-ink);
}
.bp-sheet [data-drag] {
  cursor: ns-resize;
  touch-action: none;
}

.bp-sheet .hit{fill:transparent}.bp-sheet .grid-line{stroke:var(--bp-grid);stroke-width:.6px}.bp-sheet .cam-tint{fill:var(--bp-accent);fill-opacity:.38}.bp-sheet .cam-line{stroke:var(--bp-accent)}.bp-sheet .cam-hl{fill:none;stroke:var(--bp-accent);stroke-width:.6px}.bp-sheet .ink{fill:url(#ink)}.bp-sheet .path-dash{stroke-dasharray:3 2}.bp-sheet .sd-box.on{stroke:var(--bp-accent);stroke-width:2px}.bp-sheet [data-drag]{cursor:ew-resize}

<script>
"use strict";
const K = (() => {
// Blueprint drafting kit: orthographic views, sections, hatching, dimensions and sheet furniture.
// Every function here is pure and returns SVG markup strings, so the same code runs in the build
// and, inlined, in the page (live dimensions, moving springs, needles).
//
// Units. World geometry is in millimetres of the real object: u to the right, v up (a front view),
// or u right, v away from the viewer (a plan view). The sheet is an A2 drawing, 594 mm wide, drawn
// 1200 units wide; a view maps world mm to sheet units through its drawing scale.

const SHEET = { w: 1200, h: 848 };
const PX_PER_MM = SHEET.w / 594;

// ISO 128 line widths and ISO 3098 lettering, in sheet units (A2: 0.5 / 0.25 mm lines, 3.5 mm text).
const THICK = 1.15;
const THIN = 0.55;
const TEXT = 9.5;
const ARROW = 7;
const GAP = 2.2; // extension lines start this far from the object
const OVER = 3.5; // and run this far past the dimension line

const r2 = (n) => Math.round(n * 100) / 100;

function fmt(n, digits = 1) {
  const near = Math.round(n);
  if (Math.abs(n - near) < 0.05) return String(near);
  return n.toFixed(digits);
}

// ---------------------------------------------------------------- views

// A view is a window from world mm onto the sheet. scale is the drawing scale (1/2.5 for "1:2.5").
function view({ x, y, scale, name = "" }) {
  const k = scale * PX_PER_MM;
  return { x, y, scale, k, name, p: ([u, v]) => [r2(x + u * k), r2(y - v * k)] };
}

const scaleLabel = (scale) => (scale >= 1 ? `${fmt(scale)}:1` : `1:${fmt(1 / scale)}`);

function d(V, pts, closed = true) {
  let out = "";
  for (let i = 0; i < pts.length; i++) {
    const [x, y] = V.p(pts[i]);
    out += `${i ? "L" : "M"}${x} ${y}`;
  }
  return closed ? out + "Z" : out;
}

// ---------------------------------------------------------------- world geometry (point lists)

const rect = (u0, v0, u1, v1) => [[u0, v0], [u1, v0], [u1, v1], [u0, v1]];

function arc(cu, cv, r, a0, a1, steps) {
  const n = steps ?? Math.max(3, Math.ceil(Math.abs(a1 - a0) / 7.5));
  const out = [];
  for (let i = 0; i <= n; i++) {
    const a = ((a0 + ((a1 - a0) * i) / n) * Math.PI) / 180;
    out.push([cu + r * Math.cos(a), cv + r * Math.sin(a)]);
  }
  return out;
}

const circle = (cu, cv, r, steps = 48) => arc(cu, cv, r, 0, 360 - 360 / steps, steps - 1);

// A rectangle with filleted corners.
function rrect(u0, v0, u1, v1, r, steps = 4) {
  const q = Math.min(r, (u1 - u0) / 2, (v1 - v0) / 2);
  return [
    ...arc(u1 - q, v0 + q, q, -90, 0, steps),
    ...arc(u1 - q, v1 - q, q, 0, 90, steps),
    ...arc(u0 + q, v1 - q, q, 90, 180, steps),
    ...arc(u0 + q, v0 + q, q, 180, 270, steps),
  ];
}

const move = (pts, du, dv) => pts.map(([u, v]) => [u + du, v + dv]);
const flipU = (pts, about = 0) => pts.map(([u, v]) => [2 * about - u, v]).reverse();
const flipV = (pts, about = 0) => pts.map(([u, v]) => [u, 2 * about - v]).reverse();

function inside([u, v], poly) {
  let hit = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [ui, vi] = poly[i];
    const [uj, vj] = poly[j];
    if (vi > v !== vj > v && u < ((uj - ui) * (v - vi)) / (vj - vi) + ui) hit = !hit;
  }
  return hit;
}

// A body of revolution cut through its axis.
// loop is the half-profile as [r, s] pairs: r >= 0 measured from the axis, s along the axis.
// axis "v" is a vertical axis at u = at; axis "u" a horizontal axis at v = at.
// Returns the cut faces (hatched) and the edges seen through the bore behind the cutting plane:
// every circle on an inner surface shows edge-on as a straight line across the bore.
function revolve(loop, { axis = "v", at = 0 } = {}) {
  const place = axis === "v" ? (r, s) => [at + r, s] : (r, s) => [s, at + r];
  const n = loop.length;
  const onAxis = loop.findIndex(([r], i) => r === 0 && loop[(i + 1) % n][0] === 0);
  let cuts;
  if (onAxis >= 0) {
    const chain = Array.from({ length: n }, (_, j) => loop[(onAxis + 1 + j) % n]);
    const right = chain.map(([r, s]) => place(r, s));
    const left = chain.slice(1, -1).reverse().map(([r, s]) => place(-r, s));
    cuts = [[...right, ...left]];
  } else {
    cuts = [loop.map(([r, s]) => place(r, s)), loop.map(([r, s]) => place(-r, s)).reverse()];
  }
  const eps = 1e-3;
  const across = new Map();
  const clear = (r, s) => [0.02, 0.25, 0.5, 0.75, 0.98].every((t) => !inside([t * r, s], loop));
  for (const [r, s] of loop) {
    if (r <= 0) continue;
    if (clear(r, s + eps) && clear(r, s - eps)) across.set(s, Math.max(across.get(s) ?? 0, r));
  }
  const edges = [...across].map(([s, r]) => [place(-r, s), place(r, s)]);
  return { cuts, edges };
}

// ---------------------------------------------------------------- hatching

// ANSI/ISO-style material hatches. Spacing is in sheet units and never scales with the view,
// so a detail at 2:1 shows the same density as the main view, as on a real drawing.
const MATERIALS = {
  steel: { kind: "lines", gap: 3.4 },
  iron: { kind: "lines", gap: 5.6 },
  alu: { kind: "pairs", gap: 5.2, pair: 1.5 },
  brass: { kind: "dashed", gap: 4.6 },
  bronze: { kind: "dashed", gap: 3.6 },
  rubber: { kind: "cross", gap: 3.2 },
  plastic: { kind: "lines", gap: 2.3 },
  foam: { kind: "dots", gap: 2.6 },
  wood: { kind: "grain", gap: 4 },
};
const ANGLES = [45, 135, 30, 60];

function hatchDefs() {
  let out = "";
  for (const [name, m] of Object.entries(MATERIALS)) {
    for (const angle of ANGLES) {
      const g = m.gap;
      let body = "";
      if (m.kind === "lines") body = `<path class="hl" d="M0 -1V${g + 1}"/>`;
      if (m.kind === "pairs") body = `<path class="hl" d="M0 -1V${g + 1}M${m.pair} -1V${g + 1}"/>`;
      if (m.kind === "dashed") body = `<path class="hl" d="M0 -1V${g + 1}"/><path class="hl hl-dash" d="M${g / 2} -1V${g + 1}"/>`;
      if (m.kind === "cross") body = `<path class="hl" d="M0 -1V${g + 1}M-1 0H${g + 1}"/>`;
      if (m.kind === "dots") body = `<circle class="hd" cx="${g / 2}" cy="${g / 2}" r="0.42"/>`;
      if (m.kind === "grain") body = `<path class="hl" d="M0 -1V${g + 1}"/><path class="hl" d="M${g * 0.55} -1C${g * 0.75} ${g * 0.3} ${g * 0.35} ${g * 0.7} ${g * 0.55} ${g + 1}"/>`;
      out += `<pattern id="h-${name}-${angle}" patternUnits="userSpaceOnUse" width="${g}" height="${g}" patternTransform="rotate(${angle})">${body}</pattern>`;
    }
  }
  return out;
}

// ---------------------------------------------------------------- drawing parts

// A cut face: paper underneath (it hides what is behind), the material hatch, a thick outline.
// mat "solid" blacks the section in, the ISO convention for sections too thin to hatch.
function cut(V, pts, { mat = "steel", angle = 45 } = {}) {
  const dd = d(V, pts);
  if (mat === "solid") return `<path class="solid" d="${dd}"/>`;
  return `<path class="paper" d="${dd}"/><path fill="url(#h-${mat}-${angle})" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

// A body of revolution in section, with the edges behind the cut.
function section(V, rev, opts) {
  return rev.cuts.map((c) => cut(V, c, opts)).join("") + rev.edges.map((e) => line(V, e)).join("");
}

// An unsectioned solid (shafts, rods, pins, balls, nuts and ribs are never hatched in a section).
function body(V, pts) {
  const dd = d(V, pts);
  return `<path class="paper" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

const line = (V, pts, cls = "vis", closed = false) => `<path class="${cls}" d="${d(V, pts, closed)}"/>`;
const lines = (V, list, cls = "vis") => `<path class="${cls}" d="${list.map((pts) => d(V, pts, false)).join("")}"/>`;

// A centre line, run a little past the outline at both ends.
function centerline(V, a, b, over = 6) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  return `<path class="ctr" d="M${r2(ax - ux * over)} ${r2(ay - uy * over)}L${r2(bx + ux * over)} ${r2(by + uy * over)}"/>`;
}

// Centre mark for a circle in a view: two crossed centre lines.
function centerMark(V, [cu, cv], r, over = 5) {
  return centerline(V, [cu - r, cv], [cu + r, cv], over) + centerline(V, [cu, cv - r], [cu, cv + r], over);
}

// A compression spring cut along its axis: wire sections (blacked in) on both sides, half a pitch
// apart, joined by the back half of each turn. from/to are positions along the axis.
function springSection(V, { from, to, radius, wire, turns, axis = "u", at = 0 }) {
  const place = axis === "u" ? (s, r) => [s, at + r] : (s, r) => [at + r, s];
  const pitch = (to - from - wire) / turns;
  const start = from + wire / 2;
  const back = [];
  let sections = "";
  for (let i = 0; i <= turns; i++) {
    const sTop = start + i * pitch;
    sections += cut(V, circle(...place(sTop, radius), wire / 2, 12), { mat: "solid" });
    if (i < turns) {
      const sBot = sTop + pitch / 2;
      sections += cut(V, circle(...place(sBot, -radius), wire / 2, 12), { mat: "solid" });
      back.push([place(sTop, radius), place(sBot, -radius)]);
    }
  }
  return lines(V, back, "vis spring") + sections;
}

// ---------------------------------------------------------------- annotation

function arrowHead([x, y], [dx, dy]) {
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len;
  const uy = dy / len;
  const bx = x - ux * ARROW;
  const by = y - uy * ARROW;
  const half = ARROW * 0.25;
  return `M${r2(x)} ${r2(y)}L${r2(bx - uy * half)} ${r2(by + ux * half)}L${r2(bx + uy * half)} ${r2(by - ux * half)}Z`;
}

const textWidth = (s, size = TEXT) => String(s).length * size * 0.6;

// A linear dimension between two world points, measured along dir ("h" or "v").
// off is the sheet distance from point a to the dimension line (negative: up or left).
// The value is measured from the geometry unless text is given, so a dimension cannot lie.
function dim(V, a, b, { dir = "h", off = 18, text, prefix = "", suffix = "", id = "", cls = "" } = {}) {
  const A = V.p(a);
  const B = V.p(b);
  const value = text ?? prefix + fmt(Math.abs(dir === "h" ? b[0] - a[0] : b[1] - a[1])) + suffix;
  const h = dir === "h";
  const main = h ? 0 : 1; // the axis the dimension measures along
  const side = 1 - main;
  const at = A[side] + off; // where the dimension line sits
  const pt = (m, s) => (h ? [m, s] : [s, m]);
  let ext = "";
  for (const P of [A, B]) {
    const gapTo = at - P[side];
    if (Math.abs(gapTo) <= GAP) continue;
    const sgn = Math.sign(gapTo);
    const [x1, y1] = pt(P[main], P[side] + sgn * GAP);
    const [x2, y2] = pt(P[main], at + sgn * OVER);
    ext += `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
  }
  const lo = Math.min(A[main], B[main]);
  const hi = Math.max(A[main], B[main]);
  const span = hi - lo;
  const tw = textWidth(value);
  const arrowsIn = span >= ARROW * 2 + 3;
  const textIn = span >= tw + ARROW * 2 + 6;
  let lineD;
  let heads;
  let tm; // text position along the measured axis
  let anchor = "middle";
  if (arrowsIn) {
    const [x1, y1] = pt(lo, at);
    const [x2, y2] = pt(hi, at);
    lineD = `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
    heads = arrowHead(pt(lo, at), pt(-1, 0)) + arrowHead(pt(hi, at), pt(1, 0));
  } else {
    const [x1, y1] = pt(lo - ARROW - 7, at);
    const [x2, y2] = pt(hi + ARROW + 7, at);
    lineD = `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
    heads = arrowHead(pt(lo, at), pt(1, 0)) + arrowHead(pt(hi, at), pt(-1, 0));
  }
  if (textIn) tm = (lo + hi) / 2;
  else {
    tm = hi + ARROW + 10 + tw / 2;
    const [x2, y2] = pt(tm + tw / 2, at);
    lineD += `L${r2(x2)} ${r2(y2)}`;
  }
  // ISO: text sits just above a horizontal line and reads from the right on a vertical one.
  const [tx, ty] = pt(tm, at - 3);
  const textEl = h
    ? `<text class="t" x="${r2(tx)}" y="${r2(ty)}" text-anchor="${anchor}">${value}</text>`
    : `<text class="t" x="${r2(tx)}" y="${r2(ty)}" text-anchor="${anchor}" transform="rotate(-90 ${r2(tx)} ${r2(ty)})">${value}</text>`;
  return `<g data-role="dim"${id ? ` id="${id}"` : ""}${cls ? ` class="${cls}"` : ""}><path class="thin" d="${ext}${lineD}"/><path class="head" d="${heads}"/>${textEl}</g>`;
}

// A part balloon: a dot on the part, a thin leader, a circled item number.
function balloon(V, at, [bx, by], n, { target = "", r = 8.5 } = {}) {
  const [ax, ay] = V.p(at);
  const a = Math.atan2(ay - by, ax - bx);
  const ex = r2(bx + r * Math.cos(a));
  const ey = r2(by + r * Math.sin(a));
  return (
    `<g data-role="balloon" data-target="${target}" data-at="${ax} ${ay}">` +
    `<path class="thin" d="M${ex} ${ey}L${ax} ${ay}"/><circle class="dot" cx="${ax}" cy="${ay}" r="1.5"/>` +
    `<circle class="balloon" cx="${bx}" cy="${by}" r="${r}"/>` +
    `<text class="t" x="${bx}" y="${r2(by + 3.3)}" text-anchor="middle">${n}</text></g>`
  );
}

// A view title: SECTION A-A over its scale, centred under the view.
function viewLabel(x, y, title, sub = "") {
  return (
    `<g data-role="label"><text class="t t-lg" x="${x}" y="${y}" text-anchor="middle">${title}</text>` +
    (sub ? `<text class="t t-sm" x="${x}" y="${y + 12}" text-anchor="middle">${sub}</text>` : "") +
    `</g>`
  );
}

// The circle that marks a detail in its parent view, with its letter.
function detailMark(V, [cu, cv], r, letter, angle = 45) {
  const [x, y] = V.p([cu, cv]);
  const R = r * V.k;
  const a = (-angle * Math.PI) / 180;
  const lx = r2(x + (R + 9) * Math.cos(a));
  const ly = r2(y + (R + 9) * Math.sin(a) + 4);
  return `<g data-role="label"><circle class="thin mark" cx="${x}" cy="${y}" r="${r2(R)}"/><text class="t t-lg" x="${lx}" y="${ly}" text-anchor="middle">${letter}</text></g>`;
}

// A viewing-direction arrow (VIEW C): a thick-tipped arrow pointing at the surface, with its letter.
function viewArrow(V, at, [dx, dy], letter, len = 26) {
  const [x, y] = V.p(at);
  const n = Math.hypot(dx, dy) || 1;
  const ux = dx / n;
  const uy = dy / n;
  const sx = r2(x - ux * len);
  const sy = r2(y - uy * len);
  return (
    `<g data-role="label"><path class="vis" d="M${sx} ${sy}L${r2(x - ux * ARROW)} ${r2(y - uy * ARROW)}"/>` +
    `<path class="head" d="${arrowHead([x, y], [ux, uy])}"/>` +
    `<text class="t t-lg" x="${r2(sx - uy * 10)}" y="${r2(sy + ux * 10 + 4)}" text-anchor="middle">${letter}</text></g>`
  );
}

// A long-break line across a part (thin, with one zigzag), for parts that run out of the view.
function breakLine(V, a, b) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const mx = (ax + bx) / 2;
  const my = (ay + by) / 2;
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  const z = 3.5;
  const p = (t, s) => `${r2(mx + ux * t - uy * s)} ${r2(my + uy * t + ux * s)}`;
  return `<path class="thin" d="M${r2(ax - ux * 4)} ${r2(ay - uy * 4)}L${p(-z, 0)}L${p(-z / 2, z * 1.6)}L${p(z / 2, -z * 1.6)}L${p(z, 0)}L${r2(bx + ux * 4)} ${r2(by + uy * 4)}"/>`;
}

// ---------------------------------------------------------------- sheet furniture

// The drawing frame: trimmed edge, a thick border, zone references and centring marks.
function frame({ w = SHEET.w, h = SHEET.h, trim = 8, m = 24, cols = 8, rows = 6 } = {}) {
  let out = `<g data-role="frame"><rect class="thin" x="${trim}" y="${trim}" width="${w - trim * 2}" height="${h - trim * 2}"/>`;
  out += `<rect class="vis" x="${m}" y="${m}" width="${w - m * 2}" height="${h - m * 2}"/>`;
  const cw = (w - m * 2) / cols;
  const rh = (h - m * 2) / rows;
  let ticks = "";
  let labels = "";
  for (let i = 0; i <= cols; i++) {
    const x = r2(m + i * cw);
    if (i > 0 && i < cols) ticks += `M${x} ${trim}V${m}M${x} ${h - m}V${h - trim}`;
    if (i < cols) {
      const cx = r2(m + (i + 0.5) * cw);
      labels += `<text class="t t-sm" x="${cx}" y="${r2((trim + m) / 2 + 3)}" text-anchor="middle">${i + 1}</text>`;
      labels += `<text class="t t-sm" x="${cx}" y="${r2(h - (trim + m) / 2 + 3)}" text-anchor="middle">${i + 1}</text>`;
    }
  }
  for (let j = 0; j <= rows; j++) {
    const y = r2(m + j * rh);
    if (j > 0 && j < rows) ticks += `M${trim} ${y}H${m}M${w - m} ${y}H${w - trim}`;
    if (j < rows) {
      const cy = r2(m + (j + 0.5) * rh + 3);
      const letter = String.fromCharCode(65 + j);
      labels += `<text class="t t-sm" x="${r2((trim + m) / 2)}" y="${cy}" text-anchor="middle">${letter}</text>`;
      labels += `<text class="t t-sm" x="${r2(w - (trim + m) / 2)}" y="${cy}" text-anchor="middle">${letter}</text>`;
    }
  }
  const cm = `M${w / 2} ${trim}V${m + 10}M${w / 2} ${h - trim}V${h - m - 10}M${trim} ${h / 2}H${m + 10}M${w - trim} ${h / 2}H${w - m - 10}`;
  out += `<path class="thin" d="${ticks}"/><path class="vis" d="${cm}"/>${labels}</g>`;
  return out;
}

// A ruled table (parts list). cols: [{ w, align, title }]. rows: arrays of cell strings.
// Item numbers count up from the bottom, as a parts list sits on top of the title block.
function table(x, y, cols, rows, { rowH = 16, role = "bom", headH = 18 } = {}) {
  const w = cols.reduce((s, c) => s + c.w, 0);
  const h = headH + rows.length * rowH;
  let rules = "";
  let text = "";
  let cx = x;
  for (const [i, c] of cols.entries()) {
    if (i > 0) rules += `M${r2(cx)} ${y}V${y + h}`;
    const tx = c.align === "center" ? cx + c.w / 2 : c.align === "right" ? cx + c.w - 4 : cx + 4;
    const anchor = c.align === "center" ? "middle" : c.align === "right" ? "end" : "start";
    text += `<text class="t t-sm t-head" x="${r2(tx)}" y="${y + h - 5.5}" text-anchor="${anchor}">${c.title}</text>`;
    rows.forEach((row, j) => {
      text += `<text class="t t-sm" x="${r2(tx)}" y="${r2(y + (rows.length - 1 - j) * rowH + rowH - 4.8)}" text-anchor="${anchor}">${row[i]}</text>`;
    });
    cx += c.w;
  }
  for (let j = 1; j <= rows.length; j++) rules += `M${x} ${r2(y + j * rowH)}H${x + w}`;
  return `<g data-role="${role}"><rect class="paper" x="${x}" y="${y}" width="${w}" height="${h}"/><path class="thin" d="${rules}"/><rect class="vis" x="${x}" y="${y}" width="${w}" height="${h}"/>${text}</g>`;
}

// A title-block cell: a small caption over a value. size: "sm" | "md" | "lg".
function cell({ x, y, w, h, label, value = "", size = "md", id = "" }) {
  const cls = size === "lg" ? "t t-xl" : size === "sm" ? "t t-sm" : "t";
  const vy = size === "lg" ? y + h - 7 : y + h - 5;
  return (
    `<rect class="thin" x="${x}" y="${y}" width="${w}" height="${h}"/>` +
    `<text class="t t-cap" x="${x + 4}" y="${y + 9}">${label}</text>` +
    `<text class="${cls}" x="${x + 4}" y="${vy}"${id ? ` id="${id}"` : ""}>${value}</text>`
  );
}

function titleBlock(x, y, w, h, cells) {
  return `<g data-role="title"><rect class="paper" x="${x}" y="${y}" width="${w}" height="${h}"/>${cells.map((c) => cell({ ...c, x: x + c.x, y: y + c.y })).join("")}<rect class="vis" x="${x}" y="${y}" width="${w}" height="${h}"/></g>`;
}

// A notes block: a heading and numbered lines.
function notes(x, y, heading, items, lead = 13) {
  let out = `<g data-role="notes"><text class="t t-head" x="${x}" y="${y}">${heading}</text>`;
  items.forEach((s, i) => {
    out += `<text class="t t-sm" x="${x}" y="${r2(y + lead * (i + 1) + 2)}">${i + 1}. ${s}</text>`;
  });
  return out + `</g>`;
}

return { SHEET, PX_PER_MM, THICK, THIN, TEXT, ARROW, GAP, OVER, r2, fmt, view, scaleLabel, d, rect, arc, circle, rrect, move, flipU, flipV, inside, revolve, MATERIALS, ANGLES, hatchDefs, cut, section, body, line, lines, centerline, centerMark, springSection, textWidth, dim, balloon, viewLabel, detailMark, viewArrow, breakLine, frame, table, cell, titleBlock, notes };
})();

const L = (() => {
// Live runtime for a blueprint sheet: one time-based loop, an idle tour, input wake-ups,
// offscreen and hidden-tab pauses, reduced motion, and deterministic frames for checks.
//
// URL parameters (all optional):
//   ?t=6.5            render the tour at 6.5 s, deterministically, and stop (for screenshots)
//   ?theme=paper      blueprint | paper | dark
//   ?zoom=x,y,w,h     show only this sheet region, filling the window (for 4x close-ups)
//   ?check=1          run the layout self-check after the first frame (see selfcheck.mjs)

function params() {
  const q = new URLSearchParams(location.search);
  return {
    t: q.has("t") ? Number(q.get("t")) : null,
    theme: q.get("theme"),
    zoom: q.get("zoom"),
    check: q.has("check"),
  };
}

const THEMES = ["blueprint", "paper", "dark"];

function setupPage(svg) {
  const q = params();
  const pick = (name) => {
    if (!THEMES.includes(name)) return;
    document.documentElement.dataset.theme = name;
    for (const b of document.querySelectorAll("[data-theme-pick]")) b.setAttribute("aria-pressed", String(b.dataset.themePick === name));
    try {
      localStorage.setItem("bp-theme", name);
    } catch {}
  };
  let saved = null;
  try {
    saved = localStorage.getItem("bp-theme");
  } catch {}
  pick(q.theme ?? saved ?? "blueprint");
  for (const b of document.querySelectorAll("[data-theme-pick]")) b.addEventListener("click", () => pick(b.dataset.themePick));
  if (q.zoom) {
    const box = q.zoom.split(",").map(Number);
    if (box.length === 4 && box.every(Number.isFinite)) {
      svg.setAttribute("viewBox", box.join(" "));
      document.body.classList.add("bp-zoom");
    }
  }
  return q;
}

// Critically damped follow toward a target: calm, no overshoot, frame-rate independent.
function follow(at, want, rate, dt) {
  return want + (at - want) * Math.exp(-rate * dt);
}

const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, t)));

// run({ root, step, render, idleAfter })
//   step(dt, live) advances the model; live.touring says whether the idle tour drives it.
//   It returns true while something is still settling, so a reduced-motion page can sleep.
//   render(live) writes attributes; it never rebuilds static geometry.
function run({ root, step, render, idleAfter = 4, onFrozen }) {
  const q = params();
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const live = { clock: 0, slow: 1, lastInput: -Infinity, reduced, touring: !reduced, frozen: q.t != null };
  live.input = () => {
    live.lastInput = live.clock;
    live.touring = false;
    wake();
  };

  if (live.frozen) {
    const dt = 1 / 240;
    for (let t = 0; t < q.t; t += dt) {
      live.clock = t;
      live.touring = true;
      step(dt, live);
    }
    render(live);
    onFrozen?.(live);
    return live;
  }

  let raf = 0;
  let last = 0;
  let visible = true;
  function frame(now) {
    raf = 0;
    const real = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    live.clock += real;
    live.touring = !reduced && live.clock - live.lastInput > idleAfter;
    const busy = step(real * live.slow, live);
    render(live);
    if (visible && !document.hidden && (!reduced || busy)) raf = requestAnimationFrame(frame);
    else last = 0;
  }
  function wake() {
    if (!raf && visible && !document.hidden) raf = requestAnimationFrame(frame);
  }
  live.wake = wake;
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(([entry]) => {
      visible = entry.isIntersecting;
      if (visible) wake();
    }).observe(root);
  }
  document.addEventListener("visibilitychange", wake);
  render(live);
  wake();
  return live;
}

// Vertical drag on an element, reported as a sheet-unit delta since the press.
function dragY(svg, el, { start, move, end }) {
  let id = null;
  let y0 = 0;
  const toSheet = (e) => {
    const m = svg.getScreenCTM();
    return m ? (e.clientY - m.f) / m.d : e.clientY;
  };
  el.addEventListener("pointerdown", (e) => {
    id = e.pointerId;
    el.setPointerCapture(id);
    y0 = toSheet(e);
    start?.();
    e.preventDefault();
  });
  el.addEventListener("pointermove", (e) => {
    if (e.pointerId === id) move(toSheet(e) - y0);
  });
  const stop = (e) => {
    if (e.pointerId !== id) return;
    id = null;
    end?.();
  };
  el.addEventListener("pointerup", stop);
  el.addEventListener("pointercancel", stop);
}

// Announce a readout to screen readers at most every `every` seconds.
function announcer(el, every = 1.5) {
  let lastAt = -Infinity;
  let lastText = "";
  return (text, clock) => {
    if (text === lastText || clock - lastAt < every) return;
    lastAt = clock;
    lastText = text;
    el.textContent = text;
  };
}

return { params, THEMES, setupPage, follow, ease, run, dragY, announcer };
})();

const C = (() => {
// Layout self-check, run in the page with ?check=1 (scripts/check.mjs drives it headlessly).
// It writes a JSON report into <pre id="bp-check"> and to the console. A clean sheet reports
// zero failures in every category.
//
//   text-overlap      two pieces of lettering touch
//   text-on-geometry  lettering sits on a part or on another annotation's lines
//   outside-frame     an annotation or a view crosses the drawing frame
//   balloon-target    a balloon's dot is not on the part it names
//   balloon-on-geom   a balloon circle sits on a part
//   hard-colour       a fill or stroke is a literal colour instead of a token
//   sideways-scroll   the page scrolls horizontally

const roleOf = (el) => el.closest("[data-role]")?.dataset.role ?? "";

// A clipped group's box is its clip region's box (getBoundingClientRect ignores clipping).
function clippedBox(el) {
  const ref = el.getAttribute("clip-path")?.match(/url\(#([^)]+)\)/)?.[1];
  const shape = ref && document.getElementById(ref)?.firstElementChild;
  if (!shape) return el.getBoundingClientRect();
  const b = shape.getBBox();
  const m = shape.ownerSVGElement.getScreenCTM();
  const x0 = m.a * b.x + m.e;
  const y0 = m.d * b.y + m.f;
  return { left: x0, top: y0, right: x0 + m.a * b.width, bottom: y0 + m.d * b.height };
}

function selfCheck(svg) {
  const fails = [];
  const fail = (kind, what) => fails.push({ kind, what });
  const label = (el) => {
    const g = el.closest("[data-role],[data-part],[data-geom]");
    const name = g?.id || g?.dataset.part || g?.dataset.target || g?.dataset.role || g?.dataset.geom || el.tagName;
    return `${name}: "${(el.textContent || "").trim().slice(0, 24)}"`;
  };
  const shown = (el) => {
    const b = el.getBoundingClientRect();
    if (b.width < 0.5 || b.height < 0.5) return false;
    const cs = getComputedStyle(el);
    return cs.visibility !== "hidden" && cs.display !== "none" && Number(cs.opacity) > 0.05;
  };
  const texts = [...svg.querySelectorAll("text")].filter(shown);
  const boxes = texts.map((t) => t.getBoundingClientRect());
  const grow = 0.4;
  const hit = (a, b) => a.left < b.right - grow && b.left < a.right - grow && a.top < b.bottom - grow && b.top < a.bottom - grow;

  for (let i = 0; i < texts.length; i++)
    for (let j = i + 1; j < texts.length; j++) if (hit(boxes[i], boxes[j])) fail("text-overlap", `${label(texts[i])} × ${label(texts[j])}`);

  const geomOf = (el) => el.closest("[data-geom]");
  for (const [i, t] of texts.entries()) {
    const role = roleOf(t);
    if (role === "engraved" || role === "frame") continue;
    const own = t.closest("[data-role]");
    const b = boxes[i];
    const seen = new Set();
    for (let ix = 0; ix < 4; ix++)
      for (let iy = 0; iy < 2; iy++) {
        const x = b.left + b.width * (0.15 + ix * 0.233);
        const y = b.top + b.height * (0.3 + iy * 0.4);
        for (const el of document.elementsFromPoint(x, y)) {
          if (el === t || el.tagName === "text" || el.tagName === "svg" || el.closest("defs")) continue;
          if (el.classList.contains("tint") || el.classList.contains("hit") || el.closest('[data-role="phantom"]')) continue;
          if (own && own.contains(el)) continue;
          const g = geomOf(el);
          const other = el.closest("[data-role]");
          const bad = (g && !g.contains(t)) || (other && other !== own && other.dataset.role !== "frame" && other.dataset.role !== "chart-bg");
          if (bad && !el.classList.contains("sheet-bg") && !el.classList.contains("grid")) {
            const key = el.closest("[data-part],[data-role],[data-geom]");
            if (!seen.has(key)) {
              seen.add(key);
              fail("text-on-geometry", `${label(t)} on ${key?.dataset.part || key?.id || key?.dataset.role || key?.dataset.geom || el.tagName}`);
            }
          }
        }
      }
  }

  const frameRect = svg.querySelector('[data-role="frame"] rect.vis')?.getBoundingClientRect();
  if (frameRect) {
    for (const el of svg.querySelectorAll("[data-role]:not([data-role=frame]), [data-geom]")) {
      if (el.parentElement?.closest("[data-role]:not([data-role=frame]), [data-geom]")) continue;
      if (!shown(el)) continue;
      const b = clippedBox(el);
      const tol = 0.5;

// the button. Angles θ are in degrees about the axis. The cam track is developed (unrolled) at
// radius R_DEV, where the ridges of the guide and the lugs of the rotator overlap; a degree of
// track is MMD mm of arc there.

// Three parts make the toggle:
//   the CAM GUIDE (fixed) has 6 ridge teeth, pitch 60°, with a sawtooth bottom. Every second
//   valley opens into a LONG SLOT (channel, open to the top); the others into a SHORT SLOT (notch).
//   the PLUNGER (slides, never turns) has 6 V teeth, pitch 60°, half a pitch out of phase.
//   the ROTATOR (slides and turns) has 3 lugs, 15° wide, with tops at the same slope.

// ridge tooth turns it another 30° into the next slot. One click = 60°, long and short alternate,

const H_P = s1 * 45; // rise of a plunger tooth's long flank (45°); the short flank is 15°
const LUG_DROP = s1 * LUG_W; // the lug top falls this much across its width
const NOTCH = 1.0; // depth of a short slot above its valley

const THROW = 3.2; // refill travel between the two stable states
const U_R_EXT = 96.0; // rotator front face (= refill rear end) when extended

const Y_G = Y_N - NOTCH - H_R; // the ridge teeth's tips
const Y_V = Y_G + H_R; // a ridge valley
const Y_RET = Y_N + THROW; // lug corner in a long slot (plunger collar against the top cap)

    const x0 = Math.max(ra, lo);
    const x1 = Math.min(rb, hi);
    if (x1 > x0 + 0.05) out.push({ a: x0 + a - ra, b: x1 + a - ra, near });
  }
  return out;
}

function lugView(V, phi, Y, a, b, bot, closedA, closedB) {
  const pts = [];
  for (let j = 0; j <= 6; j++) {
    const th = a + ((b - a) * j) / 6;
    const top = M.lugTop(th, phi, Y);
    for (const r of [R.hub, R.lugO]) pts.push([bot, r * cosS(th)], [top, r * cosS(th)]);
  }
  const edges = [];
  if (closedA) edges.push([[bot, R.lugO * cosS(a)], [M.lugTop(a, phi, Y), R.lugO * cosS(a)]]);
  if (closedB) edges.push([[bot, R.lugO * cosS(b)], [M.lugTop(b, phi, Y), R.lugO * cosS(b)]]);
  return camBody(V, hull(pts)) + (edges.length ? K.lines(V, edges, "vis cam-line") : "");
}

// The rotator with its lugs' leading corners at angle X (deg) and height Y (u of the corner).
// far: the lug portions behind the cutting plane (drawn under the cut faces); near: the rest.
function rotator(V, X, Y) {
  const ur = M.refillEnd(Y);
  const bot = ur + 1;
  let far = "";
  let near = "";
  for (let i = 0; i < M.LUGS; i++) {
    const phi = X + 120 * i;
    const a = phi - M.LUG_W + 0.5;
    const b = phi - 0.5;
    for (const h of halves(a, b)) {
      const svg = lugView(V, phi, Y, h.a, h.b, bot, Math.abs(h.a - a) < 0.01, Math.abs(h.b - b) < 0.01);
      if (h.near) near += svg;
      else far += svg;
    }
  }
  const base = camBody(V, [[ur, -R.base], [ur + 1, -R.base], [ur + 1, R.base], [ur, R.base]]);
  const hub = camBody(V, [[ur + 1, -R.hub], [ur + 8, -R.hub], [ur + 8, R.hub], [ur + 1, R.hub]]);
  return { far: part(11, far, ` class="cam"`), near: part(11, base + hub + near, ` class="cam"`) };
}

// ---------------------------------------------------------------- phantom extreme positions

function phantoms(V) {
  // the point at EXTENDED (the writing position)
  const tip = [[at(0.3), 0.62], [at(3.5), 1.15], [at(8), 1.15]];
  const tipLine = K.line(V, [...tip, ...tip.map(([u, v]) => [u, -v]).reverse()], "phan");
  // the button fully out (RETRACTED, at rest)
  const b = M.YPT_TOP + PL.button;
  const btn = [[b, 3.5], [b + 3.3, 3.5], [b + 3.9, 2.4], [b + PL.buttonH, 0], [b + 3.9, -2.4], [b + 3.3, -3.5], [b, -3.5]];
  return tipLine + K.line(V, btn, "phan", true);
}

// ---------------------------------------------------------------- DEVELOPED VIEW E (world: θ·MMD, u)

const dx = (theta) => theta * M.MMD;

function devRidges(V, from, to) {
  let out = "";
  for (let base = -360; base <= 360; base += 120) {
    // one ridge runs from a long slot's right wall (base) to the next long slot's left wall
    const pts = [[dx(base), 111]];
    for (let k = 0; k < 2; k++) {
      const e = base + 60 * k;
      pts.push([dx(e), M.Y_G]);
      const steps = 8;
      for (let j = 1; j <= steps; j++) {
        const t = (45 * j) / steps;
        pts.push([dx(e + t), M.Y_G + M.SLOPE * M.MMD * t]);
      }
      if (k === 0) {
        pts.push([dx(e + 45), M.ridgeBottom(e + 45.001)]);
        pts.push([dx(e + 60), M.Y_V + M.NOTCH]);
      }
    }
    pts.push([dx(base + 105), 111]);
    if (dx(base + 105) < dx(from) || dx(base) > dx(to)) continue;
    out += K.cut(V, pts, { mat: "plastic", angle: 45 });
  }
  return part(12, out);
}

function devLugs(V, X, Y, from, to) {
  let out = "";
  const ur = M.refillEnd(Y);
  for (let i = -3; i <= 6; i++) {
    const phi = X + 120 * i;
    const a = phi - M.LUG_W + 0.5;
    const b = phi - 0.5;
    if (b < from - 20 || a > to + 20) continue;
    out += camBody(V, [[dx(a), ur + 1], [dx(b), ur + 1], [dx(b), M.lugTop(b, phi, Y)], [dx(a), M.lugTop(a, phi, Y)]]);
  }
  return part(11, out, ` class="cam"`);
}

// The plunger's teeth (radius 2–2.95, inside the ridges) projected onto the track: an adjacent part.
function devPlunger(V, from, to, yPt = M.YPT_TOP) {
  const pts = [];
  for (let th = from - 20; th <= to + 20; th += 1.25) pts.push([dx(th), M.plungerBottom(th, yPt)]);
  let keys = "";
  for (let c = -360; c <= 720; c += 120) {
    if (c < from - 20 || c - 15 > to + 20) continue;
    keys += K.line(V, [[dx(c - 15), 113], [dx(c - 15), yPt + PL.key], [dx(c), yPt + PL.key], [dx(c), 113]], "phan");
  }
  return K.line(V, pts, "phan", false) + keys;
}

// The path of a lug's leading corner through one revolution.
function lugPath(from, to) {
  const pts = [];
  const yIdx = M.Y_G + M.H_R / 2;
  const yLow = M.Y_MIN + M.H_R / 2;
  for (let q = -4; q <= 16; q += 2) {
    const e = q * 30;
    const top = M.slotKind(q) === "long" ? M.Y_RET : M.Y_N;
    pts.push([e, top], [e, M.Y_G], [e + 30, yIdx], [e + 30, yLow], [e + 30, yIdx], [e + 60, M.Y_V]);
  }
  return pts.filter(([th]) => th >= from - 30 && th <= to + 30).map(([th, u]) => [dx(th), u]);
}

// ---------------------------------------------------------------- SECTION B-B (world: across the axis)

// Looking toward the tip: angle θ appears at the top for θ = θS and turns counter-clockwise.
const polar = (r, theta) => [-r * sinS(theta), r * cosS(theta)];

function ringPath(V, rOut, rInner) {
  const outer = [];
  const inner = [];
  for (let i = 0; i < 360; i += 2) outer.push(polar(rOut, i));
  for (let i = 0; i < 720; i++) inner.push(polar(rInner(i / 2), i / 2));
  return K.d(V, outer) + K.d(V, inner.reverse());
}

function annulusCut(V, d, mat, angle) {
  if (mat === "solid") return `<path class="solid" fill-rule="evenodd" d="${d}"/>`;
  return `<path class="paper" fill-rule="evenodd" d="${d}"/><path fill-rule="evenodd" fill="url(#h-${mat}-${angle})" d="${d}"/><path class="vis" d="${d}"/>`;
}

// What the riding plane at height h cuts of the guide: the wall, and the ridges below h.
function bbGuide(V, h) {
  const inner = (th) => (M.ridgeBottom(th) < h ? R.ridge : R.guideI);
  return part(12, annulusCut(V, ringPath(V, R.barrelI, inner), "plastic", 45));
}

function bbBarrel(V) {
  return part(1, annulusCut(V, ringPath(V, R.barrelO, () => R.barrelI), "solid"));
}

// The plunger's teeth below h, cut: sectors of its tube.
function bbPlunger(V, h, yPt) {
  let out = "";
  let run = null;
  const flush = (end) => {
    if (!run) return;
    const pts = [];
    for (let th = run; th <= end; th += 0.5) pts.push(polar(R.plO, th));
    for (let th = end; th >= run; th -= 0.5) pts.push(polar(R.plI, th));
    out += K.cut(V, pts, { mat: "plastic", angle: 135 });
    run = null;
  };
  for (let th = 0; th <= 360; th += 0.5) {
    const cutHere = M.plungerBottom(th, yPt) < h && th < 360;
    if (cutHere && run === null) run = th;
    if (!cutHere && run !== null) flush(th);
  }
  flush(360);
  return out ? part(13, out) : "";
}

// The rotator cut at its lugs, drawn with its leading corner at angle 0; the page rotates it.
function bbRotator(V) {
  const pts = [];
  for (let i = 0; i < M.LUGS; i++) {
    const phi = 120 * i;
    const a = phi - M.LUG_W + 0.5;
    const b = phi - 0.5;
    for (let th = b - 120; th <= a; th += 2) pts.push(polar(R.hub, th));
    pts.push(polar(R.hub, a));
    for (let th = a; th <= b; th += 1.5) pts.push(polar(R.lugO, th));
    pts.push(polar(R.lugO, b), polar(R.hub, b));
  }
  const dd = K.d(V, pts);
  return part(11, `<path class="paper" d="${dd}"/><path fill="url(#h-cam)" d="${dd}"/><path class="vis cam-line" d="${dd}"/>`, ` class="cam"`);
}

// Seen beyond the plane: the rotator's thrust collar and the refill's end.
function bbBeyond(V) {
  return part(10, K.line(V, K.circle(0, 0, 3.0, 72), "vis", true)) + K.line(V, K.circle(0, 0, R.base, 72), "vis", true);
}

return { part, THETA_S, R, camBody, barrel, bush, nose, guide, CAP, topCap, clip, S0, point, ball, holder, tube, follower, endPlug, inkShapes, ink, refill, spring, PL, plunger, button, rotator, phantoms, devRidges, devLugs, devPlunger, lugPath, polar, annulusCut, bbGuide, bbBarrel, bbPlunger, bbRotator, bbBeyond };
})();

// Page code for click-pen.html. K (kit), L (runtime), C (self-check), M (model) and P (parts)
// are inlined above this script as namespaces.

const svg = document.querySelector(".bp-sheet");
const q = L.setupPage(svg);
const specs = JSON.parse(svg.dataset.views);
const VM = K.view(specs.main);
const VD = K.view(specs.D);
const VE = K.view(specs.E);
const VB = K.view(specs.BB);
const CH = {"x0":318,"x1":516,"y0":574,"y1":712,"xMax":12,"fMax":3.5};
const LAY = {"D":{"x":40,"y":276,"w":318,"h":186},"E":{"x":440,"y":282,"w":216,"h":222,"th0":-25,"th1":155,"uTop":107},"F":{"cx":150,"cy":664,"r":96},"BB":{"cx":662,"cy":664}};
const $ = (id) => document.getElementById(id);

const axial = [["main", VM], ["D", VD]].map(([id, V]) => ({
  V,
  rotFar: $(`rotfar-${id}`),
  rotNear: $(`rotnear-${id}`),
  plFar: $(`plfar-${id}`),
  pl: $(`pl-${id}`),
  refill: $(`refill-${id}`),
  spring: $(`spring-${id}`),
}));
const el = {
  mvbRefill: $("mvb-refill"),
  mvbPl: $("mvb-pl"),
  mvbDRot: $("mvb-D-rot"),
  mvbDPl: $("mvb-D-pl"),
  bbMark: $("bbmark"),
  dimTip: $("dim-tip-wrap"),
  dimBtn: $("dim-btn-wrap"),
  devLugs: $("dev-lugs"),
  devPl: $("dev-pl"),
  devDot: $("dev-dot"),
  bbGuide: $("bb-guide"),
  bbPl: $("bb-pl"),
  bbRot: $("bb-rot"),
  states: [0, 1, 2, 3].map((i) => $(`sd-${i}`).querySelector(".sd-box")),
  dot: $("chart-dot"),
  readout: $("readout"),
};
const say = L.announcer($("sr"), 2);

// ---------------------------------------------------------------- state
const pen = M.pen();
const Y0 = pen.Y;
let push = 0; // button push the thumb applies, mm
let target = 0;
let offX = 0; // display offsets that ease the spring-driven snaps
let offY = 0;
let dragging = false;
let clickT = -1; // a keyed click in progress

// The tour: rest, click, write, click, retracted again. Two clicks turn the rotator 120°,
// which brings its three lugs back to the same picture: one full cycle of the toggle.
const PERIOD = 5;
const press = (t, t0) => {
  if (t < t0) return 0;
  if (t < t0 + 0.45) return M.PUSH_MAX * L.ease((t - t0) / 0.45);
  if (t < t0 + 0.6) return M.PUSH_MAX;
  if (t < t0 + 1.05) return M.PUSH_MAX * (1 - L.ease((t - t0 - 0.6) / 0.45));
  return 0;
};
const tour = { t: 0 };
const tourPush = (t) => {
  const p = t % PERIOD;
  return p < 2.9 ? press(p, 0.8) : press(p, 3.4);
};
const clickPush = (t) => press(t, 0);

// ---------------------------------------------------------------- step and render
function step(dt, live) {
  const n = Math.max(1, Math.ceil(dt * 480));
  const h = dt / n;
  for (let i = 0; i < n; i++) {
    let driven = false;
    if (live.touring && !dragging) {
      tour.t += h;
      push = tourPush(tour.t);
      driven = true;
    } else if (clickT >= 0) {
      clickT += h;
      target = clickPush(clickT);
      if (clickT > 1.1) clickT = -1;
    }
    if (!driven) push = live.reduced ? target : L.follow(push, target, 30, h);
    const q0 = pen.q;
    const x0 = pen.X;
    const y0 = pen.Y;
    M.settle(pen, push);
    if (pen.q !== q0) {
      offX += x0 - pen.X;
      offY += y0 - pen.Y;
    }
    offX = live.reduced ? 0 : L.follow(offX, 0, 40, h);
    offY = live.reduced ? 0 : L.follow(offY, 0, 40, h);
  }
  return Math.abs(push - target) > 1e-4 || Math.abs(offX) > 0.01 || Math.abs(offY) > 1e-3 || clickT >= 0;
}

const camAngle = (X) => ((Math.round(X) % 360) + 360) % 360;
let shown = { X: NaN, Y: NaN, yPt: NaN, h: NaN };

function render(live) {
  const X = pen.X + offX;
  const Y = pen.Y + offY;
  const yPt = pen.yPt;
  const du = M.refillEnd(Y) - M.U_R_EXT;
  const dp = yPt - M.YPT_TOP;
  if (X !== shown.X || Y !== shown.Y) {
    for (const a of axial) {
      const rot = P.rotator(a.V, X, Y);
      a.rotFar.innerHTML = rot.far;
      a.rotNear.innerHTML = rot.near;
      a.refill.setAttribute("transform", `translate(${K.r2(du * a.V.k)} 0)`);
      a.spring.innerHTML = P.spring(a.V, Y);
    }
    el.mvbRefill.setAttribute("transform", `translate(${K.r2(du * VM.k)} 0)`);
    el.mvbDRot.setAttribute("transform", `translate(${K.r2((M.refillEnd(Y) - M.refillEnd(Y0)) * VD.k)} 0)`);
    el.devLugs.innerHTML = P.devLugs(VE, X, Y, LAY.E.th0, LAY.E.th1);
    const [cx, cy] = VE.p([X * M.MMD, Y]);
    el.devDot.setAttribute("cx", cx);
    el.devDot.setAttribute("cy", cy);
    el.bbMark.innerHTML = bbMark(Y);
    el.bbRot.setAttribute("transform", `rotate(${K.r2(-X)} ${LAY.BB.cx} ${LAY.BB.cy})`);
    el.dimTip.innerHTML = tipDim(Y);
    shown.X = X;
    shown.Y = Y;
  }
  if (yPt !== shown.yPt) {
    for (const a of axial) {
      a.pl.setAttribute("transform", `translate(${K.r2(dp * a.V.k)} 0)`);
      a.plFar.setAttribute("transform", `translate(${K.r2(dp * a.V.k)} 0)`);
    }
    el.mvbPl.setAttribute("transform", `translate(${K.r2(dp * VM.k)} 0)`);
    el.mvbDPl.setAttribute("transform", `translate(${K.r2(dp * VD.k)} 0)`);
    el.devPl.setAttribute("transform", `translate(0 ${K.r2(-dp * VE.k)})`);
    el.dimBtn.innerHTML = btnDim(yPt);
    shown.yPt = yPt;
  }
  const hCut = Y - 0.5;
  if (Math.abs(hCut - shown.h) > 0.004 || yPt !== shown.yPtB) {
    el.bbGuide.innerHTML = P.bbGuide(VB, hCut);
    el.bbPl.innerHTML = P.bbPlunger(VB, hCut, yPt);
    shown.h = hCut;
    shown.yPtB = yPt;
  }
  const m = ((pen.q % 4) + 4) % 4;
  el.states.forEach((b, i) => b.classList.toggle("on", i === m));
  const c = M.compression(Y);
  el.dot.setAttribute("cx", K.r2(CH.x0 + (c / CH.xMax) * (CH.x1 - CH.x0)));
  el.dot.setAttribute("cy", K.r2(CH.y1 - ((M.RATE * c) / CH.fMax) * (CH.y1 - CH.y0)));
  const tip = -M.tipU(Y);
  const state = M.stateName(pen.q);
  const b = M.buttonDepth(pen);
  el.readout.textContent = `${state} · CAM ${camAngle(X)}° · b ${b.toFixed(1)} · TIP ${tip >= 0 ? "+" : "−"}${Math.abs(tip).toFixed(1)} · F ${M.springForce(Y).toFixed(2)} N`;
  say(`${state.toLowerCase()}, cam at ${camAngle(X)} degrees, button in ${b.toFixed(1)} millimetres, tip ${tip >= 0 ? "out" : "in"} ${Math.abs(tip).toFixed(1)}, spring ${M.springForce(Y).toFixed(1)} newtons.`, live.clock);
}

// The same annotations the build drew, re-measured.
function tipDim(Y) {
  const t = M.tipU(Y);
  const txt = `${t <= 0 ? "+" : "−"}${Math.abs(t).toFixed(1)}`;
  return K.dim(VM, [0, -1.3], [t, -0.5], { dir: "h", off: 26, text: txt, id: "dim-tip" });
}
function btnDim(yPt) {
  const top = (y) => y + P.PL.button + P.PL.buttonH;
  return K.dim(VM, [top(M.YPT_TOP), 0.8], [top(yPt), 0.4], { dir: "h", off: -48, text: `b=${(M.YPT_TOP - yPt).toFixed(1)}`, id: "dim-btn" });
}
function bbMark(Y) {
  const u = Y - 0.5;
  const [x] = VD.p([u, 0]);
  const yT = VD.p([0, 8.7])[1];
  const yB = VD.p([0, -8.7])[1];
  const aT = VD.p([0, 7.0])[1];
  const aB = VD.p([0, -7.0])[1];
  const head = (y) => `M${K.r2(x - 9)} ${y}L${K.r2(x - 3)} ${K.r2(y - 1.8)}L${K.r2(x - 3)} ${K.r2(y + 1.8)}Z`;
  return (
    `<path class="vis" d="M${x} ${yT}V${aT}M${x} ${yB}V${aB}M${x} ${yT}H${K.r2(x - 9)}M${x} ${yB}H${K.r2(x - 9)}"/>` +
    `<path class="head" d="${head(yT)}${head(yB)}"/>` +
    `<text class="t t-lg" x="${K.r2(x - 16)}" y="${K.r2(yT + 4)}" text-anchor="middle">B</text>` +
    `<text class="t t-lg" x="${K.r2(x - 16)}" y="${K.r2(yB + 4)}" text-anchor="middle">B</text>`
  );
}

// ---------------------------------------------------------------- input
const live = L.run({
  root: svg,
  step,
  render,
  idleAfter: 5,
  onFrozen: () => q.check && C.selfCheck(svg),
});

if (live.reduced && !live.frozen) {
  // A still, true moment: the tour played to the writing position, drawn once.
  const fake = { touring: true, reduced: false, clock: 0 };
  for (let t = 0; t < 2.6; t += 1 / 240) step(1 / 240, fake);
  render(live);
}

const clamp = (v) => Math.min(M.PUSH_MAX, Math.max(0, v));

// Horizontal drag, reported as a sheet-unit delta since the press (the pen lies along x).
function dragX(el, { start, move, end }) {
  let id = null;
  let x0 = 0;
  const toSheet = (e) => {
    const m = svg.getScreenCTM();
    return m ? (e.clientX - m.e) / m.a : e.clientX;
  };
  el.addEventListener("pointerdown", (e) => {
    id = e.pointerId;
    el.setPointerCapture(id);
    x0 = toSheet(e);
    start?.();
    e.preventDefault();
  });
  el.addEventListener("pointermove", (e) => {
    if (e.pointerId === id) move(toSheet(e) - x0);
  });
  const stop = (e) => {
    if (e.pointerId !== id) return;
    id = null;
    end?.();
  };
  el.addEventListener("pointerup", stop);
  el.addEventListener("pointercancel", stop);
}

for (const hit of svg.querySelectorAll("[data-drag]")) {
  const k = hit.dataset.drag === "D" ? VD.k : VM.k;
  let p0 = 0;
  dragX(hit, {
    start: () => {
      dragging = true;
      clickT = -1;
      p0 = push;
      target = push;
      live.input();
    },
    move: (dx) => {
      target = clamp(p0 - dx / k);
      live.input();
    },
    end: () => {
      dragging = false;
      target = 0; // let go: the spring returns the button
      live.input();
    },
  });
}

svg.addEventListener("keydown", (e) => {
  const key = e.key;
  if (key === " " || key === "Enter") clickT = 0;
  else if (key === "ArrowLeft") {
    clickT = -1;
    target = clamp(target + 1);
  } else if (key === "ArrowRight") {
    clickT = -1;
    target = clamp(target - 1);
  } else if (key === "Home") {
    clickT = -1;
    target = 0;
  } else if (key === "s" || key === "S") live.slow = live.slow === 1 ? 0.2 : live.slow === 0.2 ? 0.05 : 1;
  else return;
  e.preventDefault();
  live.input();
});

if (q.check && !live.frozen) setTimeout(() => C.selfCheck(svg), 400);

</script>
</body>
</html>
