">1</text><text class="t t-sm" x="1160" y="565.2" text-anchor="middle">1</text><text class="t t-sm" x="1160" y="550.2" text-anchor="middle">1</text><text class="t t-sm" x="1160" y="535.2" text-anchor="middle">1</text><text class="t t-sm" x="1160" y="520.2" text-anchor="middle">1</text><text class="t t-sm" x="1160" y="505.2" text-anchor="middle">1</text><text class="t t-sm" x="1160" y="490.2" text-anchor="middle">1</text><text class="t t-sm" x="1160" y="475.2" text-anchor="middle">2</text><text class="t t-sm" x="1160" y="460.2" text-anchor="middle">2</text><text class="t t-sm" x="1160" y="445.2" text-anchor="middle">1</text><text class="t t-sm" x="1160" y="430.2" text-anchor="middle">1</text><text class="t t-sm" x="1160" y="415.2" text-anchor="middle">2</text><text class="t t-sm" x="1160" y="400.2" text-anchor="middle">2</text><text class="t t-sm" x="1160" y="385.2" text-anchor="middle">2</text><text class="t t-sm" x="1160" y="370.2" text-anchor="middle">2</text><text class="t t-sm" x="1160" y="355.2" text-anchor="middle">2</text><text class="t t-sm" x="1160" y="340.2" text-anchor="middle">1</text><text class="t t-sm" x="1160" y="325.2" text-anchor="middle">1</text><text class="t t-sm" x="1160" y="310.2" text-anchor="middle">1</text><text class="t t-sm" x="1160" y="295.2" text-anchor="middle">1</text><text class="t t-sm" x="1160" y="280.2" text-anchor="middle">1</text><text class="t t-sm" x="1160" y="265.2" text-anchor="middle">1</text></g><g data-role="title"><rect class="paper" x="776" y="708" width="400" height="116"/><rect class="thin" x="776" y="708" width="290" height="32"/><text class="t t-cap" x="780" y="717">TITLE</text><text class="t t-xl" x="780" y="733">125 cc FOUR-STROKE · SECTION</text><rect class="thin" x="1066" y="708" width="110" height="32"/><text class="t t-cap" x="1070" y="717">DWG NO</text><text class="t t-xl" x="1070" y="733">BP-002</text><rect class="thin" x="776" y="740" width="64" height="25"/><text class="t t-cap" x="780" y="749">SCALE</text><text class="t" x="780" y="760">1:1</text><rect class="thin" x="840" y="740" width="50" height="25"/><text class="t t-cap" x="844" y="749">SIZE</text><text class="t" x="844" y="760">A2</text><rect class="thin" x="890" y="740" width="56" height="25"/><text class="t t-cap" x="894" y="749">SHEET</text><text class="t" x="894" y="760">1 / 1</text><rect class="thin" x="946" y="740" width="110" height="25"/><text class="t t-cap" x="950" y="749">DRAWN</text><text class="t" x="950" y="760">CLAUDE</text><rect class="thin" x="1056" y="740" width="120" height="25"/><text class="t t-cap" x="1060" y="749">DATE</text><text class="t" x="1060" y="760">2026-10-15</text><rect class="thin" x="776" y="765" width="140" height="25"/><text class="t t-cap" x="780" y="774">MATERIAL</text><text class="t" x="780" y="785">SEE PARTS LIST</text><rect class="thin" x="916" y="765" width="120" height="25"/><text class="t t-cap" x="920" y="774">GENERAL TOL.</text><text class="t" x="920" y="785">ISO 2768-m</text><rect class="thin" x="1036" y="765" width="140" height="25"/><text class="t t-cap" x="1040" y="774">UNITS</text><text class="t" x="1040" y="785">mm · bar abs · °</text><rect class="thin" x="776" y="790" width="400" height="34"/><text class="t t-cap" x="780" y="799">LIVE · DRAG THE CRANK · ← → TURN · SPACE RUNS · S SLOW</text><text class="t" x="780" y="819" id="readout"></text><rect class="vis" x="776" y="708" width="400" height="116"/></g><circle class="hit" data-drag="crank" cx="290" cy="660" r="125.25"/></svg>

<script>
"use strict";
const K = (() => {
// Blueprint drafting kit: orthographic views, sections, hatching, dimensions and sheet furniture.
// Every function here is pure and returns SVG markup strings, so the same code runs in the build
// and, inlined, in the page (live dimensions, moving springs, needles).
//
// Units. World geometry is in millimetres of the real object: u to the right, v up (a front view),
// or u right, v away from the viewer (a plan view). The sheet is an A2 drawing, 594 mm wide, drawn
// 1200 units wide; a view maps world mm to sheet units through its drawing scale.

const SHEET = { w: 1200, h: 848 };
const PX_PER_MM = SHEET.w / 594;

// ISO 128 line widths and ISO 3098 lettering, in sheet units (A2: 0.5 / 0.25 mm lines, 3.5 mm text).
const THICK = 1.15;
const THIN = 0.55;
const TEXT = 9.5;
const ARROW = 7;
const GAP = 2.2; // extension lines start this far from the object
const OVER = 3.5; // and run this far past the dimension line

const r2 = (n) => Math.round(n * 100) / 100;

function fmt(n, digits = 1) {
  const near = Math.round(n);
  if (Math.abs(n - near) < 0.05) return String(near);
  return n.toFixed(digits);
}

// ---------------------------------------------------------------- views

// A view is a window from world mm onto the sheet. scale is the drawing scale (1/2.5 for "1:2.5").
function view({ x, y, scale, name = "" }) {
  const k = scale * PX_PER_MM;
  return { x, y, scale, k, name, p: ([u, v]) => [r2(x + u * k), r2(y - v * k)] };
}

const scaleLabel = (scale) => (scale >= 1 ? `${fmt(scale)}:1` : `1:${fmt(1 / scale)}`);

function d(V, pts, closed = true) {
  let out = "";
  for (let i = 0; i < pts.length; i++) {
    const [x, y] = V.p(pts[i]);
    out += `${i ? "L" : "M"}${x} ${y}`;
  }
  return closed ? out + "Z" : out;
}

// ---------------------------------------------------------------- world geometry (point lists)

const rect = (u0, v0, u1, v1) => [[u0, v0], [u1, v0], [u1, v1], [u0, v1]];

function arc(cu, cv, r, a0, a1, steps) {
  const n = steps ?? Math.max(3, Math.ceil(Math.abs(a1 - a0) / 7.5));
  const out = [];
  for (let i = 0; i <= n; i++) {
    const a = ((a0 + ((a1 - a0) * i) / n) * Math.PI) / 180;
    out.push([cu + r * Math.cos(a), cv + r * Math.sin(a)]);
  }
  return out;
}

const circle = (cu, cv, r, steps = 48) => arc(cu, cv, r, 0, 360 - 360 / steps, steps - 1);

// A rectangle with filleted corners.
function rrect(u0, v0, u1, v1, r, steps = 4) {
  const q = Math.min(r, (u1 - u0) / 2, (v1 - v0) / 2);
  return [
    ...arc(u1 - q, v0 + q, q, -90, 0, steps),
    ...arc(u1 - q, v1 - q, q, 0, 90, steps),
    ...arc(u0 + q, v1 - q, q, 90, 180, steps),
    ...arc(u0 + q, v0 + q, q, 180, 270, steps),
  ];
}

const move = (pts, du, dv) => pts.map(([u, v]) => [u + du, v + dv]);
const flipU = (pts, about = 0) => pts.map(([u, v]) => [2 * about - u, v]).reverse();
const flipV = (pts, about = 0) => pts.map(([u, v]) => [u, 2 * about - v]).reverse();

function inside([u, v], poly) {
  let hit = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [ui, vi] = poly[i];
    const [uj, vj] = poly[j];
    if (vi > v !== vj > v && u < ((uj - ui) * (v - vi)) / (vj - vi) + ui) hit = !hit;
  }
  return hit;
}

// A body of revolution cut through its axis.
// loop is the half-profile as [r, s] pairs: r >= 0 measured from the axis, s along the axis.
// axis "v" is a vertical axis at u = at; axis "u" a horizontal axis at v = at.
// Returns the cut faces (hatched) and the edges seen through the bore behind the cutting plane:
// every circle on an inner surface shows edge-on as a straight line across the bore.
function revolve(loop, { axis = "v", at = 0 } = {}) {
  const place = axis === "v" ? (r, s) => [at + r, s] : (r, s) => [s, at + r];
  const n = loop.length;
  const onAxis = loop.findIndex(([r], i) => r === 0 && loop[(i + 1) % n][0] === 0);
  let cuts;
  if (onAxis >= 0) {
    const chain = Array.from({ length: n }, (_, j) => loop[(onAxis + 1 + j) % n]);
    const right = chain.map(([r, s]) => place(r, s));
    const left = chain.slice(1, -1).reverse().map(([r, s]) => place(-r, s));
    cuts = [[...right, ...left]];
  } else {
    cuts = [loop.map(([r, s]) => place(r, s)), loop.map(([r, s]) => place(-r, s)).reverse()];
  }
  const eps = 1e-3;
  const across = new Map();
  const clear = (r, s) => [0.02, 0.25, 0.5, 0.75, 0.98].every((t) => !inside([t * r, s], loop));
  for (const [r, s] of loop) {
    if (r <= 0) continue;
    if (clear(r, s + eps) && clear(r, s - eps)) across.set(s, Math.max(across.get(s) ?? 0, r));
  }
  const edges = [...across].map(([s, r]) => [place(-r, s), place(r, s)]);
  return { cuts, edges };
}

// ---------------------------------------------------------------- hatching

// ANSI/ISO-style material hatches. Spacing is in sheet units and never scales with the view,
// so a detail at 2:1 shows the same density as the main view, as on a real drawing.
const MATERIALS = {
  steel: { kind: "lines", gap: 3.4 },
  iron: { kind: "lines", gap: 5.6 },
  alu: { kind: "pairs", gap: 5.2, pair: 1.5 },
  brass: { kind: "dashed", gap: 4.6 },
  bronze: { kind: "dashed", gap: 3.6 },
  rubber: { kind: "cross", gap: 3.2 },
  plastic: { kind: "lines", gap: 2.3 },
  foam: { kind: "dots", gap: 2.6 },
  wood: { kind: "grain", gap: 4 },
};
const ANGLES = [45, 135, 30, 60];

function hatchDefs() {
  let out = "";
  for (const [name, m] of Object.entries(MATERIALS)) {
    for (const angle of ANGLES) {
      const g = m.gap;
      let body = "";
      if (m.kind === "lines") body = `<path class="hl" d="M0 -1V${g + 1}"/>`;
      if (m.kind === "pairs") body = `<path class="hl" d="M0 -1V${g + 1}M${m.pair} -1V${g + 1}"/>`;
      if (m.kind === "dashed") body = `<path class="hl" d="M0 -1V${g + 1}"/><path class="hl hl-dash" d="M${g / 2} -1V${g + 1}"/>`;
      if (m.kind === "cross") body = `<path class="hl" d="M0 -1V${g + 1}M-1 0H${g + 1}"/>`;
      if (m.kind === "dots") body = `<circle class="hd" cx="${g / 2}" cy="${g / 2}" r="0.42"/>`;
      if (m.kind === "grain") body = `<path class="hl" d="M0 -1V${g + 1}"/><path class="hl" d="M${g * 0.55} -1C${g * 0.75} ${g * 0.3} ${g * 0.35} ${g * 0.7} ${g * 0.55} ${g + 1}"/>`;
      out += `<pattern id="h-${name}-${angle}" patternUnits="userSpaceOnUse" width="${g}" height="${g}" patternTransform="rotate(${angle})">${body}</pattern>`;
    }
  }
  return out;
}

// ---------------------------------------------------------------- drawing parts

// A cut face: paper underneath (it hides what is behind), the material hatch, a thick outline.
// mat "solid" blacks the section in, the ISO convention for sections too thin to hatch.
function cut(V, pts, { mat = "steel", angle = 45 } = {}) {
  const dd = d(V, pts);
  if (mat === "solid") return `<path class="solid" d="${dd}"/>`;
  return `<path class="paper" d="${dd}"/><path fill="url(#h-${mat}-${angle})" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

// A body of revolution in section, with the edges behind the cut.
function section(V, rev, opts) {
  return rev.cuts.map((c) => cut(V, c, opts)).join("") + rev.edges.map((e) => line(V, e)).join("");
}

// An unsectioned solid (shafts, rods, pins, balls, nuts and ribs are never hatched in a section).
function body(V, pts) {
  const dd = d(V, pts);
  return `<path class="paper" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

const line = (V, pts, cls = "vis", closed = false) => `<path class="${cls}" d="${d(V, pts, closed)}"/>`;
const lines = (V, list, cls = "vis") => `<path class="${cls}" d="${list.map((pts) => d(V, pts, false)).join("")}"/>`;

// A centre line, run a little past the outline at both ends.
function centerline(V, a, b, over = 6) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  return `<path class="ctr" d="M${r2(ax - ux * over)} ${r2(ay - uy * over)}L${r2(bx + ux * over)} ${r2(by + uy * over)}"/>`;
}

// Centre mark for a circle in a view: two crossed centre lines.
function centerMark(V, [cu, cv], r, over = 5) {
  return centerline(V, [cu - r, cv], [cu + r, cv], over) + centerline(V, [cu, cv - r], [cu, cv + r], over);
}

// A compression spring cut along its axis: wire sections (blacked in) on both sides, half a pitch
// apart, joined by the back half of each turn. from/to are positions along the axis.
function springSection(V, { from, to, radius, wire, turns, axis = "u", at = 0 }) {
  const place = axis === "u" ? (s, r) => [s, at + r] : (s, r) => [at + r, s];
  const pitch = (to - from - wire) / turns;
  const start = from + wire / 2;
  const back = [];
  let sections = "";
  for (let i = 0; i <= turns; i++) {
    const sTop = start + i * pitch;
    sections += cut(V, circle(...place(sTop, radius), wire / 2, 12), { mat: "solid" });
    if (i < turns) {
      const sBot = sTop + pitch / 2;
      sections += cut(V, circle(...place(sBot, -radius), wire / 2, 12), { mat: "solid" });
      back.push([place(sTop, radius), place(sBot, -radius)]);
    }
  }
  return lines(V, back, "vis spring") + sections;
}

// ---------------------------------------------------------------- annotation

function arrowHead([x, y], [dx, dy]) {
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len;
  const uy = dy / len;
  const bx = x - ux * ARROW;
  const by = y - uy * ARROW;
  const half = ARROW * 0.25;
  return `M${r2(x)} ${r2(y)}L${r2(bx - uy * half)} ${r2(by + ux * half)}L${r2(bx + uy * half)} ${r2(by - ux * half)}Z`;
}

const textWidth = (s, size = TEXT) => String(s).length * size * 0.6;

// A linear dimension between two world points, measured along dir ("h" or "v").
// off is the sheet distance from point a to the dimension line (negative: up or left).
// The value is measured from the geometry unless text is given, so a dimension cannot lie.
function dim(V, a, b, { dir = "h", off = 18, text, prefix = "", suffix = "", id = "", cls = "" } = {}) {
  const A = V.p(a);
  const B = V.p(b);
  const value = text ?? prefix + fmt(Math.abs(dir === "h" ? b[0] - a[0] : b[1] - a[1])) + suffix;
  const h = dir === "h";
  const main = h ? 0 : 1; // the axis the dimension measures along
  const side = 1 - main;
  const at = A[side] + off; // where the dimension line sits
  const pt = (m, s) => (h ? [m, s] : [s, m]);
  let ext = "";
  for (const P of [A, B]) {
    const gapTo = at - P[side];
    if (Math.abs(gapTo) <= GAP) continue;
    const sgn = Math.sign(gapTo);
    const [x1, y1] = pt(P[main], P[side] + sgn * GAP);
    const [x2, y2] = pt(P[main], at + sgn * OVER);
    ext += `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
  }
  const lo = Math.min(A[main], B[main]);
  const hi = Math.max(A[main], B[main]);
  const span = hi - lo;
  const tw = textWidth(value);
  const arrowsIn = span >= ARROW * 2 + 3;
  const textIn = span >= tw + ARROW * 2 + 6;
  let lineD;
  let heads;
  let tm; // text position along the measured axis
  let anchor = "middle";
  if (arrowsIn) {
    const [x1, y1] = pt(lo, at);
    const [x2, y2] = pt(hi, at);
    lineD = `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
    heads = arrowHead(pt(lo, at), pt(-1, 0)) + arrowHead(pt(hi, at), pt(1, 0));
  } else {
    const [x1, y1] = pt(lo - ARROW - 7, at);
    const [x2, y2] = pt(hi + ARROW + 7, at);
    lineD = `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
    heads = arrowHead(pt(lo, at), pt(1, 0)) + arrowHead(pt(hi, at), pt(-1, 0));
  }
  if (textIn) tm = (lo + hi) / 2;
  else {
    tm = hi + ARROW + 10 + tw / 2;
    const [x2, y2] = pt(tm + tw / 2, at);
    lineD += `L${r2(x2)} ${r2(y2)}`;
  }
  // ISO: text sits just above a horizontal line and reads from the right on a vertical one.
  const [tx, ty] = pt(tm, at - 3);
  const textEl = h
    ? `<text class="t" x="${r2(tx)}" y="${r2(ty)}" text-anchor="${anchor}">${value}</text>`
    : `<text class="t" x="${r2(tx)}" y="${r2(ty)}" text-anchor="${anchor}" transform="rotate(-90 ${r2(tx)} ${r2(ty)})">${value}</text>`;
  return `<g data-role="dim"${id ? ` id="${id}"` : ""}${cls ? ` class="${cls}"` : ""}><path class="thin" d="${ext}${lineD}"/><path class="head" d="${heads}"/>${textEl}</g>`;
}

// A part balloon: a dot on the part, a thin leader, a circled item number.
function balloon(V, at, [bx, by], n, { target = "", r = 8.5 } = {}) {
  const [ax, ay] = V.p(at);
  const a = Math.atan2(ay - by, ax - bx);
  const ex = r2(bx + r * Math.cos(a));
  const ey = r2(by + r * Math.sin(a));
  return (
    `<g data-role="balloon" data-target="${target}" data-at="${ax} ${ay}">` +
    `<path class="thin" d="M${ex} ${ey}L${ax} ${ay}"/><circle class="dot" cx="${ax}" cy="${ay}" r="1.5"/>` +
    `<circle class="balloon" cx="${bx}" cy="${by}" r="${r}"/>` +
    `<text class="t" x="${bx}" y="${r2(by + 3.3)}" text-anchor="middle">${n}</text></g>`
  );
}

// A view title: SECTION A-A over its scale, centred under the view.
function viewLabel(x, y, title, sub = "") {
  return (
    `<g data-role="label"><text class="t t-lg" x="${x}" y="${y}" text-anchor="middle">${title}</text>` +
    (sub ? `<text class="t t-sm" x="${x}" y="${y + 12}" text-anchor="middle">${sub}</text>` : "") +
    `</g>`
  );
}

// The circle that marks a detail in its parent view, with its letter.
function detailMark(V, [cu, cv], r, letter, angle = 45) {
  const [x, y] = V.p([cu, cv]);
  const R = r * V.k;
  const a = (-angle * Math.PI) / 180;
  const lx = r2(x + (R + 9) * Math.cos(a));
  const ly = r2(y + (R + 9) * Math.sin(a) + 4);
  return `<g data-role="label"><circle class="thin mark" cx="${x}" cy="${y}" r="${r2(R)}"/><text class="t t-lg" x="${lx}" y="${ly}" text-anchor="middle">${letter}</text></g>`;
}

// A viewing-direction arrow (VIEW C): a thick-tipped arrow pointing at the surface, with its letter.
function viewArrow(V, at, [dx, dy], letter, len = 26) {
  const [x, y] = V.p(at);
  const n = Math.hypot(dx, dy) || 1;
  const ux = dx / n;
  const uy = dy / n;
  const sx = r2(x - ux * len);
  const sy = r2(y - uy * len);
  return (
    `<g data-role="label"><path class="vis" d="M${sx} ${sy}L${r2(x - ux * ARROW)} ${r2(y - uy * ARROW)}"/>` +
    `<path class="head" d="${arrowHead([x, y], [ux, uy])}"/>` +
    `<text class="t t-lg" x="${r2(sx - uy * 10)}" y="${r2(sy + ux * 10 + 4)}" text-anchor="middle">${letter}</text></g>`
  );
}

// A long-break line across a part (thin, with one zigzag), for parts that run out of the view.
function breakLine(V, a, b) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const mx = (ax + bx) / 2;
  const my = (ay + by) / 2;
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  const z = 3.5;
  const p = (t, s) => `${r2(mx + ux * t - uy * s)} ${r2(my + uy * t + ux * s)}`;
  return `<path class="thin" d="M${r2(ax - ux * 4)} ${r2(ay - uy * 4)}L${p(-z, 0)}L${p(-z / 2, z * 1.6)}L${p(z / 2, -z * 1.6)}L${p(z, 0)}L${r2(bx + ux * 4)} ${r2(by + uy * 4)}"/>`;
}

// ---------------------------------------------------------------- sheet furniture

// The drawing frame: trimmed edge, a thick border, zone references and centring marks.
function frame({ w = SHEET.w, h = SHEET.h, trim = 8, m = 24, cols = 8, rows = 6 } = {}) {
  let out = `<g data-role="frame"><rect class="thin" x="${trim}" y="${trim}" width="${w - trim * 2}" height="${h - trim * 2}"/>`;
  out += `<rect class="vis" x="${m}" y="${m}" width="${w - m * 2}" height="${h - m * 2}"/>`;
  const cw = (w - m * 2) / cols;
  const rh = (h - m * 2) / rows;
  let ticks = "";
  let labels = "";
  for (let i = 0; i <= cols; i++) {
    const x = r2(m + i * cw);
    if (i > 0 && i < cols) ticks += `M${x} ${trim}V${m}M${x} ${h - m}V${h - trim}`;
    if (i < cols) {
      const cx = r2(m + (i + 0.5) * cw);
      labels += `<text class="t t-sm" x="${cx}" y="${r2((trim + m) / 2 + 3)}" text-anchor="middle">${i + 1}</text>`;
      labels += `<text class="t t-sm" x="${cx}" y="${r2(h - (trim + m) / 2 + 3)}" text-anchor="middle">${i + 1}</text>`;
    }
  }
  for (let j = 0; j <= rows; j++) {
    const y = r2(m + j * rh);
    if (j > 0 && j < rows) ticks += `M${trim} ${y}H${m}M${w - m} ${y}H${w - trim}`;
    if (j < rows) {
      const cy = r2(m + (j + 0.5) * rh + 3);
      const letter = String.fromCharCode(65 + j);
      labels += `<text class="t t-sm" x="${r2((trim + m) / 2)}" y="${cy}" text-anchor="middle">${letter}</text>`;
      labels += `<text class="t t-sm" x="${r2(w - (trim + m) / 2)}" y="${cy}" text-anchor="middle">${letter}</text>`;
    }
  }
  const cm = `M${w / 2} ${trim}V${m + 10}M${w / 2} ${h - trim}V${h - m - 10}M${trim} ${h / 2}H${m + 10}M${w - trim} ${h / 2}H${w - m - 10}`;
  out += `<path class="thin" d="${ticks}"/><path class="vis" d="${cm}"/>${labels}</g>`;
  return out;
}

// A ruled table (parts list). cols: [{ w, align, title }]. rows: arrays of cell strings.
// Item numbers count up from the bottom, as a parts list sits on top of the title block.
function table(x, y, cols, rows, { rowH = 16, role = "bom", headH = 18 } = {}) {
  const w = cols.reduce((s, c) => s + c.w, 0);
  const h = headH + rows.length * rowH;
  let rules = "";
  let text = "";
  let cx = x;
  for (const [i, c] of cols.entries()) {
    if (i > 0) rules += `M${r2(cx)} ${y}V${y + h}`;
    const tx = c.align === "center" ? cx + c.w / 2 : c.align === "right" ? cx + c.w - 4 : cx + 4;
    const anchor = c.align === "center" ? "middle" : c.align === "right" ? "end" : "start";
    text += `<text class="t t-sm t-head" x="${r2(tx)}" y="${y + h - 5.5}" text-anchor="${anchor}">${c.title}</text>`;
    rows.forEach((row, j) => {
      text += `<text class="t t-sm" x="${r2(tx)}" y="${r2(y + (rows.length - 1 - j) * rowH + rowH - 4.8)}" text-anchor="${anchor}">${row[i]}</text>`;
    });
    cx += c.w;
  }
  for (let j = 1; j <= rows.length; j++) rules += `M${x} ${r2(y + j * rowH)}H${x + w}`;
  return `<g data-role="${role}"><rect class="paper" x="${x}" y="${y}" width="${w}" height="${h}"/><path class="thin" d="${rules}"/><rect class="vis" x="${x}" y="${y}" width="${w}" height="${h}"/>${text}</g>`;
}

// A title-block cell: a small caption over a value. size: "sm" | "md" | "lg".
function cell({ x, y, w, h, label, value = "", size = "md", id = "" }) {
  const cls = size === "lg" ? "t t-xl" : size === "sm" ? "t t-sm" : "t";
  const vy = size === "lg" ? y + h - 7 : y + h - 5;
  return (
    `<rect class="thin" x="${x}" y="${y}" width="${w}" height="${h}"/>` +
    `<text class="t t-cap" x="${x + 4}" y="${y + 9}">${label}</text>` +
    `<text class="${cls}" x="${x + 4}" y="${vy}"${id ? ` id="${id}"` : ""}>${value}</text>`
  );
}

function titleBlock(x, y, w, h, cells) {
  return `<g data-role="title"><rect class="paper" x="${x}" y="${y}" width="${w}" height="${h}"/>${cells.map((c) => cell({ ...c, x: x + c.x, y: y + c.y })).join("")}<rect class="vis" x="${x}" y="${y}" width="${w}" height="${h}"/></g>`;
}

// A notes block: a heading and numbered lines.
function notes(x, y, heading, items, lead = 13) {
  let out = `<g data-role="notes"><text class="t t-head" x="${x}" y="${y}">${heading}</text>`;
  items.forEach((s, i) => {
    out += `<text class="t t-sm" x="${x}" y="${r2(y + lead * (i + 1) + 2)}">${i + 1}. ${s}</text>`;
  });
  return out + `</g>`;
}

return { SHEET, PX_PER_MM, THICK, THIN, TEXT, ARROW, GAP, OVER, r2, fmt, view, scaleLabel, d, rect, arc, circle, rrect, move, flipU, flipV, inside, revolve, MATERIALS, ANGLES, hatchDefs, cut, section, body, line, lines, centerline, centerMark, springSection, textWidth, dim, balloon, viewLabel, detailMark, viewArrow, breakLine, frame, table, cell, titleBlock, notes };
})();

const L = (() => {
// Live runtime for a blueprint sheet: one time-based loop, an idle tour, input wake-ups,
// offscreen and hidden-tab pauses, reduced motion, and deterministic frames for checks.
//
// URL parameters (all optional):
//   ?t=6.5            render the tour at 6.5 s, deterministically, and stop (for screenshots)
//   ?theme=paper      blueprint | paper | white | dark
//   ?zoom=x,y,w,h     show only this sheet region, filling the window (for 4x close-ups)
//   ?mask=x,y,w,h     blank everything outside this box, so one view stands alone
//   ?check=1          run the layout self-check after the first frame (see selfcheck.mjs)

function params() {
  const q = new URLSearchParams(location.search);
  return {
    t: q.has("t") ? Number(q.get("t")) : null,
    theme: q.get("theme"),
    zoom: q.get("zoom"),
    mask: q.get("mask"),
    check: q.has("check"),
  };
}

const THEMES = ["blueprint", "paper", "white", "dark"];

function setupPage(svg) {
  const q = params();
  // the page's own default (writePage's `theme`), then a saved choice, then ?theme=, which wins but isn't saved
  const fallback = document.documentElement.dataset.theme || "blueprint";
  const pick = (name, save) => {
    if (!THEMES.includes(name)) return;
    document.documentElement.dataset.theme = name;
    for (const b of document.querySelectorAll("[data-theme-pick]")) b.setAttribute("aria-pressed", String(b.dataset.themePick === name));
    if (save) {
      try {
        localStorage.setItem("bp-theme", name);
      } catch {}
    }
  };
  let saved = null;
  try {
    saved = localStorage.getItem("bp-theme");
  } catch {}
  pick(q.theme ?? saved ?? fallback, false);
  for (const b of document.querySelectorAll("[data-theme-pick]")) b.addEventListener("click", () => pick(b.dataset.themePick, true));
  // ?mask=x,y,w,h paints the page colour over everything outside one box, so a view stands alone
  if (q.mask) {
    const [x, y, w, h] = q.mask.split(",").map(Number);
    if ([x, y, w, h].every(Number.isFinite)) {
      const m = document.createElementNS("http://www.w3.org/2000/svg", "path");
      m.setAttribute("d", `M-9999 -9999H9999V9999H-9999Z M${x} ${y}V${y + h}H${x + w}V${y}Z`);
      m.setAttribute("fill-rule", "evenodd");
      m.setAttribute("style", "fill:var(--bp-page);pointer-events:none");
      m.dataset.role = "mask";
      svg.appendChild(m);
    }
  }
  // The sheet's keys listen on the svg. Make them work without clicking the sheet first: a press on the
  // sheet focuses it (drag handlers cancel pointerdown, which would otherwise skip focus), and a key typed
  // while nothing is focused is passed on to the sheet.
  svg.addEventListener("pointerdown", (e) => {
    if (document.activeElement !== svg && !e.target.closest?.("[tabindex]:not(svg), a, button, input, select, textarea")) svg.focus({ preventScroll: true });
  });
  window.addEventListener("keydown", (e) => {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || svg.contains(e.target)) return;
    const a = document.activeElement;
    if (a && a !== document.body && a !== document.documentElement) return;
    const fwd = new KeyboardEvent("keydown", { key: e.key, code: e.code, shiftKey: e.shiftKey, repeat: e.repeat, bubbles: true, cancelable: true });
    if (!svg.dispatchEvent(fwd)) e.preventDefault();
  });
  if (q.zoom) {
    const box = q.zoom.split(",").map(Number);
    if (box.length === 4 && box.every(Number.isFinite)) {
      svg.setAttribute("viewBox", box.join(" "));
      document.body.classList.add("bp-zoom");
    }
  }
  return q;
}

// Critically damped follow toward a target: calm, no overshoot, frame-rate independent.
function follow(at, want, rate, dt) {
  return want + (at - want) * Math.exp(-rate * dt);
}

const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, t)));

// run({ root, step, render, idleAfter })
//   step(dt, live) advances the model; live.touring says whether the idle tour drives it.
//   It returns true while something is still settling, so a reduced-motion page can sleep.
//   render(live) writes attributes; it never rebuilds static geometry.
function run({ root, step, render, idleAfter = 4, onFrozen }) {
  const q = params();
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const live = { clock: 0, slow: 1, lastInput: -Infinity, reduced, touring: !reduced, frozen: q.t != null };
  live.input = () => {
    live.lastInput = live.clock;
    live.touring = false;
    wake();
  };

  if (live.frozen) {
    const dt = 1 / 240;
    for (let t = 0; t < q.t; t += dt) {
      live.clock = t;
      live.touring = true;
      step(dt, live);
    }
    render(live);
    onFrozen?.(live);
    return live;
  }

  let raf = 0;
  let last = 0;
  let visible = true;
  function frame(now) {
    raf = 0;
    const real = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    live.clock += real;
    live.touring = !reduced && live.clock - live.lastInput > idleAfter;
    // the first frame (and the first after a pause) has no elapsed time: models that divide by the step
    // (a speed from two positions) would turn NaN and stay NaN, so a zero step is not taken
    const busy = real > 0 ? step(real * live.slow, live) : true;
    render(live);
    if (visible && !document.hidden && (!reduced || busy)) raf = requestAnimationFrame(frame);
    else last = 0;
  }
  function wake() {
    if (!raf && visible && !document.hidden) raf = requestAnimationFrame(frame);
  }
  live.wake = wake;
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(([entry]) => {
      visible = entry.isIntersecting;
      if (visible) wake();
    }).observe(root);
  }
  document.addEventListener("visibilitychange", wake);
  render(live);
  wake();
  return live;
}

// Vertical drag on an element, reported as a sheet-unit delta since the press.
function dragY(svg, el, { start, move, end }) {
  let id = null;
  let y0 = 0;
  const toSheet = (e) => {
    const m = svg.getScreenCTM();
    return m ? (e.clientY - m.f) / m.d : e.clientY;
  };
  el.addEventListener("pointerdown", (e) => {
    id = e.pointerId;
    el.setPointerCapture(id);
    y0 = toSheet(e);
    start?.();
    e.preventDefault();
  });
  el.addEventListener("pointermove", (e) => {
    if (e.pointerId === id) move(toSheet(e) - y0);
  });
  const stop = (e) => {
    if (e.pointerId !== id) return;
    id = null;
    end?.();
  };
  el.addEventListener("pointerup", stop);
  el.addEventListener("pointercancel", stop);
}

// Announce a readout to screen readers at most every `every` seconds.
function announcer(el, every = 1.5) {
  let lastAt = -Infinity;
  let lastText = "";
  return (text, clock) => {
    if (text === lastText || clock - lastAt < every) return;
    lastAt = clock;
    lastText = text;
    el.textContent = text;
  };
}

return { params, THEMES, setupPage, follow, ease, run, dragY, announcer };
})();

const C = (() => {
// Layout self-check, run in the page with ?check=1 (scripts/check.mjs drives it headlessly).
// It writes a JSON report into <pre id="bp-check"> and to the console. A clean sheet reports
// zero failures in every category.
//
//   text-overlap      two pieces of lettering touch
//   text-on-geometry  lettering sits on a part or on another annotation's lines
//   outside-frame     an annotation or a view crosses the drawing frame
//   balloon-target    a balloon's dot is not on the part it names
//   balloon-on-geom   a balloon circle sits on a part
//   hard-colour       a fill or stroke is a literal colour instead of a token
//   sideways-scroll   the page scrolls horizontally

const roleOf = (el) => el.closest("[data-role]")?.dataset.role ?? "";

// A clipped group's box is its clip region's box (getBoundingClientRect ignores clipping).
function clippedBox(el) {
  const ref = el.getAttribute("clip-path")?.match(/url\(#([^)]+)\)/)?.[1];
  const shape = ref && document.getElementById(ref)?.firstElementChild;
  if (!shape) return el.getBoundingClientRect();
  const b = shape.getBBox();
  const m = shape.ownerSVGElement.getScreenCTM();
  const x0 = m.a * b.x + m.e;
  const y0 = m.d * b.y + m.f;
  return { left: x0, top: y0, right: x0 + m.a * b.width, bottom: y0 + m.d * b.height };
}

function selfCheck(svg) {
  const fails = [];
  const fail = (kind, what) => fails.push({ kind, what });
  const label = (el) => {
    const g = el.closest("[data-role],[data-part],[data-geom]");
    const name = g?.id || g?.dataset.part || g?.dataset.target || g?.dataset.role || g?.dataset.geom || el.tagName;
    return `${name}: "${(el.textContent || "").trim().slice(0, 24)}"`;
  };
  const shown = (el) => {
    const b = el.getBoundingClientRect();
    if (b.width < 0.5 || b.height < 0.5) return false;
    const cs = getComputedStyle(el);
    return cs.visibility !== "hidden" && cs.display !== "none" && Number(cs.opacity) > 0.05;
  };
  const texts = [...svg.querySelectorAll("text")].filter(shown);
  const boxes = texts.map((t) => t.getBoundingClientRect());
  const grow = 0.4;
  const hit = (a, b) => a.left < b.right - grow && b.left < a.right - grow && a.top < b.bottom - grow && b.top < a.bottom - grow;

  for (let i = 0; i < texts.length; i++)
    for (let j = i + 1; j < texts.length; j++) if (hit(boxes[i], boxes[j])) fail("text-overlap", `${label(texts[i])} × ${label(texts[j])}`);

  const geomOf = (el) => el.closest("[data-geom]");
  for (const [i, t] of texts.entries()) {
    const role = roleOf(t);
    if (role === "engraved" || role === "frame") continue;
    const own = t.closest("[data-role]");
    const b = boxes[i];
    const seen = new Set();
    for (let ix = 0; ix < 4; ix++)
      for (let iy = 0; iy < 2; iy++) {
        const x = b.left + b.width * (0.15 + ix * 0.233);
        const y = b.top + b.height * (0.3 + iy * 0.4);
        for (const el of document.elementsFromPoint(x, y)) {
          if (el === t || el.tagName === "text" || el.tagName === "svg" || el.closest("defs")) continue;
          if (el.classList.contains("tint") || el.classList.contains("hit") || el.closest('[data-role="phantom"]')) continue;
          if (own && own.contains(el)) continue;
          const g = geomOf(el);
          const other = el.closest("[data-role]");
          const bad = (g && !g.contains(t)) || (other && other !== own && other.dataset.role !== "frame" && other.dataset.role !== "chart-bg");
          if (bad && !el.classList.contains("sheet-bg") && !el.classList.contains("grid")) {
            const key = el.closest("[data-part],[data-role],[data-geom]");
            if (!seen.has(key)) {
              seen.add(key);
              fail("text-on-geometry", `${label(t)} on ${key?.dataset.part || key?.id || key?.dataset.role || key?.dataset.geom || el.tagName}`);
            }
          }
        }
      }
  }

  const frameRect = svg.querySelector('[data-role="frame"] rect.vis')?.getBoundingClientRect();

const DEG_PER_S = 90; // the tour turns one working cycle (720°) in 8 s

let target = 0;
let auto = false;
let dragging = false;

function step(dt, live) {
  const driven = (live.touring || auto) && !dragging;
  if (driven) {
    target += DEG_PER_S * dt;
    phi = target;
    return true;
  }
  const n = Math.max(1, Math.ceil(dt * 240));
  for (let i = 0; i < n; i++) phi = live.reduced ? target : L.follow(phi, target, dragging ? 40 : 14, dt / n);
  return Math.abs(phi - target) > 0.01;
}

  const flameOn = f >= M.SPARK && xb < 0.995;
  for (const [gas, flame, clip, V, under] of el.gas) {

    gas.setAttribute("class", burning && !flameOn ? "tint burn" : "tint");
    gas.setAttribute("fill-opacity", opacity(s.p));
    clip.setAttribute("d", d);
    const fr = flameOn ? K.r2(38 * Math.sqrt(xb) * V.k) : 0;
    flame.setAttribute("r", fr);
    under.setAttribute("r", fr);
    flame.setAttribute("fill-opacity", opacity(s.p));
  }

  el.gasB.setAttribute("fill-opacity", opacity(s.p));

  // live dimension and balloons
  el.dim.innerHTML = K.dim(VM, [M.BORE / 2, M.crownAtTDC], [M.BORE / 2, M.crown(f)], {

  const [px, py] = pvPt(s).split(",");
  el.pvDot.setAttribute("cx", px);
  el.pvDot.setAttribute("cy", py);
  const x = K.r2(LC.x0 + (f / 720) * (LC.x1 - LC.x0));
  el.cursor.setAttribute("d", `M${x} ${LC.y0 - 12}V${LC.y1}`);

  const stroke = M.strokeOf(f);
  el.readout.textContent = `${Math.round(f)}° ${stroke} · p ${s.p < 10 ? s.p.toFixed(2) : s.p.toFixed(1)} bar · V ${s.V.toFixed(1)} cm³ · ${Math.round(s.T)} K · IN ${lifts.in.toFixed(1)} EX ${lifts.ex.toFixed(1)}`;
  say(`${stroke.toLowerCase()} stroke, crank ${Math.round(f)} degrees, cylinder pressure ${s.p.toFixed(1)} bar, ${Math.round(s.T)} kelvin.`, live.clock);
}

// ---------------------------------------------------------------- input
const live = L.run({
  root: svg,
  step,
  render,
  idleAfter: 5,
  onFrozen: () => q.check && C.selfCheck(svg),
});

if (live.reduced && !live.frozen) {
  // A still, true moment: just after the firing TDC, the flame most of the way across.
  phi = target = 372;
  render(live);
}

// Rotary drag about the crank axis: the pointer's angle change turns the crank.
const hit = svg.querySelector("[data-drag]");
let last = null;
const angleOf = (e) => {
  const m = svg.getScreenCTM();
  const x = (e.clientX - m.e) / m.a;
  const y = (e.clientY - m.f) / m.d;
  const [cx, cy] = VM.p([0, 0]);
  return (Math.atan2(y - cy, x - cx) * 180) / Math.PI;

hit.addEventListener("pointerdown", (e) => {
  hit.setPointerCapture(e.pointerId);
  dragging = true;
  auto = false;
  target = phi;
  last = angleOf(e);
  live.input();
  e.preventDefault();
});
hit.addEventListener("pointermove", (e) => {
  if (last === null) return;
  const a = angleOf(e);
  let d = a - last;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  last = a;
  target += d; // clockwise on screen is a positive turn
  live.input();
});
const release = () => {
  last = null;
  dragging = false;
  live.input();
};
hit.addEventListener("pointerup", release);
hit.addEventListener("pointercancel", release);

svg.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === "ArrowRight" || k === "ArrowLeft") target += k === "ArrowRight" ? 10 : -10;
  else if (k === "Home") target = Math.round(target / 720) * 720;
  else if (k === " ") auto = !auto;
  else if (k === "s" || k === "S") live.slow = live.slow === 1 ? 0.25 : live.slow === 0.25 ? 0.06 : 1;
  else return;
  e.preventDefault();
  if (k !== " " && k !== "s" && k !== "S") auto = false;
  live.input();
});

if (q.check && !live.frozen) setTimeout(() => C.selfCheck(svg), 400);

</script>
<script>
"use strict";
const BP_LINKS = {};
const BP_ATLAS = {"slug":"four-stroke","kind":"2d","level":2,"parent":"aero-engine","parentPart":"6","atlas":false};
const BP_CARDS = (() => {
// Part cards: hover, tap or focus a balloon and a small card names the part, gives its size and
// material, and says in a sentence what it does. The part it points to lights up in the accent.
//
// Works on both pages: a 2D sheet's balloons are <g data-role="balloon" data-target="n">, a 3D page's
// are <g data-part="n"> in its overlay (re-drawn every frame, so everything here is delegated and
// keyed on the number, never on the element). The data comes from examples/<slug>/info.json, which
// kit/page.mjs inlines as BP_INFO when it exists:
//   { "4": { "name": "O-ring", "spec": "33 × 2", "material": "NBR 70", "note": "Seals the barrel..." } }
// 2D: the part's [data-part] groups get the class bp-hl.  3D: a "bp:part" event (detail.id, or null)
// that kit/solid3d.mjs answers by tinting the part.
//
// Atlas (references/atlas.md): a part with "open": "<slug>" is a doorway into another example. Its card
// adds the child's idea and a "Look inside →" link (or "drawing in progress" while the child is not
// drawn). Activating it (the link, Enter on the focused balloon, double-click on the part in 3D) flies
// in and then navigates: a "bp:open" event (detail { id, href, go }) that kit/solid3d.mjs takes over
// by calling preventDefault (it flies the camera, then calls go); on a 2D sheet the viewBox eases in on
// the part here. links: page.mjs's BP_LINKS; atlas: BP_ATLAS, the page's own slug and place.
// The page also answers ?focus=<part> (start zoomed on that part, ease out) and ?from=<slug> (a short
// zoom-out on arrival); on a 3D page kit/solid3d.mjs does both.

function attach({ info = {}, links = null, atlas = null, root = document }) {
  info = info || {};
  const has = Object.keys(info).length > 0;
  const Q = new URLSearchParams(location.search);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const is3d = !!document.getElementById("gl");
  // no flights in a deterministic frame, a sheet's ?zoom= close-up or a check run
  const still = reduced || Q.has("t") || Q.has("check") || (!is3d && Q.has("zoom"));
  const sheet = is3d ? null : root.querySelector("svg.bp-sheet");
  if (!has && !atlas) return null;

  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

  function light(id) {
    for (const el of document.querySelectorAll(".bp-hl")) el.classList.remove("bp-hl");
    if (id != null) for (const el of document.querySelectorAll(`svg [data-part="${CSS.escape(id)}"]`)) if (!el.closest("#ov")) el.classList.add("bp-hl");
    document.dispatchEvent(new CustomEvent("bp:part", { detail: { id } }));
  }

  // ---- atlas: where a doorway leads, and the flight there
  // { slug, href } for a doorway whose child is drawn, { slug, wip: true } while it is not, else null
  const doorway = (id) => {
    const slug = info[id]?.open;
    if (!slug) return null;
    const l = links?.[slug];
    const href = l ? (is3d ? l.href3d || l.href2d : l.href2d) || l.href : null;
    if (!href) return { slug, wip: true };
    const from = atlas?.slug ? `${href.includes("?") ? "&" : "?"}from=${encodeURIComponent(atlas.slug)}` : "";
    return { slug, href: href + from, title: l.title, idea: l.idea };
  };
  let going = false;
  function go(id) {
    const d = doorway(id);
    if (!d?.href || going) return;
    going = true;
    // inside a frame (a landing-page hero) the whole window goes, not the little frame
    const nav = () => {
      const abs = new URL(d.href, location.href).href;
      try { if (window.top !== window) return window.top.location.assign(abs); } catch {}
      location.assign(abs);
    };
    if (still) return nav();
    hide();
    // a 3D page flies its camera and calls go; otherwise a sheet zooms its viewBox; else straight there
    const ev = new CustomEvent("bp:open", { cancelable: true, detail: { id, href: d.href, go: nav } });
    if (!document.dispatchEvent(ev)) return;
    if (sheet) flySheet(id, nav);
    else nav();
  }

  // 2D: the sheet's viewBox, eased between two boxes [x, y, w, h]
  const full = sheet ? (sheet.getAttribute("viewBox") || "0 0 1200 848").split(/[\s,]+/).map(Number) : null;
  let anim = 0;
  function tween(a, b, ms, done) {
    cancelAnimationFrame(anim);
    const t0 = performance.now();
    const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, t)));
    const step = (now) => {
      const k = ease((now - t0) / ms);
      sheet.setAttribute("viewBox", a.map((v, i) => +(v + (b[i] - v) * k).toFixed(2)).join(" "));
      if (now - t0 < ms) anim = requestAnimationFrame(step);
      else done?.();
    };
    anim = requestAnimationFrame(step);
  }
  // the part's box in sheet units: of the view (data-geom) nearest its balloon's leader end, padded
  // and grown to the sheet's aspect
  function partBox(id) {
    if (!sheet) return null;
    const inv = sheet.getScreenCTM()?.inverse();
    if (!inv) return null;
    const pt = (x, y) => new DOMPoint(x, y).matrixTransform(inv);
    const groups = new Map();
    for (const el of sheet.querySelectorAll(`[data-part="${CSS.escape(id)}"]`)) {
      if (el.closest('[data-role="balloon"]')) continue;
      const r = el.getBoundingClientRect();
      if (!r.width && !r.height) continue;
      const a = pt(r.left, r.top);
      const b = pt(r.right, r.bottom);
      const key = el.closest("[data-geom]") ?? sheet;
      const g = groups.get(key) ?? [Infinity, Infinity, -Infinity, -Infinity];
      groups.set(key, [Math.min(g[0], a.x), Math.min(g[1], a.y), Math.max(g[2], b.x), Math.max(g[3], b.y)]);
    }
    if (!groups.size) return null;
    const at = sheet.querySelector(`[data-role="balloon"][data-target="${CSS.escape(id)}"]`)?.dataset.at?.split(/\s+/).map(Number);
    let best = null;
    let score = Infinity;
    for (const g of groups.values()) {
      const s = at ? Math.hypot((g[0] + g[2]) / 2 - at[0], (g[1] + g[3]) / 2 - at[1]) : -(g[2] - g[0]) * (g[3] - g[1]);
      if (s < score) [score, best] = [s, g];
    }
    const [x0, y0, x1, y1] = best;
    let w = Math.max(24, (x1 - x0) * 1.5);
    let h = Math.max(24, (y1 - y0) * 1.5);
    const aspect = full[2] / full[3];
    if (w / h < aspect) w = h * aspect;
    else h = w / aspect;
    w = Math.min(w, full[2]);
    h = Math.min(h, full[3]);
    return [(x0 + x1) / 2 - w / 2, (y0 + y1) / 2 - h / 2, w, h];
  }
  function flySheet(id, nav) {
    const box = partBox(id);
    if (!box) return nav();
    light(id);
    sheet.classList.add("bp-flying");
    tween(full, box, 900, nav);
  }
  // back to this page from the browser's cache: the whole sheet, not the end of the flight
  addEventListener("pageshow", (e) => {
    if (!e.persisted) return;
    going = false;
    if (sheet) {
      cancelAnimationFrame(anim);
      sheet.setAttribute("viewBox", full.join(" "));
      sheet.classList.remove("bp-flying");
      light(null);
    }
  });
  // arriving: ?focus=<part> starts on that part and eases out to the whole sheet; ?from= a short zoom-out
  if (sheet && !still) {
    const focus = Q.get("focus");
    const box = focus ? partBox(focus) : null;
    if (box) {
      sheet.setAttribute("viewBox", box.join(" "));
      if (info[focus]) light(focus);
      tween(box, full, 900, () => setTimeout(() => light(null), 600));
    } else if (Q.has("from")) {
      const z = 1 / 1.35;
      const a = [full[0] + (full[2] * (1 - z)) / 2, full[1] + (full[3] * (1 - z)) / 2, full[2] * z, full[3] * z];
      sheet.setAttribute("viewBox", a.join(" "));
      tween(a, full, 650);
    }
  }
  if (!has) return null;

  const card = document.createElement("div");
  card.className = "bp-card";
  card.setAttribute("role", "dialog");
  card.setAttribute("aria-live", "polite");
  card.hidden = true;
  document.body.appendChild(card);

  let shown = null;
  let pinned = false;

  // the balloon under an element, and its part number
  const balloonOf = (el) => el?.closest?.('[data-role="balloon"], #ov [data-part], .v3-stage [data-part]');
  // the balloon at a point: look through transparent drag targets (a sheet's hit rectangles lie over
  // its balloons in places), never through real geometry
  const balloonAt = (x, y) => {
    for (const el of document.elementsFromPoint(x, y)) {
      const b = balloonOf(el);
      if (b) return b;
      if (!el.matches?.("[data-drag], .hit")) return null;
    }
    return null;
  };
  const numberOf = (b) => {
    if (!b) return null;
    return partNo(b.dataset.target || b.dataset.part || b.querySelector("text")?.textContent);
  };
  // a second copy of a part ("3u" in a 3D scene) shares its card with the item number it starts with
  const partNo = (v) => {
    const raw = String(v ?? "").trim();
    const n = info[raw] ? raw : raw.match(/^\d+/)?.[0];
    return n && info[n] ? n : null;
  };

  function place(x, y) {
    const pad = 12;
    const w = card.offsetWidth;
    const h = card.offsetHeight;
    let left = x + 16;
    let top = y + 16;
    if (left + w > innerWidth - pad) left = x - w - 16;
    if (left < pad) left = pad;
    if (top + h > innerHeight - pad) top = y - h - 16;
    if (top < pad) top = pad;
    card.style.left = `${left + scrollX}px`;
    card.style.top = `${top + scrollY}px`;
  }

  function show(id, x, y) {
    const p = info[id];
    if (!p) return hide();
    if (shown !== id) {
      const sub = [p.spec, p.material, p.qty && p.qty !== "1" ? `× ${p.qty}` : ""].filter(Boolean).map(esc).join(" · ");
      const d = doorway(id);
      const door = !d
        ? ""
        : d.href
          ? (d.idea ? `<p class="bp-card-i">${esc(d.idea)}</p>` : "") + `<a class="bp-card-go" href="${esc(d.href)}" data-open="${esc(id)}">${esc(info[id].openLabel || "Look inside")} →</a>`
          : `<div class="bp-card-wip">Inside: drawing in progress</div>`;
      card.innerHTML =
        `<div class="bp-card-h"><span class="bp-card-n">${esc(id)}</span><b>${esc(p.name)}</b></div>` +
        (sub ? `<div class="bp-card-s">${sub}</div>` : "") +
        (p.note ? `<p>${esc(p.note)}</p>` : "") +
        door +
        (pinned ? `<div class="bp-card-x">Esc or click elsewhere to close</div>` : "");
      card.hidden = false;
      shown = id;
      light(id);
    }
    place(x, y);
  }

  function hide() {
    card.hidden = true;
    shown = null;
    pinned = false;
    light(null);
  }

  card.addEventListener("click", (e) => {
    const a = e.target.closest?.("[data-open]");
    if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return; // a new tab: let the link be a link
    e.preventDefault();
    go(a.dataset.open);
  });

  // hover (pointer): follow whatever balloon is under the pointer; the 3D overlay is re-drawn each
  // frame, so ask the document what is under the pointer rather than trusting enter/leave events
  addEventListener("pointermove", (e) => {
    if (pinned || e.pointerType === "touch") return;
    const id = numberOf(balloonAt(e.clientX, e.clientY));
    if (id) show(id, e.clientX, e.clientY);
    else if (shown) hide();
  }, { passive: true });

  // click or tap pins the card; it must not start an orbit or a drag underneath
  addEventListener("pointerdown", (e) => {
    const b = balloonAt(e.clientX, e.clientY);
    const id = numberOf(b);
    if (id) {
      e.stopPropagation();
      e.preventDefault();
      pinned = false;
      shown = null;
      pinned = true;
      show(id, e.clientX, e.clientY);
    } else if (pinned && !card.contains(e.target)) hide();
  }, true);
  // double-click a doorway's balloon: straight in
  addEventListener("dblclick", (e) => {
    const id = numberOf(balloonAt(e.clientX, e.clientY));
    if (id && doorway(id)?.href) {
      e.preventDefault();
      go(id);
    }
  });
  // double-click on a doorway part in 3D: kit/solid3d.mjs names the part under the pointer
  document.addEventListener("bp:dblpart", (e) => {
    const id = partNo(e.detail?.id);
    if (id && doorway(id)?.href) {
      e.preventDefault();
      go(id);
    }
  });

  addEventListener("keydown", (e) => {
    if (e.key === "Escape" && shown) hide();
  });

  // keyboard: static (2D) balloons are focusable buttons; focus shows the card, Enter or Space pins
  // it, and Enter on a doorway's balloon looks inside
  for (const b of root.querySelectorAll('[data-role="balloon"]')) {
    const id = numberOf(b);
    if (!id) continue;
    const d = doorway(id);
    b.setAttribute("tabindex", "0");
    b.setAttribute("role", "button");
    b.setAttribute("aria-label", `Part ${id}: ${info[id].name}${d?.href ? `. Enter to look inside: ${d.title}` : d ? ". Inside: drawing in progress" : ""}`);
    const at = () => { const r = b.getBoundingClientRect(); return [r.right, r.top]; };
    b.addEventListener("focus", () => show(id, ...at()));
    b.addEventListener("blur", () => { if (!pinned) hide(); });
    b.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && d?.href) { e.preventDefault(); go(id); return; }
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pinned = true; shown = null; show(id, ...at()); }
    });
  }

  // keyboard on a 3D page: its balloons are drawn afresh every frame and can't hold focus, so the
  // doorways get a short list of real buttons, out of sight until focused; each shows its card at
  // its balloon, Enter looks inside
  const doors = Object.keys(info).filter((id) => doorway(id));
  const stage = document.getElementById("stage");
  if (is3d && stage && doors.length) {
    const nav = document.createElement("nav");
    nav.className = "bp-doors";
    nav.setAttribute("aria-label", "Look inside a part");
    nav.innerHTML = doors.map((id) => { const d = doorway(id); return `<button type="button" data-door="${esc(id)}"${d.href ? "" : " aria-disabled=\"true\""}>${esc(id)} ${esc(info[id].name)}${d.href ? " →" : " · in progress"}</button>`; }).join("");
    stage.before(nav); // not inside the stage: it is role="img", whose children are presentational
    const where = (id, btn) => {
      const g = document.querySelector(`#ov [data-part="${CSS.escape(id)}"]`);
      const r = (g ?? btn).getBoundingClientRect();
      return [r.right, r.top];
    };
    nav.addEventListener("focusin", (e) => { const id = e.target.dataset?.door; if (id) { shown = null; show(id, ...where(id, e.target)); } });
    nav.addEventListener("focusout", () => { if (!pinned) hide(); });
    nav.addEventListener("click", (e) => { const id = e.target.closest?.("[data-door]")?.dataset.door; if (id) go(id); });
    nav.addEventListener("keydown", (e) => e.stopPropagation()); // its keys are its own, not the stage's
  }

  addEventListener("scroll", () => { if (shown && !pinned) hide(); }, { passive: true });
  return { show, hide, go };
}

return { attach };
})();

ial":"42CrMo4","qty":"2","note":"A cap on the stem end that the spring pushes against."},"22":{"name":"Valve collet","spec":"Pair","material":"C15","qty":"2","note":"Two split cones that lock the retainer to a groove in the valve stem."},"23":{"name":"Bucket tappet + shim","spec":"Ø26","material":"16MnCr5","qty":"2","note":"The cam pushes on this cup, which presses the valve open. The shim under it sets the valve clearance."},"24":{"name":"Inlet camshaft","spec":"","material":"EN-GJL chilled","qty":"1","note":"Its lobe sets how far and when the inlet valve lifts. It turns at half crank speed, so each valve opens once per two crank turns."},"25":{"name":"Exhaust camshaft","spec":"","material":"EN-GJL chilled","qty":"1","note":"Same job for the exhaust valve, with its lobe timed to open before the piston reaches the bottom of the power stroke."},"26":{"name":"Cam cover","spec":"","material":"EN AC-46000","qty":"1","note":"Closes the top of the head and keeps oil in around the cams and tappets."},"27":{"name":"Spark plug","spec":"M10×1, 12.7 reach","material":"Bought out","qty":"1","note":"Fires a spark in the chamber before top dead centre. The flame grows from its tip across the charge and starts the power stroke."},"28":{"name":"Inlet manifold","spec":"","material":"EN AC-46000","qty":"1","note":"Carries the fresh charge from the throttle to the inlet port."},"29":{"name":"Exhaust pipe","spec":"Ø27 × 1.5","material":"X5CrNi18-10","qty":"1","note":"Carries burned gas away from the exhaust port."}}, links: BP_LINKS, atlas: BP_ATLAS });
