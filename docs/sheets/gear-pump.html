<script>
"use strict";
const K = (() => {
// Blueprint drafting kit: orthographic views, sections, hatching, dimensions and sheet furniture.
// Every function here is pure and returns SVG markup strings, so the same code runs in the build
// and, inlined, in the page (live dimensions, moving springs, needles).
//
// Units. World geometry is in millimetres of the real object: u to the right, v up (a front view),
// or u right, v away from the viewer (a plan view). The sheet is an A2 drawing, 594 mm wide, drawn
// 1200 units wide; a view maps world mm to sheet units through its drawing scale.

const SHEET = { w: 1200, h: 848 };
const PX_PER_MM = SHEET.w / 594;

// ISO 128 line widths and ISO 3098 lettering, in sheet units (A2: 0.5 / 0.25 mm lines, 3.5 mm text).
const THICK = 1.15;
const THIN = 0.55;
const TEXT = 9.5;
const ARROW = 7;
const GAP = 2.2; // extension lines start this far from the object
const OVER = 3.5; // and run this far past the dimension line

const r2 = (n) => Math.round(n * 100) / 100;

function fmt(n, digits = 1) {
  const near = Math.round(n);
  if (Math.abs(n - near) < 0.05) return String(near);
  return n.toFixed(digits);
}

// ---------------------------------------------------------------- views

// A view is a window from world mm onto the sheet. scale is the drawing scale (1/2.5 for "1:2.5").
function view({ x, y, scale, name = "" }) {
  const k = scale * PX_PER_MM;
  return { x, y, scale, k, name, p: ([u, v]) => [r2(x + u * k), r2(y - v * k)] };
}

const scaleLabel = (scale) => (scale >= 1 ? `${fmt(scale)}:1` : `1:${fmt(1 / scale)}`);

function d(V, pts, closed = true) {
  let out = "";
  for (let i = 0; i < pts.length; i++) {
    const [x, y] = V.p(pts[i]);
    out += `${i ? "L" : "M"}${x} ${y}`;
  }
  return closed ? out + "Z" : out;
}

// ---------------------------------------------------------------- world geometry (point lists)

const rect = (u0, v0, u1, v1) => [[u0, v0], [u1, v0], [u1, v1], [u0, v1]];

function arc(cu, cv, r, a0, a1, steps) {
  const n = steps ?? Math.max(3, Math.ceil(Math.abs(a1 - a0) / 7.5));
  const out = [];
  for (let i = 0; i <= n; i++) {
    const a = ((a0 + ((a1 - a0) * i) / n) * Math.PI) / 180;
    out.push([cu + r * Math.cos(a), cv + r * Math.sin(a)]);
  }
  return out;
}

const circle = (cu, cv, r, steps = 48) => arc(cu, cv, r, 0, 360 - 360 / steps, steps - 1);

// A rectangle with filleted corners.
function rrect(u0, v0, u1, v1, r, steps = 4) {
  const q = Math.min(r, (u1 - u0) / 2, (v1 - v0) / 2);
  return [
    ...arc(u1 - q, v0 + q, q, -90, 0, steps),
    ...arc(u1 - q, v1 - q, q, 0, 90, steps),
    ...arc(u0 + q, v1 - q, q, 90, 180, steps),
    ...arc(u0 + q, v0 + q, q, 180, 270, steps),
  ];
}

const move = (pts, du, dv) => pts.map(([u, v]) => [u + du, v + dv]);
const flipU = (pts, about = 0) => pts.map(([u, v]) => [2 * about - u, v]).reverse();
const flipV = (pts, about = 0) => pts.map(([u, v]) => [u, 2 * about - v]).reverse();

function inside([u, v], poly) {
  let hit = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [ui, vi] = poly[i];
    const [uj, vj] = poly[j];
    if (vi > v !== vj > v && u < ((uj - ui) * (v - vi)) / (vj - vi) + ui) hit = !hit;
  }
  return hit;
}

// A body of revolution cut through its axis.
// loop is the half-profile as [r, s] pairs: r >= 0 measured from the axis, s along the axis.
// axis "v" is a vertical axis at u = at; axis "u" a horizontal axis at v = at.
// Returns the cut faces (hatched) and the edges seen through the bore behind the cutting plane:
// every circle on an inner surface shows edge-on as a straight line across the bore.
function revolve(loop, { axis = "v", at = 0 } = {}) {
  const place = axis === "v" ? (r, s) => [at + r, s] : (r, s) => [s, at + r];
  const n = loop.length;
  const onAxis = loop.findIndex(([r], i) => r === 0 && loop[(i + 1) % n][0] === 0);
  let cuts;
  if (onAxis >= 0) {
    const chain = Array.from({ length: n }, (_, j) => loop[(onAxis + 1 + j) % n]);
    const right = chain.map(([r, s]) => place(r, s));
    const left = chain.slice(1, -1).reverse().map(([r, s]) => place(-r, s));
    cuts = [[...right, ...left]];
  } else {
    cuts = [loop.map(([r, s]) => place(r, s)), loop.map(([r, s]) => place(-r, s)).reverse()];
  }
  const eps = 1e-3;
  const across = new Map();
  const clear = (r, s) => [0.02, 0.25, 0.5, 0.75, 0.98].every((t) => !inside([t * r, s], loop));
  for (const [r, s] of loop) {
    if (r <= 0) continue;
    if (clear(r, s + eps) && clear(r, s - eps)) across.set(s, Math.max(across.get(s) ?? 0, r));
  }
  const edges = [...across].map(([s, r]) => [place(-r, s), place(r, s)]);
  return { cuts, edges };
}

// ---------------------------------------------------------------- hatching

// ANSI/ISO-style material hatches. Spacing is in sheet units and never scales with the view,
// so a detail at 2:1 shows the same density as the main view, as on a real drawing.
const MATERIALS = {
  steel: { kind: "lines", gap: 3.4 },
  iron: { kind: "lines", gap: 5.6 },
  alu: { kind: "pairs", gap: 5.2, pair: 1.5 },
  brass: { kind: "dashed", gap: 4.6 },
  bronze: { kind: "dashed", gap: 3.6 },
  rubber: { kind: "cross", gap: 3.2 },
  plastic: { kind: "lines", gap: 2.3 },
  foam: { kind: "dots", gap: 2.6 },
  wood: { kind: "grain", gap: 4 },
};
const ANGLES = [45, 135, 30, 60];

function hatchDefs() {
  let out = "";
  for (const [name, m] of Object.entries(MATERIALS)) {
    for (const angle of ANGLES) {
      const g = m.gap;
      let body = "";
      if (m.kind === "lines") body = `<path class="hl" d="M0 -1V${g + 1}"/>`;
      if (m.kind === "pairs") body = `<path class="hl" d="M0 -1V${g + 1}M${m.pair} -1V${g + 1}"/>`;
      if (m.kind === "dashed") body = `<path class="hl" d="M0 -1V${g + 1}"/><path class="hl hl-dash" d="M${g / 2} -1V${g + 1}"/>`;
      if (m.kind === "cross") body = `<path class="hl" d="M0 -1V${g + 1}M-1 0H${g + 1}"/>`;
      if (m.kind === "dots") body = `<circle class="hd" cx="${g / 2}" cy="${g / 2}" r="0.42"/>`;
      if (m.kind === "grain") body = `<path class="hl" d="M0 -1V${g + 1}"/><path class="hl" d="M${g * 0.55} -1C${g * 0.75} ${g * 0.3} ${g * 0.35} ${g * 0.7} ${g * 0.55} ${g + 1}"/>`;
      out += `<pattern id="h-${name}-${angle}" patternUnits="userSpaceOnUse" width="${g}" height="${g}" patternTransform="rotate(${angle})">${body}</pattern>`;
    }
  }
  return out;
}

// ---------------------------------------------------------------- drawing parts

// A cut face: paper underneath (it hides what is behind), the material hatch, a thick outline.
// mat "solid" blacks the section in, the ISO convention for sections too thin to hatch.
function cut(V, pts, { mat = "steel", angle = 45 } = {}) {
  const dd = d(V, pts);
  if (mat === "solid") return `<path class="solid" d="${dd}"/>`;
  return `<path class="paper" d="${dd}"/><path fill="url(#h-${mat}-${angle})" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

// A body of revolution in section, with the edges behind the cut.
function section(V, rev, opts) {
  return rev.cuts.map((c) => cut(V, c, opts)).join("") + rev.edges.map((e) => line(V, e)).join("");
}

// An unsectioned solid (shafts, rods, pins, balls, nuts and ribs are never hatched in a section).
function body(V, pts) {
  const dd = d(V, pts);
  return `<path class="paper" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

const line = (V, pts, cls = "vis", closed = false) => `<path class="${cls}" d="${d(V, pts, closed)}"/>`;
const lines = (V, list, cls = "vis") => `<path class="${cls}" d="${list.map((pts) => d(V, pts, false)).join("")}"/>`;

// A centre line, run a little past the outline at both ends.
function centerline(V, a, b, over = 6) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  return `<path class="ctr" d="M${r2(ax - ux * over)} ${r2(ay - uy * over)}L${r2(bx + ux * over)} ${r2(by + uy * over)}"/>`;
}

// Centre mark for a circle in a view: two crossed centre lines.
function centerMark(V, [cu, cv], r, over = 5) {
  return centerline(V, [cu - r, cv], [cu + r, cv], over) + centerline(V, [cu, cv - r], [cu, cv + r], over);
}

// A compression spring cut along its axis: wire sections (blacked in) on both sides, half a pitch
// apart, joined by the back half of each turn. from/to are positions along the axis.
function springSection(V, { from, to, radius, wire, turns, axis = "u", at = 0 }) {
  const place = axis === "u" ? (s, r) => [s, at + r] : (s, r) => [at + r, s];
  const pitch = (to - from - wire) / turns;
  const start = from + wire / 2;
  const back = [];
  let sections = "";
  for (let i = 0; i <= turns; i++) {
    const sTop = start + i * pitch;
    sections += cut(V, circle(...place(sTop, radius), wire / 2, 12), { mat: "solid" });
    if (i < turns) {
      const sBot = sTop + pitch / 2;
      sections += cut(V, circle(...place(sBot, -radius), wire / 2, 12), { mat: "solid" });
      back.push([place(sTop, radius), place(sBot, -radius)]);
    }
  }
  return lines(V, back, "vis spring") + sections;
}

// ---------------------------------------------------------------- annotation

function arrowHead([x, y], [dx, dy]) {
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len;
  const uy = dy / len;
  const bx = x - ux * ARROW;
  const by = y - uy * ARROW;
  const half = ARROW * 0.25;
  return `M${r2(x)} ${r2(y)}L${r2(bx - uy * half)} ${r2(by + ux * half)}L${r2(bx + uy * half)} ${r2(by - ux * half)}Z`;
}

const textWidth = (s, size = TEXT) => String(s).length * size * 0.6;

// A linear dimension between two world points, measured along dir ("h" or "v").
// off is the sheet distance from point a to the dimension line (negative: up or left).
// The value is measured from the geometry unless text is given, so a dimension cannot lie.
function dim(V, a, b, { dir = "h", off = 18, text, prefix = "", suffix = "", id = "", cls = "" } = {}) {
  const A = V.p(a);
  const B = V.p(b);
  const value = text ?? prefix + fmt(Math.abs(dir === "h" ? b[0] - a[0] : b[1] - a[1])) + suffix;
  const h = dir === "h";
  const main = h ? 0 : 1; // the axis the dimension measures along
  const side = 1 - main;
  const at = A[side] + off; // where the dimension line sits
  const pt = (m, s) => (h ? [m, s] : [s, m]);
  let ext = "";
  for (const P of [A, B]) {
    const gapTo = at - P[side];
    if (Math.abs(gapTo) <= GAP) continue;
    const sgn = Math.sign(gapTo);
    const [x1, y1] = pt(P[main], P[side] + sgn * GAP);
    const [x2, y2] = pt(P[main], at + sgn * OVER);
    ext += `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
  }
  const lo = Math.min(A[main], B[main]);
  const hi = Math.max(A[main], B[main]);
  const span = hi - lo;
  const tw = textWidth(value);
  const arrowsIn = span >= ARROW * 2 + 3;
  const textIn = span >= tw + ARROW * 2 + 6;
  let lineD;
  let heads;
  let tm; // text position along the measured axis
  let anchor = "middle";
  if (arrowsIn) {
    const [x1, y1] = pt(lo, at);
    const [x2, y2] = pt(hi, at);
    lineD = `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
    heads = arrowHead(pt(lo, at), pt(-1, 0)) + arrowHead(pt(hi, at), pt(1, 0));
  } else {
    const [x1, y1] = pt(lo - ARROW - 7, at);
    const [x2, y2] = pt(hi + ARROW + 7, at);
    lineD = `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
    heads = arrowHead(pt(lo, at), pt(1, 0)) + arrowHead(pt(hi, at), pt(-1, 0));
  }
  if (textIn) tm = (lo + hi) / 2;
  else {
    tm = hi + ARROW + 10 + tw / 2;
    const [x2, y2] = pt(tm + tw / 2, at);
    lineD += `L${r2(x2)} ${r2(y2)}`;
  }
  // ISO: text sits just above a horizontal line and reads from the right on a vertical one.
  const [tx, ty] = pt(tm, at - 3);
  const textEl = h
    ? `<text class="t" x="${r2(tx)}" y="${r2(ty)}" text-anchor="${anchor}">${value}</text>`
    : `<text class="t" x="${r2(tx)}" y="${r2(ty)}" text-anchor="${anchor}" transform="rotate(-90 ${r2(tx)} ${r2(ty)})">${value}</text>`;
  return `<g data-role="dim"${id ? ` id="${id}"` : ""}${cls ? ` class="${cls}"` : ""}><path class="thin" d="${ext}${lineD}"/><path class="head" d="${heads}"/>${textEl}</g>`;
}

// A part balloon: a dot on the part, a thin leader, a circled item number.
function balloon(V, at, [bx, by], n, { target = "", r = 8.5 } = {}) {
  const [ax, ay] = V.p(at);
  const a = Math.atan2(ay - by, ax - bx);
  const ex = r2(bx + r * Math.cos(a));
  const ey = r2(by + r * Math.sin(a));
  return (
    `<g data-role="balloon" data-target="${target}" data-at="${ax} ${ay}">` +
    `<path class="thin" d="M${ex} ${ey}L${ax} ${ay}"/><circle class="dot" cx="${ax}" cy="${ay}" r="1.5"/>` +
    `<circle class="balloon" cx="${bx}" cy="${by}" r="${r}"/>` +
    `<text class="t" x="${bx}" y="${r2(by + 3.3)}" text-anchor="middle">${n}</text></g>`
  );
}

// A view title: SECTION A-A over its scale, centred under the view.
function viewLabel(x, y, title, sub = "") {
  return (
    `<g data-role="label"><text class="t t-lg" x="${x}" y="${y}" text-anchor="middle">${title}</text>` +
    (sub ? `<text class="t t-sm" x="${x}" y="${y + 12}" text-anchor="middle">${sub}</text>` : "") +
    `</g>`
  );
}

// The circle that marks a detail in its parent view, with its letter.
function detailMark(V, [cu, cv], r, letter, angle = 45) {
  const [x, y] = V.p([cu, cv]);
  const R = r * V.k;
  const a = (-angle * Math.PI) / 180;
  const lx = r2(x + (R + 9) * Math.cos(a));
  const ly = r2(y + (R + 9) * Math.sin(a) + 4);
  return `<g data-role="label"><circle class="thin mark" cx="${x}" cy="${y}" r="${r2(R)}"/><text class="t t-lg" x="${lx}" y="${ly}" text-anchor="middle">${letter}</text></g>`;
}

// A viewing-direction arrow (VIEW C): a thick-tipped arrow pointing at the surface, with its letter.
function viewArrow(V, at, [dx, dy], letter, len = 26) {
  const [x, y] = V.p(at);
  const n = Math.hypot(dx, dy) || 1;
  const ux = dx / n;
  const uy = dy / n;
  const sx = r2(x - ux * len);
  const sy = r2(y - uy * len);
  return (
    `<g data-role="label"><path class="vis" d="M${sx} ${sy}L${r2(x - ux * ARROW)} ${r2(y - uy * ARROW)}"/>` +
    `<path class="head" d="${arrowHead([x, y], [ux, uy])}"/>` +
    `<text class="t t-lg" x="${r2(sx - uy * 10)}" y="${r2(sy + ux * 10 + 4)}" text-anchor="middle">${letter}</text></g>`
  );
}

// A long-break line across a part (thin, with one zigzag), for parts that run out of the view.
function breakLine(V, a, b) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const mx = (ax + bx) / 2;
  const my = (ay + by) / 2;
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  const z = 3.5;
  const p = (t, s) => `${r2(mx + ux * t - uy * s)} ${r2(my + uy * t + ux * s)}`;
  return `<path class="thin" d="M${r2(ax - ux * 4)} ${r2(ay - uy * 4)}L${p(-z, 0)}L${p(-z / 2, z * 1.6)}L${p(z / 2, -z * 1.6)}L${p(z, 0)}L${r2(bx + ux * 4)} ${r2(by + uy * 4)}"/>`;
}

// ---------------------------------------------------------------- sheet furniture

// The drawing frame: trimmed edge, a thick border, zone references and centring marks.
function frame({ w = SHEET.w, h = SHEET.h, trim = 8, m = 24, cols = 8, rows = 6 } = {}) {
  let out = `<g data-role="frame"><rect class="thin" x="${trim}" y="${trim}" width="${w - trim * 2}" height="${h - trim * 2}"/>`;
  out += `<rect class="vis" x="${m}" y="${m}" width="${w - m * 2}" height="${h - m * 2}"/>`;
  const cw = (w - m * 2) / cols;
  const rh = (h - m * 2) / rows;
  let ticks = "";
  let labels = "";
  for (let i = 0; i <= cols; i++) {
    const x = r2(m + i * cw);
    if (i > 0 && i < cols) ticks += `M${x} ${trim}V${m}M${x} ${h - m}V${h - trim}`;
    if (i < cols) {
      const cx = r2(m + (i + 0.5) * cw);
      labels += `<text class="t t-sm" x="${cx}" y="${r2((trim + m) / 2 + 3)}" text-anchor="middle">${i + 1}</text>`;
      labels += `<text class="t t-sm" x="${cx}" y="${r2(h - (trim + m) / 2 + 3)}" text-anchor="middle">${i + 1}</text>`;
    }
  }
  for (let j = 0; j <= rows; j++) {
    const y = r2(m + j * rh);
    if (j > 0 && j < rows) ticks += `M${trim} ${y}H${m}M${w - m} ${y}H${w - trim}`;
    if (j < rows) {
      const cy = r2(m + (j + 0.5) * rh + 3);
      const letter = String.fromCharCode(65 + j);
      labels += `<text class="t t-sm" x="${r2((trim + m) / 2)}" y="${cy}" text-anchor="middle">${letter}</text>`;
      labels += `<text class="t t-sm" x="${r2(w - (trim + m) / 2)}" y="${cy}" text-anchor="middle">${letter}</text>`;
    }
  }
  const cm = `M${w / 2} ${trim}V${m + 10}M${w / 2} ${h - trim}V${h - m - 10}M${trim} ${h / 2}H${m + 10}M${w - trim} ${h / 2}H${w - m - 10}`;
  out += `<path class="thin" d="${ticks}"/><path class="vis" d="${cm}"/>${labels}</g>`;
  return out;
}

// A ruled table (parts list). cols: [{ w, align, title }]. rows: arrays of cell strings.
// Item numbers count up from the bottom, as a parts list sits on top of the title block.
function table(x, y, cols, rows, { rowH = 16, role = "bom", headH = 18 } = {}) {
  const w = cols.reduce((s, c) => s + c.w, 0);
  const h = headH + rows.length * rowH;
  let rules = "";
  let text = "";
  let cx = x;
  for (const [i, c] of cols.entries()) {
    if (i > 0) rules += `M${r2(cx)} ${y}V${y + h}`;
    const tx = c.align === "center" ? cx + c.w / 2 : c.align === "right" ? cx + c.w - 4 : cx + 4;
    const anchor = c.align === "center" ? "middle" : c.align === "right" ? "end" : "start";
    text += `<text class="t t-sm t-head" x="${r2(tx)}" y="${y + h - 5.5}" text-anchor="${anchor}">${c.title}</text>`;
    rows.forEach((row, j) => {
      text += `<text class="t t-sm" x="${r2(tx)}" y="${r2(y + (rows.length - 1 - j) * rowH + rowH - 4.8)}" text-anchor="${anchor}">${row[i]}</text>`;
    });
    cx += c.w;
  }
  for (let j = 1; j <= rows.length; j++) rules += `M${x} ${r2(y + j * rowH)}H${x + w}`;
  return `<g data-role="${role}"><rect class="paper" x="${x}" y="${y}" width="${w}" height="${h}"/><path class="thin" d="${rules}"/><rect class="vis" x="${x}" y="${y}" width="${w}" height="${h}"/>${text}</g>`;
}

// A title-block cell: a small caption over a value. size: "sm" | "md" | "lg".
function cell({ x, y, w, h, label, value = "", size = "md", id = "" }) {
  const cls = size === "lg" ? "t t-xl" : size === "sm" ? "t t-sm" : "t";
  const vy = size === "lg" ? y + h - 7 : y + h - 5;
  return (
    `<rect class="thin" x="${x}" y="${y}" width="${w}" height="${h}"/>` +
    `<text class="t t-cap" x="${x + 4}" y="${y + 9}">${label}</text>` +
    `<text class="${cls}" x="${x + 4}" y="${vy}"${id ? ` id="${id}"` : ""}>${value}</text>`
  );
}

function titleBlock(x, y, w, h, cells) {
  return `<g data-role="title"><rect class="paper" x="${x}" y="${y}" width="${w}" height="${h}"/>${cells.map((c) => cell({ ...c, x: x + c.x, y: y + c.y })).join("")}<rect class="vis" x="${x}" y="${y}" width="${w}" height="${h}"/></g>`;
}

// A notes block: a heading and numbered lines.
function notes(x, y, heading, items, lead = 13) {
  let out = `<g data-role="notes"><text class="t t-head" x="${x}" y="${y}">${heading}</text>`;
  items.forEach((s, i) => {
    out += `<text class="t t-sm" x="${x}" y="${r2(y + lead * (i + 1) + 2)}">${i + 1}. ${s}</text>`;
  });
  return out + `</g>`;
}

return { SHEET, PX_PER_MM, THICK, THIN, TEXT, ARROW, GAP, OVER, r2, fmt, view, scaleLabel, d, rect, arc, circle, rrect, move, flipU, flipV, inside, revolve, MATERIALS, ANGLES, hatchDefs, cut, section, body, line, lines, centerline, centerMark, springSection, textWidth, dim, balloon, viewLabel, detailMark, viewArrow, breakLine, frame, table, cell, titleBlock, notes };
})();

const L = (() => {
// Live runtime for a blueprint sheet: one time-based loop, an idle tour, input wake-ups,
// offscreen and hidden-tab pauses, reduced motion, and deterministic frames for checks.
//
// URL parameters (all optional):
//   ?t=6.5            render the tour at 6.5 s, deterministically, and stop (for screenshots)
//   ?theme=paper      blueprint | paper | white | dark
//   ?zoom=x,y,w,h     show only this sheet region, filling the window (for 4x close-ups)
//   ?mask=x,y,w,h     blank everything outside this box, so one view stands alone
//   ?check=1          run the layout self-check after the first frame (see selfcheck.mjs)

function params() {
  const q = new URLSearchParams(location.search);
  return {
    t: q.has("t") ? Number(q.get("t")) : null,
    theme: q.get("theme"),
    zoom: q.get("zoom"),
    mask: q.get("mask"),
    check: q.has("check"),
  };
}

const THEMES = ["blueprint", "paper", "white", "dark"];

function setupPage(svg) {
  const q = params();
  // the page's own default (writePage's `theme`), then a saved choice, then ?theme=, which wins but isn't saved
  const fallback = document.documentElement.dataset.theme || "blueprint";
  const pick = (name, save) => {
    if (!THEMES.includes(name)) return;
    document.documentElement.dataset.theme = name;
    for (const b of document.querySelectorAll("[data-theme-pick]")) b.setAttribute("aria-pressed", String(b.dataset.themePick === name));
    if (save) {
      try {
        localStorage.setItem("bp-theme", name);
      } catch {}
    }
  };
  let saved = null;
  try {
    saved = localStorage.getItem("bp-theme");
  } catch {}
  pick(q.theme ?? saved ?? fallback, false);
  for (const b of document.querySelectorAll("[data-theme-pick]")) b.addEventListener("click", () => pick(b.dataset.themePick, true));
  // ?mask=x,y,w,h paints the page colour over everything outside one box, so a view stands alone
  if (q.mask) {
    const [x, y, w, h] = q.mask.split(",").map(Number);
    if ([x, y, w, h].every(Number.isFinite)) {
      const m = document.createElementNS("http://www.w3.org/2000/svg", "path");
      m.setAttribute("d", `M-9999 -9999H9999V9999H-9999Z M${x} ${y}V${y + h}H${x + w}V${y}Z`);
      m.setAttribute("fill-rule", "evenodd");
      m.setAttribute("style", "fill:var(--bp-page);pointer-events:none");
      m.dataset.role = "mask";
      svg.appendChild(m);
    }
  }
  if (q.zoom) {
    const box = q.zoom.split(",").map(Number);
    if (box.length === 4 && box.every(Number.isFinite)) {
      svg.setAttribute("viewBox", box.join(" "));
      document.body.classList.add("bp-zoom");
    }
  }
  return q;
}

// Critically damped follow toward a target: calm, no overshoot, frame-rate independent.
function follow(at, want, rate, dt) {
  return want + (at - want) * Math.exp(-rate * dt);
}

const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, t)));

// run({ root, step, render, idleAfter })
//   step(dt, live) advances the model; live.touring says whether the idle tour drives it.
//   It returns true while something is still settling, so a reduced-motion page can sleep.
//   render(live) writes attributes; it never rebuilds static geometry.
function run({ root, step, render, idleAfter = 4, onFrozen }) {
  const q = params();
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const live = { clock: 0, slow: 1, lastInput: -Infinity, reduced, touring: !reduced, frozen: q.t != null };
  live.input = () => {
    live.lastInput = live.clock;
    live.touring = false;
    wake();
  };

  if (live.frozen) {
    const dt = 1 / 240;
    for (let t = 0; t < q.t; t += dt) {
      live.clock = t;
      live.touring = true;
      step(dt, live);
    }
    render(live);
    onFrozen?.(live);
    return live;
  }

  let raf = 0;
  let last = 0;
  let visible = true;
  function frame(now) {
    raf = 0;
    const real = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    live.clock += real;
    live.touring = !reduced && live.clock - live.lastInput > idleAfter;
    const busy = step(real * live.slow, live);
    render(live);
    if (visible && !document.hidden && (!reduced || busy)) raf = requestAnimationFrame(frame);
    else last = 0;
  }
  function wake() {
    if (!raf && visible && !document.hidden) raf = requestAnimationFrame(frame);
  }
  live.wake = wake;
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(([entry]) => {
      visible = entry.isIntersecting;
      if (visible) wake();
    }).observe(root);
  }
  document.addEventListener("visibilitychange", wake);
  render(live);
  wake();
  return live;
}

// Vertical drag on an element, reported as a sheet-unit delta since the press.
function dragY(svg, el, { start, move, end }) {
  let id = null;
  let y0 = 0;
  const toSheet = (e) => {
    const m = svg.getScreenCTM();
    return m ? (e.clientY - m.f) / m.d : e.clientY;
  };
  el.addEventListener("pointerdown", (e) => {
    id = e.pointerId;
    el.setPointerCapture(id);
    y0 = toSheet(e);
    start?.();
    e.preventDefault();
  });
  el.addEventListener("pointermove", (e) => {
    if (e.pointerId === id) move(toSheet(e) - y0);
  });
  const stop = (e) => {
    if (e.pointerId !== id) return;
    id = null;
    end?.();
  };
  el.addEventListener("pointerup", stop);
  el.addEventListener("pointercancel", stop);
}

// Announce a readout to screen readers at most every `every` seconds.
function announcer(el, every = 1.5) {
  let lastAt = -Infinity;
  let lastText = "";
  return (text, clock) => {
    if (text === lastText || clock - lastAt < every) return;
    lastAt = clock;
    lastText = text;
    el.textContent = text;
  };
}

return { params, THEMES, setupPage, follow, ease, run, dragY, announcer };

const C = (() => {
// Layout self-check, run in the page with ?check=1 (scripts/check.mjs drives it headlessly).
// It writes a JSON report into <pre id="bp-check"> and to the console. A clean sheet reports
// zero failures in every category.
//
//   text-overlap      two pieces of lettering touch
//   text-on-geometry  lettering sits on a part or on another annotation's lines
//   outside-frame     an annotation or a view crosses the drawing frame
//   balloon-target    a balloon's dot is not on the part it names
//   balloon-on-geom   a balloon circle sits on a part
//   hard-colour       a fill or stroke is a literal colour instead of a token
//   sideways-scroll   the page scrolls horizontally

const roleOf = (el) => el.closest("[data-role]")?.dataset.role ?? "";

// A clipped group's box is its clip region's box (getBoundingClientRect ignores clipping).
function clippedBox(el) {
  const ref = el.getAttribute("clip-path")?.match(/url\(#([^)]+)\)/)?.[1];
  const shape = ref && document.getElementById(ref)?.firstElementChild;
  if (!shape) return el.getBoundingClientRect();
  const b = shape.getBBox();
  const m = shape.ownerSVGElement.getScreenCTM();
  const x0 = m.a * b.x + m.e;
  const y0 = m.d * b.y + m.f;
  return { left: x0, top: y0, right: x0 + m.a * b.width, bottom: y0 + m.d * b.height };
}

function selfCheck(svg) {
  const fails = [];
  const fail = (kind, what) => fails.push({ kind, what });
  const label = (el) => {
    const g = el.closest("[data-role],[data-part],[data-geom]");
    const name = g?.id || g?.dataset.part || g?.dataset.target || g?.dataset.role || g?.dataset.geom || el.tagName;
    return `${name}: "${(el.textContent || "").trim().slice(0, 24)}"`;
  };
  const shown = (el) => {
    const b = el.getBoundingClientRect();
    if (b.width < 0.5 || b.height < 0.5) return false;
    const cs = getComputedStyle(el);
    return cs.visibility !== "hidden" && cs.display !== "none" && Number(cs.opacity) > 0.05;
  };
  const texts = [...svg.querySelectorAll("text")].filter(shown);
  const boxes = texts.map((t) => t.getBoundingClientRect());
  const grow = 0.4;
  const hit = (a, b) => a.left < b.right - grow && b.left < a.right - grow && a.top < b.bottom - grow && b.top < a.bottom - grow;

  for (let i = 0; i < texts.length; i++)
    for (let j = i + 1; j < texts.length; j++) if (hit(boxes[i], boxes[j])) fail("text-overlap", `${label(texts[i])} × ${label(texts[j])}`);

  const geomOf = (el) => el.closest("[data-geom]");
  for (const [i, t] of texts.entries()) {
    const role = roleOf(t);
    if (role === "engraved" || role === "frame") continue;
    const own = t.closest("[data-role]");
    const b = boxes[i];
    const seen = new Set();
    for (let ix = 0; ix < 4; ix++)
      for (let iy = 0; iy < 2; iy++) {
        const x = b.left + b.width * (0.15 + ix * 0.233);
        const y = b.top + b.height * (0.3 + iy * 0.4);
        for (const el of document.elementsFromPoint(x, y)) {
          if (el === t || el.tagName === "text" || el.tagName === "svg" || el.closest("defs")) continue;
          if (el.classList.contains("tint") || el.classList.contains("hit") || el.closest('[data-role="phantom"]')) continue;
          if (own && own.contains(el)) continue;
          const g = geomOf(el);
          const other = el.closest("[data-role]");
          const bad = (g && !g.contains(t)) || (other && other !== own && other.dataset.role !== "frame" && other.dataset.role !== "chart-bg");
          if (bad && !el.classList.contains("sheet-bg") && !el.classList.contains("grid")) {
            const key = el.closest("[data-part],[data-role],[data-geom]");
            if (!seen.has(key)) {
              seen.add(key);
              fail("text-on-geometry", `${label(t)} on ${key?.dataset.part || key?.id || key?.dataset.role || key?.dataset.geom || el.tagName}`);
            }
          }
        }
      }
  }

  const frameRect = svg.querySelector('[data-role="frame"] rect.vis')?.getBoundingClientRect();
  if (frameRect) {
    for (const el of svg.querySelectorAll("[data-role]:not([data-role=frame]), [data-geom]")) {
      if (el.parentElement?.closest("[data-role]:not([data-role=frame]), [data-geom]")) continue;
      if (!shown(el)) continue;
      const b = clippedBox(el);
      const tol = 0.5;
      if (b.left < frameRect.left - tol || b.right > frameRect.right + tol || b.top < frameRect.top - tol || b.bottom > frameRect.bottom + tol)
        fail("outside-frame", el.id || el.dataset.geom || el.dataset.role);
    }
  }

  for (const g of svg.querySelectorAll('[data-role="balloon"]')) {
    if (!shown(g)) continue;
    const dot = g.querySelector("circle.dot").getBoundingClientRect();
    const x = dot.left + dot.width / 2;
    const y = dot.top + dot.height / 2;
    const target = g.dataset.target;
    const under = document.elementsFromPoint(x, y).some((el) => el.closest(`[data-part="${target}"]`));
    if (!under) fail("balloon-target", `balloon ${g.textContent.trim()} → ${target}`);
    const c = g.querySelector("circle.balloon").getBoundingClientRect();
    const pts = [
      [c.left + c.width * 0.5, c.top + c.height * 0.5],
      [c.left + c.width * 0.2, c.top + c.height * 0.5],
      [c.left + c.width * 0.8, c.top + c.height * 0.5],
      [c.left + c.width * 0.5, c.top + c.height * 0.2],
      [c.left + c.width * 0.5, c.top + c.height * 0.8],
    ];
    if (pts.some(([px, py]) => document.elementsFromPoint(px, py).some((el) => geomOf(el) && !el.classList.contains("tint") && !el.closest('[data-role="phantom"]'))))
      fail("balloon-on-geom", `balloon ${g.textContent.trim()}`);
  }

  for (const el of svg.querySelectorAll("[fill],[stroke]")) {
    if (el.closest("defs") && el.tagName !== "path" && el.tagName !== "circle") continue;
    for (const a of ["fill", "stroke"]) {
      const v = el.getAttribute(a);
      if (v && v !== "none" && !v.startsWith("url(") && v !== "currentColor") fail("hard-colour", `${el.tagName} ${a}=${v}`);
    }
  }

  if (document.documentElement.scrollWidth > window.innerWidth + 1) fail("sideways-scroll", `${document.documentElement.scrollWidth} > ${window.innerWidth}`);

  const kinds = ["text-overlap", "text-on-geometry", "outside-frame", "balloon-target", "balloon-on-geom", "hard-colour", "sideways-scroll"];
  const counts = Object.fromEntries(kinds.map((k) => [k, fails.filter((f) => f.kind === k).length]));
  const report = { ok: fails.length === 0, counts, fails, texts: texts.length, parts: svg.querySelectorAll("[data-part]").length };
  let pre = document.getElementById("bp-check");
  if (!pre) {
    pre = document.createElement("pre");
    pre.id = "bp-check";
    pre.hidden = true;
    document.body.append(pre);
  }
  pre.textContent = JSON.stringify(report);
  console.log("bp-check", JSON.stringify(report.counts));
  return report;
}

return { selfCheck };
})();

const M = (() => {
// Truth first: an external gear pump, group 2, 8 cm³/rev. Pure, no imports, no DOM.
// The gear geometry, the sections, the oil pockets, the readout and the chart all read this.
//
// Gears: two identical spur gear-shafts, z = 12, m = 3, α = 20°, both profile-shifted x = +0.3
// (12 teeth would undercut at x = 0). The shift opens the working pressure angle and the
// centre distance; the tips are cut back for 0.25·m root clearance.
// Displacement (both gears, per rev): V = 2π·b·(ra² − rw² − pb²/12), pb the base pitch.
// Flow: Q = V·n·ηv. The leakage across tips and faces is laminar, so it grows with pressure and
// hardly at all with speed; the clearances also open a little under load: QL = C·p·(1 + p/pc).
// Torque: T = V·p/(20π·ηhm) + T0 (V in cm³, p in bar, T in N·m).

const rad = Math.PI / 180;
const inv = (a) => Math.tan(a) - a;

const Z = 12;
const MOD = 3;
const ALPHA = 20 * rad;
const XSHIFT = 0.3;
const B = 11.6; // face width, mm

const R = (MOD * Z) / 2; // reference radius
const RB = R * Math.cos(ALPHA); // base radius
const RF = R - MOD * (1.25 - XSHIFT); // root radius
const PB = Math.PI * MOD * Math.cos(ALPHA); // base pitch

// Working pressure angle: inv αw = inv α + 2·tan α·(x1 + x2)/(z1 + z2), solved by Newton.
function solveInv(target) {
  let a = 0.4;
  for (let i = 0; i < 30; i++) a -= (inv(a) - target) / Math.tan(a) ** 2;
  return a;
}
const ALPHA_W = solveInv(inv(ALPHA) + (2 * Math.tan(ALPHA) * (2 * XSHIFT)) / (2 * Z));
const A = (MOD * Z * Math.cos(ALPHA)) / Math.cos(ALPHA_W); // centre distance
const RW = A / 2; // working pitch radius
const RA = A - RF - 0.25 * MOD; // tip radius, cut back for root clearance
const BORE_R = RA + 0.08; // housing bore, radial tip clearance 0.08
const EPS = (2 * Math.sqrt(RA ** 2 - RB ** 2) - A * Math.sin(ALPHA_W)) / PB; // contact ratio

// Tooth half-angle at radius ρ (rad), measured from the tooth's centre line.
const S_REF = MOD * (Math.PI / 2 + 2 * XSHIFT * Math.tan(ALPHA)); // tooth thickness on the reference circle
const PSI = S_REF / (2 * R);
function halfAngle(rho) {
  if (rho <= RB) return PSI + inv(ALPHA);
  return PSI + inv(ALPHA) - inv(Math.acos(RB / rho));
}
const TIP_HALF = halfAngle(RA);
const PITCH = (2 * Math.PI) / Z;

// Displacement and batches
const V_DISP = (2 * Math.PI * B * (RA ** 2 - RW ** 2 - PB ** 2 / 12)) / 1000; // cm³/rev
const BATCH = V_DISP / (2 * Z); // what one tooth space delivers, cm³

// Fluid and losses (ISO VG 46 at 50 °C)
const C_LEAK = 0.00266; // L/min per bar
const P_C = 400; // bar, clearances opening under load
const ETA_HM = 0.9;
const T0 = 0.3; // N·m, seal and bearing drag
const P_MAX = 280; // bar, chart range
const P_RATED = 250;
const N_RATED = 1500;
const N_MIN = 500;
const N_MAX = 3000;

const qTheory = (n) => (V_DISP * n) / 1000; // L/min
const qLeak = (p) => C_LEAK * p * (1 + p / P_C);
const flow = (n, p) => Math.max(0, qTheory(n) - qLeak(p));
const etaV = (n, p) => (qTheory(n) > 0 ? flow(n, p) / qTheory(n) : 0);
const torque = (p) => (V_DISP * p) / (20 * Math.PI * ETA_HM) + T0; // N·m
const powerIn = (n, p) => (torque(p) * 2 * Math.PI * n) / 60 / 1000; // kW
const powerOut = (n, p) => (flow(n, p) * p) / 600; // kW

// Ports (mm). Inlet at the bottom (−v), outlet at the top (+v), both on u = 0.
const HOUSING = { u: 61, v: 40, r: 4 };
const INLET = { drill: 8, minor: 9.315, major: 10.478, depth: 14, thread: "G1/2" };
const OUTLET = { drill: 6, minor: 7.475, major: 8.33, depth: 12, thread: "G3/8" };
const BOLT = { u: 49, v: 26, hole: 4.5, d: 8 };

// Where a port's drilling meets the bore of the left gear, as a polar angle about its centre.
const edge = (rp, sign) => {
  const du = RW - rp;
  return Math.atan2(sign * Math.sqrt(BORE_R ** 2 - du ** 2), du);
};
const IN_EDGE = edge(INLET.drill, -1); // ≈ −60°
const OUT_EDGE = edge(OUTLET.drill, 1) - 2 * Math.PI; // ≈ −305°: the left gear turns clockwise
const SEAL_ARC = IN_EDGE - OUT_EDGE;

// Pressure in a tooth space of the left gear whose centre sits at polar angle g (rad, about its
// centre, unwrapped so it falls between the inlet and one turn on). The space is filling while it
// is open to the inlet, carried at inlet pressure, and compressed over the last two pitches as the
// tip clearance leaks outlet oil back into it.
function space(g, pOut) {
  const T = 2 * Math.PI;
  const x = (((IN_EDGE - g) % T) + T) % T; // how far the space centre has travelled past the inlet edge
  const half = PITCH / 2 - TIP_HALF; // from the space centre to either tip
  if (x >= T + IN_EDGE) return { state: "fill", p: 0 }; // past the mesh, opening to the inlet
  if (x + half > SEAL_ARC) return { state: "deliver", p: pOut }; // its leading tip has reached the outlet
  if (x < half) return { state: "fill", p: 0 }; // its trailing tip has not yet left the inlet
  const f = x / SEAL_ARC;
  const k = Math.min(1, Math.max(0, (f - 0.62) / 0.38));
  return { state: "sealed", p: pOut * k * k * (3 - 2 * k) };
}

// The radius of a gear's outline along polar angle a (rad, in the gear's own frame, a tooth centred
// at 0): tip, flank or root. Used where the axial section cuts the gear.
function outlineRadius(a) {
  let d = Math.abs((((a % PITCH) + PITCH * 1.5) % PITCH) - PITCH / 2);
  if (d <= TIP_HALF) return RA;
  if (d >= halfAngle(RB)) return RF;
  let lo = RB;
  let hi = RA;
  for (let i = 0; i < 40; i++) {
    const mid = (lo + hi) / 2;
    if (halfAngle(mid) > d) lo = mid;
    else hi = mid;
  }
  return (lo + hi) / 2;
}

// Visual speed: the drawing turns 30°/s at 1500 rpm, 1/300 of real speed.
const SLOWDOWN = 300;
const degPerSec = (n) => (n * 6) / SLOWDOWN;

return { inv, Z, MOD, ALPHA, XSHIFT, B, R, RB, RF, PB, ALPHA_W, A, RW, RA, BORE_R, EPS, PSI, halfAngle, TIP_HALF, PITCH, V_DISP, BATCH, C_LEAK, P_C, ETA_HM, T0, P_MAX, P_RATED, N_RATED, N_MIN, N_MAX, qTheory, qLeak, flow, etaV, torque, powerIn, powerOut, HOUSING, INLET, OUTLET, BOLT, IN_EDGE, OUT_EDGE, SEAL_ARC, space, outlineRadius, SLOWDOWN, degPerSec };
})();

const P = (() => {
// The gear pump's parts, in world mm. Two frames:
//   A-A, across the shafts: u right, v up (inlet at the bottom, outlet at the top); the drive
//       gear's axis at (−RW, 0), the driven gear's at (+RW, 0). Looking from the rear toward the flange.
//   B-B, along the shafts: the same u, and the sheet's up is −z (the flange and the shaft end are
//       at the top). Parts are written in (u, z) and turned into view points by uz().
// The gears turn, so their outlines are functions of the turned angle th (rad): the drive gear
// turns clockwise by th, the driven gear anticlockwise.



const part = (id, inner, extra = "") => `<g data-part="${id}"${extra}>${inner}</g>`;
const uz = (pts) => pts.map(([u, z]) => [u, -z]);
const pol = (cu, cv, r, a) => [cu + r * Math.cos(a), cv + r * Math.sin(a)];

// A cut face with holes (bolt bores): paper, hatch and outline over several sub-paths, even-odd.
function cutEO(V, polys, { mat = "steel", angle = 45 } = {}) {
  const dd = polys.map((p) => K.d(V, p)).join("");
  return `<path class="paper eo" d="${dd}"/><path class="eo" fill="url(#h-${mat}-${angle})" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

// ---------------------------------------------------------------- gear geometry

const C1 = [-M.RW, 0];
const C2 = [M.RW, 0];
const rot1 = (th) => -th;
const rot2 = (th) => M.PITCH / 2 + th;

const THB = M.halfAngle(M.RB);
const FILLET = 0.7;
const GAP = FILLET / (M.RF + FILLET);
const TA = Math.sqrt((M.RA / M.RB) ** 2 - 1);

// One flank, root to tip, about the tooth centre line at angle c. side −1: the flank at c − θ.
function flank(cu, cv, c, side) {
  const out = [];
  // root fillet, tangent to the root circle and to the radial part of the flank
  const a0 = c + side * THB;
  const n = [Math.cos(a0), Math.sin(a0)];
  const t = [-Math.sin(a0) * side, Math.cos(a0) * side]; // toward the space
  const fc = [cu + n[0] * (M.RF + FILLET) + t[0] * FILLET, cv + n[1] * (M.RF + FILLET) + t[1] * FILLET];
  for (let i = 0; i <= 4; i++) {
    const w = (Math.PI / 2) * (i / 4);
    out.push([fc[0] - FILLET * (n[0] * Math.cos(w) + t[0] * Math.sin(w)), fc[1] - FILLET * (n[1] * Math.cos(w) + t[1] * Math.sin(w))]);
  }
  for (let i = 0; i <= 9; i++) {
    const tt = (TA * i) / 9;
    const rho = M.RB * Math.sqrt(1 + tt * tt);
    out.push(pol(cu, cv, rho, c + side * M.halfAngle(rho)));
  }
  return out;
}

const rootArc = (cu, cv, a0, a1) => {
  const out = [];
  for (let i = 1; i < 4; i++) out.push(pol(cu, cv, M.RF, a0 + ((a1 - a0) * i) / 4));
  return out;
};

function gearPoly([cu, cv], rot) {
  const pts = [];
  for (let k = 0; k < M.Z; k++) {
    const c = rot + k * M.PITCH;
    pts.push(...flank(cu, cv, c, -1));
    pts.push(pol(cu, cv, M.RA, c));
    pts.push(...flank(cu, cv, c, 1).reverse());
    pts.push(...rootArc(cu, cv, c + THB + GAP, c + M.PITCH - THB - GAP));
  }
  return pts;
}

// The tooth space after the tooth centred at c, closed by the bore.
function spacePoly([cu, cv], c) {
  const out = [...flank(cu, cv, c, 1).reverse()];
  out.push(...rootArc(cu, cv, c + THB + GAP, c + M.PITCH - THB - GAP));
  out.push(...flank(cu, cv, c + M.PITCH, -1));
  const a0 = c + M.PITCH - M.TIP_HALF;
  const a1 = c + M.TIP_HALF;
  for (let i = 0; i <= 4; i++) out.push(pol(cu, cv, M.BORE_R, a0 + ((a1 - a0) * i) / 4));
  return out;
}

// Every tooth space of both gears with its state and pressure (mirrored into the left gear's frame).
function spaces(th, pOut) {
  const out = [];
  for (let k = 0; k < M.Z; k++) {
    const c = rot1(th) + k * M.PITCH;
    out.push({ gear: 1, c, ...M.space(c + M.PITCH / 2, pOut) });
    const c2 = rot2(th) + k * M.PITCH;
    out.push({ gear: 2, c: c2, ...M.space(Math.PI - (c2 + M.PITCH / 2), pOut) });

  return out;
}

// The oil is drawn in a few density bands, so a frame rewrites a handful of paths.
const BANDS = 6;
const bandOpacity = (i) => (i === 0 ? 0.3 : K.r2(0.5 + (0.5 * (i - 1)) / (BANDS - 2)));
const bandOf = (s) => (s.state === "fill" ? 0 : 1 + Math.round(Math.min(1, s.p / M.P_RATED) * (BANDS - 2)));
function oilBands(V, th, pOut) {
  const band = Array.from({ length: BANDS }, () => "");
  for (const s of spaces(th, pOut)) band[bandOf(s)] += K.d(V, spacePoly(s.gear === 1 ? C1 : C2, s.c));
  return band;
}

// ---------------------------------------------------------------- A-A: across the shafts

const H = M.HOUSING;
// The tapped port and its drilling, as its left wall (u < 0), from the face to the bore.
function portWall(p, sign) {
  const face = sign * H.v;
  const ch = p.major + 0.5;
  const tip = (p.minor - p.drill) / Math.tan((59 * Math.PI) / 180);
  const vb = sign * Math.sqrt(M.BORE_R ** 2 - (M.RW - p.drill) ** 2);
  return [
    [-ch, face],
    [-p.minor, face - sign * (ch - p.minor)],
    [-p.minor, face - sign * p.depth],
    [-p.drill, face - sign * (p.depth + tip)],
    [-p.drill, vb],
  ];
}

function housingLeft() {
  const top = portWall(M.OUTLET, 1);
  const bot = portWall(M.INLET, -1);
  const aTop = Math.atan2(top[4][1], M.RW + top[4][0]);
  const aBot = Math.atan2(bot[4][1], M.RW + bot[4][0]) + 2 * Math.PI;
  const bore = K.arc(C1[0], C1[1], M.BORE_R, (aTop * 180) / Math.PI, (aBot * 180) / Math.PI, 48);
  return [
    ...top,
    ...bore.slice(1, -1),
    ...bot.reverse(),
    ...K.arc(-H.u + H.r, -H.v + H.r, H.r, 270, 180, 3),
    ...K.arc(-H.u + H.r, H.v - H.r, H.r, 180, 90, 3),
  ];
}

const boltHoles = (side) => [-1, 1].map((sv) => K.circle(side * M.BOLT.u, sv * M.BOLT.v, M.BOLT.hole, 36));

function housingA(V) {
  const left = housingLeft();
  const right = K.flipU(left);
  const threads = [];
  for (const [p, sign] of [[M.OUTLET, 1], [M.INLET, -1]]) {
    const v0 = sign * (H.v - (p.major + 0.5 - p.minor) - 0.3);
    const v1 = sign * (H.v - p.depth + 1.5);
    threads.push([[-p.major, v0], [-p.major, v1]], [[p.major, v0], [p.major, v1]]);
  }
  return part(
    1,
    cutEO(V, [left, ...boltHoles(-1)], { mat: "alu", angle: 45 }) +
      cutEO(V, [right, ...boltHoles(1)], { mat: "alu", angle: 45 }) +
      K.lines(V, threads, "thin")
  );
}

function boltsA(V) {
  let out = "";
  for (const su of [-1, 1]) for (const sv of [-1, 1]) out += K.cut(V, K.circle(su * M.BOLT.u, sv * M.BOLT.v, M.BOLT.d / 2, 32), { mat: "steel", angle: 135 });
  return part(12, out);
}

// The front bushings' face, seen behind the gears: the joint between the two D-shaped bushings
// and the trapping-relief grooves either side of the mesh.
const RELIEF = { half: 3.2, out: [2.0, 8.6], inl: [-8.6, -3.0] };
const WAIST = Math.sqrt(M.BORE_R ** 2 - M.RW ** 2);
function bushingFace(V) {
  const g = RELIEF;
  return part(
    6,
    K.line(V, [[0, -WAIST], [0, WAIST]]) +
      K.line(V, K.rect(-g.half, g.out[0], g.half, g.out[1]), "vis", true) +
      K.line(V, K.rect(-g.half, g.inl[0], g.half, g.inl[1]), "vis", true)
  );
}

function gearA(V, n, th) {
  const C = n === 1 ? C1 : C2;
  const rot = n === 1 ? rot1(th) : rot2(th);
  return K.cut(V, gearPoly(C, rot), { mat: "steel", angle: n === 1 ? 135 : 60 });
}

function gearMarks(V) {
  return (
    K.centerMark(V, C1, 3) +
    K.centerMark(V, C2, 3) +
    K.line(V, K.circle(C1[0], C1[1], M.RW, 96), "ctr", true) +
    K.line(V, K.circle(C2[0], C2[1], M.RW, 96), "ctr", true)
  );
}

// The line of action and the contact points on it (the drive gear's working flanks).
const DIR = [Math.sin(M.ALPHA_W), -Math.cos(M.ALPHA_W)];
const T1 = [-(M.A / 2) * Math.sin(M.ALPHA_W) ** 2, (M.A / 2) * Math.sin(M.ALPHA_W) * Math.cos(M.ALPHA_W)];
const T2 = [-T1[0], -T1[1]];
const S_E = Math.sqrt(M.RA ** 2 - M.RB ** 2);
const S_A = M.A * Math.sin(M.ALPHA_W) - S_E;
function contacts(th) {
  const out = [];
  let t = M.ALPHA_W + THB + th;
  t = ((t % M.PITCH) + M.PITCH) % M.PITCH;
  for (let s = M.RB * t; s <= S_E + 1e-6; s += M.PB) if (s >= S_A - 1e-6) out.push([T1[0] + s * DIR[0], T1[1] + s * DIR[1]]);
  return out;
}
const contactPath = () => [[T1[0] + S_A * DIR[0], T1[1] + S_A * DIR[1]], [T1[0] + S_E * DIR[0], T1[1] + S_E * DIR[1]]];

// ---------------------------------------------------------------- B-B: along the shafts

const Z = {
  g0: 0,
  g1: M.B,
  front: -15, // flange joint, the front bushings' back face
  rear: M.B + 15, // cover joint
  coverOut: M.B + 29,
  flangeFace: -33,
  spigot: -35,
  sealIn: -25.2, // the seal's seat
  shaftEnd: -62,
  step: -37, // Ø15 shaft end to Ø16
  head: M.B + 30.6, // under the screw head, on the washer
  boltEnd: -27.8,
};
const CU = C1[0];
const RJ = 8; // journals Ø16
const CLIP = { z0: -34.6, z1: -33.4, groove: 14.7 };
const BAL = [[-35.5, -32.5], [-5.5, -2.5], [2.5, 5.5], [32.5, 35.5]];
const OR = { u0: 41.0, u1: 43.4, depth: 1.5 };
const SPIGOT = 25;
const BOLT_U = M.BOLT.u;
const TAP = { r: 3.32, depth: -29.5 };

const groove = (u0, u1, z, d) => [[u0, z], [u0, z - d], [u1, z - d], [u1, z]];
const tapped = (u) => [
  [u - 4, Z.front], [u - 4, Z.boltEnd], [u - TAP.r, Z.boltEnd], [u - TAP.r, TAP.depth],
  [u, TAP.depth - 2], [u + TAP.r, TAP.depth], [u + TAP.r, Z.boltEnd], [u + 4, Z.boltEnd], [u + 4, Z.front],
];

function flangeB(V) {
  const L = [
    [-61, Z.front],
    ...tapped(-BOLT_U),
    ...groove(-OR.u1, -OR.u0, Z.front, OR.depth),
    ...groove(BAL[0][0], BAL[0][1], Z.front, 1.6),
    [CU - 10, Z.front],
    [CU - 10, Z.sealIn],
    [CU - 14, Z.sealIn],
    [CU - 14, CLIP.z1],
    [CU - CLIP.groove, CLIP.z1],
    [CU - CLIP.groove, CLIP.z0],
    [CU - 14, CLIP.z0],
    [CU - 14, Z.spigot + 0.5],
    [CU - 14.5, Z.spigot],
    [CU - SPIGOT + 0.6, Z.spigot],
    [CU - SPIGOT, Z.spigot + 0.6],
    [CU - SPIGOT, Z.flangeFace],
    [-60.2, Z.flangeFace],
    [-61, Z.flangeFace + 0.8],
  ];
  const R = [
    [CU + 10, Z.front],
    ...groove(BAL[1][0], BAL[1][1], Z.front, 1.6),
    ...groove(BAL[2][0], BAL[2][1], Z.front, 1.6),
    ...groove(BAL[3][0], BAL[3][1], Z.front, 1.6),
    ...groove(OR.u0, OR.u1, Z.front, OR.depth),
    ...tapped(BOLT_U),
    [61, Z.front],
    [61, Z.flangeFace + 0.8],
    [60.2, Z.flangeFace],
    [CU + SPIGOT, Z.flangeFace],
    [CU + SPIGOT, Z.spigot + 0.6],
    [CU + SPIGOT - 0.6, Z.spigot],
    [CU + 14.5, Z.spigot],
    [CU + 14, Z.spigot + 0.5],
    [CU + 14, CLIP.z0],
    [CU + CLIP.groove, CLIP.z0],
    [CU + CLIP.groove, CLIP.z1],
    [CU + 14, CLIP.z1],
    [CU + 14, Z.sealIn],
    [CU + 10, Z.sealIn],
  ];
  const taps = [];
  for (const s of [-1, 1]) {
    const u = s * BOLT_U;
    taps.push(uz([[u - 4, Z.boltEnd], [u - 4, TAP.depth + 0.4]]), uz([[u + 4, Z.boltEnd], [u + 4, TAP.depth + 0.4]]));
  }
  return part(2, K.cut(V, uz(L), { mat: "alu", angle: 135 }) + K.cut(V, uz(R), { mat: "alu", angle: 135 }) + K.lines(V, taps, "thin"));
}

function bodyB(V) {
  const pieces = [];
  for (const s of [-1, 1]) {
    pieces.push(K.rect(s * (M.RW + M.BORE_R), Z.front, s * (BOLT_U - M.BOLT.hole), Z.rear));
    pieces.push(K.rect(s * (BOLT_U + M.BOLT.hole), Z.front, s * 61, Z.rear));
  }
  return part(1, pieces.map((p) => K.cut(V, uz(p), { mat: "alu", angle: 45 })).join(""));
}

function coverB(V) {
  const zo = Z.coverOut;
  const h = BOLT_U - M.BOLT.hole;
  const mid = [
    [-h, Z.rear],
    ...groove(-OR.u1, -OR.u0, Z.rear, -OR.depth),
    ...groove(OR.u0, OR.u1, Z.rear, -OR.depth),
    [h, Z.rear],
    [h, zo],
    [-h, zo],
  ];
  const outer = [[-61, Z.rear], [-(BOLT_U + M.BOLT.hole), Z.rear], [-(BOLT_U + M.BOLT.hole), zo], [-60.2, zo], [-61, zo - 0.8]];
  const o = { mat: "iron", angle: 135 };
  return part(3, K.cut(V, uz(mid), o) + K.cut(V, uz(outer), o) + K.cut(V, uz(K.flipU(outer)), o));
}

// Front (6) and rear (7) bushings: D-shaped pairs meeting on u = 0.
function bushingsB(V, id, z0, z1) {
  let out = "";
  for (const s of [-1, 1]) {
    const c = s * M.RW;
    const outerU = s * (M.RW + M.BORE_R);
    const a = K.rect(Math.min(outerU, c + s * 9), z0, Math.max(outerU, c + s * 9), z1); // outboard of the bore
    const b = K.rect(Math.min(0, c - s * 9), z0, Math.max(0, c - s * 9), z1); // inboard, to the joint on u = 0
    const opts = { mat: "bronze", angle: s < 0 ? 30 : 60 };
    out += K.cut(V, uz(a), opts) + K.cut(V, uz(b), opts);
  }
  return part(id, out);
}

// Plain bearings (8), steel-backed, 1 mm wall: blacked in.
function bearingsB(V) {
  let out = "";
  for (const c of [C1[0], C2[0]])
    for (const [z0, z1] of [[Z.front + 0.5, -0.5], [Z.g1 + 0.5, Z.rear - 0.5]])
      for (const s of [-1, 1]) {
        const a = c + s * RJ;
        const b = c + s * (RJ + 1);
        out += K.cut(V, uz(K.rect(Math.min(a, b), z0, Math.max(a, b), z1)), { mat: "solid" });
      }
  return part(8, out);
}

// Where the plane B-B meets a gear: its outline radius toward +u and −u, and the silhouette of
// the teeth just beyond the plane (looking toward −v).
function gearReach(n, th) {
  const rot = n === 1 ? rot1(th) : rot2(th);
  const r = (a) => M.outlineRadius(a - rot);
  let sr = 0;
  let sl = 0;
  for (let i = 0; i <= 90; i++) {
    const a = Math.PI + (Math.PI * i) / 90;
    const x = r(a) * Math.cos(a);
    sr = Math.max(sr, x);
    sl = Math.max(sl, -x);
  }
  return { right: r(0), left: r(Math.PI), sr, sl };
}

// One side (s = ±1) of a gear-shaft, from the front end to the rear end, as (u, z).
function shaftSide(c, s, reach, drive) {
  const pts = [];
  if (drive) {
    pts.push([c + s * 7, Z.shaftEnd], [c + s * 7.5, Z.shaftEnd + 0.5]);
    pts.push([c + s * 7.5, Z.step], [c + s * RJ, Z.step + 0.5]);
  } else pts.push([c + s * 7.5, Z.front + 0.5], [c + s * RJ, Z.front + 1]);
  pts.push([c + s * RJ, Z.g0 - 0.6], [c + s * (RJ + 0.6), Z.g0]);
  pts.push([c + s * reach, Z.g0], [c + s * reach, Z.g1]);
  pts.push([c + s * (RJ + 0.6), Z.g1], [c + s * RJ, Z.g1 + 0.6]);
  pts.push([c + s * RJ, Z.rear - 1], [c + s * 7.5, Z.rear - 0.5]);
  return pts;
}

function gearShaftB(V, n, th) {
  const c = n === 1 ? C1[0] : C2[0];
  const g = gearReach(n, th);
  const outline = [...shaftSide(c, 1, g.right, n === 1), ...shaftSide(c, -1, g.left, n === 1).reverse()];
  let edges = "";
  if (g.sl - g.left > 0.05) edges += K.line(V, uz([[c - g.sl, Z.g0], [c - g.sl, Z.g1]]));
  if (g.sr - g.right > 0.05) edges += K.line(V, uz([[c + g.sr, Z.g0], [c + g.sr, Z.g1]]));
  return K.body(V, uz(outline)) + edges;
}

function pitchLinesB(V) {
  const L = [];
  for (const c of [C1[0], C2[0]]) for (const s of [-1, 1]) L.push(uz([[c + s * M.RW, Z.g0 - 1.6], [c + s * M.RW, Z.g1 + 1.6]]));
  return K.lines(V, L, "ctr");
}


// Oil cut by the plane B-B: in the tooth spaces at the outer sides, and between the gears.
function oilB(th) {
  const g1 = gearReach(1, th);
  const g2 = gearReach(2, th);
  const out = [];
  const add = (u0, u1, a) => {
    if (u1 - u0 > 0.05) out.push({ rect: K.rect(u0, Z.g0, u1, Z.g1), a });
  };
  add(C1[0] - M.BORE_R, C1[0] - g1.left, Math.PI);
  add(C1[0] + g1.right, C2[0] - g2.left, 0);
  add(C2[0] + g2.right, C2[0] + M.BORE_R, 0);
  return out;
}

// Radial lip seal DIN 3760 A 16×28×7: a rubber body with the lip toward the oil, a steel case
// moulded in and a garter spring behind the lip. Its section shows on both sides of the shaft.
const SEAL_RUBBER = [
  [14, -32.2], [14, -25.6], [13.6, -25.2], [12.9, -25.2], [12.9, -29.6], [11.0, -29.6],
  [10.2, -28.6], [10.0, -27.9], [8.0, -27.2], [8.0, -26.7], [10.0, -25.3], [10.8, -25.3],
  [10.8, -25.9], [10.1, -26.2], [10.1, -27.4], [11.6, -28.1], [11.9, -28.1], [11.9, -30.1], [10.4, -30.1], [10.4, -32.2],
];
const SEAL_CASE = [[13.2, -31.8], [13.2, -25.9], [13.6, -25.9], [13.6, -32.0], [10.9, -32.0], [10.9, -31.6], [13.2, -31.6]];
const SPRING = [11.0, -27.0];
function sealB(V) {
  let out = "";
  for (const s of [-1, 1]) {
    const m = (pts) => uz(pts.map(([r, z]) => [CU + s * r, z]));
    out += K.cut(V, m(SEAL_RUBBER), { mat: "rubber", angle: 45 });
    out += K.cut(V, m(SEAL_CASE), { mat: "solid" });
    const sx = CU + s * SPRING[0];
    out += K.cut(V, uz(K.circle(sx, SPRING[1], 0.62, 16)), { mat: "solid" }) + `<path class="paper" d="${K.d(V, uz(K.circle(sx, SPRING[1], 0.3, 12)))}"/>`;
  }
  return part(9, out);
}

function circlipB(V) {
  let out = "";
  for (const s of [-1, 1]) {
    const a = CU + s * 12.1;
    const b = CU + s * (CLIP.groove - 0.1);
    out += K.cut(V, uz(K.rect(Math.min(a, b), CLIP.z0 + 0.1, Math.max(a, b), CLIP.z1 - 0.1)), { mat: "solid" });
  }
  return part(10, out);
}

function balanceSealB(V) {
  return part(15, BAL.map(([u0, u1]) => K.cut(V, uz(K.rrect(u0 + 0.2, Z.front - 1.5, u1 - 0.2, Z.front, 0.4)), { mat: "rubber", angle: 45 })).join(""));
}

function oringsB(V) {
  let out = "";
  for (const s of [-1, 1]) {
    const u0 = s < 0 ? -OR.u1 : OR.u0;
    const u1 = s < 0 ? -OR.u0 : OR.u1;
    out += K.cut(V, uz(K.rrect(u0 + 0.15, Z.front - OR.depth + 0.05, u1 - 0.15, Z.front, 0.6)), { mat: "rubber", angle: 135 });
    out += K.cut(V, uz(K.rrect(u0 + 0.15, Z.rear, u1 - 0.15, Z.rear + OR.depth - 0.05, 0.6)), { mat: "rubber", angle: 135 });
  }
  return part(14, out);
}

// Socket head cap screws M8×70 ISO 4762 (12) on washers ISO 7089 (13), cut lengthwise: not hatched.
function boltsB(V) {
  let screw = "";
  let washer = "";
  for (const s of [-1, 1]) {
    const u = s * BOLT_U;
    const zh = Z.head;
    const head = [[u - 6.5, zh], [u + 6.5, zh], [u + 6.5, zh + 7.4], [u + 5.9, zh + 8], [u - 5.9, zh + 8], [u - 6.5, zh + 7.4]];
    const shank = [[u - 4, zh], [u + 4, zh], [u + 4, Z.boltEnd + 0.6], [u + 3.4, Z.boltEnd], [u - 3.4, Z.boltEnd], [u - 4, Z.boltEnd + 0.6]];
    const thr = Z.boltEnd + 28;
    screw +=
      K.body(V, uz(shank)) +
      K.body(V, uz(head)) +
      K.lines(V, [uz([[u - TAP.r, Z.boltEnd + 0.3], [u - TAP.r, thr]]), uz([[u + TAP.r, Z.boltEnd + 0.3], [u + TAP.r, thr]]), uz([[u - 4, thr], [u + 4, thr]])], "thin") +
      K.line(V, uz([[u - 3.46, zh + 8], [u - 3.46, zh + 4], [u, zh + 2.6], [u + 3.46, zh + 4], [u + 3.46, zh + 8]]), "hid");
    for (const w of [[u - 8, u - 4.2], [u + 4.2, u + 8]]) washer += K.body(V, uz(K.rect(w[0], Z.coverOut, w[1], zh)));
  }
  return part(12, screw) + part(13, washer);
}

const P_UZ = (u, z) => [u, -z];

// The key turns with the drive shaft (angle psi = π − th in A-A's frame). Where the plane B-B cuts
// it, it shows in section; on the far side of the plane only the part standing above the shaft shows.
function keyB(V, th) {
  const psi = Math.PI - th;
  const c = Math.cos(psi);
  const s = Math.sin(psi);
  const side = Math.sign(c) || 1;
  let r0;
  let r1;
  if (Math.abs(s) < 0.3) [r0, r1] = [4.5, 9.5];
  else if (s < 0) {
    const e = 9.5 * Math.abs(c) + 2.5 * Math.abs(s);
    if (e <= 7.6) return "";
    [r0, r1] = [7.5, e];
  } else return "";
  const a = CU + side * r0;
  const b = CU + side * r1;
  return K.body(V, uz(K.rect(Math.min(a, b), -58, Math.max(a, b), -42)));
}

// VIEW F, on the shaft end from the front: x' = −u, so a turn th shows anticlockwise.
// Static: the flange's seal bore and chamfer, the seal's face, the circlip and its lugs.
function shaftEndF(V) {
  const flange = K.line(V, K.circle(0, 0, 14.5, 96), "vis", true) + K.line(V, K.circle(0, 0, 14, 96), "vis", true);
  const seal = K.line(V, K.circle(0, 0, 10.4, 72), "vis", true) + K.line(V, K.circle(0, 0, 8.6, 72), "thin", true);
  // circlip DIN 472: an open ring with two lugs at its ends (gap at the top), each with a hole
  const g = 14; // half-gap, degrees
  const outer = K.arc(0, 0, 14, 90 + g, 450 - g, 64);
  const inner = K.arc(0, 0, 12.1, 450 - g - 9, 90 + g + 9, 60);
  const ring = [...outer, ...K.arc(0, 0, 10.3, 450 - g, 450 - g - 9, 3), ...inner, ...K.arc(0, 0, 10.3, 90 + g + 9, 90 + g, 3)];
  const holes = [90 + g + 6, 90 - g - 6].map((a) => {
    const t = (a * Math.PI) / 180;
    return K.circle(11.9 * Math.cos(t), 11.9 * Math.sin(t), 0.85, 16);
  });
  const clip = `<path class="paper eo" d="${[ring, ...holes].map((p) => K.d(V, p)).join("")}"/><path class="vis" d="${[ring, ...holes].map((p) => K.d(V, p)).join("")}"/>`;
  return part(2, flange) + part(9, `<path class="paper" d="${K.d(V, K.circle(0, 0, 12.1, 72))}"/>` + seal) + part(10, clip);
}

function shaftF(V) {
  const key = K.body(V, K.rect(6.6, -2.5, 9.5, 2.5));
  const end = K.body(V, K.circle(0, 0, 7.5, 64)) + K.line(V, K.circle(0, 0, 7, 64), "thin", true);
  return part(11, key) + part(4, end);
}

const keyPointF = (th) => [8.6 * Math.cos(th) - 0.8 * Math.sin(th), 8.6 * Math.sin(th) + 0.8 * Math.cos(th)];
const KEY_BALLOON = [760, 330];

return { part, uz, cutEO, C1, C2, rot1, rot2, gearPoly, spacePoly, spaces, BANDS, bandOpacity, bandOf, oilBands, housingLeft, housingA, boltsA, RELIEF, WAIST, bushingFace, gearA, gearMarks, T1, T2, contacts, contactPath, Z, CU, CLIP, BAL, OR, flangeB, bodyB, coverB, bushingsB, bearingsB, gearReach, gearShaftB, pitchLinesB, oilB, SPRING, sealB, circlipB, balanceSealB, oringsB, boltsB, P_UZ, keyB, shaftEndF, shaftF, keyPointF, KEY_BALLOON };
})();

// Page code for gear-pump.html. K (kit), L (runtime), C (self-check), M (model) and P (parts)
// are inlined above this script as namespaces.

const svg = document.querySelector(".bp-sheet");
const q = L.setupPage(svg);
const specs = JSON.parse(svg.dataset.views);
const VA = K.view(specs.A);
const VC = K.view(specs.C);
const VB = K.view(specs.B);
const VF = K.view(specs.F);
const CH = {"x0":834,"x1":1130,"y0":52,"y1":196,"pMax":280,"qMax":26,"eMin":0.6};
const C2H = {"x0":398,"x1":538,"y0":520,"y1":640,"aMax":360};
const $ = (id) => document.getElementById(id);
const rad = Math.PI / 180;

const el = {
  gears: [["A", VA], ["C", VC]].map(([id, V]) => [$(`g1-${id}`), $(`g2-${id}`), V]),
  oil: [["A", VA], ["C", VC]].map(([id, V]) => [Array.from({ length: P.BANDS }, (_, i) => $(`oil-${id}-${i}`)), V]),
  shafts: [$("s1-B"), $("s2-B")],
  key: $("key-B"),
  oilB: ["l", "m", "r"].map((k) => $(`oilB-B-${k}`)),
  contacts: $("contacts-C"),
  shaftF: $("shaft-F"),
  balloonKey: $("balloon-key"),
  qNow: $("q-now"),
  etaNow: $("eta-now"),
  qTheory: $("q-theory"),
  opDot: $("op-dot"),
  opDrop: $("op-drop"),
  pCurve: $("p-curve"),
  pk: Array.from({ length: M.Z }, (_, i) => $(`pk-${i}`)),
  readout: $("readout"),
};
const say = L.announcer($("sr"), 2.5);
const [fx, fy] = VF.p([0, 0]);

// ---------------------------------------------------------------- state
let th = 0; // turned angle of the drive gear, rad (clockwise in A-A)
let p = 30; // outlet pressure, bar
let pWant = 30;
let n = M.N_RATED; // speed, rpm
let nWant = M.N_RATED;
let paused = false;
let dragging = false;

// The tour: 20 s, the gears turning at 1500 rpm (shown 1/300), the outlet pressure rising from
// 30 to 250 bar, holding, and falling back. 20 s at 30°/s is twenty tooth pitches, so it loops.
const TOUR = 20;
function tourP(t) {
  const u = t % TOUR;
  if (u < 2) return 30;
  if (u < 8) return 30 + 220 * L.ease((u - 2) / 6);
  if (u < 12) return 250;
  if (u < 17) return 250 - 220 * L.ease((u - 12) / 5);
  return 30;
}
let tourT = 0;

function step(dt, live) {
  const sub = Math.max(1, Math.ceil(dt * 240));
  const h = dt / sub;
  for (let i = 0; i < sub; i++) {
    if (live.touring) {
      tourT += h;
      pWant = tourP(tourT);
      nWant = M.N_RATED;
    }
    p = live.reduced && !live.touring ? pWant : L.follow(p, pWant, live.touring ? 40 : 8, h);
    n = live.reduced && !live.touring ? nWant : L.follow(n, nWant, 8, h);
    if (!dragging && !paused && !(live.reduced && !live.touring)) th += M.degPerSec(n) * rad * h;
  }
  th %= 2 * Math.PI;
  return Math.abs(p - pWant) > 0.05 || Math.abs(n - nWant) > 0.5;
}

// ---------------------------------------------------------------- render
const chX = (pp) => K.r2(CH.x0 + (pp / CH.pMax) * (CH.x1 - CH.x0));
const chY = (qq) => K.r2(CH.y1 - (Math.max(0, qq) / CH.qMax) * (CH.y1 - CH.y0));
const c2X = (deg) => K.r2(C2H.x0 + (deg / C2H.aMax) * (C2H.x1 - C2H.x0));
const c2Y = (pp) => K.r2(C2H.y1 - (pp / M.P_MAX) * (C2H.y1 - C2H.y0));
const ARC = M.SEAL_ARC / rad;
let shownN = -1;

function render(live) {
  for (const [g1, g2, V] of el.gears) {
    g1.innerHTML = P.gearA(V, 1, th);
    g2.innerHTML = P.gearA(V, 2, th);
  }
  for (const [paths, V] of el.oil) {
    const bands = P.oilBands(V, th, p);
    paths.forEach((node, i) => node.setAttribute("d", bands[i]));
  }
  el.shafts[0].innerHTML = P.gearShaftB(VB, 1, th);
  el.shafts[1].innerHTML = P.gearShaftB(VB, 2, th);
  el.key.innerHTML = P.keyB(VB, th);
  const oil = P.oilB(th);
  el.oilB.forEach((node, i) => {
    const o = oil[i];
    if (!o) return node.setAttribute("d", "");
    node.setAttribute("d", K.d(VB, P.uz(o.rect)));
    node.setAttribute("fill-opacity", P.bandOpacity(P.bandOf(M.space(o.a, p))));
  });
  // the gap between the gears at the cut: its oil is either side of the mesh, keep it in step
  el.contacts.innerHTML = P.contacts(th)
    .map((c) => {
      const [x, y] = VC.p(c);
      return `<circle class="dot" cx="${x}" cy="${y}" r="3.2"/>`;
    })
    .join("");
  el.shaftF.setAttribute("transform", `rotate(${K.r2(-th / rad)} ${fx} ${fy})`);
  el.balloonKey.innerHTML = K.balloon(VF, P.keyPointF(th), P.KEY_BALLOON, 11, { target: 11 });

  // DIAGRAM 1: the curve for this speed, the operating point and the leakage it loses
  if (Math.abs(n - shownN) > 0.5) {
    const pts = [];
    for (let pp = 0; pp <= CH.pMax; pp += 10) pts.push(`${chX(pp)},${chY(M.flow(n, pp))}`);
    el.qNow.setAttribute("points", pts.join(" "));
    const ep = [];
    for (let pp = 0; pp <= CH.pMax; pp += 10) ep.push(`${chX(pp)},${K.r2(CH.y1 - ((M.etaV(n, pp) - CH.eMin) / (1 - CH.eMin)) * (CH.y1 - CH.y0))}`);
    el.etaNow.setAttribute("points", ep.join(" "));
    el.qTheory.setAttribute("d", `M${CH.x0} ${chY(M.qTheory(n))}H${CH.x1}`);
    shownN = n;
  }
  const Q = M.flow(n, p);
  el.opDot.setAttribute("cx", chX(p));
  el.opDot.setAttribute("cy", chY(Q));
  el.opDrop.setAttribute("d", `M${chX(p)} ${chY(M.qTheory(n))}V${chY(Q)}`);

  // DIAGRAM 2: the pressure along the sealed arc, and where each of the drive gear's spaces is now
  const curve = [];
  for (let a = 0; a <= 360; a += 6) curve.push(`${c2X(a)},${c2Y(a <= ARC ? M.space(M.IN_EDGE - a * rad, p).p : a < 300 ? p : 0)}`);
  el.pCurve.setAttribute("points", curve.join(" "));
  P.spaces(th, p)
    .filter((s) => s.gear === 1)
    .forEach((s, i) => {
      const g = s.c + M.PITCH / 2;
      const x = ((((M.IN_EDGE - g) / rad) % 360) + 360) % 360;
      el.pk[i].setAttribute("cx", c2X(x));
      el.pk[i].setAttribute("cy", c2Y(s.p));
    });

  const eta = M.etaV(n, p);
  el.readout.textContent =
    `${Math.round(n)} rpm · ${Math.round(p)} bar · Q ${Q.toFixed(1)} L/min · ηv ${eta.toFixed(3)} · ` +
    `T ${M.torque(p).toFixed(1)} N·m · ${M.powerIn(n, p).toFixed(2)} kW`;
  say(`${Math.round(n)} rpm at ${Math.round(p)} bar: flow ${Q.toFixed(1)} litres a minute, volumetric efficiency ${Math.round(eta * 100)} percent, torque ${M.torque(p).toFixed(0)} newton metres.`, live.clock);
}

// ---------------------------------------------------------------- input
const live = L.run({ root: svg, step, render, idleAfter: 6, onFrozen: () => q.check && C.selfCheck(svg) });

if (live.reduced && !live.frozen) {
  // A still, true moment: the tour played to 9 s, drawn once.
  const fake = { touring: true, reduced: false, clock: 0 };
  for (let t = 0; t < 9; t += 1 / 240) step(1 / 240, fake);
  render(live);
}

// Turn the gears by dragging round the drive gear's centre (in A-A or in Detail C).
for (const hit of svg.querySelectorAll("[data-turn]")) {
  const V = hit.dataset.turn === "A" ? VA : VC;
  let id = null;
  let last = 0;
  const angle = (e) => {
    const m = svg.getScreenCTM();
    const x = (e.clientX - m.e) / m.a;
    const y = (e.clientY - m.f) / m.d;
    const [cx, cy] = V.p(P.C1);
    return Math.atan2(-(y - cy), x - cx);
  };
  hit.addEventListener("pointerdown", (e) => {
    id = e.pointerId;
    hit.setPointerCapture(id);
    last = angle(e);
    dragging = true;
    live.input();
    e.preventDefault();
  });
  hit.addEventListener("pointermove", (e) => {
    if (e.pointerId !== id) return;
    const a = angle(e);
    let d = a - last;
    if (d > Math.PI) d -= 2 * Math.PI;
    if (d < -Math.PI) d += 2 * Math.PI;
    th -= d; // the drive gear turns clockwise for positive th
    last = a;
    live.input();
  });
  const stop = (e) => {
    if (e.pointerId !== id) return;
    id = null;
    dragging = false;
    live.input();
  };
  hit.addEventListener("pointerup", stop);
  hit.addEventListener("pointercancel", stop);
}

svg.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === "ArrowUp" || k === "ArrowDown") pWant = Math.min(M.P_MAX, Math.max(0, pWant + (k === "ArrowUp" ? 10 : -10)));
  else if (k === "ArrowRight" || k === "ArrowLeft") nWant = Math.min(M.N_MAX, Math.max(M.N_MIN, nWant + (k === "ArrowRight" ? 250 : -250)));
  else if (k === " ") paused = !paused;
  else if (k === "s" || k === "S") live.slow = live.slow === 1 ? 0.25 : live.slow === 0.25 ? 0.05 : 1;
  else return;
  e.preventDefault();
  live.input();
});

if (q.check && !live.frozen) setTimeout(() => C.selfCheck(svg), 400);

</script>
<script>
"use strict";
const BP_CARDS = (() => {
// Part cards: hover, tap or focus a balloon and a small card names the part, gives its size and
// material, and says in a sentence what it does. The part it points to lights up in the accent.
//
// Works on both pages: a 2D sheet's balloons are <g data-role="balloon" data-target="n">, a 3D page's
// are <g data-part="n"> in its overlay (re-drawn every frame, so everything here is delegated and
// keyed on the number, never on the element). The data comes from examples/<slug>/info.json, which
// kit/page.mjs inlines as BP_INFO when it exists:
//   { "4": { "name": "O-ring", "spec": "33 × 2", "material": "NBR 70", "note": "Seals the barrel..." } }
// 2D: the part's [data-part] groups get the class bp-hl.  3D: a "bp:part" event (detail.id, or null)
// that kit/solid3d.mjs answers by tinting the part.

function attach({ info, root = document }) {
  if (!info || !Object.keys(info).length) return null;
  const card = document.createElement("div");
  card.className = "bp-card";
  card.setAttribute("role", "dialog");
  card.setAttribute("aria-live", "polite");
  card.hidden = true;
  document.body.appendChild(card);

  let shown = null;
  let pinned = false;

  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
  // the balloon under an element, and its part number
  const balloonOf = (el) => el?.closest?.('[data-role="balloon"], #ov [data-part], .v3-stage [data-part]');
  const numberOf = (b) => {
    if (!b) return null;
    const raw = String(b.dataset.target || b.dataset.part || b.querySelector("text")?.textContent || "").trim();
    // a second copy of a part ("3u" in a 3D scene) shares its card with the item number it starts with
    const n = info[raw] ? raw : raw.match(/^\d+/)?.[0];
    return n && info[n] ? n : null;
  };

  function light(id) {
    for (const el of document.querySelectorAll(".bp-hl")) el.classList.remove("bp-hl");
    if (id != null) for (const el of document.querySelectorAll(`svg [data-part="${CSS.escape(id)}"]`)) if (!el.closest("#ov")) el.classList.add("bp-hl");
    document.dispatchEvent(new CustomEvent("bp:part", { detail: { id } }));
  }

  function place(x, y) {
    const pad = 12;
    const w = card.offsetWidth;
    const h = card.offsetHeight;
    let left = x + 16;
    let top = y + 16;
    if (left + w > innerWidth - pad) left = x - w - 16;
    if (left < pad) left = pad;
    if (top + h > innerHeight - pad) top = y - h - 16;
    if (top < pad) top = pad;
    card.style.left = `${left + scrollX}px`;
    card.style.top = `${top + scrollY}px`;
  }

  function show(id, x, y) {
    const p = info[id];
    if (!p) return hide();
    if (shown !== id) {
      const sub = [p.spec, p.material, p.qty && p.qty !== "1" ? `× ${p.qty}` : ""].filter(Boolean).map(esc).join(" · ");
      card.innerHTML =
        `<div class="bp-card-h"><span class="bp-card-n">${esc(id)}</span><b>${esc(p.name)}</b></div>` +
        (sub ? `<div class="bp-card-s">${sub}</div>` : "") +
        (p.note ? `<p>${esc(p.note)}</p>` : "") +
        (pinned ? `<div class="bp-card-x">Esc or click elsewhere to close</div>` : "");
      card.hidden = false;
      shown = id;
      light(id);
    }
    place(x, y);
  }

  function hide() {
    card.hidden = true;
    shown = null;
    pinned = false;
    light(null);
  }

  // hover (pointer): follow whatever balloon is under the pointer; the 3D overlay is re-drawn each
  // frame, so ask the document what is under the pointer rather than trusting enter/leave events
  addEventListener("pointermove", (e) => {
    if (pinned || e.pointerType === "touch") return;
    const id = numberOf(balloonOf(document.elementFromPoint(e.clientX, e.clientY)));
    if (id) show(id, e.clientX, e.clientY);
    else if (shown) hide();
  }, { passive: true });

  // click or tap pins the card; it must not start an orbit or a drag underneath
  addEventListener("pointerdown", (e) => {
    const b = balloonOf(document.elementFromPoint(e.clientX, e.clientY));
    const id = numberOf(b);
    if (id) {
      e.stopPropagation();
      e.preventDefault();
      pinned = false;
      shown = null;
      pinned = true;
      show(id, e.clientX, e.clientY);
    } else if (pinned && !card.contains(e.target)) hide();
  }, true);

  addEventListener("keydown", (e) => {
    if (e.key === "Escape" && shown) hide();
  });

  // keyboard: static (2D) balloons are focusable buttons; Enter or focus shows the card
  for (const b of root.querySelectorAll('[data-role="balloon"]')) {
    const id = numberOf(b);
    if (!id) continue;
    b.setAttribute("tabindex", "0");
    b.setAttribute("role", "button");
    b.setAttribute("aria-label", `Part ${id}: ${info[id].name}`);
    const at = () => { const r = b.getBoundingClientRect(); return [r.right, r.top]; };
    b.addEventListener("focus", () => show(id, ...at()));
    b.addEventListener("blur", () => { if (!pinned) hide(); });
    b.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pinned = true; shown = null; show(id, ...at()); } });
  }

  addEventListener("scroll", () => { if (shown && !pinned) hide(); }, { passive: true });
  return { show, hide };
}

return { attach };
})();

BP_CARDS.attach({ info: {"1":{"name":"Body","spec":"2-bore","material":"EN AW-6082 T6","qty":"1","note":"The block with the two overlapping bores. The gear tips run close to the bore wall, which seals each tooth space as a batch."},"2":{"name":"Front flange","spec":"Spigot Ø50","material":"EN AC-46000","qty":"1","note":"Closes the shaft end of the body, carries the shaft seal and locates the pump on the motor or engine."},"3":{"name":"Rear cover","spec":"","material":"EN-GJL-250 cast iron","qty":"1","note":"Closes the back of the body."},"4":{"name":"Drive gear shaft","spec":"z12, m3, x+0.3","material":"16MnCr5, case hardened 58 HRC","qty":"1","note":"The input. It turns the driven gear and carries oil round the bore in its tooth spaces."},"5":{"name":"Driven gear shaft","spec":"z12, m3, x+0.3","material":"16MnCr5, case hardened 58 HRC","qty":"1","note":"Turned by the drive gear. Where the two gears mesh, the teeth squeeze the oil out to the outlet."},"6":{"name":"Front bushing","spec":"D-form","material":"CuSn12-C bronze","qty":"2","note":"Bronze pieces on the flange side. They hold the gear faces to keep the end leak small, and carry the shafts."},"7":{"name":"Rear bushing","spec":"D-form","material":"CuSn12-C bronze","qty":"2","note":"The same on the cover side. Pressure behind them presses them against the gears, which closes the gap."},"8":{"name":"Plain bearing","spec":"16 × 18 × 14, ISO 3547","material":"Steel / PTFE","qty":"4","note":"Journal bearings for the shaft ends."},"9":{"name":"Shaft seal","spec":"16 × 28 × 7, DIN 3760 A","material":"FKM 75","qty":"1","note":"Lip seal on the drive shaft that keeps oil from leaking out of the flange."},"10":{"name":"Circlip","spec":"28 × 1.2, DIN 472","material":"C75S steel","qty":"1","note":"Holds the shaft seal in the flange."},"11":{"name":"Parallel key","spec":"5 × 5 × 16, DIN 6885 A","material":"C45+C steel","qty":"1","note":"Transmits the input torque from the coupling to the drive shaft."},"12":{"name":"Screw","spec":"M8 × 70, ISO 4762","material":"Steel 10.9","qty":"4","note":"Clamps the flange, body and cover together against the oil pressure."},"13":{"name":"Washer","spec":"8, ISO 7089","material":"Steel 300 HV","qty":"4","note":"Spreads each screw's clamping load."},"14":{"name":"Body seal","spec":"Figure-8, Ø2 cord","material":"NBR 90","qty":"2","note":"Figure-8 seals between the body and each end plate, keeping oil in at both joints."},"15":{"name":"Balance seal","spec":"3-form","material":"FKM 80","qty":"1","note":"Defines the pressurised area behind the bushings, so they press on the gears just enough to close the gap."}} });
</script>
