<script>
"use strict";
const K = (() => {
// Blueprint drafting kit: orthographic views, sections, hatching, dimensions and sheet furniture.
// Every function here is pure and returns SVG markup strings, so the same code runs in the build
// and, inlined, in the page (live dimensions, moving springs, needles).
//
// Units. World geometry is in millimetres of the real object: u to the right, v up (a front view),
// or u right, v away from the viewer (a plan view). The sheet is an A2 drawing, 594 mm wide, drawn
// 1200 units wide; a view maps world mm to sheet units through its drawing scale.

const SHEET = { w: 1200, h: 848 };
const PX_PER_MM = SHEET.w / 594;

// ISO 128 line widths and ISO 3098 lettering, in sheet units (A2: 0.5 / 0.25 mm lines, 3.5 mm text).
const THICK = 1.15;
const THIN = 0.55;
const TEXT = 9.5;
const ARROW = 7;
const GAP = 2.2; // extension lines start this far from the object
const OVER = 3.5; // and run this far past the dimension line

const r2 = (n) => Math.round(n * 100) / 100;

function fmt(n, digits = 1) {
  const near = Math.round(n);
  if (Math.abs(n - near) < 0.05) return String(near);
  return n.toFixed(digits);
}

// ---------------------------------------------------------------- views

// A view is a window from world mm onto the sheet. scale is the drawing scale (1/2.5 for "1:2.5").
function view({ x, y, scale, name = "" }) {
  const k = scale * PX_PER_MM;
  return { x, y, scale, k, name, p: ([u, v]) => [r2(x + u * k), r2(y - v * k)] };
}

const scaleLabel = (scale) => (scale >= 1 ? `${fmt(scale)}:1` : `1:${fmt(1 / scale)}`);

function d(V, pts, closed = true) {
  let out = "";
  for (let i = 0; i < pts.length; i++) {
    const [x, y] = V.p(pts[i]);
    out += `${i ? "L" : "M"}${x} ${y}`;
  }
  return closed ? out + "Z" : out;
}

// ---------------------------------------------------------------- world geometry (point lists)

const rect = (u0, v0, u1, v1) => [[u0, v0], [u1, v0], [u1, v1], [u0, v1]];

function arc(cu, cv, r, a0, a1, steps) {
  const n = steps ?? Math.max(3, Math.ceil(Math.abs(a1 - a0) / 7.5));
  const out = [];
  for (let i = 0; i <= n; i++) {
    const a = ((a0 + ((a1 - a0) * i) / n) * Math.PI) / 180;
    out.push([cu + r * Math.cos(a), cv + r * Math.sin(a)]);
  }
  return out;
}

const circle = (cu, cv, r, steps = 48) => arc(cu, cv, r, 0, 360 - 360 / steps, steps - 1);

// A rectangle with filleted corners.
function rrect(u0, v0, u1, v1, r, steps = 4) {
  const q = Math.min(r, (u1 - u0) / 2, (v1 - v0) / 2);
  return [
    ...arc(u1 - q, v0 + q, q, -90, 0, steps),
    ...arc(u1 - q, v1 - q, q, 0, 90, steps),
    ...arc(u0 + q, v1 - q, q, 90, 180, steps),
    ...arc(u0 + q, v0 + q, q, 180, 270, steps),
  ];
}

const move = (pts, du, dv) => pts.map(([u, v]) => [u + du, v + dv]);
const flipU = (pts, about = 0) => pts.map(([u, v]) => [2 * about - u, v]).reverse();
const flipV = (pts, about = 0) => pts.map(([u, v]) => [u, 2 * about - v]).reverse();

function inside([u, v], poly) {
  let hit = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [ui, vi] = poly[i];
    const [uj, vj] = poly[j];
    if (vi > v !== vj > v && u < ((uj - ui) * (v - vi)) / (vj - vi) + ui) hit = !hit;
  }
  return hit;
}

// A body of revolution cut through its axis.
// loop is the half-profile as [r, s] pairs: r >= 0 measured from the axis, s along the axis.
// axis "v" is a vertical axis at u = at; axis "u" a horizontal axis at v = at.
// Returns the cut faces (hatched) and the edges seen through the bore behind the cutting plane:
// every circle on an inner surface shows edge-on as a straight line across the bore.
function revolve(loop, { axis = "v", at = 0 } = {}) {
  const place = axis === "v" ? (r, s) => [at + r, s] : (r, s) => [s, at + r];
  const n = loop.length;
  const onAxis = loop.findIndex(([r], i) => r === 0 && loop[(i + 1) % n][0] === 0);
  let cuts;
  if (onAxis >= 0) {
    const chain = Array.from({ length: n }, (_, j) => loop[(onAxis + 1 + j) % n]);
    const right = chain.map(([r, s]) => place(r, s));
    const left = chain.slice(1, -1).reverse().map(([r, s]) => place(-r, s));
    cuts = [[...right, ...left]];
  } else {
    cuts = [loop.map(([r, s]) => place(r, s)), loop.map(([r, s]) => place(-r, s)).reverse()];
  }
  const eps = 1e-3;
  const across = new Map();
  const clear = (r, s) => [0.02, 0.25, 0.5, 0.75, 0.98].every((t) => !inside([t * r, s], loop));
  for (const [r, s] of loop) {
    if (r <= 0) continue;
    if (clear(r, s + eps) && clear(r, s - eps)) across.set(s, Math.max(across.get(s) ?? 0, r));
  }
  const edges = [...across].map(([s, r]) => [place(-r, s), place(r, s)]);
  return { cuts, edges };
}

// ---------------------------------------------------------------- hatching

// ANSI/ISO-style material hatches. Spacing is in sheet units and never scales with the view,
// so a detail at 2:1 shows the same density as the main view, as on a real drawing.
const MATERIALS = {
  steel: { kind: "lines", gap: 3.4 },
  iron: { kind: "lines", gap: 5.6 },
  alu: { kind: "pairs", gap: 5.2, pair: 1.5 },
  brass: { kind: "dashed", gap: 4.6 },
  bronze: { kind: "dashed", gap: 3.6 },
  rubber: { kind: "cross", gap: 3.2 },
  plastic: { kind: "lines", gap: 2.3 },
  foam: { kind: "dots", gap: 2.6 },
  wood: { kind: "grain", gap: 4 },
};
const ANGLES = [45, 135, 30, 60];

function hatchDefs() {
  let out = "";
  for (const [name, m] of Object.entries(MATERIALS)) {
    for (const angle of ANGLES) {
      const g = m.gap;
      let body = "";
      if (m.kind === "lines") body = `<path class="hl" d="M0 -1V${g + 1}"/>`;
      if (m.kind === "pairs") body = `<path class="hl" d="M0 -1V${g + 1}M${m.pair} -1V${g + 1}"/>`;
      if (m.kind === "dashed") body = `<path class="hl" d="M0 -1V${g + 1}"/><path class="hl hl-dash" d="M${g / 2} -1V${g + 1}"/>`;
      if (m.kind === "cross") body = `<path class="hl" d="M0 -1V${g + 1}M-1 0H${g + 1}"/>`;
      if (m.kind === "dots") body = `<circle class="hd" cx="${g / 2}" cy="${g / 2}" r="0.42"/>`;
      if (m.kind === "grain") body = `<path class="hl" d="M0 -1V${g + 1}"/><path class="hl" d="M${g * 0.55} -1C${g * 0.75} ${g * 0.3} ${g * 0.35} ${g * 0.7} ${g * 0.55} ${g + 1}"/>`;
      out += `<pattern id="h-${name}-${angle}" patternUnits="userSpaceOnUse" width="${g}" height="${g}" patternTransform="rotate(${angle})">${body}</pattern>`;
    }
  }
  return out;
}

// ---------------------------------------------------------------- drawing parts

// A cut face: paper underneath (it hides what is behind), the material hatch, a thick outline.
// mat "solid" blacks the section in, the ISO convention for sections too thin to hatch.
function cut(V, pts, { mat = "steel", angle = 45 } = {}) {
  const dd = d(V, pts);
  if (mat === "solid") return `<path class="solid" d="${dd}"/>`;
  return `<path class="paper" d="${dd}"/><path fill="url(#h-${mat}-${angle})" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

// A body of revolution in section, with the edges behind the cut.
function section(V, rev, opts) {
  return rev.cuts.map((c) => cut(V, c, opts)).join("") + rev.edges.map((e) => line(V, e)).join("");
}

// An unsectioned solid (shafts, rods, pins, balls, nuts and ribs are never hatched in a section).
function body(V, pts) {
  const dd = d(V, pts);
  return `<path class="paper" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

const line = (V, pts, cls = "vis", closed = false) => `<path class="${cls}" d="${d(V, pts, closed)}"/>`;
const lines = (V, list, cls = "vis") => `<path class="${cls}" d="${list.map((pts) => d(V, pts, false)).join("")}"/>`;

// A centre line, run a little past the outline at both ends.
function centerline(V, a, b, over = 6) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  return `<path class="ctr" d="M${r2(ax - ux * over)} ${r2(ay - uy * over)}L${r2(bx + ux * over)} ${r2(by + uy * over)}"/>`;
}

// Centre mark for a circle in a view: two crossed centre lines.
function centerMark(V, [cu, cv], r, over = 5) {
  return centerline(V, [cu - r, cv], [cu + r, cv], over) + centerline(V, [cu, cv - r], [cu, cv + r], over);
}

// A compression spring cut along its axis: wire sections (blacked in) on both sides, half a pitch
// apart, joined by the back half of each turn. from/to are positions along the axis.
function springSection(V, { from, to, radius, wire, turns, axis = "u", at = 0 }) {
  const place = axis === "u" ? (s, r) => [s, at + r] : (s, r) => [at + r, s];
  const pitch = (to - from - wire) / turns;
  const start = from + wire / 2;
  const back = [];
  let sections = "";
  for (let i = 0; i <= turns; i++) {
    const sTop = start + i * pitch;
    sections += cut(V, circle(...place(sTop, radius), wire / 2, 12), { mat: "solid" });
    if (i < turns) {
      const sBot = sTop + pitch / 2;
      sections += cut(V, circle(...place(sBot, -radius), wire / 2, 12), { mat: "solid" });
      back.push([place(sTop, radius), place(sBot, -radius)]);
    }
  }
  return lines(V, back, "vis spring") + sections;
}

// ---------------------------------------------------------------- annotation

function arrowHead([x, y], [dx, dy]) {
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len;
  const uy = dy / len;
  const bx = x - ux * ARROW;
  const by = y - uy * ARROW;
  const half = ARROW * 0.25;
  return `M${r2(x)} ${r2(y)}L${r2(bx - uy * half)} ${r2(by + ux * half)}L${r2(bx + uy * half)} ${r2(by - ux * half)}Z`;
}

const textWidth = (s, size = TEXT) => String(s).length * size * 0.6;

// A linear dimension between two world points, measured along dir ("h" or "v").
// off is the sheet distance from point a to the dimension line (negative: up or left).
// The value is measured from the geometry unless text is given, so a dimension cannot lie.
function dim(V, a, b, { dir = "h", off = 18, text, prefix = "", suffix = "", id = "", cls = "" } = {}) {
  const A = V.p(a);
  const B = V.p(b);
  const value = text ?? prefix + fmt(Math.abs(dir === "h" ? b[0] - a[0] : b[1] - a[1])) + suffix;
  const h = dir === "h";
  const main = h ? 0 : 1; // the axis the dimension measures along
  const side = 1 - main;
  const at = A[side] + off; // where the dimension line sits
  const pt = (m, s) => (h ? [m, s] : [s, m]);
  let ext = "";
  for (const P of [A, B]) {
    const gapTo = at - P[side];
    if (Math.abs(gapTo) <= GAP) continue;
    const sgn = Math.sign(gapTo);
    const [x1, y1] = pt(P[main], P[side] + sgn * GAP);
    const [x2, y2] = pt(P[main], at + sgn * OVER);
    ext += `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
  }
  const lo = Math.min(A[main], B[main]);
  const hi = Math.max(A[main], B[main]);
  const span = hi - lo;
  const tw = textWidth(value);
  const arrowsIn = span >= ARROW * 2 + 3;
  const textIn = span >= tw + ARROW * 2 + 6;
  let lineD;
  let heads;
  let tm; // text position along the measured axis
  let anchor = "middle";
  if (arrowsIn) {
    const [x1, y1] = pt(lo, at);
    const [x2, y2] = pt(hi, at);
    lineD = `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
    heads = arrowHead(pt(lo, at), pt(-1, 0)) + arrowHead(pt(hi, at), pt(1, 0));
  } else {
    const [x1, y1] = pt(lo - ARROW - 7, at);
    const [x2, y2] = pt(hi + ARROW + 7, at);
    lineD = `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
    heads = arrowHead(pt(lo, at), pt(1, 0)) + arrowHead(pt(hi, at), pt(-1, 0));
  }
  if (textIn) tm = (lo + hi) / 2;
  else {
    tm = hi + ARROW + 10 + tw / 2;
    const [x2, y2] = pt(tm + tw / 2, at);
    lineD += `L${r2(x2)} ${r2(y2)}`;
  }
  // ISO: text sits just above a horizontal line and reads from the right on a vertical one.
  const [tx, ty] = pt(tm, at - 3);
  const textEl = h
    ? `<text class="t" x="${r2(tx)}" y="${r2(ty)}" text-anchor="${anchor}">${value}</text>`
    : `<text class="t" x="${r2(tx)}" y="${r2(ty)}" text-anchor="${anchor}" transform="rotate(-90 ${r2(tx)} ${r2(ty)})">${value}</text>`;
  return `<g data-role="dim"${id ? ` id="${id}"` : ""}${cls ? ` class="${cls}"` : ""}><path class="thin" d="${ext}${lineD}"/><path class="head" d="${heads}"/>${textEl}</g>`;
}

// A part balloon: a dot on the part, a thin leader, a circled item number.
function balloon(V, at, [bx, by], n, { target = "", r = 8.5 } = {}) {
  const [ax, ay] = V.p(at);
  const a = Math.atan2(ay - by, ax - bx);
  const ex = r2(bx + r * Math.cos(a));
  const ey = r2(by + r * Math.sin(a));
  return (
    `<g data-role="balloon" data-target="${target}" data-at="${ax} ${ay}">` +
    `<path class="thin" d="M${ex} ${ey}L${ax} ${ay}"/><circle class="dot" cx="${ax}" cy="${ay}" r="1.5"/>` +
    `<circle class="balloon" cx="${bx}" cy="${by}" r="${r}"/>` +
    `<text class="t" x="${bx}" y="${r2(by + 3.3)}" text-anchor="middle">${n}</text></g>`
  );
}

// A view title: SECTION A-A over its scale, centred under the view.
function viewLabel(x, y, title, sub = "") {
  return (
    `<g data-role="label"><text class="t t-lg" x="${x}" y="${y}" text-anchor="middle">${title}</text>` +
    (sub ? `<text class="t t-sm" x="${x}" y="${y + 12}" text-anchor="middle">${sub}</text>` : "") +
    `</g>`
  );
}

// The circle that marks a detail in its parent view, with its letter.
function detailMark(V, [cu, cv], r, letter, angle = 45) {
  const [x, y] = V.p([cu, cv]);
  const R = r * V.k;
  const a = (-angle * Math.PI) / 180;
  const lx = r2(x + (R + 9) * Math.cos(a));
  const ly = r2(y + (R + 9) * Math.sin(a) + 4);
  return `<g data-role="label"><circle class="thin mark" cx="${x}" cy="${y}" r="${r2(R)}"/><text class="t t-lg" x="${lx}" y="${ly}" text-anchor="middle">${letter}</text></g>`;
}

// A viewing-direction arrow (VIEW C): a thick-tipped arrow pointing at the surface, with its letter.
function viewArrow(V, at, [dx, dy], letter, len = 26) {
  const [x, y] = V.p(at);
  const n = Math.hypot(dx, dy) || 1;
  const ux = dx / n;
  const uy = dy / n;
  const sx = r2(x - ux * len);
  const sy = r2(y - uy * len);
  return (
    `<g data-role="label"><path class="vis" d="M${sx} ${sy}L${r2(x - ux * ARROW)} ${r2(y - uy * ARROW)}"/>` +
    `<path class="head" d="${arrowHead([x, y], [ux, uy])}"/>` +
    `<text class="t t-lg" x="${r2(sx - uy * 10)}" y="${r2(sy + ux * 10 + 4)}" text-anchor="middle">${letter}</text></g>`
  );
}

// A long-break line across a part (thin, with one zigzag), for parts that run out of the view.
function breakLine(V, a, b) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const mx = (ax + bx) / 2;
  const my = (ay + by) / 2;
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  const z = 3.5;
  const p = (t, s) => `${r2(mx + ux * t - uy * s)} ${r2(my + uy * t + ux * s)}`;
  return `<path class="thin" d="M${r2(ax - ux * 4)} ${r2(ay - uy * 4)}L${p(-z, 0)}L${p(-z / 2, z * 1.6)}L${p(z / 2, -z * 1.6)}L${p(z, 0)}L${r2(bx + ux * 4)} ${r2(by + uy * 4)}"/>`;
}

// ---------------------------------------------------------------- sheet furniture

// The drawing frame: trimmed edge, a thick border, zone references and centring marks.
function frame({ w = SHEET.w, h = SHEET.h, trim = 8, m = 24, cols = 8, rows = 6 } = {}) {
  let out = `<g data-role="frame"><rect class="thin" x="${trim}" y="${trim}" width="${w - trim * 2}" height="${h - trim * 2}"/>`;
  out += `<rect class="vis" x="${m}" y="${m}" width="${w - m * 2}" height="${h - m * 2}"/>`;
  const cw = (w - m * 2) / cols;
  const rh = (h - m * 2) / rows;
  let ticks = "";
  let labels = "";
  for (let i = 0; i <= cols; i++) {
    const x = r2(m + i * cw);
    if (i > 0 && i < cols) ticks += `M${x} ${trim}V${m}M${x} ${h - m}V${h - trim}`;
    if (i < cols) {
      const cx = r2(m + (i + 0.5) * cw);
      labels += `<text class="t t-sm" x="${cx}" y="${r2((trim + m) / 2 + 3)}" text-anchor="middle">${i + 1}</text>`;
      labels += `<text class="t t-sm" x="${cx}" y="${r2(h - (trim + m) / 2 + 3)}" text-anchor="middle">${i + 1}</text>`;
    }
  }
  for (let j = 0; j <= rows; j++) {
    const y = r2(m + j * rh);
    if (j > 0 && j < rows) ticks += `M${trim} ${y}H${m}M${w - m} ${y}H${w - trim}`;
    if (j < rows) {
      const cy = r2(m + (j + 0.5) * rh + 3);
      const letter = String.fromCharCode(65 + j);
      labels += `<text class="t t-sm" x="${r2((trim + m) / 2)}" y="${cy}" text-anchor="middle">${letter}</text>`;
      labels += `<text class="t t-sm" x="${r2(w - (trim + m) / 2)}" y="${cy}" text-anchor="middle">${letter}</text>`;
    }
  }
  const cm = `M${w / 2} ${trim}V${m + 10}M${w / 2} ${h - trim}V${h - m - 10}M${trim} ${h / 2}H${m + 10}M${w - trim} ${h / 2}H${w - m - 10}`;
  out += `<path class="thin" d="${ticks}"/><path class="vis" d="${cm}"/>${labels}</g>`;
  return out;
}

// A ruled table (parts list). cols: [{ w, align, title }]. rows: arrays of cell strings.
// Item numbers count up from the bottom, as a parts list sits on top of the title block.
function table(x, y, cols, rows, { rowH = 16, role = "bom", headH = 18 } = {}) {
  const w = cols.reduce((s, c) => s + c.w, 0);
  const h = headH + rows.length * rowH;
  let rules = "";
  let text = "";
  let cx = x;
  for (const [i, c] of cols.entries()) {
    if (i > 0) rules += `M${r2(cx)} ${y}V${y + h}`;
    const tx = c.align === "center" ? cx + c.w / 2 : c.align === "right" ? cx + c.w - 4 : cx + 4;
    const anchor = c.align === "center" ? "middle" : c.align === "right" ? "end" : "start";
    text += `<text class="t t-sm t-head" x="${r2(tx)}" y="${y + h - 5.5}" text-anchor="${anchor}">${c.title}</text>`;
    rows.forEach((row, j) => {
      text += `<text class="t t-sm" x="${r2(tx)}" y="${r2(y + (rows.length - 1 - j) * rowH + rowH - 4.8)}" text-anchor="${anchor}">${row[i]}</text>`;
    });
    cx += c.w;
  }
  for (let j = 1; j <= rows.length; j++) rules += `M${x} ${r2(y + j * rowH)}H${x + w}`;
  return `<g data-role="${role}"><rect class="paper" x="${x}" y="${y}" width="${w}" height="${h}"/><path class="thin" d="${rules}"/><rect class="vis" x="${x}" y="${y}" width="${w}" height="${h}"/>${text}</g>`;
}

// A title-block cell: a small caption over a value. size: "sm" | "md" | "lg".
function cell({ x, y, w, h, label, value = "", size = "md", id = "" }) {
  const cls = size === "lg" ? "t t-xl" : size === "sm" ? "t t-sm" : "t";
  const vy = size === "lg" ? y + h - 7 : y + h - 5;
  return (
    `<rect class="thin" x="${x}" y="${y}" width="${w}" height="${h}"/>` +
    `<text class="t t-cap" x="${x + 4}" y="${y + 9}">${label}</text>` +
    `<text class="${cls}" x="${x + 4}" y="${vy}"${id ? ` id="${id}"` : ""}>${value}</text>`
  );
}

function titleBlock(x, y, w, h, cells) {
  return `<g data-role="title"><rect class="paper" x="${x}" y="${y}" width="${w}" height="${h}"/>${cells.map((c) => cell({ ...c, x: x + c.x, y: y + c.y })).join("")}<rect class="vis" x="${x}" y="${y}" width="${w}" height="${h}"/></g>`;
}

// A notes block: a heading and numbered lines.
function notes(x, y, heading, items, lead = 13) {
  let out = `<g data-role="notes"><text class="t t-head" x="${x}" y="${y}">${heading}</text>`;
  items.forEach((s, i) => {
    out += `<text class="t t-sm" x="${x}" y="${r2(y + lead * (i + 1) + 2)}">${i + 1}. ${s}</text>`;
  });
  return out + `</g>`;
}

return { SHEET, PX_PER_MM, THICK, THIN, TEXT, ARROW, GAP, OVER, r2, fmt, view, scaleLabel, d, rect, arc, circle, rrect, move, flipU, flipV, inside, revolve, MATERIALS, ANGLES, hatchDefs, cut, section, body, line, lines, centerline, centerMark, springSection, textWidth, dim, balloon, viewLabel, detailMark, viewArrow, breakLine, frame, table, cell, titleBlock, notes };
})();

const L = (() => {
// Live runtime for a blueprint sheet: one time-based loop, an idle tour, input wake-ups,
// offscreen and hidden-tab pauses, reduced motion, and deterministic frames for checks.
//
// URL parameters (all optional):
//   ?t=6.5            render the tour at 6.5 s, deterministically, and stop (for screenshots)
//   ?theme=paper      blueprint | paper | dark
//   ?zoom=x,y,w,h     show only this sheet region, filling the window (for 4x close-ups)
//   ?check=1          run the layout self-check after the first frame (see selfcheck.mjs)

function params() {
  const q = new URLSearchParams(location.search);
  return {
    t: q.has("t") ? Number(q.get("t")) : null,
    theme: q.get("theme"),
    zoom: q.get("zoom"),
    check: q.has("check"),
  };
}

const THEMES = ["blueprint", "paper", "dark"];

function setupPage(svg) {
  const q = params();
  const pick = (name) => {
    if (!THEMES.includes(name)) return;
    document.documentElement.dataset.theme = name;
    for (const b of document.querySelectorAll("[data-theme-pick]")) b.setAttribute("aria-pressed", String(b.dataset.themePick === name));
    try {
      localStorage.setItem("bp-theme", name);
    } catch {}
  };
  let saved = null;
  try {
    saved = localStorage.getItem("bp-theme");
  } catch {}
  pick(q.theme ?? saved ?? "blueprint");
  for (const b of document.querySelectorAll("[data-theme-pick]")) b.addEventListener("click", () => pick(b.dataset.themePick));
  if (q.zoom) {
    const box = q.zoom.split(",").map(Number);
    if (box.length === 4 && box.every(Number.isFinite)) {
      svg.setAttribute("viewBox", box.join(" "));
      document.body.classList.add("bp-zoom");
    }
  }
  return q;
}

// Critically damped follow toward a target: calm, no overshoot, frame-rate independent.
function follow(at, want, rate, dt) {
  return want + (at - want) * Math.exp(-rate * dt);
}

const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, t)));

// run({ root, step, render, idleAfter })
//   step(dt, live) advances the model; live.touring says whether the idle tour drives it.
//   It returns true while something is still settling, so a reduced-motion page can sleep.
//   render(live) writes attributes; it never rebuilds static geometry.
function run({ root, step, render, idleAfter = 4, onFrozen }) {
  const q = params();
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const live = { clock: 0, slow: 1, lastInput: -Infinity, reduced, touring: !reduced, frozen: q.t != null };
  live.input = () => {
    live.lastInput = live.clock;
    live.touring = false;
    wake();
  };

  if (live.frozen) {
    const dt = 1 / 240;
    for (let t = 0; t < q.t; t += dt) {
      live.clock = t;
      live.touring = true;
      step(dt, live);
    }
    render(live);
    onFrozen?.(live);
    return live;
  }

  let raf = 0;
  let last = 0;
  let visible = true;
  function frame(now) {
    raf = 0;
    const real = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    live.clock += real;
    live.touring = !reduced && live.clock - live.lastInput > idleAfter;
    const busy = step(real * live.slow, live);
    render(live);
    if (visible && !document.hidden && (!reduced || busy)) raf = requestAnimationFrame(frame);
    else last = 0;
  }
  function wake() {
    if (!raf && visible && !document.hidden) raf = requestAnimationFrame(frame);
  }
  live.wake = wake;
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(([entry]) => {
      visible = entry.isIntersecting;
      if (visible) wake();
    }).observe(root);
  }
  document.addEventListener("visibilitychange", wake);
  render(live);
  wake();
  return live;
}

// Vertical drag on an element, reported as a sheet-unit delta since the press.
function dragY(svg, el, { start, move, end }) {
  let id = null;
  let y0 = 0;
  const toSheet = (e) => {
    const m = svg.getScreenCTM();
    return m ? (e.clientY - m.f) / m.d : e.clientY;
  };
  el.addEventListener("pointerdown", (e) => {
    id = e.pointerId;
    el.setPointerCapture(id);
    y0 = toSheet(e);
    start?.();
    e.preventDefault();
  });
  el.addEventListener("pointermove", (e) => {
    if (e.pointerId === id) move(toSheet(e) - y0);
  });
  const stop = (e) => {
    if (e.pointerId !== id) return;
    id = null;
    end?.();
  };
  el.addEventListener("pointerup", stop);
  el.addEventListener("pointercancel", stop);
}

// Announce a readout to screen readers at most every `every` seconds.
function announcer(el, every = 1.5) {
  let lastAt = -Infinity;
  let lastText = "";
  return (text, clock) => {
    if (text === lastText || clock - lastAt < every) return;
    lastAt = clock;
    lastText = text;
    el.textContent = text;
  };
}

return { params, THEMES, setupPage, follow, ease, run, dragY, announcer };
})();

const C = (() => {
// Layout self-check, run in the page with ?check=1 (scripts/check.mjs drives it headlessly).
// It writes a JSON report into <pre id="bp-check"> and to the console. A clean sheet reports
// zero failures in every category.
//
//   text-overlap      two pieces of lettering touch
//   text-on-geometry  lettering sits on a part or on another annotation's lines
//   outside-frame     an annotation or a view crosses the drawing frame
//   balloon-target    a balloon's dot is not on the part it names
//   balloon-on-geom   a balloon circle sits on a part
//   hard-colour       a fill or stroke is a literal colour instead of a token
//   sideways-scroll   the page scrolls horizontally

const roleOf = (el) => el.closest("[data-role]")?.dataset.role ?? "";

// A clipped group's box is its clip region's box (getBoundingClientRect ignores clipping).
function clippedBox(el) {
  const ref = el.getAttribute("clip-path")?.match(/url\(#([^)]+)\)/)?.[1];
  const shape = ref && document.getElementById(ref)?.firstElementChild;
  if (!shape) return el.getBoundingClientRect();
  const b = shape.getBBox();
  const m = shape.ownerSVGElement.getScreenCTM();
  const x0 = m.a * b.x + m.e;
  const y0 = m.d * b.y + m.f;
  return { left: x0, top: y0, right: x0 + m.a * b.width, bottom: y0 + m.d * b.height };
}

function selfCheck(svg) {
  const fails = [];
  const fail = (kind, what) => fails.push({ kind, what });
  const label = (el) => {
    const g = el.closest("[data-role],[data-part],[data-geom]");
    const name = g?.id || g?.dataset.part || g?.dataset.target || g?.dataset.role || g?.dataset.geom || el.tagName;
    return `${name}: "${(el.textContent || "").trim().slice(0, 24)}"`;
  };
  const shown = (el) => {
    const b = el.getBoundingClientRect();
    if (b.width < 0.5 || b.height < 0.5) return false;
    const cs = getComputedStyle(el);
    return cs.visibility !== "hidden" && cs.display !== "none" && Number(cs.opacity) > 0.05;
  };
  const texts = [...svg.querySelectorAll("text")].filter(shown);
  const boxes = texts.map((t) => t.getBoundingClientRect());
  const grow = 0.4;
  const hit = (a, b) => a.left < b.right - grow && b.left < a.right - grow && a.top < b.bottom - grow && b.top < a.bottom - grow;

  for (let i = 0; i < texts.length; i++)
    for (let j = i + 1; j < texts.length; j++) if (hit(boxes[i], boxes[j])) fail("text-overlap", `${label(texts[i])} × ${label(texts[j])}`);

  const geomOf = (el) => el.closest("[data-geom]");
  for (const [i, t] of texts.entries()) {
    const role = roleOf(t);
    if (role === "engraved" || role === "frame") continue;
    const own = t.closest("[data-role]");
    const b = boxes[i];
    const seen = new Set();
    for (let ix = 0; ix < 4; ix++)
      for (let iy = 0; iy < 2; iy++) {
        const x = b.left + b.width * (0.15 + ix * 0.233);
        const y = b.top + b.height * (0.3 + iy * 0.4);
        for (const el of document.elementsFromPoint(x, y)) {
          if (el === t || el.tagName === "text" || el.tagName === "svg" || el.closest("defs")) continue;
          if (el.classList.contains("tint") || el.classList.contains("hit") || el.closest('[data-role="phantom"]')) continue;
          if (own && own.contains(el)) continue;
          const g = geomOf(el);
          const other = el.closest("[data-role]");
          const bad = (g && !g.contains(t)) || (other && other !== own && other.dataset.role !== "frame" && other.dataset.role !== "chart-bg");
          if (bad && !el.classList.contains("sheet-bg") && !el.classList.contains("grid")) {

            if (!seen.has(key)) {
              seen.add(key);
              fail("text-on-geometry", `${label(t)} on ${key?.dataset.part || key?.id || key?.dataset.role || key?.dataset.geom || el.tagName}`);
            }

  const frameRect = svg.querySelector('[data-role="frame"] rect.vis')?.getBoundingClientRect();
  if (frameRect) {
    for (const el of svg.querySelectorAll("[data-role]:not([data-role=frame]), [data-geom]")) {
      if (el.parentElement?.closest("[data-role]:not([data-role=frame]), [data-geom]")) continue;
      if (!shown(el)) continue;

      const tol = 0.5;

        fail("outside-frame", el.id || el.dataset.geom || el.dataset.role);

    if (!shown(g)) continue;
    const dot = g.querySelector("circle.dot").getBoundingClientRect();
    const x = dot.left + dot.width / 2;
    const y = dot.top + dot.height / 2;
    const target = g.dataset.target;
    const under = document.elementsFromPoint(x, y).some((el) => el.closest(`[data-part="${target}"]`));
    if (!under) fail("balloon-target", `balloon ${g.textContent.trim()} → ${target}`);
    const c = g.querySelector("circle.balloon").getBoundingClientRect();
    const pts = [
      [c.left + c.width * 0.5, c.top + c.height * 0.5],
      [c.left + c.width * 0.2, c.top + c.height * 0.5],
      [c.left + c.width * 0.8, c.top + c.height * 0.5],
      [c.left + c.width * 0.5, c.top + c.height * 0.2],
      [c.left + c.width * 0.5, c.top + c.height * 0.8],

  const counts = Object.fromEntries(kinds.map((k) => [k, fails.filter((f) => f.kind === k).length]));
  const report = { ok: fails.length === 0, counts, fails, texts: texts.length, parts: svg.querySelectorAll("[data-part]").length };
  let pre = document.getElementById("bp-check");

    pre = document.createElement("pre");
    pre.id = "bp-check";
    pre.hidden = true;
    document.body.append(pre);

  console.log("bp-check", JSON.stringify(report.counts));

const M = (() => {
// Truth first: a Porter governor on a mill engine, closing a double-beat throttle valve.
// Pure, no imports, no DOM. The geometry, the dimensions, the readout and both diagrams read this.
//
// Governor. Two balls of mass m on equal arms and links (length l, pivots at offset e from the
// axis) carry a central load M on the sleeve. With friction neglected the balance of each ball is
//     m·ω²·r = (m + M)·g·tan α,   r = e + l·sin α
// so a faster spindle swings the balls out, α grows and the sleeve rises 2·l·Δcos α.
// The sleeve moves a bell crank, the bell crank a link, the link the valve stem: a rising sleeve
// shuts the valve. The balls and sleeve lag their equilibrium with a time constant TAU_G
// (ball inertia and pin friction folded into one first-order lag).
//
// Engine. One first-order shaft:  J·dΩ/dt = T·f − LOAD − c·Ω,
// where f is the valve opening (curtain area of the two seats over the outlet bore, capped at 1).
// Closing the loop gives a proportional controller: more load needs more opening, more opening
// needs the sleeve lower, and the sleeve only sits lower at a lower speed. That is the droop.

const rad = (d) => (d * Math.PI) / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const G = 9.81;

// ---------------------------------------------------------------- governor geometry (mm)
const ARM = 150; // upper arm and lower link, pin to pin
const OFFSET = 20; // arm and link pivots, out from the axis
const ALPHA_MIN = 30; // deg, sleeve on the lower stop collar
const ALPHA_MAX = 45; // deg, sleeve on the upper stop collar
const VT = 550; // head pivots, above the drive-shaft axis
const BALL_D = 75;
const RHO_IRON = 7200; // kg/m³, grey iron

const mm3 = 1e-9;
const ringVol = (r1, r0, h) => Math.PI * (r1 * r1 - r0 * r0) * h;
const BALL_M = RHO_IRON * (4 / 3) * Math.PI * (BALL_D / 2) ** 3 * mm3;

// The sleeve, as drawn, in mm relative to its link pivots (the "lug" height).
const SLEEVE = { bore: 12.5, hubR: 29, bodyR: 65, neckR: 25, grooveR: 20, top: 10, bodyTop: -10, bodyBot: -70, bot: -116, grooveLo: -108, grooveHi: -92 };
const S = SLEEVE;
const SLEEVE_M =
  RHO_IRON *
  mm3 *
  (ringVol(S.hubR, S.bore, S.top - S.bodyTop) +
    ringVol(S.bodyR, S.bore, S.bodyTop - S.bodyBot) +
    ringVol(S.neckR, S.bore, S.bodyBot - S.bot) -
    ringVol(S.neckR, S.grooveR, S.grooveHi - S.grooveLo));

const RATIO = 30 / 20; // bevel wheel 30 teeth on the engine shaft, pinion 20 on the spindle

const ballR = (a) => OFFSET + ARM * Math.sin(rad(a)); // mm from the axis
const heightH = (a) => ARM * Math.cos(rad(a)); // ball plane below the head pivots
const lug = (a) => VT - 2 * ARM * Math.cos(rad(a)); // the sleeve's link pivots
const ballC = (a) => [ballR(a), VT - heightH(a)];
const sleeveLift = (a) => lug(a) - lug(ALPHA_MIN);
const LIFT_MAX = sleeveLift(ALPHA_MAX);

// ω² that holds the balls at α, rad²/s².
function omega2(a) {
  return ((BALL_M + SLEEVE_M) * G * Math.tan(rad(a))) / (BALL_M * (ballR(a) / 1000));
}
const spindleRpm = (a) => (Math.sqrt(omega2(a)) * 60) / (2 * Math.PI);
const N_LO = spindleRpm(ALPHA_MIN); // spindle rpm at which the sleeve leaves the lower stop
const N_HI = spindleRpm(ALPHA_MAX); // and reaches the upper one

// Equilibrium arm angle for a spindle speed, on the stops outside the band.
function alphaEq(n) {
  if (n <= N_LO) return ALPHA_MIN;
  if (n >= N_HI) return ALPHA_MAX;
  let lo = ALPHA_MIN;
  let hi = ALPHA_MAX;
  for (let i = 0; i < 40; i++) {
    const mid = (lo + hi) / 2;
    if (spindleRpm(mid) < n) lo = mid;
    else hi = mid;
  }
  return (lo + hi) / 2;
}

// ---------------------------------------------------------------- linkage (mm)
// The swivel collar's pin rides with the sleeve; it slides in the slot of the bell crank's long arm.
const PIN_C_U = 58;
const PIN_C_DV = -100; // below the sleeve's link pivots
const pinC = (a) => [PIN_C_U, lug(a) + PIN_C_DV];
const F = [PIN_C_U + 130, (pinC(ALPHA_MIN)[1] + pinC(ALPHA_MAX)[1]) / 2]; // fulcrum, level with mid travel
const ARM2 = 55; // short arm, to the valve link
const ARM2_AT = 300; // deg, its direction when the long arm is level (a 120° bell crank)
function crankTurn(a) {
  const [u, v] = pinC(a);
  return Math.atan2(v - F[1], u - F[0]) - Math.PI * Math.sign(v - F[1] || 1); // radians, + is anticlockwise
}
const pinE = (psi) => [F[0] + ARM2 * Math.cos(rad(ARM2_AT) + psi), F[1] + ARM2 * Math.sin(rad(ARM2_AT) + psi)];
const UV = F[0] + ARM2 * Math.cos(rad(ARM2_AT)); // valve axis, under the short arm at mid travel
const PIN_G_SHUT = 110; // stem clevis pin with the valve on its seats
const LINK = Math.hypot(pinE(crankTurn(ALPHA_MAX))[0] - UV, pinE(crankTurn(ALPHA_MAX))[1] - PIN_G_SHUT);
function pinG(a) {
  const [eu, ev] = pinE(crankTurn(a));
  return [UV, ev - Math.sqrt(LINK * LINK - (eu - UV) ** 2)];
}
const valveLift = (a) => Math.max(0, pinG(a)[1] - PIN_G_SHUT);
const VALVE_LIFT_MAX = valveLift(ALPHA_MIN);

// ---------------------------------------------------------------- valve
const SEAT_LO = 48; // lower seat bore
const SEAT_HI = 56; // upper seat bore
const OUTLET_D = 60;
const PORT = (Math.PI / 4) * OUTLET_D ** 2; // mm²
const CURTAIN = Math.PI * (SEAT_LO + SEAT_HI); // mm² per mm of lift, both seats
const opening = (lift) => clamp((CURTAIN * lift) / PORT, 0, 1);
const FULL_LIFT = PORT / CURTAIN; // lift at which the curtains equal the bore

// ---------------------------------------------------------------- engine
const T_MAX = 2400; // N·m with the throttle wide open
const J = 600; // kg·m², flywheel and shaft
const C_F = 15; // N·m per rad/s, friction and windage
const TAU_G = 0.35; // s, governor lag
const LOAD_LIGHT = 600; // N·m
const LOAD_HEAVY = 1300;
const LOAD_MIN = 200;
const LOAD_MAX = 1900;

const toRpm = (w) => (w * 60) / (2 * Math.PI);
const toRad = (n) => (n * 2 * Math.PI) / 60;

// Torque balance at an engine speed with the governor in equilibrium.
const surplus = (w, load) => T_MAX * opening(valveLift(alphaEq(RATIO * toRpm(w)))) - load - C_F * w;

// The operating point for a load: engine speed, arm angle, valve opening.
function steady(load) {
  let lo = 1;
  let hi = 40;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (surplus(mid, load) > 0) lo = mid;
    else hi = mid;
  }
  const omega = (lo + hi) / 2;
  const alpha = alphaEq(RATIO * toRpm(omega));
  return { omega, alpha, f: opening(valveLift(alpha)) };
}

const engine = (load = LOAD_LIGHT) => ({ ...steady(load), load });

// One step of the closed loop.
function step(s, dt, load) {
  s.load = load;
  const want = alphaEq(RATIO * toRpm(s.omega));
  s.alpha += (want - s.alpha) * (1 - Math.exp(-dt / TAU_G));
  s.f = opening(valveLift(s.alpha));
  s.omega += (dt * (T_MAX * s.f - load - C_F * s.omega)) / J;
  return s;
}

// The sleeve lift the engine needs to carry a load at a speed (the engine's line on Diagram 1).
function liftNeeded(load, w) {
  const f = (load + C_F * w) / T_MAX;
  if (f >= 1) return 0;
  let lo = ALPHA_MIN;
  let hi = ALPHA_MAX;
  for (let i = 0; i < 40; i++) {
    const mid = (lo + hi) / 2;
    if (opening(valveLift(mid)) > f) lo = mid;
    else hi = mid;
  }
  return sleeveLift((lo + hi) / 2);
}

return { G, ARM, OFFSET, ALPHA_MIN, ALPHA_MAX, VT, BALL_D, RHO_IRON, BALL_M, SLEEVE, SLEEVE_M, RATIO, ballR, heightH, lug, ballC, sleeveLift, LIFT_MAX, omega2, spindleRpm, N_LO, N_HI, alphaEq, PIN_C_U, PIN_C_DV, pinC, F, ARM2, ARM2_AT, crankTurn, pinE, UV, PIN_G_SHUT, LINK, pinG, valveLift, VALVE_LIFT_MAX, SEAT_LO, SEAT_HI, OUTLET_D, PORT, CURTAIN, opening, FULL_LIFT, T_MAX, J, C_F, TAU_G, LOAD_LIGHT, LOAD_HEAVY, LOAD_MIN, LOAD_MAX, toRpm, toRad, steady, engine, step, liftNeeded };
})();

const P = (() => {
// The governor's parts in world mm: u right, v up, the spindle axis at u = 0 and the drive-shaft
// axis at v = 0. Each function draws one part into a view and returns SVG, so the main view and the
// details draw the same geometry at their own scale. Parts that move take the arm angle α (deg)
// and are redrawn each frame from the model's linkage; nothing is typed twice.



const part = (id, inner) => `<g data-part="${id}">${inner}</g>`;

const rad = (d) => (d * Math.PI) / 180;
const mirror = (pts) => K.flipU(pts, 0);
const atU = (pts, du) => K.move(pts, du, 0);

// A cut face that may have holes: the first loop is the outline, the rest are holes (reversed).
function cutHoles(V, loops, { mat = "steel", angle = 45 } = {}) {
  const dd = loops.map((p, i) => K.d(V, i ? [...p].reverse() : p)).join("");

// A forged link between two pins: eyes of radius R, a shank of half-width h, one outline.
function linkOutline(A, B, R, h) {
  const th = Math.atan2(B[1] - A[1], B[0] - A[0]) * (180 / Math.PI);

function pose(a) {

  const C = M.pinC(a);
  const psi = M.crankTurn(a);

  const G = M.pinG(a);

// ---------------------------------------------------------------- gear case and drive

const BASE_V = -84; // the case stands on the engine bed here
const VALVE_BASE = -72; // and the valve on a raised pad of the bed

function gearCase(V) {
  const upperLeft = [[-100, 16], [-76, 16], [-76, 84], [-12.5, 84], [-12.5, 160], [-26, 160], [-26, 104], [-32, 98], [-100, 98]];

function arms(V, P) {
  const [br, bv] = P.ball;
  const out = [1, -1].map((s) => K.body(V, linkOutline([s * M.OFFSET, M.VT], [s * br, bv], 8, 5.5))).join("");
  return part(12, out);
}

function links(V, P) {
  const [br, bv] = P.ball;
  const out = [1, -1].map((s) => K.body(V, linkOutline([s * br, bv], [s * M.OFFSET, P.lug], 7, 4.5))).join("");
  return part(14, out);
}

function balls(V, P, tint = true) {
  const [br, bv] = P.ball;
  let out = "";
  for (const s of [1, -1]) {
    const c = K.circle(s * br, bv, M.BALL_D / 2, 64);
    out += K.body(V, c);
    if (tint) out += `<path class="tint ball-tint" d="${K.d(V, c)}"/>`;
  }
  return part(13, out);
}

const ballPins = (V, P) => part(15, [1, -1].map((s) => pinEnd(V, [s * P.ball[0], P.ball[1]], 135) + pinEnd(V, [s * M.OFFSET, P.lug], 135)).join(""));

function sleeveLoop(lug) {
  const S = M.SLEEVE;
  return [
    [S.bore, lug + S.bot], [S.neckR - 1, lug + S.bot], [S.neckR, lug + S.bot + 1], [S.neckR, lug + S.grooveLo], [S.grooveR, lug + S.grooveLo], [S.grooveR, lug + S.grooveHi],
    [S.neckR, lug + S.grooveHi], [S.neckR, lug + S.bodyBot - 4], [S.neckR + 4, lug + S.bodyBot], [S.bodyR - 3, lug + S.bodyBot], [S.bodyR, lug + S.bodyBot + 3],
    [S.bodyR, lug + S.bodyTop - 3], [S.bodyR - 3, lug + S.bodyTop], [S.hubR, lug + S.bodyTop], [S.hubR, lug + S.top - 2], [S.hubR - 2, lug + S.top], [S.bore, lug + S.top],
  ];
}

function sleeve(V, P) {
  return part(16, K.section(V, { ...K.revolve(sleeveLoop(P.lug)), edges: [] }, { mat: "iron", angle: 45 }));
}

// The split swivel collar in the sleeve's groove; it does not turn. Its forked lug (two cheeks,
// in front of and behind the plane) carries pin C; the crank's slotted end runs between them,
// so the section cuts the ring and the crank, and shows the far cheek in outline.
function collar(V, P) {
  const v = P.lug;
  const lo = v + M.SLEEVE.grooveLo + 0.5;
  const hi = v + M.SLEEVE.grooveHi - 0.5;
  const c = P.C[1];
  const cheek = [[37, c - 6], [M.PIN_C_U, c - 6], ...K.arc(M.PIN_C_U, c, 6, -90, 90, 10).slice(1, -1), [M.PIN_C_U, c + 6], [37, c + 6]];
  const ring = [[20.5, lo], [37.5, lo], [39, lo + 1.5], [39, hi - 1.5], [37.5, hi], [20.5, hi]];
  return part(17, K.body(V, cheek) + K.cut(V, ring, { mat: "bronze", angle: 135 }) + K.cut(V, mirror(ring), { mat: "bronze", angle: 135 }));
}

const collarPin = (V, P) => part(15, pinEnd(V, P.C, 45));

// The bell crank, drawn level and turned by ψ about the fulcrum F. The long arm's slot takes pin C.
// One outline, anticlockwise: long arm underside, hub, short arm out to its eye, hub, long arm top.
function crankShape() {
  const [fu, fv] = M.F;
  const hw = 7; // long arm half-width
  const h2 = 6.5; // short arm half-width
  const R = 14; // hub
  const Re = 9; // eye at E
  const a2 = M.ARM2_AT;
  const d2 = [Math.cos(rad(a2)), Math.sin(rad(a2))];
  const E = [fu + M.ARM2 * d2[0], fv + M.ARM2 * d2[1]];
  const xh = Math.sqrt(R * R - h2 * h2);
  const bh = (Math.atan2(h2, xh) * 180) / Math.PI;
  const xe = Math.sqrt(Re * Re - h2 * h2);
  const be = (Math.atan2(h2, xe) * 180) / Math.PI;
  const ah = (Math.atan2(hw, Math.sqrt(R * R - hw * hw)) * 180) / Math.PI;
  const tip = fu - 138; // centre of the long arm's rounded end
  const outline = [
    [tip, fv - hw],
    ...K.arc(fu, fv, R, 180 + ah, a2 - bh, 6),
    ...K.arc(E[0], E[1], Re, a2 + 180 + be, a2 + 540 - be, 14),
    ...K.arc(fu, fv, R, a2 + bh, 540 - ah, 14),
    [tip, fv + hw],
    ...K.arc(tip, fv, hw, 90, 270, 8).slice(1, -1),
  ];
  const slot = [...K.arc(fu - 121, fv, 5.4, -90, 90, 6), ...K.arc(fu - 135, fv, 5.4, 90, 270, 6)];
  return { outline, slot, E };
}

function bellCrank(V, P) {
  const { outline, slot } = crankShape();
  const [fu, fv] = M.F;
  const turn = (pts) => pts.map(([u, v]) => {
    const c = Math.cos(P.psi);
    const s = Math.sin(P.psi);
    return [fu + (u - fu) * c - (v - fv) * s, fv + (u - fu) * s + (v - fv) * c];
  });
  return part(18, cutHoles(V, [turn(outline), turn(slot)], { mat: "iron", angle: 135 }));
}

const crankPins = (V, P) => part(15, pinEnd(V, M.F) + pinEnd(V, P.E) + pinEnd(V, P.G));

function valveLink(V, P) {
  return part(19, K.body(V, linkOutline(P.E, P.G, 8, 4.5)));
}

// ---------------------------------------------------------------- the throttle valve (axis u = UV)

const UV = M.UV;
const L = (pts) => atU(pts, UV);
const LM = (pts) => atU(mirror(pts), UV);

function valveBody(V) {
  const rLow = [[30, -72], [72, -72], [72, -62], [44, -62], [44, -44], [88, -44], [88, -70], [100, -70], [100, -30], [32, -30], [32, -40], [30, -40]];
  const rUp = [[100, 8], [34, 8], [34, 10], [36, 10], [36, 20], [40, 20], [40, 40], [72, 40], [72, 28], [50, 28], [50, 18], [88, 18], [88, 48], [100, 48]];
  const lIn = [[-34, 8], [-34, 10], [-36, 10], [-36, 20], [-50, 20], [-50, -46], [-30, -46], [-30, -40], [-32, -40], [-32, -30], [-44, -30], [-44, 8]];
  const lOut = [[-30, -72], [-72, -72], [-72, 40], [-40, 40], [-40, 34], [-62, 34], [-62, -56], [-30, -56]];
  const o = { mat: "iron", angle: 45 };
  return part(23, [rLow, rUp, lIn, lOut].map((p) => K.cut(V, L(p), o)).join(""));
}

function seatRings(V) {
  const lo = [[24, -40], [32, -40], [32, -30], [26.5, -30], [24, -32.5]];
  const hi = [[28, 10], [36, 10], [36, 20], [30.5, 20], [28, 17.5]];
  const o = { mat: "bronze", angle: 135 };
  return part(22, [lo, hi].map((p) => K.cut(V, L(p), o) + K.cut(V, LM(p), o)).join(""));
}

// The valve and its stem are drawn shut and lifted with the pose.
function valve(V, P) {
  const y = P.lift;
  const loop = [[8, -38], [23.5, -38], [23.5, -33], [24, -32.5], [26.5, -30], [26.5, -25], [14, -25], [14, 9], [27, 9], [27, 16.5], [30.5, 20], [30.5, 26], [8, 26]];
  const rev = K.revolve(loop.map(([r, s]) => [r, s + y]), { axis: "v", at: UV });
  return part(21, K.section(V, { ...rev, edges: [] }, { mat: "bronze", angle: 45 }));
}

function stem(V, P) {
  const y = P.lift;
  const g = M.PIN_G_SHUT + y;
  const rod = [[-8, -54], [8, -54], [8, g - 14], [10, g - 14], [10, g + 6], [8, g + 8], [-8, g + 8], [-10, g + 6], [-10, g - 14], [-8, g - 14]].map(([r, s]) => [UV + r, s + (s < g - 20 ? y : 0)]);
  const thread = K.lines(V, [[[UV - 6.6, -54 + y], [UV - 6.6, -36 + y]], [[UV + 6.6, -54 + y], [UV + 6.6, -36 + y]]], "thin");
  return part(20, K.body(V, rod) + thread + K.line(V, [[UV - 10, g - 5], [UV + 10, g - 5]], "thin"));
}

function stemNut(V, P) {
  const y = P.lift;
  const n = [[-12, -50], [12, -50], [12, -39], [11, -38], [-11, -38], [-12, -39]].map(([r, s]) => [UV + r, s + y]);
  return part(28, K.body(V, n) + K.lines(V, [[[UV - 6, -50 + y], [UV - 6, -38 + y]], [[UV + 6, -50 + y], [UV + 6, -38 + y]]], "thin"));
}

// The bonnet carries the stuffing box and, cast on, the post that holds the bell crank's fulcrum.
const POST = { r0: -46, r1: -28, top: 188 };
function bonnet(V) {
  const left = [[-8, 40], [-72, 40], [-72, 52], [POST.r0, 52], [POST.r0, POST.top], [POST.r1, POST.top], [POST.r1, 78], [-14, 78], [-14, 56], [-8, 56]];
  const right = [[8, 40], [72, 40], [72, 52], [30, 52], [30, 78], [14, 78], [14, 56], [8, 56]];
  const o = { mat: "iron", angle: 135 };
  // the post's two cheeks straddle the crank's hub; they lie behind the plane and show in outline
  const fr = M.F[0] - UV;
  const cheek = [[POST.r0, POST.top], [POST.r0, M.F[1]], ...K.arc(fr, M.F[1], 18.5, 180, 0, 16).slice(1), [fr + 18.5, M.F[1] - 6], [POST.r1 + 6, POST.top]];
  return part(24, K.cut(V, L(left), o) + K.cut(V, L(right), o) + K.body(V, L(cheek)));
}

function packing(V) {
  const ring = (s0) => [[8, s0], [14, s0], [14, s0 + 4], [8, s0 + 4]];
  return part(26, [56, 60, 64].map((s0) => K.cut(V, L(ring(s0)), { mat: "rubber" }) + K.cut(V, LM(ring(s0)), { mat: "rubber" })).join(""));
}

function gland(V) {
  const half = [[8.5, 68], [13.5, 68], [13.5, 78], [34, 78], [34, 84], [8.5, 84]];
  const o = { mat: "brass", angle: 45 };
  return part(25, K.cut(V, L(half), o) + K.cut(V, LM(half), o));
}

// Studs with their nuts: four on the bonnet flange (two in the plane), two on the gland.
function studs(V) {
  const one = (r, s0, s1, nut) => {
    const body = [[r - 4, s0], [r + 4, s0], [r + 4, s1 - 1], [r + 3, s1], [r - 3, s1], [r - 4, s1 - 1]];
    const n = [[r - 6.5, nut], [r + 6.5, nut], [r + 6.5, nut + 6], [r + 5.5, nut + 6.6], [r - 5.5, nut + 6.6], [r - 6.5, nut + 6]];
    return K.body(V, L(body)) + K.body(V, L(n));
  };
  return part(27, one(-66, 30, 62, 52) + one(66, 30, 62, 52) + one(-23, 70, 93, 84) + one(23, 70, 93, 84));
}

// ---------------------------------------------------------------- phantoms and adjacent parts

// The flying parts at full speed (α = 45°), as phantom lines: the other extreme of travel.
function phantomTop(V) {
  const P = pose(M.ALPHA_MAX);
  const [br, bv] = P.ball;
  let out = "";
  for (const s of [1, -1]) {
    out += K.line(V, K.circle(s * br, bv, M.BALL_D / 2, 64), "phan", true);
    out += K.line(V, [[s * M.OFFSET, M.VT], [s * br, bv], [s * M.OFFSET, P.lug]], "phan");
  }
  const sl = K.revolve(sleeveLoop(P.lug));
  out += K.line(V, [...sl.cuts[0]].filter(([u]) => u >= 20), "phan");
  out += K.line(V, [...sl.cuts[1]].filter(([u]) => u <= -20), "phan");
  return out;
}

// The engine bed under the case and the valve, and the steam pipe at the inlet: adjacent parts.
function adjacent(V) {
  const vb = VALVE_BASE;
  const bed = [[-150, BASE_V], [110, BASE_V], [110, vb], [UV - 30, vb], [UV - 30, BASE_V - 14], [-150, BASE_V - 14]];
  const bed2 = [[UV + 30, BASE_V - 14], [UV + 30, vb], [UV + 84, vb], [UV + 84, BASE_V - 14]];
  const pipe = [[UV + 100, -70], [UV + 112, -70], [UV + 112, -41], [UV + 124, -41]];
  const pipe2 = [[UV + 100, 48], [UV + 112, 48], [UV + 112, 19], [UV + 124, 19]];
  return K.line(V, bed, "phan") + K.line(V, bed2, "phan") + K.line(V, pipe, "phan") + K.line(V, pipe2, "phan");
}

// ---------------------------------------------------------------- VIEW D: the head and balls from above

function planView(V, P, theta) {
  const [br] = P.ball;
  let out = K.line(V, K.circle(0, 0, M.SLEEVE.bodyR, 64), "vis", true);
  const dirs = [theta, theta + Math.PI];
  let armsSvg = "";
  let ballsSvg = "";
  for (const t of dirs) {
    const c = Math.cos(t);
    const s = Math.sin(t);
    armsSvg += K.body(V, linkOutline([M.OFFSET * c, M.OFFSET * s], [br * c, br * s], 8, 6));
    const ball = K.circle(br * c, br * s, M.BALL_D / 2, 64);
    ballsSvg += K.body(V, ball) + `<path class="tint ball-tint" d="${K.d(V, ball)}"/>`;
  }
  const lugs = dirs
    .map((t) => {
      const c = Math.cos(t);
      const s = Math.sin(t);
      const q = (x, y) => [x * c - y * s, x * s + y * c];
      return K.body(V, [q(10, -8), q(31, -8), q(31, 8), q(10, 8)]);
    })
    .join("");
  const hex = Array.from({ length: 6 }, (_, i) => {
    const t = theta + (i * Math.PI) / 3 + Math.PI / 6;
    return [17.3 * Math.cos(t), 17.3 * Math.sin(t)];
  });
  out += part(12, armsSvg) + part(13, ballsSvg) + part(10, lugs + K.body(V, K.circle(0, 0, 17, 32))) + part(11, K.body(V, hex) + K.line(V, K.circle(0, 0, 15, 32), "thin", true));
  return out;
}

  const midY = (CH1.y0 + CH1.y1) / 2;
  labels += `<text class="t t-sm t-mute" x="${(CH1.x0 + CH1.x1) / 2}" y="${CH1.y1 + 24}" text-anchor="middle">ENGINE SPEED n, rpm</text>`;
  labels += `<text class="t t-sm t-mute" x="${CH1.x0 - 31}" y="${midY}" text-anchor="middle" transform="rotate(-90 ${CH1.x0 - 31} ${midY})">SLEEVE LIFT x, mm</text>`;
  const sL = M.steady(M.LOAD_LIGHT);
  const sH = M.steady(M.LOAD_HEAVY);
  const tag = (s, txt, dy) => {
    const n = M.toRpm(s.omega);
    return `<text class="t t-sm t-mute" x="${K.r2(c1x(CH1.n0) + 4)}" y="${K.r2(c1y(M.sleeveLift(s.alpha)) + dy)}">${txt}</text>`;
  };
  return (
    `<g data-role="chart"><rect class="paper" x="${CH1.x0}" y="${CH1.y0}" width="${CH1.x1 - CH1.x0}" height="${CH1.y1 - CH1.y0}"/>` +
    `<path class="thin grid-line" d="${grid}"/>` +
    `<polyline class="hid" points="${engineLine(M.LOAD_LIGHT)}"/>` +
    `<polyline class="hid" points="${engineLine(M.LOAD_HEAVY)}"/>` +
    `<polyline id="c1-load" class="thin" points="${engineLine(M.LOAD_LIGHT)}"/>` +
    `<polyline class="vis" points="${governorCurve()}"/>` +
    `<polyline id="c1-trail" class="thin accent" points=""/>` +
    `<circle id="c1-dot" class="accent-fill" cx="${c1x(M.toRpm(sL.omega))}" cy="${c1y(M.sleeveLift(sL.alpha))}" r="2.8"/>` +
    tag(sL, `${M.LOAD_LIGHT} N·m`, -3) +
    tag(sH, `${M.LOAD_HEAVY} N·m`, 9) +
    `<rect class="vis" x="${CH1.x0}" y="${CH1.y0}" width="${CH1.x1 - CH1.x0}" height="${CH1.y1 - CH1.y0}"/>` +
    labels +
    `</g>` +
    K.viewLabel((CH1.x0 + CH1.x1) / 2, CH1.y1 + 46, "DIAGRAM 1", "SOLID: GOVERNOR · DASHED: ENGINE AT LOAD · ACCENT: NOW")
  );
}

// ---------------------------------------------------------------- DIAGRAM 2: the last 16 s
const CH2 = { x0: 80, x1: 438, y0: 656, y1: 746, span: 16, n0: 106, n1: 126, l1: 2000 };
const c2x = (age) => K.r2(CH2.x1 - (age / CH2.span) * (CH2.x1 - CH2.x0));
const c2n = (n) => K.r2(CH2.y1 - ((Math.min(CH2.n1, Math.max(CH2.n0, n)) - CH2.n0) / (CH2.n1 - CH2.n0)) * (CH2.y1 - CH2.y0));
const c2f = (f) => K.r2(CH2.y1 - Math.min(1, Math.max(0, f)) * (CH2.y1 - CH2.y0));

function chart2() {
  let grid = "";
  let labels = "";
  for (let i = 0; i <= 5; i++) {
    const y = K.r2(CH2.y1 - (i / 5) * (CH2.y1 - CH2.y0));
    grid += `M${CH2.x0} ${y}H${CH2.x1}`;
    labels += `<text class="t t-sm" x="${CH2.x0 - 11}" y="${K.r2(y + 2.7)}" text-anchor="end">${CH2.n0 + (i * (CH2.n1 - CH2.n0)) / 5}</text>`;
    labels += `<text class="t t-sm" x="${CH2.x1 + 11}" y="${K.r2(y + 2.7)}">${i * 20}</text>`;
  }
  for (let age = 0; age <= CH2.span; age += 4) {
    grid += `M${c2x(age)} ${CH2.y0}V${CH2.y1}`;
    labels += `<text class="t t-sm" x="${c2x(age)}" y="${CH2.y1 + 11}" text-anchor="middle">${age ? -age : "NOW"}</text>`;
  }
  const midY = (CH2.y0 + CH2.y1) / 2;
  labels += `<text class="t t-sm t-mute" x="${(CH2.x0 + CH2.x1) / 2}" y="${CH2.y1 + 24}" text-anchor="middle">TIME, s</text>`;
  labels += `<text class="t t-sm t-mute" x="${CH2.x0 - 36}" y="${midY}" text-anchor="middle" transform="rotate(-90 ${CH2.x0 - 36} ${midY})">ENGINE n, rpm</text>`;
  labels += `<text class="t t-sm t-mute" x="${CH2.x1 + 34}" y="${midY}" text-anchor="middle" transform="rotate(90 ${CH2.x1 + 34} ${midY})">VALVE f, %</text>`;
  return (
    `<g data-role="chart"><rect class="paper" x="${CH2.x0}" y="${CH2.y0}" width="${CH2.x1 - CH2.x0}" height="${CH2.y1 - CH2.y0}"/>` +
    `<path class="thin grid-line" d="${grid}"/>` +
    `<polyline id="c2-load" class="hid" points=""/>` +
    `<polyline id="c2-f" class="thin" points=""/>` +
    `<polyline id="c2-n" class="vis accent" points=""/>` +
    `<rect class="vis" x="${CH2.x0}" y="${CH2.y0}" width="${CH2.x1 - CH2.x0}" height="${CH2.y1 - CH2.y0}"/>` +
    labels +
    `</g>` +
    K.viewLabel((CH2.x0 + CH2.x1) / 2, CH2.y1 + 46, "DIAGRAM 2", "ACCENT: ENGINE SPEED · THIN: VALVE OPENING · DASHED: LOAD, 100 = 2000 N·m")
  );
}

return { BOX, VIEWS, MARK, LABEL_D, moving, dimH, dimX, balloonsMain, balloonsMainMoving, balloonsB, balloonsC, balloonsD, CH1, c1x, c1y, governorCurve, engineLine, chart1, CH2, c2x, c2n, c2f, chart2 };
})();

// Page code for governor.html. K (kit), L (runtime), C (self-check), M (model), P (parts) and
// X (sheet plan) are inlined above this script as namespaces.

const svg = document.querySelector(".bp-sheet");
const q = L.setupPage(svg);
const specs = JSON.parse(svg.dataset.views);
const VM = K.view(specs.main);
const VB = K.view(specs.B);
const VC = K.view(specs.C);
const VD = K.view(specs.D);
const $ = (id) => document.getElementById(id);

const el = {
  mv: [["main", VM], ["B", VB], ["C", VC]].map(([id, V]) => [$(`mv-${id}`), V]),
  mvbMain: $("mvb-main"),
  mvbC: $("mvb-C"),
  plan: $("plan"),
  orbit: $("orbit"),
  dimH: $("dim-h-wrap"),
  dimX: $("dim-x-wrap"),
  c1Load: $("c1-load"),
  c1Trail: $("c1-trail"),
  c1Dot: $("c1-dot"),
  c2n: $("c2-n"),
  c2f: $("c2-f"),
  c2load: $("c2-load"),
  readout: $("readout"),
};
const say = L.announcer($("sr"), 2);

// ---------------------------------------------------------------- state
const eng = M.engine(M.LOAD_LIGHT);
let load = M.LOAD_LIGHT; // what the shaft is asked to carry now
let userLoad = M.LOAD_LIGHT;
let theta = 0.4; // spindle angle, for VIEW D (shown at 1/20 speed)
let dragging = false;
const SAMPLE = 0.05;
let sinceSample = 0;
const hist = []; // [n, f, load], oldest first, one every SAMPLE s
for (let i = 0; i < X.CH2.span / SAMPLE; i++) hist.push([M.toRpm(eng.omega), eng.f, load]);
const trail = [];
let steadyFor = -1;
let steadyAt = null;

// The tour: light load, a step to heavy at 2 s, back to light at 10 s, every 16 s.
const PERIOD = 16;
const tourLoad = (t) => {
  const p = t % PERIOD;
  return p >= 2 && p < 10 ? M.LOAD_HEAVY : M.LOAD_LIGHT;
};

// ---------------------------------------------------------------- step and render
function step(dt, live) {
  const n = Math.max(1, Math.ceil(dt * 480));
  const h = dt / n;
  for (let i = 0; i < n; i++) {
    load = live.touring && !dragging ? tourLoad(live.clock) : userLoad;
    M.step(eng, h, load);
    theta += (M.RATIO * eng.omega * h) / 20;
    sinceSample += h;
    if (sinceSample >= SAMPLE) {
      sinceSample -= SAMPLE;
      hist.push([M.toRpm(eng.omega), eng.f, load]);
      if (hist.length > X.CH2.span / SAMPLE) hist.shift();
      trail.push([M.toRpm(eng.omega), M.sleeveLift(eng.alpha)]);
      if (trail.length > 80) trail.shift();
    }
  }
  if (!live.touring) userLoad = load;
  if (load !== steadyFor) {
    steadyFor = load;
    steadyAt = M.steady(load);
  }
  const s = steadyAt;
  return Math.abs(eng.omega - s.omega) > 1e-4 || Math.abs(eng.alpha - s.alpha) > 1e-4;
}

let shownA = -1;
let shownLoad = -1;

function render(live) {
  const Q = P.pose(eng.alpha);
  if (Math.abs(eng.alpha - shownA) > 0.004) {
    for (const [node, V] of el.mv) node.innerHTML = X.moving(V, Q);
    el.mvbMain.innerHTML = X.balloonsMainMoving(VM, Q);
    el.mvbC.innerHTML = X.balloonsC(VC, Q);
    el.dimH.innerHTML = X.dimH(VM, Q);
    el.dimX.innerHTML = X.dimX(VM, Q);
    el.orbit.innerHTML = K.line(VD, K.circle(0, 0, Q.ball[0], 96), "ctr", true);
    shownA = eng.alpha;
  }
  el.plan.innerHTML = P.planView(VD, Q, theta);
  if (load !== shownLoad) {
    el.c1Load.setAttribute("points", X.engineLine(load));
    shownLoad = load;
  }
  const n = M.toRpm(eng.omega);
  const x = M.sleeveLift(eng.alpha);
  el.c1Dot.setAttribute("cx", X.c1x(Math.min(X.CH1.n1, Math.max(X.CH1.n0, n))));
  el.c1Dot.setAttribute("cy", X.c1y(x));
  el.c1Trail.setAttribute("points", trail.map(([tn, tx]) => `${X.c1x(Math.min(X.CH1.n1, Math.max(X.CH1.n0, tn)))},${X.c1y(tx)}`).join(" "));
  const last = hist.length - 1;
  const at = (i) => X.c2x((last - i) * SAMPLE);
  el.c2n.setAttribute("points", hist.map(([hn], i) => `${at(i)},${X.c2n(hn)}`).join(" "));
  el.c2f.setAttribute("points", hist.map(([, hf], i) => `${at(i)},${X.c2f(hf)}`).join(" "));
  el.c2load.setAttribute("points", hist.map(([, , hl], i) => `${at(i)},${X.c2f(hl / X.CH2.l1)}`).join(" "));
  const lift = M.valveLift(eng.alpha);
  el.readout.textContent = `n ${n.toFixed(1)} rpm · x ${x.toFixed(1)} mm · VALVE ${lift.toFixed(1)} mm (${Math.round(eng.f * 100)} %) · LOAD ${Math.round(load)} N·m`;
  say(`Engine ${n.toFixed(1)} rpm, sleeve lift ${x.toFixed(0)} millimetres, valve ${Math.round(eng.f * 100)} percent open, load ${Math.round(load)} newton metres.`, live.clock);
}

// ---------------------------------------------------------------- input
const live = L.run({
  root: svg,
  step,
  render,
  idleAfter: 6,
  onFrozen: () => q.check && C.selfCheck(svg),
});

if (live.reduced && !live.frozen) {
  // A still, true moment: the tour played to 9 s (heavy load, settled), drawn once.
  const fake = { touring: true, reduced: false, clock: 0 };
  for (let t = 0; t < 9; t += 1 / 240) {
    fake.clock = t;
    step(1 / 240, fake);
  }
  render(live);
}

const clampLoad = (v) => Math.min(M.LOAD_MAX, Math.max(M.LOAD_MIN, v));
for (const hit of svg.querySelectorAll("[data-drag]")) {
  let l0 = 0;
  L.dragY(svg, hit, {
    start: () => {
      dragging = true;
      l0 = load;
      userLoad = load;
      live.input();
    },
    move: (dy) => {
      userLoad = clampLoad(l0 - dy * 5);
      live.input();
    },
    end: () => {
      dragging = false;
      live.input();
    },
  });
}

svg.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === "ArrowUp" || k === "ArrowDown") userLoad = clampLoad(load + (k === "ArrowUp" ? 100 : -100));
  else if (k === " ") userLoad = load > (M.LOAD_LIGHT + M.LOAD_HEAVY) / 2 ? M.LOAD_LIGHT : M.LOAD_HEAVY;
  else if (k === "s" || k === "S") live.slow = live.slow === 1 ? 0.25 : live.slow === 0.25 ? 0.06 : 1;
  else return;
  e.preventDefault();
  live.input();
});

if (q.check && !live.frozen) setTimeout(() => C.selfCheck(svg), 400);

</script>
</body>
</html>
