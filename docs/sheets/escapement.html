const K = (() => {
// Blueprint drafting kit: orthographic views, sections, hatching, dimensions and sheet furniture.
// Every function here is pure and returns SVG markup strings, so the same code runs in the build
// and, inlined, in the page (live dimensions, moving springs, needles).
//
// Units. World geometry is in millimetres of the real object: u to the right, v up (a front view),
// or u right, v away from the viewer (a plan view). The sheet is an A2 drawing, 594 mm wide, drawn
// 1200 units wide; a view maps world mm to sheet units through its drawing scale.

const SHEET = { w: 1200, h: 848 };
const PX_PER_MM = SHEET.w / 594;

// ISO 128 line widths and ISO 3098 lettering, in sheet units (A2: 0.5 / 0.25 mm lines, 3.5 mm text).
const THICK = 1.15;
const THIN = 0.55;
const TEXT = 9.5;
const ARROW = 7;
const GAP = 2.2; // extension lines start this far from the object
const OVER = 3.5; // and run this far past the dimension line

const r2 = (n) => Math.round(n * 100) / 100;

function fmt(n, digits = 1) {
  const near = Math.round(n);
  if (Math.abs(n - near) < 0.05) return String(near);
  return n.toFixed(digits);
}

// ---------------------------------------------------------------- views

// A view is a window from world mm onto the sheet. scale is the drawing scale (1/2.5 for "1:2.5").
function view({ x, y, scale, name = "" }) {
  const k = scale * PX_PER_MM;
  return { x, y, scale, k, name, p: ([u, v]) => [r2(x + u * k), r2(y - v * k)] };
}

const scaleLabel = (scale) => (scale >= 1 ? `${fmt(scale)}:1` : `1:${fmt(1 / scale)}`);

function d(V, pts, closed = true) {
  let out = "";
  for (let i = 0; i < pts.length; i++) {
    const [x, y] = V.p(pts[i]);
    out += `${i ? "L" : "M"}${x} ${y}`;
  }
  return closed ? out + "Z" : out;
}

// ---------------------------------------------------------------- world geometry (point lists)

const rect = (u0, v0, u1, v1) => [[u0, v0], [u1, v0], [u1, v1], [u0, v1]];

function arc(cu, cv, r, a0, a1, steps) {
  const n = steps ?? Math.max(3, Math.ceil(Math.abs(a1 - a0) / 7.5));
  const out = [];
  for (let i = 0; i <= n; i++) {
    const a = ((a0 + ((a1 - a0) * i) / n) * Math.PI) / 180;
    out.push([cu + r * Math.cos(a), cv + r * Math.sin(a)]);
  }
  return out;
}

const circle = (cu, cv, r, steps = 48) => arc(cu, cv, r, 0, 360 - 360 / steps, steps - 1);

// A rectangle with filleted corners.
function rrect(u0, v0, u1, v1, r, steps = 4) {
  const q = Math.min(r, (u1 - u0) / 2, (v1 - v0) / 2);
  return [
    ...arc(u1 - q, v0 + q, q, -90, 0, steps),
    ...arc(u1 - q, v1 - q, q, 0, 90, steps),
    ...arc(u0 + q, v1 - q, q, 90, 180, steps),
    ...arc(u0 + q, v0 + q, q, 180, 270, steps),
  ];
}

const move = (pts, du, dv) => pts.map(([u, v]) => [u + du, v + dv]);
const flipU = (pts, about = 0) => pts.map(([u, v]) => [2 * about - u, v]).reverse();
const flipV = (pts, about = 0) => pts.map(([u, v]) => [u, 2 * about - v]).reverse();

function inside([u, v], poly) {
  let hit = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [ui, vi] = poly[i];
    const [uj, vj] = poly[j];
    if (vi > v !== vj > v && u < ((uj - ui) * (v - vi)) / (vj - vi) + ui) hit = !hit;
  }
  return hit;
}

// A body of revolution cut through its axis.
// loop is the half-profile as [r, s] pairs: r >= 0 measured from the axis, s along the axis.
// axis "v" is a vertical axis at u = at; axis "u" a horizontal axis at v = at.
// Returns the cut faces (hatched) and the edges seen through the bore behind the cutting plane:
// every circle on an inner surface shows edge-on as a straight line across the bore.
function revolve(loop, { axis = "v", at = 0 } = {}) {
  const place = axis === "v" ? (r, s) => [at + r, s] : (r, s) => [s, at + r];
  const n = loop.length;
  const onAxis = loop.findIndex(([r], i) => r === 0 && loop[(i + 1) % n][0] === 0);
  let cuts;
  if (onAxis >= 0) {
    const chain = Array.from({ length: n }, (_, j) => loop[(onAxis + 1 + j) % n]);
    const right = chain.map(([r, s]) => place(r, s));
    const left = chain.slice(1, -1).reverse().map(([r, s]) => place(-r, s));
    cuts = [[...right, ...left]];
  } else {
    cuts = [loop.map(([r, s]) => place(r, s)), loop.map(([r, s]) => place(-r, s)).reverse()];
  }
  const eps = 1e-3;
  const across = new Map();
  const clear = (r, s) => [0.02, 0.25, 0.5, 0.75, 0.98].every((t) => !inside([t * r, s], loop));
  for (const [r, s] of loop) {
    if (r <= 0) continue;
    if (clear(r, s + eps) && clear(r, s - eps)) across.set(s, Math.max(across.get(s) ?? 0, r));
  }
  const edges = [...across].map(([s, r]) => [place(-r, s), place(r, s)]);
  return { cuts, edges };
}

// ---------------------------------------------------------------- hatching

// ANSI/ISO-style material hatches. Spacing is in sheet units and never scales with the view,
// so a detail at 2:1 shows the same density as the main view, as on a real drawing.
const MATERIALS = {
  steel: { kind: "lines", gap: 3.4 },
  iron: { kind: "lines", gap: 5.6 },
  alu: { kind: "pairs", gap: 5.2, pair: 1.5 },
  brass: { kind: "dashed", gap: 4.6 },
  bronze: { kind: "dashed", gap: 3.6 },
  rubber: { kind: "cross", gap: 3.2 },
  plastic: { kind: "lines", gap: 2.3 },
  foam: { kind: "dots", gap: 2.6 },
  wood: { kind: "grain", gap: 4 },
};
const ANGLES = [45, 135, 30, 60];

function hatchDefs() {
  let out = "";
  for (const [name, m] of Object.entries(MATERIALS)) {
    for (const angle of ANGLES) {
      const g = m.gap;
      let body = "";
      if (m.kind === "lines") body = `<path class="hl" d="M0 -1V${g + 1}"/>`;
      if (m.kind === "pairs") body = `<path class="hl" d="M0 -1V${g + 1}M${m.pair} -1V${g + 1}"/>`;
      if (m.kind === "dashed") body = `<path class="hl" d="M0 -1V${g + 1}"/><path class="hl hl-dash" d="M${g / 2} -1V${g + 1}"/>`;
      if (m.kind === "cross") body = `<path class="hl" d="M0 -1V${g + 1}M-1 0H${g + 1}"/>`;
      if (m.kind === "dots") body = `<circle class="hd" cx="${g / 2}" cy="${g / 2}" r="0.42"/>`;
      if (m.kind === "grain") body = `<path class="hl" d="M0 -1V${g + 1}"/><path class="hl" d="M${g * 0.55} -1C${g * 0.75} ${g * 0.3} ${g * 0.35} ${g * 0.7} ${g * 0.55} ${g + 1}"/>`;
      out += `<pattern id="h-${name}-${angle}" patternUnits="userSpaceOnUse" width="${g}" height="${g}" patternTransform="rotate(${angle})">${body}</pattern>`;
    }
  }
  return out;
}

// ---------------------------------------------------------------- drawing parts

// A cut face: paper underneath (it hides what is behind), the material hatch, a thick outline.
// mat "solid" blacks the section in, the ISO convention for sections too thin to hatch.
function cut(V, pts, { mat = "steel", angle = 45 } = {}) {
  const dd = d(V, pts);
  if (mat === "solid") return `<path class="solid" d="${dd}"/>`;
  return `<path class="paper" d="${dd}"/><path fill="url(#h-${mat}-${angle})" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

// A body of revolution in section, with the edges behind the cut.
function section(V, rev, opts) {
  return rev.cuts.map((c) => cut(V, c, opts)).join("") + rev.edges.map((e) => line(V, e)).join("");
}

// An unsectioned solid (shafts, rods, pins, balls, nuts and ribs are never hatched in a section).
function body(V, pts) {
  const dd = d(V, pts);
  return `<path class="paper" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

const line = (V, pts, cls = "vis", closed = false) => `<path class="${cls}" d="${d(V, pts, closed)}"/>`;
const lines = (V, list, cls = "vis") => `<path class="${cls}" d="${list.map((pts) => d(V, pts, false)).join("")}"/>`;

// A centre line, run a little past the outline at both ends.
function centerline(V, a, b, over = 6) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  return `<path class="ctr" d="M${r2(ax - ux * over)} ${r2(ay - uy * over)}L${r2(bx + ux * over)} ${r2(by + uy * over)}"/>`;
}

// Centre mark for a circle in a view: two crossed centre lines.
function centerMark(V, [cu, cv], r, over = 5) {
  return centerline(V, [cu - r, cv], [cu + r, cv], over) + centerline(V, [cu, cv - r], [cu, cv + r], over);
}

// A compression spring cut along its axis: wire sections (blacked in) on both sides, half a pitch
// apart, joined by the back half of each turn. from/to are positions along the axis.
function springSection(V, { from, to, radius, wire, turns, axis = "u", at = 0 }) {
  const place = axis === "u" ? (s, r) => [s, at + r] : (s, r) => [at + r, s];
  const pitch = (to - from - wire) / turns;
  const start = from + wire / 2;
  const back = [];
  let sections = "";
  for (let i = 0; i <= turns; i++) {
    const sTop = start + i * pitch;
    sections += cut(V, circle(...place(sTop, radius), wire / 2, 12), { mat: "solid" });
    if (i < turns) {
      const sBot = sTop + pitch / 2;
      sections += cut(V, circle(...place(sBot, -radius), wire / 2, 12), { mat: "solid" });
      back.push([place(sTop, radius), place(sBot, -radius)]);
    }
  }
  return lines(V, back, "vis spring") + sections;
}

// ---------------------------------------------------------------- annotation

function arrowHead([x, y], [dx, dy]) {
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len;
  const uy = dy / len;
  const bx = x - ux * ARROW;
  const by = y - uy * ARROW;
  const half = ARROW * 0.25;
  return `M${r2(x)} ${r2(y)}L${r2(bx - uy * half)} ${r2(by + ux * half)}L${r2(bx + uy * half)} ${r2(by - ux * half)}Z`;
}

const textWidth = (s, size = TEXT) => String(s).length * size * 0.6;

// A linear dimension between two world points, measured along dir ("h" or "v").
// off is the sheet distance from point a to the dimension line (negative: up or left).
// The value is measured from the geometry unless text is given, so a dimension cannot lie.
function dim(V, a, b, { dir = "h", off = 18, text, prefix = "", suffix = "", id = "", cls = "" } = {}) {
  const A = V.p(a);
  const B = V.p(b);
  const value = text ?? prefix + fmt(Math.abs(dir === "h" ? b[0] - a[0] : b[1] - a[1])) + suffix;
  const h = dir === "h";
  const main = h ? 0 : 1; // the axis the dimension measures along
  const side = 1 - main;
  const at = A[side] + off; // where the dimension line sits
  const pt = (m, s) => (h ? [m, s] : [s, m]);
  let ext = "";
  for (const P of [A, B]) {
    const gapTo = at - P[side];
    if (Math.abs(gapTo) <= GAP) continue;
    const sgn = Math.sign(gapTo);
    const [x1, y1] = pt(P[main], P[side] + sgn * GAP);
    const [x2, y2] = pt(P[main], at + sgn * OVER);
    ext += `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
  }
  const lo = Math.min(A[main], B[main]);
  const hi = Math.max(A[main], B[main]);
  const span = hi - lo;
  const tw = textWidth(value);
  const arrowsIn = span >= ARROW * 2 + 3;
  const textIn = span >= tw + ARROW * 2 + 6;
  let lineD;
  let heads;
  let tm; // text position along the measured axis
  let anchor = "middle";
  if (arrowsIn) {
    const [x1, y1] = pt(lo, at);
    const [x2, y2] = pt(hi, at);
    lineD = `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
    heads = arrowHead(pt(lo, at), pt(-1, 0)) + arrowHead(pt(hi, at), pt(1, 0));
  } else {
    const [x1, y1] = pt(lo - ARROW - 7, at);
    const [x2, y2] = pt(hi + ARROW + 7, at);
    lineD = `M${r2(x1)} ${r2(y1)}L${r2(x2)} ${r2(y2)}`;
    heads = arrowHead(pt(lo, at), pt(1, 0)) + arrowHead(pt(hi, at), pt(-1, 0));
  }
  if (textIn) tm = (lo + hi) / 2;
  else {
    tm = hi + ARROW + 10 + tw / 2;
    const [x2, y2] = pt(tm + tw / 2, at);
    lineD += `L${r2(x2)} ${r2(y2)}`;
  }
  // ISO: text sits just above a horizontal line and reads from the right on a vertical one.
  const [tx, ty] = pt(tm, at - 3);
  const textEl = h
    ? `<text class="t" x="${r2(tx)}" y="${r2(ty)}" text-anchor="${anchor}">${value}</text>`
    : `<text class="t" x="${r2(tx)}" y="${r2(ty)}" text-anchor="${anchor}" transform="rotate(-90 ${r2(tx)} ${r2(ty)})">${value}</text>`;
  return `<g data-role="dim"${id ? ` id="${id}"` : ""}${cls ? ` class="${cls}"` : ""}><path class="thin" d="${ext}${lineD}"/><path class="head" d="${heads}"/>${textEl}</g>`;
}

// A part balloon: a dot on the part, a thin leader, a circled item number.
function balloon(V, at, [bx, by], n, { target = "", r = 8.5 } = {}) {
  const [ax, ay] = V.p(at);
  const a = Math.atan2(ay - by, ax - bx);
  const ex = r2(bx + r * Math.cos(a));
  const ey = r2(by + r * Math.sin(a));
  return (
    `<g data-role="balloon" data-target="${target}" data-at="${ax} ${ay}">` +
    `<path class="thin" d="M${ex} ${ey}L${ax} ${ay}"/><circle class="dot" cx="${ax}" cy="${ay}" r="1.5"/>` +
    `<circle class="balloon" cx="${bx}" cy="${by}" r="${r}"/>` +
    `<text class="t" x="${bx}" y="${r2(by + 3.3)}" text-anchor="middle">${n}</text></g>`
  );
}

// A view title: SECTION A-A over its scale, centred under the view.
function viewLabel(x, y, title, sub = "") {
  return (
    `<g data-role="label"><text class="t t-lg" x="${x}" y="${y}" text-anchor="middle">${title}</text>` +
    (sub ? `<text class="t t-sm" x="${x}" y="${y + 12}" text-anchor="middle">${sub}</text>` : "") +
    `</g>`
  );
}

// The circle that marks a detail in its parent view, with its letter.
function detailMark(V, [cu, cv], r, letter, angle = 45) {
  const [x, y] = V.p([cu, cv]);
  const R = r * V.k;
  const a = (-angle * Math.PI) / 180;
  const lx = r2(x + (R + 9) * Math.cos(a));
  const ly = r2(y + (R + 9) * Math.sin(a) + 4);
  return `<g data-role="label"><circle class="thin mark" cx="${x}" cy="${y}" r="${r2(R)}"/><text class="t t-lg" x="${lx}" y="${ly}" text-anchor="middle">${letter}</text></g>`;
}

// A viewing-direction arrow (VIEW C): a thick-tipped arrow pointing at the surface, with its letter.
function viewArrow(V, at, [dx, dy], letter, len = 26) {
  const [x, y] = V.p(at);
  const n = Math.hypot(dx, dy) || 1;
  const ux = dx / n;
  const uy = dy / n;
  const sx = r2(x - ux * len);
  const sy = r2(y - uy * len);
  return (
    `<g data-role="label"><path class="vis" d="M${sx} ${sy}L${r2(x - ux * ARROW)} ${r2(y - uy * ARROW)}"/>` +
    `<path class="head" d="${arrowHead([x, y], [ux, uy])}"/>` +
    `<text class="t t-lg" x="${r2(sx - uy * 10)}" y="${r2(sy + ux * 10 + 4)}" text-anchor="middle">${letter}</text></g>`
  );
}

// A long-break line across a part (thin, with one zigzag), for parts that run out of the view.
function breakLine(V, a, b) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const mx = (ax + bx) / 2;
  const my = (ay + by) / 2;
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const ux = (bx - ax) / len;
  const uy = (by - ay) / len;
  const z = 3.5;
  const p = (t, s) => `${r2(mx + ux * t - uy * s)} ${r2(my + uy * t + ux * s)}`;
  return `<path class="thin" d="M${r2(ax - ux * 4)} ${r2(ay - uy * 4)}L${p(-z, 0)}L${p(-z / 2, z * 1.6)}L${p(z / 2, -z * 1.6)}L${p(z, 0)}L${r2(bx + ux * 4)} ${r2(by + uy * 4)}"/>`;
}

// ---------------------------------------------------------------- sheet furniture

// The drawing frame: trimmed edge, a thick border, zone references and centring marks.
function frame({ w = SHEET.w, h = SHEET.h, trim = 8, m = 24, cols = 8, rows = 6 } = {}) {
  let out = `<g data-role="frame"><rect class="thin" x="${trim}" y="${trim}" width="${w - trim * 2}" height="${h - trim * 2}"/>`;
  out += `<rect class="vis" x="${m}" y="${m}" width="${w - m * 2}" height="${h - m * 2}"/>`;
  const cw = (w - m * 2) / cols;
  const rh = (h - m * 2) / rows;
  let ticks = "";
  let labels = "";
  for (let i = 0; i <= cols; i++) {
    const x = r2(m + i * cw);
    if (i > 0 && i < cols) ticks += `M${x} ${trim}V${m}M${x} ${h - m}V${h - trim}`;
    if (i < cols) {
      const cx = r2(m + (i + 0.5) * cw);
      labels += `<text class="t t-sm" x="${cx}" y="${r2((trim + m) / 2 + 3)}" text-anchor="middle">${i + 1}</text>`;
      labels += `<text class="t t-sm" x="${cx}" y="${r2(h - (trim + m) / 2 + 3)}" text-anchor="middle">${i + 1}</text>`;
    }
  }
  for (let j = 0; j <= rows; j++) {
    const y = r2(m + j * rh);
    if (j > 0 && j < rows) ticks += `M${trim} ${y}H${m}M${w - m} ${y}H${w - trim}`;
    if (j < rows) {
      const cy = r2(m + (j + 0.5) * rh + 3);
      const letter = String.fromCharCode(65 + j);
      labels += `<text class="t t-sm" x="${r2((trim + m) / 2)}" y="${cy}" text-anchor="middle">${letter}</text>`;
      labels += `<text class="t t-sm" x="${r2(w - (trim + m) / 2)}" y="${cy}" text-anchor="middle">${letter}</text>`;
    }
  }
  const cm = `M${w / 2} ${trim}V${m + 10}M${w / 2} ${h - trim}V${h - m - 10}M${trim} ${h / 2}H${m + 10}M${w - trim} ${h / 2}H${w - m - 10}`;
  out += `<path class="thin" d="${ticks}"/><path class="vis" d="${cm}"/>${labels}</g>`;
  return out;
}

// A ruled table (parts list). cols: [{ w, align, title }]. rows: arrays of cell strings.
// Item numbers count up from the bottom, as a parts list sits on top of the title block.
function table(x, y, cols, rows, { rowH = 16, role = "bom", headH = 18 } = {}) {
  const w = cols.reduce((s, c) => s + c.w, 0);
  const h = headH + rows.length * rowH;
  let rules = "";
  let text = "";
  let cx = x;
  for (const [i, c] of cols.entries()) {
    if (i > 0) rules += `M${r2(cx)} ${y}V${y + h}`;
    const tx = c.align === "center" ? cx + c.w / 2 : c.align === "right" ? cx + c.w - 4 : cx + 4;
    const anchor = c.align === "center" ? "middle" : c.align === "right" ? "end" : "start";
    text += `<text class="t t-sm t-head" x="${r2(tx)}" y="${y + h - 5.5}" text-anchor="${anchor}">${c.title}</text>`;
    rows.forEach((row, j) => {
      text += `<text class="t t-sm" x="${r2(tx)}" y="${r2(y + (rows.length - 1 - j) * rowH + rowH - 4.8)}" text-anchor="${anchor}">${row[i]}</text>`;
    });
    cx += c.w;
  }
  for (let j = 1; j <= rows.length; j++) rules += `M${x} ${r2(y + j * rowH)}H${x + w}`;
  return `<g data-role="${role}"><rect class="paper" x="${x}" y="${y}" width="${w}" height="${h}"/><path class="thin" d="${rules}"/><rect class="vis" x="${x}" y="${y}" width="${w}" height="${h}"/>${text}</g>`;
}

// A title-block cell: a small caption over a value. size: "sm" | "md" | "lg".
function cell({ x, y, w, h, label, value = "", size = "md", id = "" }) {
  const cls = size === "lg" ? "t t-xl" : size === "sm" ? "t t-sm" : "t";
  const vy = size === "lg" ? y + h - 7 : y + h - 5;
  return (
    `<rect class="thin" x="${x}" y="${y}" width="${w}" height="${h}"/>` +
    `<text class="t t-cap" x="${x + 4}" y="${y + 9}">${label}</text>` +
    `<text class="${cls}" x="${x + 4}" y="${vy}"${id ? ` id="${id}"` : ""}>${value}</text>`
  );
}

function titleBlock(x, y, w, h, cells) {
  return `<g data-role="title"><rect class="paper" x="${x}" y="${y}" width="${w}" height="${h}"/>${cells.map((c) => cell({ ...c, x: x + c.x, y: y + c.y })).join("")}<rect class="vis" x="${x}" y="${y}" width="${w}" height="${h}"/></g>`;
}

// A notes block: a heading and numbered lines.
function notes(x, y, heading, items, lead = 13) {
  let out = `<g data-role="notes"><text class="t t-head" x="${x}" y="${y}">${heading}</text>`;
  items.forEach((s, i) => {
    out += `<text class="t t-sm" x="${x}" y="${r2(y + lead * (i + 1) + 2)}">${i + 1}. ${s}</text>`;
  });
  return out + `</g>`;
}

return { SHEET, PX_PER_MM, THICK, THIN, TEXT, ARROW, GAP, OVER, r2, fmt, view, scaleLabel, d, rect, arc, circle, rrect, move, flipU, flipV, inside, revolve, MATERIALS, ANGLES, hatchDefs, cut, section, body, line, lines, centerline, centerMark, springSection, textWidth, dim, balloon, viewLabel, detailMark, viewArrow, breakLine, frame, table, cell, titleBlock, notes };
})();

const L = (() => {
// Live runtime for a blueprint sheet: one time-based loop, an idle tour, input wake-ups,
// offscreen and hidden-tab pauses, reduced motion, and deterministic frames for checks.
//
// URL parameters (all optional):
//   ?t=6.5            render the tour at 6.5 s, deterministically, and stop (for screenshots)
//   ?theme=paper      blueprint | paper | white | dark
//   ?zoom=x,y,w,h     show only this sheet region, filling the window (for 4x close-ups)
//   ?mask=x,y,w,h     blank everything outside this box, so one view stands alone
//   ?check=1          run the layout self-check after the first frame (see selfcheck.mjs)

function params() {
  const q = new URLSearchParams(location.search);
  return {
    t: q.has("t") ? Number(q.get("t")) : null,
    theme: q.get("theme"),
    zoom: q.get("zoom"),
    mask: q.get("mask"),
    check: q.has("check"),
  };
}

const THEMES = ["blueprint", "paper", "white", "dark"];

function setupPage(svg) {
  const q = params();
  // the page's own default (writePage's `theme`), then a saved choice, then ?theme=, which wins but isn't saved
  const fallback = document.documentElement.dataset.theme || "blueprint";
  const pick = (name, save) => {
    if (!THEMES.includes(name)) return;
    document.documentElement.dataset.theme = name;
    for (const b of document.querySelectorAll("[data-theme-pick]")) b.setAttribute("aria-pressed", String(b.dataset.themePick === name));
    if (save) {
      try {
        localStorage.setItem("bp-theme", name);
      } catch {}
    }
  };
  let saved = null;
  try {
    saved = localStorage.getItem("bp-theme");
  } catch {}
  pick(q.theme ?? saved ?? fallback, false);
  for (const b of document.querySelectorAll("[data-theme-pick]")) b.addEventListener("click", () => pick(b.dataset.themePick, true));
  // ?mask=x,y,w,h paints the page colour over everything outside one box, so a view stands alone
  if (q.mask) {
    const [x, y, w, h] = q.mask.split(",").map(Number);
    if ([x, y, w, h].every(Number.isFinite)) {
      const m = document.createElementNS("http://www.w3.org/2000/svg", "path");
      m.setAttribute("d", `M-9999 -9999H9999V9999H-9999Z M${x} ${y}V${y + h}H${x + w}V${y}Z`);
      m.setAttribute("fill-rule", "evenodd");
      m.setAttribute("style", "fill:var(--bp-page);pointer-events:none");
      m.dataset.role = "mask";
      svg.appendChild(m);
    }
  }
  if (q.zoom) {
    const box = q.zoom.split(",").map(Number);
    if (box.length === 4 && box.every(Number.isFinite)) {
      svg.setAttribute("viewBox", box.join(" "));
      document.body.classList.add("bp-zoom");
    }
  }
  return q;
}

// Critically damped follow toward a target: calm, no overshoot, frame-rate independent.
function follow(at, want, rate, dt) {
  return want + (at - want) * Math.exp(-rate * dt);
}

const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, t)));

// run({ root, step, render, idleAfter })
//   step(dt, live) advances the model; live.touring says whether the idle tour drives it.
//   It returns true while something is still settling, so a reduced-motion page can sleep.
//   render(live) writes attributes; it never rebuilds static geometry.
function run({ root, step, render, idleAfter = 4, onFrozen }) {
  const q = params();
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const live = { clock: 0, slow: 1, lastInput: -Infinity, reduced, touring: !reduced, frozen: q.t != null };
  live.input = () => {
    live.lastInput = live.clock;
    live.touring = false;
    wake();
  };

  if (live.frozen) {
    const dt = 1 / 240;
    for (let t = 0; t < q.t; t += dt) {
      live.clock = t;
      live.touring = true;
      step(dt, live);
    }
    render(live);
    onFrozen?.(live);
    return live;
  }

  let raf = 0;
  let last = 0;
  let visible = true;
  function frame(now) {
    raf = 0;
    const real = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    live.clock += real;
    live.touring = !reduced && live.clock - live.lastInput > idleAfter;
    const busy = step(real * live.slow, live);
    render(live);
    if (visible && !document.hidden && (!reduced || busy)) raf = requestAnimationFrame(frame);
    else last = 0;
  }
  function wake() {
    if (!raf && visible && !document.hidden) raf = requestAnimationFrame(frame);
  }
  live.wake = wake;
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(([entry]) => {
      visible = entry.isIntersecting;
      if (visible) wake();
    }).observe(root);
  }
  document.addEventListener("visibilitychange", wake);
  render(live);
  wake();
  return live;
}

// Vertical drag on an element, reported as a sheet-unit delta since the press.
function dragY(svg, el, { start, move, end }) {
  let id = null;
  let y0 = 0;
  const toSheet = (e) => {
    const m = svg.getScreenCTM();
    return m ? (e.clientY - m.f) / m.d : e.clientY;
  };
  el.addEventListener("pointerdown", (e) => {
    id = e.pointerId;
    el.setPointerCapture(id);
    y0 = toSheet(e);
    start?.();
    e.preventDefault();
  });
  el.addEventListener("pointermove", (e) => {
    if (e.pointerId === id) move(toSheet(e) - y0);
  });
  const stop = (e) => {
    if (e.pointerId !== id) return;
    id = null;
    end?.();
  };
  el.addEventListener("pointerup", stop);
  el.addEventListener("pointercancel", stop);
}

// Announce a readout to screen readers at most every `every` seconds.
function announcer(el, every = 1.5) {
  let lastAt = -Infinity;
  let lastText = "";
  return (text, clock) => {
    if (text === lastText || clock - lastAt < every) return;
    lastAt = clock;
    lastText = text;
    el.textContent = text;
  };
}

return { params, THEMES, setupPage, follow, ease, run, dragY, announcer };
})();

const C = (() => {
// Layout self-check, run in the page with ?check=1 (scripts/check.mjs drives it headlessly).
// It writes a JSON report into <pre id="bp-check"> and to the console. A clean sheet reports
// zero failures in every category.
//
//   text-overlap      two pieces of lettering touch
//   text-on-geometry  lettering sits on a part or on another annotation's lines
//   outside-frame     an annotation or a view crosses the drawing frame
//   balloon-target    a balloon's dot is not on the part it names
//   balloon-on-geom   a balloon circle sits on a part
//   hard-colour       a fill or stroke is a literal colour instead of a token
//   sideways-scroll   the page scrolls horizontally

const roleOf = (el) => el.closest("[data-role]")?.dataset.role ?? "";

// A clipped group's box is its clip region's box (getBoundingClientRect ignores clipping).
function clippedBox(el) {
  const ref = el.getAttribute("clip-path")?.match(/url\(#([^)]+)\)/)?.[1];
  const shape = ref && document.getElementById(ref)?.firstElementChild;
  if (!shape) return el.getBoundingClientRect();
  const b = shape.getBBox();
  const m = shape.ownerSVGElement.getScreenCTM();
  const x0 = m.a * b.x + m.e;
  const y0 = m.d * b.y + m.f;
  return { left: x0, top: y0, right: x0 + m.a * b.width, bottom: y0 + m.d * b.height };
}

function selfCheck(svg) {
  const fails = [];
  const fail = (kind, what) => fails.push({ kind, what });
  const label = (el) => {
    const g = el.closest("[data-role],[data-part],[data-geom]");
    const name = g?.id || g?.dataset.part || g?.dataset.target || g?.dataset.role || g?.dataset.geom || el.tagName;
    return `${name}: "${(el.textContent || "").trim().slice(0, 24)}"`;
  };
  const shown = (el) => {
    const b = el.getBoundingClientRect();
    if (b.width < 0.5 || b.height < 0.5) return false;
    const cs = getComputedStyle(el);
    return cs.visibility !== "hidden" && cs.display !== "none" && Number(cs.opacity) > 0.05;
  };
  const texts = [...svg.querySelectorAll("text")].filter(shown);
  const boxes = texts.map((t) => t.getBoundingClientRect());
  const grow = 0.4;
  const hit = (a, b) => a.left < b.right - grow && b.left < a.right - grow && a.top < b.bottom - grow && b.top < a.bottom - grow;

  for (let i = 0; i < texts.length; i++)
    for (let j = i + 1; j < texts.length; j++) if (hit(boxes[i], boxes[j])) fail("text-overlap", `${label(texts[i])} × ${label(texts[j])}`);

// mainplate removed. Moving parts are drawn at rest (θ = 0, φ = 0, ψ = 0) and turned by the page.
// Section frame (SECTION A-A): u along the line of centres from the balance staff's axis, v = z up
// from the lower pivot's end.



const part = (id, inner, extra = "") => `<g data-part="${id}"${extra}>${inner}</g>`;

const B = M.B;
const E = M.E;
const RAD = Math.PI / 180;
const at = (c, r, a) => [c[0] + r * Math.cos(a * RAD), c[1] + r * Math.sin(a * RAD)];
const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k];
const unit = (a, b) => {
  const l = Math.hypot(b[0] - a[0], b[1] - a[1]);
  return [(b[0] - a[0]) / l, (b[1] - a[1]) / l];
};

// A body with holes: paper with the holes left open (even-odd), and every edge thick.
function holed(V, outer, holes) {
  const dd = K.d(V, outer) + holes.map((h) => K.d(V, h)).join("");
  return `<path class="paper" fill-rule="evenodd" d="${dd}"/><path class="vis" d="${dd}"/>`;
}

// ---------------------------------------------------------------- balance (plan, B frame at θ = 0)

// Rim, three arms and the hub: one Glucydur casting, seen from below. The rim is round, so it is
// drawn fixed; the arms and hub turn (balanceArms), and the rim covers the arms' outer ends.
function balanceRim(V) {
  const { ro, ri } = M.BAL;
  return part(9, holed(V, K.circle(B[0], B[1], ro, 120), [K.circle(B[0], B[1], ri, 120)]) + K.line(V, K.circle(B[0], B[1], ro - 0.08, 120), "thin", true));
}
function balanceArms(V) {
  const { ri, armW, hub } = M.BAL;
  let out = "";
  for (const a of [90, 210, 330]) {
    const c = Math.cos(a * RAD);
    const sn = Math.sin(a * RAD);
    const p = (r, w) => [B[0] + r * c - w * sn, B[1] + r * sn + w * c];
    out += K.body(V, [p(hub, -armW / 2), p(ri + 0.04, -armW / 2), p(ri + 0.04, armW / 2), p(hub, armW / 2)]);
  }
  out += K.body(V, K.circle(B[0], B[1], hub + 0.12, 32));
  return part(9, out);
}
const balance = (V) => balanceArms(V) + balanceRim(V);

// The collar of the staff under the balance hub, seen end-on; rotation-invariant.
function staffPlan(V) {
  return part(8, K.body(V, K.circle(B[0], B[1], 0.4, 32)) + K.line(V, K.circle(B[0], B[1], 0.22, 24), "thin", true)) +
    part(8, K.body(V, K.circle(B[0], B[1], 0.12, 20)) + K.body(V, K.circle(B[0], B[1], 0.045, 12)));
}

// Hairspring: an Archimedean spiral from the collet to the stud. The inner end turns with the
// balance, the outer end is held, so the coils wind up and open out as it swings.
const STUD_A = 52; // degrees, where the outer end is pinned
function spiral(th, steps = 7) {
  const { r0, r1 } = M.HS;
  const aIn = STUD_A - 360 * M.HS_TURNS + th;
  const sweep = STUD_A - aIn;
  const n = Math.ceil(Math.abs(sweep) / steps);
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const s = i / n;
    pts.push(at(B, r0 + (r1 - r0) * s, aIn + sweep * s));
  }
  return pts;
}
function hairspring(V, th) {
  return part(10, K.line(V, spiral(th), "vis"));
}

function stud(V) {
  const r = M.HS.r1;
  const c = at(B, r + 0.08, STUD_A + 2);
  const radial = [Math.cos((STUD_A + 2) * RAD), Math.sin((STUD_A + 2) * RAD)];
  const tang = [-radial[1], radial[0]];
  const corner = (a, b) => add(add(c, radial, a), tang, b);
  const block = [corner(-0.24, -0.2), corner(0.26, -0.2), corner(0.26, 0.2), corner(-0.24, 0.2)];
  return part(12, K.body(V, block) + K.body(V, K.circle(...corner(0.12, 0), 0.07, 12)));
}

function collet(V) {
  const ring = K.circle(B[0], B[1], 0.6, 40);
  const bore = K.circle(B[0], B[1], 0.25, 24);
  const slot = [at(B, 0.27, 176), at(B, 0.6, 178), at(B, 0.6, 182), at(B, 0.27, 184)];
  return part(11, holed(V, ring, [bore]) + K.line(V, slot, "thin", true));
}

// ---------------------------------------------------------------- double roller and impulse jewel

function rollerTable(V) {
  // The impulse roller's table: the jewel sits in a hole at its edge.
  return part(13, K.body(V, K.circle(B[0], B[1], 1.0, 60)) + K.line(V, K.circle(B[0], B[1], 0.32, 24), "thin", true));
}

function safetyRoller(V) {
  const r = 0.45;
  // the passing crescent, a notch facing the jewel
  const a = 22;
  const out = [...K.arc(B[0], B[1], r, -180 + a, 180 - a, 40), ...K.arc(B[0] - r - 0.02, B[1], 0.2, 70, -70, 10)];
  return part(13, K.body(V, out));
}

function jewelPlan(V) {
  // D-section ruby pin, the flat facing the staff
  const c = [B[0] - M.R_JEWEL, 0];
  const r = 0.14;
  const flat = 0.07;
  const a = Math.acos(flat / r) / RAD;
  const pts = K.arc(c[0], c[1], r, a, 360 - a, 28);
  return part(14, K.body(V, pts));
}

// ---------------------------------------------------------------- escape wheel and pinion

function wheelOutline() {
  const out = [];
  for (let k = 0; k < M.TEETH; k++) {
    const tooth = M.toothLocal(k).map((p) => add(p, E));
    out.push(...tooth);
    const a0 = 30 + M.PITCH * k + M.ROOT_BACK;
    const a1 = 30 + M.PITCH * (k + 1) + M.ROOT_FRONT;
    out.push(...K.arc(E[0], E[1], M.R_ROOT, a0, a1, 8).slice(1, -1));
  }
  return out;
}

function wheel(V) {
  const arms = 5;
  const armW = 0.22;
  const hub = 0.5;
  const holes = [];
  for (let i = 0; i < arms; i++) {
    const a0 = 90 + (360 / arms) * i;
    const a1 = a0 + 360 / arms;
    const so = Math.asin(armW / 2 / M.R_RIM) / RAD;
    const sh = Math.asin(armW / 2 / (hub + 0.06)) / RAD;
    holes.push([...K.arc(E[0], E[1], M.R_RIM, a0 + so, a1 - so, 14), ...K.arc(E[0], E[1], hub + 0.06, a1 - sh - 8, a0 + sh + 8, 6)]);
  }
  return part(20, holed(V, wheelOutline(), holes) + K.line(V, K.circle(E[0], E[1], hub, 36), "thin", true));
}

// One tooth's outline, for the accent on the tooth at work.
const toothShape = (k) => M.toothLocal(k).map((p) => add(p, E));

function pinion(V) {
  const leaves = 7;
  const ro = 0.43;
  const rr = 0.27;
  const pts = [];
  for (let i = 0; i < leaves; i++) {
    const a = (360 / leaves) * i + 12;
    const w = 360 / leaves;
    pts.push(...K.arc(E[0], E[1], rr, a - w * 0.5, a - w * 0.22, 3));
    pts.push(...K.arc(E[0], E[1], ro, a - w * 0.14, a + w * 0.14, 4));
    pts.push(...K.arc(E[0], E[1], rr, a + w * 0.22, a + w * 0.5, 3).slice(0, -1));
  }
  return part(21, K.body(V, pts) + K.body(V, K.circle(E[0], E[1], 0.12, 20)) + K.body(V, K.circle(E[0], E[1], 0.045, 12)));
}

// ---------------------------------------------------------------- pallet fork (P frame, φ = 0)

const LEVER_HW = (u) => 0.25 - (0.25 - 0.15) * Math.max(0, Math.min(1, (u - 0.6) / 2.7));
const GUARD_TIP = M.D_PB - 0.5;
const SLOT_W = 0.3;
const SLOT_BOTTOM = M.FORK_L - 0.2;
const HORN_END = M.FORK_L + 0.32;

// One stone's frame: L locking corner, X exit corner, f along the stone, outward.
function stoneFrame(st) {
  const [L, X, Xb, Lb] = st;
  const f = unit(L, Lb);
  const nL = [f[1], -f[0]]; // a normal; its side is checked against X below
  const side = (X[0] - L[0]) * nL[0] + (X[1] - L[1]) * nL[1] > 0 ? -1 : 1;
  return { L, X, Xb, Lb, f, out: [nL[0] * side, nL[1] * side] }; // out: away from X, past the locking face
}

const S0 = 0.42; // the stones stand this far proud of the pallet body
const S1 = 1.33;
const RIM = 0.1;
function armCorners(st) {
  const s = stoneFrame(st);
  const inw = [-s.out[0], -s.out[1]];
  return {
    l0: add(add(s.L, s.f, S0), s.out, RIM),
    l1: add(add(s.L, s.f, S1), s.out, RIM),
    x0: add(add(s.X, s.f, S0), inw, RIM),
    x1: add(add(s.X, s.f, S1), inw, RIM),

function headUpper() {

    [M.FORK_L - 0.02, 0.38],
    [M.FORK_L + 0.18, 0.37],
    [HORN_END, 0.3],
    [HORN_END + 0.02, 0.24],
    [HORN_END - 0.06, SLOT_W / 2 + 0.04],

}

function palletOutline() {

  const aEn = Math.atan2(en.x0[1] - E[1], en.x0[0] - E[0]) / RAD;

    en.l0,
    en.l1,
    en.x1,
    [0.78, 0.95],
    [0.72, LEVER_HW(0.72) + 0.12],
    [1.0, LEVER_HW(1.0)],
    ...up,
    ...slotBottom(),
    ...low,
    [1.0, -LEVER_HW(1.0)],
    [0.72, -LEVER_HW(0.72) - 0.12],
    [0.62, -1.1],

    ex.x1,
    ex.x0,
    ex.l0,

function pallet(V) {
  const body = palletOutline();
  const pinHole = K.circle(0, 0, 0.16, 24);
  return part(15, holed(V, body, [pinHole]) + K.line(V, K.circle(0, 0, 0.3, 28), "thin", true));
}

const stoneEntry = (V) => part(17, K.body(V, M.STONE_ENTRY));
const stoneExit = (V) => part(18, K.body(V, M.STONE_EXIT));

function arborPlan(V) {
  return part(16, K.body(V, K.circle(0, 0, 0.16, 24)) + K.body(V, K.circle(0, 0, 0.045, 12)));
}

// Guard pin under the fork, pointing at the safety roller (nearer the viewer than the fork).
function guardPinPlan(V) {
  const r = 0.05;
  const pts = [[SLOT_BOTTOM - 0.28, -r], [GUARD_TIP - 0.03, -r], [GUARD_TIP, -r + 0.03], [GUARD_TIP, r - 0.03], [GUARD_TIP - 0.03, r], [SLOT_BOTTOM - 0.28, r]];

}

// The fork's outline at a banking, in phantom lines.
function forkPhantom(V, phi) {

const BANK_U = 1.0;
const BANK_R = 0.15;

}

// ---------------------------------------------------------------- SECTION A-A (B frame, z up)

const Z = {
  plateLo: -0.45,
  plateHi: 0.35,
  safety: [0.72, 0.92],
  table: [1.2, 1.42],
  fork: [0.94, 1.12],
  rim: [1.45, 1.95],
  hub: [1.58, 1.88],
  collet: [2.25, 2.5],
  hs: [2.32, 2.44],
  cockLo: 2.8,
  cockHi: 3.55,
  tipTop: 3.08,

// Half-profile of the staff: [r, z], one edge on the axis.

  [0.03, 0],
  [0.045, 0.02],
  [0.045, 0.26],
  [0.12, 0.42],
  [0.2, 0.46],
  [0.22, 0.5],
  [0.22, 1.43],
  [0.4, 1.45],
  [0.4, 1.55],
  [0.3, 1.56],
  [0.3, 1.88],
  [0.36, 1.89],
  [0.33, 1.95],
  [0.25, 1.96],
  [0.25, 2.62],
  [0.12, 2.74],
  [0.045, 2.8],

  [0.03, Z.tipTop],
  [0, Z.tipTop],

}

// One shock-absorbing bearing, drawn about z0 (the face the pivot's shoulder looks at); dir +1 for
// the upper bearing (pivot pointing up), −1 for the lower.
function bearingParts(dir, zEnd) {
  // zEnd is the pivot's end; everything is laid out from it along dir
  const z = (dz) => zEnd + dir * dz;
  const rv = (r0, r1, a, b) => K.rect(r0, Math.min(z(a), z(b)), r1, Math.max(z(a), z(b)));
  const ring = (pts) => pts.map(([r, dz]) => [r, z(dz)]);

    // block: a bush pressed into the plate or cock, with a groove that holds the lyre spring's ends
    block: ring([[0.25, -0.32], [0.95, -0.32], [0.95, 0.26], [0.8, 0.26], [0.8, 0.21], [0.86, 0.21], [0.86, 0.14], [0.62, 0.14], [0.62, -0.28], [0.25, -0.28]]),
    chaton: ring([[0.25, -0.28], [0.6, -0.28], [0.6, 0.02], [0.5, 0.02], [0.5, -0.25], [0.25, -0.25]]),
    hole: ring([[0.05, -0.25], [0.5, -0.25], [0.5, -0.05], [0.08, -0.05], [0.05, -0.12]]),

const both = (V, pts, opts) => K.cut(V, pts, opts) + K.cut(V, mirror(pts), opts);

function bearing(V, dir) {

  const left = [[-1.7, Z.cockLo + 0.12], [-1.58, Z.cockLo], [-0.95, Z.cockLo], [-0.95, Z.cockHi], [-1.58, Z.cockHi], [-1.7, Z.cockHi - 0.12]];

function balanceSec(V) {

const RAD = Math.PI / 180;

function head([x, y], [dx, dy]) {
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len;
  const uy = dy / len;
  const bx = x - ux * K.ARROW;
  const by = y - uy * K.ARROW;
  const h = K.ARROW * 0.25;
  return `M${K.r2(x)} ${K.r2(y)}L${K.r2(bx - uy * h)} ${K.r2(by + ux * h)}L${K.r2(bx + uy * h)} ${K.r2(by - ux * h)}Z`;
}

// A radius: a leader from the centre through the circle at angle a (degrees), arrow on the circle,
// a short shoulder and the value beyond it.
function radius(V, c, r, a, text) {
  const [cx, cy] = V.p(c);
  const [x, y] = V.p([c[0] + r * Math.cos(a * RAD), c[1] + r * Math.sin(a * RAD)]);
  const ux = (x - cx) / Math.hypot(x - cx, y - cy);
  const uy = (y - cy) / Math.hypot(x - cx, y - cy);
  const ex = x + ux * 16;
  const ey = y + uy * 16;
  const left = ux < 0;
  const sx = ex + (left ? -10 : 10);
  const tw = K.textWidth(text);
  const tx = left ? sx - 3 - tw / 2 : sx + 3 + tw / 2;
  return (
    `<g data-role="dim"><path class="thin" d="M${K.r2(x - ux * 0.5)} ${K.r2(y - uy * 0.5)}L${K.r2(ex)} ${K.r2(ey)}H${K.r2(sx)}"/>` +
    `<path class="head" d="${head([x, y], [-ux, -uy])}"/>` +
    `<text class="t" x="${K.r2(tx)}" y="${K.r2(ey + 3.3)}" text-anchor="middle">${text}</text></g>`
  );
}

// The fork's angle φ, measured at the pallet arbor between the fixed vertical through it and the
// pallet's own centre line (perpendicular to the fork), which turns with the pallet.
const PHI_R = [1.95, 3.05]; // the witness lines run between these radii, mm
const PHI_ARC = 2.8;
function forkAngle(V, phi) {
  const [px, py] = V.p([0, 0]);
  const k = V.k;
  const pt = (r, a) => [px + r * k * Math.cos(a * RAD), py - r * k * Math.sin(a * RAD)];
  const a0 = 90;
  const a1 = 90 + phi;
  const fixed = [pt(PHI_R[0], a0), pt(PHI_R[1], a0)];
  const turned = [pt(PHI_R[0] + 0.2, a1), pt(PHI_R[1], a1)];
  const R = PHI_ARC * k;
  const span = Math.abs(phi) * RAD * R;
  const lo = Math.min(a0, a1);
  const hi = Math.max(a0, a1);
  const ext = (11 / R) / RAD; // the arc runs on past both lines when the arrows sit outside
  const inside = span >= K.ARROW * 2 + 3;
  const from = inside ? lo : lo - ext;
  const to = inside ? hi : hi + ext;
  let arc = "";
  const n = 12;
  for (let i = 0; i <= n; i++) {
    const [x, y] = pt(PHI_ARC, from + ((to - from) * i) / n);
    arc += `${i ? "L" : "M"}${K.r2(x)} ${K.r2(y)}`;
  }
  // tangent directions at the two ends of the measured span (sheet y down)
  const tan = (a, s) => [-Math.sin(a * RAD) * s, -Math.cos(a * RAD) * s];
  let heads = "";
  if (span > 0.6) {
    const pLo = pt(PHI_ARC, lo);
    const pHi = pt(PHI_ARC, hi);
    heads = inside
      ? head(pLo, tan(lo, -1)) + head(pHi, tan(hi, 1))
      : head(pLo, tan(lo, 1)) + head(pHi, tan(hi, -1));
  }
  const ext1 = `M${K.r2(fixed[0][0])} ${K.r2(fixed[0][1])}L${K.r2(fixed[1][0])} ${K.r2(fixed[1][1])}`;
  const ext2 = `M${K.r2(turned[0][0])} ${K.r2(turned[0][1])}L${K.r2(turned[1][0])} ${K.r2(turned[1][1])}`;
  const [lx, ly] = pt(PHI_ARC, 90);
  const sign = phi > 0.05 ? "+" : phi < -0.05 ? "−" : "";
  const text = `φ ${sign}${Math.abs(phi).toFixed(1)}°`;
  return (
    `<g data-role="dim" id="dim-phi"><path class="ctr" d="${ext1}"/><path class="thin" d="${ext2}${arc}"/>` +
    (heads ? `<path class="head" d="${heads}"/>` : "") +
    `<text class="t" x="${K.r2(lx - 22)}" y="${K.r2(ly + 3.3)}" text-anchor="end">${text}</text></g>`
  );
}

// Cutting plane marks: thick ends on the plane's line, arrows for the viewing direction (sheet up),
// and the letter at each arrow.
function cutPlane(V, a, b, letter) {
  const [ax, ay] = V.p(a);
  const [bx, by] = V.p(b);
  const L = 14;
  const arrow = (x, y) => `M${x} ${y}V${K.r2(y - 22 + K.ARROW)}`;
  return (
    `<g data-role="label"><path class="vis" d="M${ax} ${ay}H${ax + L}M${bx - L} ${by}H${bx}${arrow(ax + 2, ay)}${arrow(bx - 2, by)}"/>` +
    `<path class="head" d="${head([ax + 2, ay - 22], [0, -1])}${head([bx - 2, by - 22], [0, -1])}"/>` +
    `<text class="t t-lg" x="${ax + 2}" y="${ay - 27}" text-anchor="middle">${letter}</text>` +
    `<text class="t t-lg" x="${bx - 2}" y="${by - 27}" text-anchor="middle">${letter}</text></g>`
  );
}

// A point on a stone's centre line, a fraction f of the way from its tip to its back end.
function mid(stone, f) {
  const [L, X, Xb, Lb] = stone;
  const tip = [(L[0] + X[0]) / 2, (L[1] + X[1]) / 2];
  const back = [(Lb[0] + Xb[0]) / 2, (Lb[1] + Xb[1]) / 2];
  return [tip[0] + (back[0] - tip[0]) * f, tip[1] + (back[1] - tip[1]) * f];
}

return { radius, PHI_R, PHI_ARC, forkAngle, cutPlane, mid };
})();

// Page code for escapement.html. K (kit), L (runtime), C (self-check), M (model), P (parts) and
// X (extra annotation) are inlined above this script as namespaces.

const svg = document.querySelector(".bp-sheet");
const q = L.setupPage(svg);
const specs = JSON.parse(svg.dataset.views);
const VP = K.view(specs.plan);
const VB = K.view(specs.B);
const CH = {"x0":834,"x1":1138,"y0":52,"y1":172,"tMax":0.5,"aMax":300,"psiMax":48};
const $ = (id) => document.getElementById(id);

const views = [
  ["plan", VP],
  ["B", VB],
].map(([id, V]) => ({
  V,
  wheel: $(`wheel-${id}`),
  tooth: $(`tooth-${id}`),
  fork: $(`fork-${id}`),
  rb: [...svg.querySelectorAll(`.rb-${id}`)],
  hs: $(`hs-${id}`),
  e: V.p(M.E),
  b: V.p(M.B),
  p: V.p([0, 0]),
}));
const el = {
  phi: $("dim-phi-wrap"),
  traceNow: $("trace-now"),
  tracePrev: $("trace-prev"),
  psiNow: $("psi-now"),
  impNow: $("imp-now"),
  impTicks: $("imp-ticks"),
  dot: $("chart-dot"),
  readout: $("readout"),
};
const say = L.announcer($("sr"), 2);

// ---------------------------------------------------------------- state
let s = M.start();
let paused = false;
let speed = 0; // 0: the tour's time warp, 1: ×1/10, 2: real time
const SPEEDS = [0, 1 / 10, 1];
let dragging = false;
let dragTarget = 0;
let rate = 1;

// The tour slows time where the escapement works: ×1/90 inside the lift, ×1/14 in the free swing.
function warp(th) {
  const a = Math.abs(th);
  const w = a < 32 ? 1 : a > 90 ? 0 : 1 - (a - 32) / 58;
  return 1 / 14 + (1 / 90 - 1 / 14) * L.ease(w);
}

// ---------------------------------------------------------------- the chart: one window of 500 ms
const WIN = CH.tMax;
let win = 0;
let now = [];
let prev = [];
let psi0 = s.psi;
let lastRec = -1;
const cx = (t) => K.r2(CH.x0 + (t / WIN) * (CH.x1 - CH.x0));
const cy = (a) => K.r2((CH.y0 + CH.y1) / 2 - (Math.max(-CH.aMax, Math.min(CH.aMax, a)) / CH.aMax) * ((CH.y1 - CH.y0) / 2));
const py = (p) => K.r2(CH.y1 - (Math.max(0, Math.min(CH.psiMax, p)) / CH.psiMax) * (CH.y1 - CH.y0));

function record() {
  const w = Math.floor(s.t / WIN);
  if (w !== win) {
    prev = now;
    now = [];
    win = w;
    psi0 = s.psi;
    lastRec = -1;
  }
  const tw = s.t - w * WIN;
  if (tw - lastRec < 0.0004) return;
  lastRec = tw;
  now.push([tw, s.th, s.impulse, s.psi - psi0]);
}

function restart() {
  s = M.start();
  win = 0;
  now = [];
  prev = [];
  psi0 = s.psi;
  lastRec = -1;
}

// ---------------------------------------------------------------- step and render
function step(dt, live) {
  if (live.touring && (paused || speed !== 0)) {
    paused = false;
    speed = 0;
  }
  if (live.touring && s.amp !== undefined && s.peak < 120 && !dragging) restart();
  if (paused && !dragging) return false;
  rate = speed === 0 ? warp(s.th) : SPEEDS[speed];
  const sim = dt * rate;
  const n = Math.max(1, Math.ceil(sim / M.DT));
  const h = sim / n;
  const hold = dragging ? L.follow(s.th, dragTarget, 18, dt) : null;
  for (let i = 0; i < n; i++) {
    M.step(s, h, hold);
    record();
  }
  return true;
}

const pts = (list) => list.map(([t, a]) => `${cx(t)},${cy(a)}`).join(" ");
function impulsePath(list) {
  let d = "";
  let ticks = "";
  let on = false;
  for (const [t, a, imp] of list) {
    if (imp) {
      d += `${on ? "L" : "M"}${cx(t)} ${cy(a)}`;
      if (!on) ticks += `M${cx(t)} ${CH.y1}V${CH.y1 - 7}`;
    }
    on = imp;
  }
  return [d, ticks];
}

let shownHs = null;
function render(live) {
  const th = s.th;
  for (const v of views) {
    v.wheel.setAttribute("transform", `rotate(${K.r2(s.psi % 360)} ${v.e[0]} ${v.e[1]})`);
    v.fork.setAttribute("transform", `rotate(${K.r2(-s.phi)} ${v.p[0]} ${v.p[1]})`);
    for (const g of v.rb) g.setAttribute("transform", `rotate(${K.r2(-th % 360)} ${v.b[0]} ${v.b[1]})`);
    const k = M.toothInAction(s);
    v.tooth.setAttribute("d", K.d(v.V, P.toothShape(k)));
    v.tooth.setAttribute("fill-opacity", s.stage === "impulse" ? "0.9" : s.stage === "drop" ? "0.12" : "0.32");
  }
  if (shownHs === null || Math.abs(th - shownHs) > 0.2) {
    views[0].hs.innerHTML = P.hairspring(VP, th);
    shownHs = th;
  }
  el.phi.innerHTML = X.forkAngle(VP, s.phi);
  el.traceNow.setAttribute("points", pts(now));
  el.tracePrev.setAttribute("points", pts(prev));
  el.psiNow.setAttribute("points", now.map(([t, , , p]) => `${cx(t)},${py(p)}`).join(" "));
  const [d, ticks] = impulsePath(now);
  el.impNow.setAttribute("d", d);
  el.impTicks.setAttribute("d", ticks);
  const tw = s.t - win * WIN;
  el.dot.setAttribute("cx", cx(tw));
  el.dot.setAttribute("cy", cy(th));
  const stage = { locked: "LOCKED", unlocking: "UNLOCKING", impulse: "IMPULSE", drop: "DROP", locking: "LOCKING" }[s.stage];
  const stone = s.side > 0 ? "ENTRY" : "EXIT";
  const speedTxt = paused ? "PAUSED" : speed === 2 ? "×1" : `×1/${Math.round(1 / rate)}`;
  const sgn = (x) => (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(0);
  el.readout.textContent = `θ ${sgn(th)}° · A ${s.peak.toFixed(0)}° · φ ${s.phi >= 0 ? "+" : "−"}${Math.abs(s.phi).toFixed(1)}° · ${stage} ${stone} · TOOTH ${M.toothInAction(s) + 1} · ${speedTxt}`;
  say(`Balance at ${Math.round(th)} degrees, amplitude ${Math.round(s.peak)}, ${stage.toLowerCase()} on the ${stone.toLowerCase()} stone, beat ${s.beats}.`, live.clock);
}

// ---------------------------------------------------------------- input
const live = L.run({
  root: svg,
  step,
  render,
  idleAfter: 5,
  onFrozen: () => q.check && C.selfCheck(svg),
});

if (live.reduced && !live.frozen) {
  // A still, true moment: the first entry impulse, half way through.
  const fake = { touring: true, reduced: false, clock: 0 };
  let guard = 0;
  while (!(s.stage === "impulse" && s.side > 0 && Math.abs(s.phi) < 0.3) && guard++ < 200000) step(1 / 240, fake);
  render(live);
}

// Rotary drag: the balance follows the pointer's angle about the staff.
const hit = svg.querySelector('[data-drag="balance"]');
const toSheet = (e) => {
  const m = svg.getScreenCTM();
  return m ? [(e.clientX - m.e) / m.a, (e.clientY - m.f) / m.d] : [e.clientX, e.clientY];
};
const [bx, by] = VP.p(M.B);
const angleOf = (e) => {
  const [x, y] = toSheet(e);
  return (Math.atan2(-(y - by), x - bx) * 180) / Math.PI;
};
let pid = null;
let aPrev = 0;
hit.addEventListener("pointerdown", (e) => {
  pid = e.pointerId;
  hit.setPointerCapture(pid);
  aPrev = angleOf(e);
  dragTarget = s.th;
  dragging = true;
  live.input();
  e.preventDefault();
});
hit.addEventListener("pointermove", (e) => {
  if (e.pointerId !== pid) return;
  const a = angleOf(e);
  let da = a - aPrev;
  if (da > 180) da -= 360;
  if (da < -180) da += 360;
  aPrev = a;
  dragTarget = Math.max(-320, Math.min(320, dragTarget + da));
  live.input();
});
const release = (e) => {
  if (e.pointerId !== pid) return;
  pid = null;
  dragging = false;
  s.om = 0; // let go from rest
  s.peak = Math.abs(s.th);
  live.input();
};
hit.addEventListener("pointerup", release);
hit.addEventListener("pointercancel", release);

svg.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === "ArrowLeft" || k === "ArrowRight") s.om += k === "ArrowLeft" ? 2500 : -2500;
  else if (k === " ") paused = !paused;
  else if (k === "s" || k === "S") speed = (speed + 1) % 3;
  else if (k === "r" || k === "R") restart();
  else return;
  e.preventDefault();
  live.input();
});

if (q.check && !live.frozen) setTimeout(() => C.selfCheck(svg), 400);

</script>
</body>
</html>
